ypically raises D-dimer.","Factor consumption can prolong PT."]},{"id":"midterm3-q0992","topic":"hemostasis","q":"What is a typical cause and consequence of pseudothrombocytopenia?","opts":["In vitro platelet clumping falsely lowers the measured count","It typically causes spontaneous bleeding","It reflects reduced marrow platelet production","The laboratory artifact itself has no bleeding consequence"],"correct":[0,3],"why":"Platelet clumps are undercounted by the analyzer even when the true circulating count is adequate.","src":"TEST 3.docx.pdf, p. 19 \u00b7 q0992","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Clumps, often in EDTA samples, can be counted incorrectly by an analyzer.","The artifact itself does not increase bleeding risk.","The apparent reduction reflects counting error, not marrow failure.","There may be an adequate circulating count despite the falsely low result."]},{"id":"midterm3-q0993","topic":"hemostasis","q":"Which can prolong aPTT?","opts":["Factor XII deficiency","Unfractionated heparin","Factor V Leiden","A factor VIII inhibitor"],"correct":[0,1,3],"why":"The intrinsic pathway assay is sensitive to contact factor deficiency, heparin, and factor VIII inhibition.","src":"TEST 3.docx.pdf, p. 19 \u00b7 q0993","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor XII is required for contact activation in the assay, even though its deficiency usually does not cause bleeding.","Unfractionated heparin enhances antithrombin activity and can prolong the aPTT.","Factor V Leiden causes resistance to activated protein C and usually does not prolong routine aPTT.","An inhibitor neutralizes factor VIII and reduces intrinsic pathway activity."]},{"id":"midterm3-q0995","topic":"hemostasis","q":"Which finding is associated with bleeding rather than inherited thrombophilia?","opts":["Factor V Leiden","Protein C deficiency","A factor VIII inhibitor","Antithrombin deficiency"],"correct":[2],"why":"Factor VIII inhibitors impair intrinsic pathway clotting and can cause acquired hemophilia.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q0995","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Activated protein C resistance increases venous thrombosis risk.","Less protein C activity means reduced inactivation of Va and VIIIa.","An inhibitor lowers functional VIII activity and can cause acquired hemophilia.","Reduced antithrombin weakens inhibition of thrombin and Xa, favoring thrombosis."]},{"id":"midterm3-q0996","topic":"hemostasis","q":"How can von Willebrand factor deficiency impair hemostasis?","opts":["Reduced platelet adhesion","Reduced stabilization of circulating factor VIII","Accelerated thrombin generation","Increased activation of factor IX"],"correct":[0,1],"why":"Von Willebrand factor bridges platelets to injured vessel walls and protects factor VIII from clearance.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q0996","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Von Willebrand factor normally bridges exposed vessel-wall matrix to platelet GPIb.","It binds factor VIII and protects it from premature clearance.","Loss of VIII stabilization can reduce rather than accelerate thrombin generation.","The factor primarily helps platelet adhesion and stabilizes VIII, not IX."]},{"id":"midterm3-q0999","topic":"hemostasis","q":"Which of these proteins is affected by warfarin?","opts":["Factor VIII","Fibrinogen","Von Willebrand factor","Protein C"],"correct":[3],"why":"Protein C is vitamin K dependent, as are factors II, VII, IX, and X.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q0999","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor VIII is not vitamin K dependent.","Fibrinogen does not require vitamin K-dependent carboxylation.","Von Willebrand factor supports adhesion and VIII stability independently of vitamin K.","Protein C requires vitamin K-dependent carboxylation and is affected by warfarin."]},{"id":"midterm3-q1000","topic":"hemostasis","q":"Which coagulation factor is not affected during warfarin (coumarin derivative) therapy","opts":["factor X","prothrombin","factor VII","fibrinogen"],"correct":[3],"why":"Fibrinogen is factor I and does not require vitamin K-dependent activation.","src":"Test 3-all gathered.docx.pdf, p. 37 \u00b7 q1000","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor X needs vitamin K-dependent gamma-carboxylation.","Prothrombin, or factor II, also depends on vitamin K.","Factor VII is vitamin K dependent and falls early during treatment.","Fibrinogen is factor I and does not require vitamin K-dependent activation."]},{"id":"midterm3-q1001","topic":"hemostasis","q":"Bleeding into tissue parenchym in hemophilia can be stopped by","opts":["long compression or tamponade","infusion of concentrated missing coagulation factor","transfusion of conserved (stored) whole blood","infusion of platelet concentrate"],"correct":[1],"why":"Replacing factor VIII or IX restores the deficient coagulation activity in hemophilia A or B when factor replacement is appropriate.","src":"Test 3-all gathered.docx.pdf, p. 38 \u00b7 q1001","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Compression alone does not replace the missing clotting factor in significant deep bleeding.","Replacing factor VIII or IX restores the deficient coagulation activity in hemophilia A or B when factor replacement is appropriate.","Whole blood does not specifically and efficiently replace the missing factor.","The primary defect is in coagulation factors, not platelet number."]},{"id":"midterm3-q1002","topic":"hemostasis","q":"Von Willebrand\u2019s disease affects mainly","opts":["platelet degranulation","prothrombin activation","platelet adhesion to subendothelial collagen","fibrin polymerization"],"correct":[2],"why":"vWF bridges exposed collagen and platelet GPIb.","src":"Test 3-all gathered.docx.pdf, p. 38 \u00b7 q1002","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The primary abnormality is vWF-dependent adhesion.","Prothrombin activation depends on the prothrombinase complex.","vWF bridges exposed collagen and platelet GPIb.","Fibrin polymerization occurs downstream after thrombin cleaves fibrinogen."]},{"id":"midterm3-q1004","topic":"hemostasis","q":"Prothrombin time is prolonged","opts":["in Hageman factor (factor XII) deficiency","when the factor X is non-functional","following dicoumarol (warfarin) therapy","in hemophilia"],"correct":[1,2],"why":"Factor X is part of the common pathway that PT measures. Vitamin K antagonism decreases activity of several factors measured by PT, especially factor VII early on.","src":"Test 3-all gathered.docx.pdf, p. 38 \u00b7 q1004","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor XII deficiency prolongs aPTT.","Factor X is part of the common pathway that PT measures.","Vitamin K antagonism decreases activity of several factors measured by PT, especially factor VII early on.","The usual isolated deficiency in hemophilia A or B prolongs aPTT rather than PT."]},{"id":"midterm3-q1008","topic":"hemostasis","q":"Plasma D-dimers","opts":["belong among FDPs (fibrin/fibrinogen degradation products)","are indicators of fibrinolytic activation","are highly sensitive, but not specific for the diagnosis of thromboembolic diseases","are highly specific, but not sensitive for the diagnosis of thromboembolic disease"],"correct":[0,1,2],"why":"D-dimer is a specific product of cross-linked fibrin breakdown, a subset of fibrin degradation products. Plasmin cleavage of cross-linked fibrin releases D-dimer. Highly sensitive assays can support exclusion of venous thromboembolism in appropriately selected low-risk patients.","src":"Test 3-all gathered.docx.pdf, p. 39 \u00b7 q1008","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["D-dimer is a specific product of cross-linked fibrin breakdown, a subset of fibrin degradation products.","Plasmin cleavage of cross-linked fibrin releases D-dimer.","Highly sensitive assays can support exclusion of venous thromboembolism in appropriately selected low-risk patients.","D-dimer can rise in other settings, including inflammation, surgery and pregnancy."]},{"id":"midterm3-q1009","topic":"hemostasis","q":"Which statements describe the platelet GPIIb/IIIa receptor?","opts":["It binds fibrinogen to support aggregation","It is the main receptor for initial von Willebrand factor-mediated adhesion","It is defective in Glanzmann thrombasthenia","It is a fibrinolytic enzyme"],"correct":[0,2],"why":"GPIIb/IIIa bridges adjacent platelets via fibrinogen. GPIb supports initial adhesion through von Willebrand factor.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1009","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Fibrinogen bridges GPIIb/IIIa receptors on adjacent activated platelets.","Initial adhesion under flow relies on GPIb binding von Willebrand factor.","Glanzmann thrombasthenia impairs GPIIb/IIIa-mediated aggregation.","GPIIb/IIIa is a platelet receptor. Plasmin is the enzyme that degrades fibrin."]},{"id":"midterm3-q1010","topic":"hemostasis","q":"Quick test (prothrombin time)","opts":["measures the activity of the intrinsic coagulation pathway","tests the activity of the extrinsic coagulation pathway","is prolonged in hemophilia A","is an essential test for monitoring the heparin therapy"],"correct":[1],"why":"PT assesses the tissue-factor pathway and common pathway.","src":"Test 3-all gathered.docx.pdf, p. 39 \u00b7 q1010","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["aPTT is the classic intrinsic pathway screening test.","PT assesses the tissue-factor pathway and common pathway.","Isolated factor VIII deficiency generally leaves PT normal.","Unfractionated heparin is generally monitored using aPTT or an anti-Xa assay, depending on local practice."]},{"id":"midterm3-q1012","topic":"hemostasis","q":"Thrombophilia","opts":["can be inborn or acquired","is not connected to a higher risk of thromboembolic disease","can participate in atherosclerotic arterial disease","can participate in the development of acute coronary syndrome"],"correct":[0,2,3],"why":"Inherited factor V Leiden and acquired antiphospholipid syndrome are examples of thrombophilia. A prothrombotic state can contribute to clot formation in an artery with atherosclerosis, particularly when a plaque disrupts. An acute coronary syndrome can result when a thrombus forms over a disrupted coronary plaque. The contribution varies with the prothrombotic disorder.","src":"Test 3-all gathered.docx.pdf, p. 39 \u00b7 q1012","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inherited factor V Leiden and acquired antiphospholipid syndrome are examples of thrombophilia.","Thrombophilia is a predisposition to thrombosis and increases thromboembolic risk.","A prothrombotic state can contribute to clot formation in an artery with atherosclerosis, particularly when a plaque disrupts.","An acute coronary syndrome can result when a thrombus forms over a disrupted coronary plaque. The contribution varies with the prothrombotic disorder."]},{"id":"midterm3-q1013","topic":"hemostasis","q":"INR (International normalized ratio)","opts":["is defined as the ratio of the patient plasma Quick test time and of the control plasma, raised to the power of the ISI value for the used analytical system","correlates with the activity of the intrinsic hemocoagulation cascade","is increased in hemophilia A","can be increased in liver disease"],"correct":[0,3],"why":"INR is the patient PT divided by normal PT, with the ratio raised to the thromboplastin reagent\u2019s ISI. Reduced hepatic synthesis of clotting factors can prolong PT and raise INR.","src":"Test 3-all gathered.docx.pdf, p. 39 \u00b7 q1013","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["INR is the patient PT divided by normal PT, with the ratio raised to the thromboplastin reagent\u2019s ISI.","The Quick test is PT and assesses the extrinsic and common pathways.","Isolated factor VIII deficiency prolongs aPTT. PT and INR are typically normal.","Reduced hepatic synthesis of clotting factors can prolong PT and raise INR."]},{"id":"midterm3-q1015","topic":"hemostasis","q":"Which of the following pathological conditions are a risk factor of venous thrombosis","opts":["excess of tPA (tissue plasminogen activator)","fibrinogen deficiency","tPA (tissue plasminogen activator) deficiency","PAI (plasminogen activator inhibitor) deficiency"],"correct":[2],"why":"Reduced tPA activity impairs plasmin generation and fibrinolysis, allowing clots to persist.","src":"send rony.pdf, p. 31 \u00b7 q1015","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Excess tPA increases plasmin generation and promotes clot breakdown. This conflicts with the dot beside this option in the scan.","Fibrinogen provides the substrate for fibrin formation. Deficiency generally impairs clot formation, although some inherited fibrinogen disorders can also be associated with thrombosis.","Reduced tPA activity impairs plasmin generation and fibrinolysis, allowing clots to persist.","Loss of the inhibitor PAI increases fibrinolysis and can cause bleeding. This conflicts with the dot beside this option in the scan."]},{"id":"midterm3-q1016","topic":"hemostasis","q":"Thrombocytopathy","opts":["is defined as an impaired platelet function","is characterized by reduced platelet count","may be associated with pathological bleeding, even with normal platelet counts","is synonymous with thrombocytopenia"],"correct":[0,2],"why":"Thrombocytopathy is a qualitative disorder affecting how platelets function. A normal number of platelets can still fail to adhere, activate, release granules or aggregate effectively.","src":"send rony.pdf, p. 31 \u00b7 q1215","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Thrombocytopathy is a qualitative disorder affecting how platelets function.","Thrombocytopenia describes a reduced platelet count. A functional defect can occur at an adequate count.","A normal number of platelets can still fail to adhere, activate, release granules or aggregate effectively.","Thrombocytopenia describes a quantitative defect. Thrombocytopathy describes a qualitative defect."]},{"id":"midterm3-q1017","topic":"hemostasis","q":"When can vitamin K administration help correct a prolonged INR?","opts":["When vitamin K deficiency reduces factor carboxylation","When isolated factor XII deficiency prolongs aPTT","When aspirin inhibits platelet COX-1","When the sample has EDTA-induced platelet clumping"],"correct":[0],"why":"Vitamin K is required for activation of factors II, VII, IX, and X through gamma-carboxylation.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1017","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Vitamin K restores the cofactor needed to carboxylate newly synthesized factors II, VII, IX, and X.","Factor XII is not vitamin K dependent, and the abnormality is in aPTT rather than INR.","Vitamin K does not reverse irreversible inhibition of platelet COX-1.","EDTA clumping affects the measured platelet count and is resolved by reassessing the sample."]},{"id":"midterm3-q1018","topic":"hemostasis","q":"What can a prolonged PT help assess?","opts":["Reduced hepatic synthesis of coagulation factors","Reduced tissue-factor and common pathway activity","Impaired platelet adhesion as a direct measure","Isolated intrinsic pathway activity as its main role"],"correct":[0,1],"why":"PT reflects extrinsic and common pathway clotting. It can also serve as a marker of hepatic synthetic function.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1018","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Loss of hepatic synthetic capacity can lower activity of PT-sensitive clotting factors.","PT initiates coagulation with tissue factor and depends on the common pathway.","Adhesion depends on platelet receptors and von Willebrand factor.","aPTT is the routine test for intrinsic pathway activity."]},{"id":"midterm3-q1019","topic":"hemostasis","q":"Which are acquired risk factors for venous thrombosis?","opts":["Estrogen exposure","Nephrotic syndrome","Inherited factor V Leiden","Congenital protein C deficiency"],"correct":[0,1],"why":"Estrogen affects coagulation factors, and nephrotic syndrome can alter circulating anticoagulant and procoagulant proteins.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1019","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Estrogen exposure can shift coagulation toward thrombosis.","Nephrotic syndrome can involve urinary loss of anticoagulant proteins and increased procoagulant activity.","The Leiden variant is a germline risk factor.","Congenital protein C deficiency is inherited."]},{"id":"midterm3-q1022","topic":"hemostasis","q":"How does fibrinogen usually behave during an inflammatory acute-phase response?","opts":["It can rise as a positive acute-phase protein","It is necessarily depleted in every inflammatory state","It remains fixed regardless of inflammation","It rises only through vitamin K activation"],"correct":[0],"why":"Inflammatory signaling increases hepatic production of fibrinogen.","src":"TEST 3.docx.pdf, p. 24 \u00b7 q1022","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammatory signaling can increase hepatic fibrinogen synthesis.","Consumption can lower fibrinogen in some conditions, but inflammation alone need not deplete it.","Its production responds to inflammatory signaling.","Fibrinogen is not a vitamin K-dependent protein."]},{"id":"midterm3-q1023","topic":"hemostasis","q":"Which can prolong both PT and aPTT?","opts":["Consumptive DIC","Severe depletion of multiple vitamin K-dependent factors","Isolated factor VIII deficiency as the usual pattern","Isolated factor XII deficiency as the usual pattern"],"correct":[0,1],"why":"A process affecting several clotting factors or the common pathway can prolong both assays.","src":"TEST 3.docx.pdf, p. 24 \u00b7 q1023","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Systemic clotting consumes several factors and can prolong both tests.","Severe depletion of factors spanning the pathways can prolong both tests.","Isolated factor VIII deficiency typically prolongs aPTT while PT remains normal.","Isolated XII deficiency affects aPTT, with PT generally normal."]},{"id":"midterm3-q1024","topic":"hemostasis","q":"What best explains spontaneous recurrent hemarthrosis in severe hemophilia A?","opts":["Deficient intrinsic pathway amplification due to low factor VIII activity","Increased platelet adhesion","Reduced plasmin formation from excess inhibitor","Isolated reduction of platelet count"],"correct":[0],"why":"Factor VIII deficiency impairs stable fibrin formation, producing deep-tissue and joint bleeding.","src":"TEST 3.docx.pdf, p. 24 \u00b7 q1024","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor VIII supports intrinsic tenase. Severe deficiency reduces thrombin generation and causes deep bleeding.","Stronger adhesion would support the platelet plug and does not explain the bleeding.","Less plasmin would slow fibrin breakdown and does not account for the inherited factor defect.","Thrombocytopenia more typically produces petechiae and mucosal bleeding."]},{"id":"midterm3-q1027","topic":"hemostasis","q":"Deficit of clotting factor XIII (fibrin-stabilizing factor) leads to changes in which of the following coagulation tests","opts":["activated partial thromboplastin time (aPTT)","prothrombin time (Quick test)","plasma concentrations of fibrinogen","the results of all of the above are normal"],"correct":[3],"why":"Because factor XIII acts after initial fibrin formation, these screening tests can all be normal.","src":"Test 3-all gathered.docx.pdf, p. 40 \u00b7 q1027","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["aPTT measures time to initial clot formation before factor XIII cross-linking.","PT also ends at clot formation and can remain normal.","Cross-linking failure does not require low fibrinogen concentration.","Because factor XIII acts after initial fibrin formation, these screening tests can all be normal."]},{"id":"midterm3-q1028","topic":"hemostasis","q":"In vivo inhibitors of coagulation cascade include","opts":["calcium chelators","warfarin","heparin","plasminogen activators"],"correct":[1,2],"why":"Warfarin reduces production of functional vitamin K-dependent clotting factors. Heparin accelerates inhibition of clotting proteases by antithrombin.","src":"Test 3-all gathered.docx.pdf, p. 40 \u00b7 q1028","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Chelation is used to anticoagulate specimens and is not the intended in vivo treatment here.","Warfarin reduces production of functional vitamin K-dependent clotting factors.","Heparin accelerates inhibition of clotting proteases by antithrombin.","Plasminogen activators promote clot breakdown rather than inhibit the coagulation cascade directly."]},{"id":"midterm3-q1029","topic":"hemostasis","q":"How does heparin inhibit coagulation?","opts":["It enhances antithrombin-mediated inhibition of factor Xa","It inhibits vitamin K recycling","Unfractionated heparin enhances antithrombin-mediated inhibition of thrombin","It directly blocks platelet GPIIb/IIIa"],"correct":[0,2],"why":"Heparin potentiates antithrombin. Unfractionated heparin can inhibit both Xa and thrombin.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1029","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Heparin accelerates inhibition of Xa by antithrombin.","Warfarin interferes with recycling of vitamin K.","Unfractionated heparin has chains long enough to bridge antithrombin and thrombin.","GPIIb/IIIa antagonists inhibit aggregation by blocking this platelet receptor."]},{"id":"midterm3-q1030","topic":"hemostasis","q":"Duke test (estimation of bleeding time) is positive (e. g. prolonged) in which of the following diseases","opts":["von Willebrand\u2019s disease","severe thrombocytopenia","hemophilia A","Leiden mutation of factor V"],"correct":[0,1],"why":"Poor vWF-dependent platelet adhesion can prolong historical bleeding time. Too few platelets impair formation of the primary hemostatic plug.","src":"Test 3-all gathered.docx.pdf, p. 40 \u00b7 q1030","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Poor vWF-dependent platelet adhesion can prolong historical bleeding time.","Too few platelets impair formation of the primary hemostatic plug.","Hemophilia A chiefly affects secondary hemostasis.","Factor V Leiden predisposes to thrombosis without a primary platelet plug defect."]},{"id":"midterm3-q1033","topic":"hemostasis","q":"Which hormone is the main regulator of platelet production?","opts":["Thrombopoietin","Erythropoietin","Aldosterone","Hepcidin"],"correct":[0],"why":"Thrombopoietin stimulates megakaryocyte development and production of platelets.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1033","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Thrombopoietin stimulates megakaryocyte maturation and platelet production.","Erythropoietin primarily supports erythroid precursors.","Aldosterone regulates renal sodium and potassium handling.","Hepcidin regulates iron transport through ferroportin."]},{"id":"midterm3-q0850","topic":"hemostasis","q":"Non-inherited hypercoagulation disorders are connected with","opts":["endothelial dysfunction","essential thrombocytopenia","estrogen therapy","increased blood flow in the case of heart failure"],"correct":[0,2],"why":"Dysfunctional endothelium can lose protective anticoagulant and antiplatelet functions. Estrogen therapy increases thrombotic risk through effects on coagulation proteins.","src":"Test 3-all gathered.docx.pdf, p. 41 \u00b7 q0850","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Dysfunctional endothelium can lose protective anticoagulant and antiplatelet functions.","The source says thrombocytopenia. Essential thrombocythaemia is a different diagnosis and can raise thrombosis risk.","Estrogen therapy increases thrombotic risk through effects on coagulation proteins.","Heart failure can promote thrombosis through slow flow and venous stasis."]},{"id":"midterm3-q0853","topic":"liver","q":"Which ion transport protein is disrupted in cystic fibrosis?","opts":["An epithelial sodium pump","A voltage-gated calcium channel","The CFTR chloride and bicarbonate channel","A potassium channel in skeletal muscle"],"correct":[2],"why":"CFTR dysfunction alters epithelial salt and water transport and can obstruct pancreatic ducts.","src":"TEST 3.docx.pdf, p. 26 \u00b7 q0853","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Sodium transport can be affected indirectly, but the defective protein is CFTR.","CFTR is an anion channel rather than a voltage-gated calcium channel.","Disrupted chloride and bicarbonate transport alters epithelial secretions and can obstruct pancreatic ducts.","The affected protein is not a skeletal-muscle potassium channel."]},{"id":"midterm3-q1046","topic":"hemostasis","q":"How can an acute stress response affect hemostasis?","opts":["It can transiently increase platelet and coagulation activity","It obligatorily causes complete fibrinogen depletion","It prevents platelet activation","It eliminates tissue factor expression in injured tissue"],"correct":[0],"why":"Acute stress can shift hemostatic activity in a procoagulant direction.","src":"TEST 3.docx.pdf, p. 28 \u00b7 q1046","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Acute stress can transiently increase platelet activation and plasma coagulability.","Complete fibrinogen depletion is not a routine stress response.","Adrenergic stress can enhance platelet reactivity.","Injured tissue can still expose or express tissue factor during stress."]},{"id":"midterm3-q1356","topic":"liver","q":"What mechanism explains Gilbert syndrome?","opts":["Reduced bilirubin conjugation causing mild unconjugated hyperbilirubinemia","Complete obstruction of the common bile duct","An isolated increase in conjugated bilirubin from duct injury","Excess erythropoietin as the primary defect"],"correct":[0],"why":"Reduced UGT1A1 activity produces intermittent mild unconjugated hyperbilirubinemia.","src":"Test 3-all gathered.docx, p. 1 \u00b7 q1356","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced UGT1A1 activity lowers conjugation capacity, causing mild intermittent unconjugated hyperbilirubinemia.","Common duct obstruction mainly raises conjugated bilirubin.","Cholestatic duct injury can cause a conjugated rise, but Gilbert syndrome affects conjugation.","Erythropoietin controls red-cell production and does not explain reduced conjugation."]},{"id":"midterm3-q0253","topic":"liver","q":"Which bilirubin fraction typically increases in Gilbert syndrome during fasting or illness?","opts":["Unconjugated bilirubin","Only conjugated bilirubin","Neither fraction can increase","Bilirubin in urine from albumin-bound unconjugated bilirubin"],"correct":[0],"why":"Reduced conjugation leads to intermittent unconjugated hyperbilirubinemia.","src":"Test 3-all gathered.docx.pdf, p. 1 \u00b7 q0253","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Fasting or illness can expose the limited UGT1A1 conjugation capacity, raising unconjugated bilirubin.","A conjugated rise suggests impaired biliary excretion instead.","The unconjugated fraction can rise intermittently.","Unconjugated bilirubin is albumin-bound and cannot readily be filtered."]},{"id":"midterm3-q0313","topic":"hemostasis","q":"Why can INR increase in advanced liver disease?","opts":["Reduced production of some clotting factors prolongs PT","Loss of factor VIII is the only mechanism","A higher platelet count directly prolongs PT","Increased bilirubin directly creates a longer intrinsic pathway"],"correct":[0],"why":"Loss of hepatic synthetic function can lower factor activity measured by the PT.","src":"Test 3-all gathered.docx.pdf, p. 4 \u00b7 q0313","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced hepatic synthesis lowers clotting factor activity, prolonging PT and raising INR.","Isolated VIII deficiency chiefly affects aPTT. Several liver-synthesized factors can affect INR.","The platelet count does not directly determine this plasma clotting assay.","INR is derived from PT and reflects tissue-factor and common pathway function."]},{"id":"midterm3-q0316","topic":"blood","q":"What erythropoietin pattern can be seen in secondary erythrocytosis caused by chronic hypoxia?","opts":["Increased or inappropriately normal erythropoietin","Suppressed erythropoietin as the required finding","Absent erythropoietin in all cases","A level determined exclusively by the platelet count"],"correct":[0],"why":"Hypoxic signaling stimulates EPO. In polycythemia vera, autonomous marrow production often suppresses EPO.","src":"Test 3-all gathered.docx.pdf, p. 4 \u00b7 q0316","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Renal oxygen sensing stimulates EPO. A normal result can be inappropriately high relative to the increased red-cell mass.","Suppressed EPO more strongly suggests autonomous erythrocytosis such as polycythemia vera.","Hypoxia normally stimulates EPO production.","Oxygen delivery to the kidney is the main signal, independent of platelet count."]},{"id":"midterm3-q0331","topic":"blood","q":"Which findings can occur in multiple myeloma?","opts":["A monoclonal immunoglobulin or light chain","Lytic bone lesions","Anemia or renal impairment","An isolated inherited platelet adhesion defect as the cause"],"correct":[0,1,2],"why":"Clonal plasma cells and their secreted proteins can damage bone and kidney and suppress normal marrow function.","src":"Test 3-all gathered.docx.pdf, p. 7 \u00b7 q0331","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A plasma-cell clone can secrete a monoclonal immunoglobulin or excess light chains.","Myeloma increases osteoclast activity and promotes bone resorption.","Marrow involvement can cause anemia, and light chains can contribute to kidney injury.","Inherited platelet adhesion defects are a separate disorder of primary hemostasis."]},{"id":"midterm3-q0350","topic":"blood","q":"What commonly explains neutrophilia after glucocorticoid administration?","opts":["Demargination of neutrophils into the circulating pool","Immediate conversion of lymphocytes into neutrophils","Obligate marrow aplasia","An increase in eosinophil recruitment as its main mechanism"],"correct":[0],"why":"Glucocorticoids alter neutrophil distribution and trafficking, increasing the measured circulating count.","src":"Test 3-all gathered.docx.pdf, p. 10 \u00b7 q0350","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced adhesion and redistribution move neutrophils from the marginal pool into sampled blood.","These are distinct cell lineages and do not rapidly convert into one another.","Marrow aplasia lowers granulocyte production.","Glucocorticoids typically reduce circulating eosinophils. Their neutrophil effect is largely redistribution."]},{"id":"midterm3-q0384","topic":"blood","q":"Reticulocytes may be in the blood increased by","opts":["chronic myeloid leukemia","in a patient after acute severe bleeding","aplastic anemia","intravascular hemolysis"],"correct":[1,3],"why":"After blood loss, an intact marrow increases red-cell production and the reticulocyte count rises after a delay. When marrow function is intact, loss of red cells to hemolysis stimulates reticulocyte production.","src":"From Ulvi/\u05d1\u05d9\u05d0\u05e0\u05d9 \u05de\u05e9\u05d0\u05dc\u05d4 123.pdf, p. 194 \u00b7 q1589","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Chronic myeloid leukemia primarily expands the granulocytic lineage.","After blood loss, an intact marrow increases red-cell production and the reticulocyte count rises after a delay.","Marrow failure reduces reticulocyte production.","When marrow function is intact, loss of red cells to hemolysis stimulates reticulocyte production."]},{"id":"midterm3-q1507","topic":"blood","q":"Which mechanism defines pernicious anemia?","opts":["Impaired B12 absorption due to loss of intrinsic factor","Reduced iron intake alone","Excess erythropoietin","A germline defect of globin synthesis"],"correct":[0],"why":"Autoimmune injury to gastric parietal cells and intrinsic factor can cause B12 deficiency.","src":"Test 3-all gathered.docx.pdf, p. 28 \u00b7 q1507","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Autoimmune gastric injury or antibodies against intrinsic factor impair ileal uptake of B12.","Low iron intake produces iron deficiency rather than autoimmune loss of intrinsic factor.","EPO promotes erythropoiesis and does not explain loss of intrinsic factor.","Globin-gene defects cause thalassemia and do not alter B12 absorption."]},{"id":"midterm3-q0195","topic":"blood","q":"Megaloblastic anaemia can be caused by which of the following GIT diseases","opts":["duodenum resection","atrophic gastritis","ileum resection","gastrectomy"],"correct":[1,2,3],"why":"Atrophic gastritis can reduce intrinsic factor production and impair B12 absorption. Terminal ileal resection can block uptake of intrinsic factor-bound B12. Gastrectomy reduces the gastric source of intrinsic factor.","src":"Test 3-all gathered.docx.pdf, p. 32 \u00b7 q0195","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The duodenum is important for iron absorption. The terminal ileum absorbs the intrinsic factor\u2013B12 complex.","Atrophic gastritis can reduce intrinsic factor production and impair B12 absorption.","Terminal ileal resection can block uptake of intrinsic factor-bound B12.","Gastrectomy reduces the gastric source of intrinsic factor."]},{"id":"midterm3-q0202","topic":"liver","q":"Which of these signs are present in decompensated liver cirrhosis","opts":["encephalopathy","prolonged prothrombin time","icterus (jaundice)","fluid retention"],"correct":[0,1,2,3],"why":"Impaired detoxification and portosystemic shunting contribute to encephalopathy. Poor synthesis of clotting factors can prolong PT. Impaired bilirubin handling can cause jaundice. Portal hypertension and renal sodium retention can produce ascites and edema.","src":"Test 3-all gathered.docx.pdf, p. 32 \u00b7 q0202","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Impaired detoxification and portosystemic shunting contribute to encephalopathy.","Poor synthesis of clotting factors can prolong PT.","Impaired bilirubin handling can cause jaundice.","Portal hypertension and renal sodium retention can produce ascites and edema."]},{"id":"midterm3-q0203","topic":"liver","q":"Which of the following conditions are known as etiological factors of liver cirrhosis","opts":["hepatitis A","hepatitis C","Wilson\u2019s disease","alpha-1-antitrypsin deficiency"],"correct":[1,2,3],"why":"Persistent hepatitis C can cause progressive inflammation and fibrosis. Copper accumulation injures hepatocytes in Wilson disease. Misfolded alpha-1-antitrypsin can accumulate and injure hepatocytes.","src":"Test 3-all gathered.docx.pdf, p. 32 \u00b7 q0203","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hepatitis A ordinarily resolves as an acute infection and does not cause chronic hepatitis.","Persistent hepatitis C can cause progressive inflammation and fibrosis.","Copper accumulation injures hepatocytes in Wilson disease.","Misfolded alpha-1-antitrypsin can accumulate and injure hepatocytes."]},{"id":"midterm3-q1073","topic":"liver","q":"Which of the hepatitis-causing viruses (can be) are typically transmitted via transfusion","opts":["hepatitis A virus","hepatitis B virus","hepatitis C virus","none of the above"],"correct":[1,2],"why":"HBV is blood-borne. Donor screening greatly reduces this historic route. HCV is blood-borne and was an important cause of post-transfusion hepatitis before screening.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1073","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["HAV is mainly transmitted by the fecal\u2013oral route.","HBV is blood-borne. Donor screening greatly reduces this historic route.","HCV is blood-borne and was an important cause of post-transfusion hepatitis before screening.","Hepatitis B and C are both classic blood-borne examples."]},{"id":"midterm3-q1074","topic":"liver","q":"The pathogenesis of hepatic encephalopathy does NOT involve","opts":["ammonia","urea","portocaval anastomosis","GIT bleeding"],"correct":[1],"why":"Urea is the less toxic product of hepatic ammonia detoxification.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1074","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Ammonia accumulation contributes to astrocyte dysfunction.","Urea is the less toxic product of hepatic ammonia detoxification.","Portosystemic collateral flow bypasses hepatic detoxification.","Luminal blood supplies nitrogen for ammonia production and can precipitate encephalopathy."]},{"id":"midterm3-q1075","topic":"liver","q":"What promotes renal sodium retention in cirrhosis with ascites?","opts":["Reduced effective arterial filling","Activation of the renin\u2013angiotensin\u2013aldosterone system","Suppression of aldosterone in every case","Increased effective arterial volume as the main stimulus"],"correct":[0,1],"why":"Splanchnic vasodilation reduces effective arterial filling and activates sodium-retaining responses.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1075","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Splanchnic vasodilation can leave the arterial circulation underfilled despite excess total fluid.","Renin, angiotensin II, and aldosterone promote retention to compensate for underfilling.","Aldosterone often increases when arterial filling is inadequate.","Reduced effective arterial filling, even with total-body fluid excess, is the stimulus."]},{"id":"midterm3-q1076","topic":"liver","q":"The clinical picture of a long-lasting obstructive icterus does NOT include","opts":["pruritus","acholic stool","presence of urobilinogen in urine","defects of hemocoagulation"],"correct":[2],"why":"Complete obstruction reduces the bilirubin available to intestinal bacteria, lowering urinary urobilinogen.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1076","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Cholestasis can cause itching.","Little or no bile pigment reaches the intestine during complete obstruction, making stool pale.","Complete obstruction reduces the bilirubin available to intestinal bacteria, lowering urinary urobilinogen.","Reduced intestinal bile impairs vitamin K absorption and can prolong PT."]},{"id":"midterm3-q1077","topic":"liver","q":"Ascites is not a symptom of which of the following conditions","opts":["right sided heart failure","Budd-Chiari syndrome","nephrotic syndrome","acute left sided heart failure"],"correct":[3],"why":"Acute isolated left-sided failure raises pulmonary venous pressure and primarily produces pulmonary congestion.","src":"Test 3-all gathered.docx.pdf, p. 34 \u00b7 q1077","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Raised systemic venous and hepatic sinusoidal pressure can drive fluid accumulation in the abdomen.","Hepatic venous outflow obstruction causes sinusoidal congestion and can produce ascites.","Urinary protein loss reduces plasma oncotic pressure. Renal sodium retention can further contribute to edema and ascites.","Acute isolated left-sided failure raises pulmonary venous pressure and primarily produces pulmonary congestion."]},{"id":"midterm3-q1083","topic":"liver","q":"Which of the following factors play role in the pathogenesis of acute pancreatitis","opts":["decreased activity of cathepsin B","increased intracellular activation of trypsin","decreased phospholipase A2 activity","increased elastase activity"],"correct":[1,3],"why":"Premature trypsin activation can activate other digestive enzymes and initiate autodigestion. Elastase can damage vessel walls and surrounding tissues.","src":"Test 3-all gathered.docx.pdf, p. 35 \u00b7 q1083","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Cathepsin B can activate trypsinogen in abnormal intracellular compartments.","Premature trypsin activation can activate other digestive enzymes and initiate autodigestion.","Activated phospholipase A2 contributes to membrane injury.","Elastase can damage vessel walls and surrounding tissues."]},{"id":"midterm3-q1084","topic":"liver","q":"The most frequent cause of chronic pancreatitis is","opts":["cholelithiasis","alcoholism","hyperlipidemia","chronic drugs abuse"],"correct":[1],"why":"The compilation uses alcohol as the classic cause of chronic pancreatic injury and fibrosis. Etiologic frequencies vary by population.","src":"Test 3-all gathered.docx.pdf, p. 35 \u00b7 q1084","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Gallstones classically precipitate acute pancreatitis.","The compilation uses alcohol as the classic cause of chronic pancreatic injury and fibrosis. Etiologic frequencies vary by population.","Severe hypertriglyceridemia is primarily a recognized trigger of acute pancreatitis.","Some drugs can precipitate acute pancreatitis. Chronic drug abuse is not the classically expected answer here."]},{"id":"midterm3-q1111","topic":"immunity","q":"Which defects characterize chronic granulomatous disease?","opts":["Impaired intracellular killing in phagocytes","Defective neutrophil adhesion as the primary mechanism","Reduced production of reactive oxygen species by phagocytes","Absent circulating neutrophils in every case"],"correct":[0,2],"why":"Defective NADPH oxidase limits the phagocyte oxidative burst.","src":"YD folder.pdf, p. 22 \u00b7 q1111","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Phagocytes ingest organisms but cannot kill some microbes effectively.","Impaired leukocyte adhesion and extravasation point toward leukocyte adhesion deficiency.","Defective NADPH oxidase limits the respiratory burst.","Cell number can be normal. The problem is oxidative killing."]},{"id":"midterm3-q1113","topic":"immunity","q":"Type 1 allergic reaction is not involved in the pathogenesis of the disease","opts":["hives (urtricaria)","hay fever","systemic lupus erythematosus","bronchial asthma"],"correct":[2],"why":"Immune complexes and other autoantibody effects are central in lupus, rather than classic immediate IgE-mediated allergy.","src":"YE.pdf.pdf, p. 30 \u00b7 q0860","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Allergic hives may arise from IgE-mediated mast-cell activation.","Hay fever is allergic rhinitis and is a classic type I response.","Immune complexes and other autoantibody effects are central in lupus, rather than classic immediate IgE-mediated allergy.","Allergic asthma can involve IgE-mediated mast-cell activation."]},{"id":"midterm3-q1206","topic":"hemostasis","q":"Which protein mediates the anticoagulant effect of heparin?","opts":["Protein C","Antithrombin","Thrombomodulin","Fibrinogen"],"correct":[1],"why":"Heparin potentiates antithrombin-mediated inhibition of activated coagulation factors.","src":"YD folder.pdf, p. 54 \u00b7 q1206","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Activated protein C inactivates Va and VIIIa but does not mediate heparin's effect.","Heparin potentiates antithrombin inhibition of factor Xa and, particularly with unfractionated heparin, thrombin.","Thrombomodulin alters thrombin activity to promote protein C activation.","Fibrinogen is a substrate for thrombin, not a heparin-activated inhibitor."]},{"id":"midterm3-q0855","topic":"blood","q":"What can happen after repeated red cell transfusions?","opts":["Systemic iron deposition increases","Transferrin saturation can increase","Iron stores inevitably decline","Copper deposition is the defining complication"],"correct":[0,1],"why":"Each transfusion adds iron, and humans have limited capacity to excrete excess iron.","src":"YE.pdf.pdf, p. 1 \u00b7 q0855","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Red cell transfusions deliver iron, which can accumulate in tissue.","Iron loading can increase the proportion of transferrin carrying iron.","Repeated transfusions usually add iron to the body.","Iron deposition is the classic overload complication."]},{"id":"midterm3-q0857","topic":"liver","q":"Which are common triggers of acute pancreatitis?","opts":["Gallstones","Alcohol exposure","Isolated hyperglycemia","Gastrin hypersecretion"],"correct":[0,1],"why":"Gallstones can obstruct pancreatic outflow, and alcohol can promote acinar injury.","src":"YE.pdf.pdf, p. 7 \u00b7 q0857","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A migrating stone can transiently obstruct pancreatic outflow at the ampulla.","Alcohol can damage acinar cells and promote premature enzyme activation.","Hyperglycemia alone is not a common initiating cause and can be a consequence of pancreatic injury.","Gastrin regulates acid secretion and is not a usual trigger of acute pancreatitis."]},{"id":"midterm3-q0596","topic":"liver","q":"The principle of alleviating the symptoms of hepatic encephalopathy with lactulose is:","opts":["in reducing the level of ammonia in the blood","in preventing manifestations of asterixis","none of the answers are correct","reducing the production of toxic substances by inducing diarrhea"],"correct":[0],"why":"Colonic bacteria ferment lactulose and 68 \u00b7 q0865","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Iron deficiency restricts hemoglobin production and tends toward microcytosis.","Loss of gastric intrinsic factor can impair vitamin B12 absorption.","Hepcidin restricts iron availability. It does not directly block DNA synthesis in erythroid cells.","Either deficiency can impair DNA synthesis and delay nuclear maturation."]},{"id":"midterm3-q0869","topic":"hemostasis","q":"Typical changes in coagulation screening tests in von Willebrand disease are (1):","opts":["increased aPTT and increased D-dimers","increased aPTT and increased bleeding time","decreased Quick index and increased Duke bleeding time","no answer is correct","increased PT and decreased Duke bleeding time"],"correct":[1],"why":"Loss of vWF can impair platelet adhesion and prolong historical bleeding time. If factor VIII activity falls sufficiently, aPTT can also be prolonged.","src":"Selected.pdf, p. 29 \u00b7 q0953","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["D-dimer is a fibrin turnover marker and is not characteristically elevated due to vWF deficiency alone.","Loss of vWF can impair platelet adhesion and prolong historical bleeding time. If factor VIII activity falls sufficiently, aPTT can also be prolonged.","Impaired platelet adhesion can prolong bleeding time, but PT or Quick index is generally unaffected.","The second choice describes the classic combined pattern. Screening tests can still be normal in mild disease.","PT generally remains normal and impaired adhesion may prolong rather than shorten bleeding time."]},{"id":"midterm3-q0601","topic":"blood","q":"Paroxysmal nocturnal hemoglobinuria (PNH)","opts":["in the pathogenesis of their symptoms, the drop in blood pH during sleep and the activation of complement is applied","it is caused by the lack of some protective proteins on the erythrocyte membrane","it arises as a result of excessive production of complement components","i causes hemophilia A.","TTP can involve impaired cleavage of large vWF multimers. Primary deficiency of vWF itself is a different disorder.","Microvascular injury can impair kidney function, especially in HUS.","Neurologic abnormalities are particularly characteristic of TTP and can occur in either condition.","Red cells can fragment as they pass through affected small vessels, causing microangiopathic hemolytic anemia."]},{"id":"midterm3-q1131","topic":"hemostasis","q":"Which finding is more characteristic of defective secondary hemostasis than defective primary hemostasis?","opts":["Petechiae","Epistaxis","Hemarthrosis","Mucosal bleeding"],"correct":[2],"why":"Deep joint bleeding suggests a coagulation factor disorder. Platelet defects more often cause mucocutaneous bleeding.","src":"midterm 3 long Copy.pdf, p. 36 \u00b7 q1131 \u00b7 Ulvi PDF, p. 249 \u00b7 q1131","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Petechiae suggest failure of platelet or vessel-wall hemostasis.","Nosebleeds are commonly mucocutaneous manifestations of primary hemostatic defects.","Bleeding into joints is characteristic of a deficiency in clotting factors such as VIII or IX.","Mucosal bleeding is more typical of platelet or vessel-wall defects."]},{"id":"midterm3-q1209","topic":"hemostasis","q":"What complex converts prothrombin into thrombin in the common pathway?","opts":["Factor Xa and factor Va assembled on a phospholipid surface","Factor XII and prekallikrein","Factor IXa and factor VIIIa alone","Plasmin with tPA"],"correct":[0],"why":"The Xa\u2013Va prothrombinase complex catalyzes thrombin formation.","src":"midterm 3 long Copy.pdf, p. 37 \u00b7 q1209","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Xa combines with its cofactor Va on phospholipid to accelerate thrombin generation.","Factor XII and prekallikrein participate in contact activation upstream.","IXa and VIIIa form intrinsic tenase, which activates X.","tPA generates plasmin, which degrades fibrin."]},{"id":"midterm3-q1132","topic":"hemostasis","q":"Which disorder can lower factor VIII activity by reducing its stability in plasma?","opts":["Hemophilia B","Von Willebrand disease","Isolated vitamin K deficiency","Factor XI deficiency"],"correct":[1],"why":"Von Willebrand factor carries and stabilizes factor VIII in circulation.","src":"midterm 3 long Copy.pdf, p. 39 \u00b7 q1132","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hemophilia B is a deficiency of factor IX.","Von Willebrand factor protects VIII from clearance, so its loss can lower VIII activity.","Factor VIII is not vitamin K dependent.","Factor XI deficiency affects intrinsic pathway activity without reducing VIII stability."]},{"id":"midterm3-q1134","topic":"blood","q":"Which findings are characteristic of megaloblastic anemia due to B12 or folate deficiency?","opts":["Macrocytosis","Marrow megaloblasts","Uniform microcytosis","Accelerated nuclear maturation"],"correct":[0,1],"why":"Impaired DNA synthesis delays nuclear maturation and produces enlarged precursors.","src":"midterm 3 long Copy.pdf, p. 42 \u00b7 q1134","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Delayed nuclear maturation produces enlarged erythroid cells.","Marrow erythroid precursors become enlarged with nuclear\u2013cytoplasmic asynchrony.","Microcytosis points more toward impaired hemoglobin synthesis.","B12 and folate deficiency impair DNA synthesis and therefore delay nuclear maturation."]},{"id":"midterm3-q1143","topic":"blood","q":"Anemia of chronic diseases arises","opts":["during inflammation caused by inflammatory cytokines","as a result of bleeding","e.g. in case of chronic infections, rheumatic inflammations","with a lack of folic acid"],"correct":[0,2],"why":"Inflammatory cytokines increase hepcidin, reducing available iron for erythropoiesis. Persistent infection and rheumatic inflammation can activate the inflammatory response that restricts iron.","optionWhy":["Inflammatory cytokines increase hepcidin, reducing available iron for erythropoiesis.","Blood loss can cause iron deficiency through actual loss of iron.","Persistent infection and rheumatic inflammation can activate the inflammatory response that restricts iron.","Folate deficiency impairs DNA synthesis and can cause megaloblastic anemia."],"src":"Copy of Czech Ws was 3.pdf, p. 174 \u00b7 q0912","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1211","topic":"liver","q":"Hepatorenal syndrome","opts":["is caused by direct damage to the kidneys by ammonia","is a functional kidney failure","is often connected to ascites caused by portal hypertension in liver failure","is a secondary liver failure, which occurs as a complication of kidney failure"],"correct":[1,2],"why":"Reduced renal perfusion and filtration can occur without a primary structural renal lesion. Portal hypertension and splanchnic vasodilation in advanced cirrhosis with ascites lower effective arterial volume.","src":"Test 3-all gathered.docx.pdf, p. 35 \u00b7 q1211","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The main mechanism is circulatory dysfunction and renal vasoconstriction.","Reduced renal perfusion and filtration can occur without a primary structural renal lesion.","Portal hypertension and splanchnic vasodilation in advanced cirrhosis with ascites lower effective arterial volume.","The renal dysfunction develops in the setting of advanced liver disease."]},{"id":"midterm3-q0126","topic":"immunity","q":"Which mechanism and example fit type III hypersensitivity?","opts":["Soluble immune complexes deposit and activate complement","Serum sickness is a classic example","It is initiated by allergen-specific IgE on mast cells","It requires antibodies against a fixed cell surface as its defining mechanism"],"correct":[0,1],"why":"Immune complexes can deposit in vessels and tissues and trigger complement-dependent inflammation.","src":"test 4 pp.docx, p. 1 \u00b7 q0126","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Deposited soluble complexes activate complement and recruit inflammatory cells.","Serum sickness is a systemic immune-complex reaction.","IgE and mast-cell activation define type I hypersensitivity.","Antibodies directed against fixed surface or matrix antigens define type II."]},{"id":"midterm3-q0130","topic":"blood","q":"Which complications can follow transfusion?","opts":["Acute hemolytic transfusion reaction","Transfusion-related acute lung injury","Transfusion-associated circulatory overload","An inherited factor V Leiden mutation"],"correct":[0,1,2],"why":"Transfusion complications can involve antibody-mediated hemolysis, inflammatory lung injury, or excess volume.","src":"test 4 pp.docx, p. 1 \u00b7 q0130","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Recipient antibodies can destroy transfused red cells.","TRALI can cause permeability pulmonary edema after transfusion.","TACO reflects circulatory overload and hydrostatic pulmonary edema.","Factor V Leiden is inherited rather than acquired from a transfusion."]},{"id":"midterm3-q0131","topic":"blood","q":"Which are intrinsic red-cell causes of hemolysis?","opts":["Hereditary spherocytosis","G6PD deficiency","Sickle cell disease","Mechanical fragmentation across a damaged valve"],"correct":[0,1,2],"why":"Intrinsic defects affect the red-cell membrane, enzymes, or hemoglobin. Mechanical injury is extrinsic.","src":"test 4 pp.docx, p. 1 \u00b7 q0131","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A membrane or cytoskeletal defect reduces red-cell deformability and promotes splenic removal.","An intrinsic enzyme defect reduces protection against oxidative stress.","A hemoglobin variant can polymerize and make red cells fragile.","A damaged valve applies an external mechanical force to red cells."]},{"id":"midterm3-q0139","topic":"immunity","q":"Which example illustrates destruction of a cell by antibodies directed against its surface antigens?","opts":["Autoimmune hemolytic anemia","Contact dermatitis","Serum sickness","Allergic rhinitis"],"correct":[0],"why":"Antibodies directed against red cell surface antigens can promote clearance or complement-mediated injury.","src":"test 4 pp.docx, p. 1 \u00b7 q0139","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Antibodies bind erythrocyte surface targets and promote clearance or complement injury.","Allergic contact dermatitis is delayed and T-cell mediated.","Serum sickness involves soluble immune complexes rather than antibodies against red-cell surfaces.","Allergic rhinitis is typically a type I IgE reaction."]},{"id":"midterm3-q0141","topic":"immunity","q":"Which example illustrates delayed T-cell-mediated hypersensitivity?","opts":["Allergic contact dermatitis","Acute IgE-mediated anaphylaxis","Serum sickness","Immediate allergic rhinitis"],"correct":[0],"why":"Contact allergens can produce delayed inflammation mediated by previously sensitized T cells.","src":"test 4 pp.docx, p. 1 \u00b7 q0141","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Sensitized T cells respond after re-exposure to contact antigens, often with delayed inflammation.","Anaphylaxis is usually a rapid type I reaction involving mast-cell mediators.","Serum sickness is mediated by immune-complex deposition.","Immediate allergic rhinitis is classically IgE mediated."]},{"id":"midterm3-q0149","topic":"immunity","q":"What immune defect is characteristic of DiGeorge syndrome?","opts":["T-cell deficiency due to thymic hypoplasia","Absent phagocyte oxidative burst as the primary defect","Terminal complement deficiency","Selective loss of platelet adhesion as the primary defect"],"correct":[0],"why":"The thymus is needed for maturation of T cells.","src":"test 4 pp.docx, p. 1 \u00b7 q0149","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced thymic tissue impairs T-cell maturation.","NADPH oxidase deficiency causes chronic granulomatous disease.","Terminal complement deficiency predisposes to invasive Neisseria infection.","Platelet adhesion is not the primary defect in DiGeorge syndrome."]},{"id":"midterm3-q0150","topic":"blood","q":"How do alpha and beta thalassemia differ?","opts":["Alpha thalassemia reduces alpha-globin synthesis","Beta thalassemia reduces beta-globin synthesis","Both result from polymerization of HbS","Both arise from iron deficiency alone"],"correct":[0,1],"why":"In both disorders, imbalance between globin chains contributes to ineffective erythropoiesis and hemolysis.","src":"test 4 pp.docx, p. 1 \u00b7 q0150","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Deficient alpha-chain production leaves excess unmatched non-alpha chains.","Deficient beta-chain production leaves excess alpha chains.","HbS polymerization is the mechanism of sickle cell disease.","Iron deficiency reduces heme availability. Thalassemia reduces globin-chain synthesis."]},{"id":"midterm3-q0153","topic":"blood","q":"What distinguishes relative erythrocytosis from absolute erythrocytosis?","opts":["Relative erythrocytosis can result from reduced plasma volume","Absolute erythrocytosis involves increased red cell mass","Relative erythrocytosis requires increased red cell mass","Absolute erythrocytosis is defined by dehydration alone"],"correct":[0,1],"why":"Hematocrit can rise through hemoconcentration or through a genuine expansion in red cell mass.","src":"test 4 pp.docx, p. 1 \u00b7 q0153","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced plasma volume concentrates existing red cells and raises measured hematocrit.","An actual increase in circulating red-cell mass defines absolute erythrocytosis.","Relative erythrocytosis can occur with normal red-cell mass.","Dehydration mainly causes hemoconcentration rather than expansion of red-cell mass."]},{"id":"midterm3-q0166","topic":"immunity","q":"What drives hyperacute rejection of a transplanted organ?","opts":["Pre-existing recipient antibodies against donor antigens","Delayed sensitization requiring several months","Loss of erythropoietin from transplanted marrow","Primary antibody production by mature donor red cells"],"correct":[0],"why":"Preformed antibodies can rapidly activate complement and injure graft vessels.","src":"test 4 pp.docx, p. 1 \u00b7 q0166","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Pre-existing recipient antibodies bind graft vascular antigens and can quickly trigger complement and thrombosis.","Hyperacute rejection occurs rapidly because relevant antibodies are already present.","Erythropoietin production does not explain rapid graft vascular injury.","Mature donor erythrocytes do not make antibodies."]},{"id":"midterm3-q0174","topic":"immunity","q":"Which target can produce autoimmune disease through receptor stimulation?","opts":["The TSH receptor in Graves disease","The hemoglobin molecule in iron deficiency anemia","Factor IX in inherited hemophilia B","CFTR in cystic fibrosis as the usual mechanism"],"correct":[0],"why":"Thyroid-stimulating autoantibodies activate the receptor and increase thyroid hormone production.","src":"test 4 pp.docx, p. 2 \u00b7 q0174","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Autoantibodies activate the TSH receptor, stimulating thyroid hormone production.","Iron deficiency limits hemoglobin synthesis rather than activating an autoantibody target.","Inherited hemophilia B reflects deficient factor IX activity.","Cystic fibrosis results from inherited CFTR dysfunction."]},{"id":"midterm3-q0179","topic":"blood","q":"Which are extrinsic causes of hemolysis?","opts":["Autoantibodies to red cells","Mechanical injury from a prosthetic valve","Shearing in microangiopathic disease","Inherited spectrin deficiency"],"correct":[0,1,2],"why":"Extrinsic processes damage otherwise normal red cells through external immune or mechanical mechanisms.","src":"test 4 pp.docx, p. 2 \u00b7 q0179","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Antibodies from outside red cells can mark them for clearance or complement attack.","Turbulence or mechanical contact can damage otherwise normal red cells.","Small-vessel obstruction creates shear that fragments red cells.","Spectrin deficiency is an intrinsic defect of the red-cell membrane skeleton."]},{"id":"midterm3-q0182","topic":"blood","q":"Which can cause neutropenia?","opts":["Cytotoxic chemotherapy","Severe marrow failure","Some drug-induced immune reactions","Glucocorticoid-mediated demargination as the typical effect"],"correct":[0,1,2],"why":"Neutrophil counts can fall from impaired production or increased peripheral destruction.","src":"test 4 pp.docx, p. 2 \u00b7 q0182","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Chemotherapy can suppress proliferating granulocyte precursors in marrow.","Marrow failure reduces production of multiple blood-cell lineages.","Drug-dependent immune mechanisms can increase peripheral destruction.","Demargination moves neutrophils into circulating blood and raises the measured count."]},{"id":"midterm3-q1159","topic":"immunity","q":"Which statements about HLA alleles are correct?","opts":["They can mark susceptibility to specific diseases","Only class II alleles are associated with disease","They can contribute to autoimmune susceptibility via antigen presentation","Only class I alleles are associated with disease"],"correct":[0,2],"why":"HLA variation in both classes can affect peptide presentation and predisposition to immune-mediated disease.","src":"\u05e9\u05d7\u05d6\u05d5\u05e8 \u05de\u05d9\u05d3\u05d8\u05e8\u05dd 3 A.pdf, p. 20 \u00b7 q1159","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Some alleles occur more often in people with particular diseases and indicate increased susceptibility.","Class I associations also occur, such as HLA-B27 and ankylosing spondylitis.","Different antigen-binding properties can change presentation of self peptides and influence tolerance.","Class II associations also occur, such as HLA-DQ2 or DQ8 in celiac disease."]},{"id":"midterm3-q1162","topic":"blood","q":"Iron deficiency:","opts":["Is characterized by increased level of ferritin","Can be a consequence of decreased stomach acidity","Can be caused by chronic occult bleeding","Is often caused by rheumatoid arthritis","Can manifest as a microcytic anemia, dysphagia and angular stomatitis"],"correct":[1,2,4],"why":"Gastric acid helps solubilize nonheme iron, so less acidity can impair its uptake. Ongoing blood loss removes iron and can deplete stores. Iron deficiency can produce microcytosis and, when longstanding, oral mucosal changes or dysphagia.","src":"Final PP.pdf.pdf, p. 19 \u00b7 q0841","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Ferritin usually falls with depleted iron stores.","Gastric acid helps solubilize nonheme iron, so less acidity can impair its uptake.","Ongoing blood loss removes iron and can deplete stores.","Rheumatoid arthritis more directly causes inflammation-mediated iron restriction, although concurrent true iron deficiency is possible.","Iron deficiency can produce microcytosis and, when longstanding, oral mucosal changes or dysphagia."]},{"id":"midterm3-q1181","topic":"blood","q":"Select the correct statement(s) about hematopoietic stem cell transplantation","opts":["Peripheral blood can be a source of hematopoietic stem cells","Bone marrow is the only source of hematopoietic stem cells","High HLA compatibility between donor and recipient is important for a successful transplant","The most common type of transplantation is xenotransplantation","Donor stem cells or their progeny can invade recipient cells"],"correct":[0,2,4],"why":"Mobilized peripheral blood is a common source of hematopoietic stem cells. HLA compatibility can  reactions, T-cell cytokines recruit and activate macrophages.","optionWhy":["B cells produce antibodies, and basophils participate in allergic responses. They are not the central delayed effectors.","These granulocytes may enter inflamed tissue, but T cells initiate the delayed reaction.","Plasma cells secrete antibodies. Type IV can proceed without antibodies.","Basophils and eosinophils are more characteristic of immediate allergic inflammation.","Sensitized T cells can recruit monocytes and activate macrophages during a delayed inflammatory response."],"src":"Ulvi PDF, p. 129 \u00b7 q0788","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1587","topic":"blood","q":"What type of anemia can develop from red-cell injury during the thrombotic phase of DIC?","opts":["Microangiopathic hemolytic anemia","Anemia from blood loss alone","Iron deficiency anemia","Megaloblastic anemia"],"correct":[0],"why":"Fibrin-rich microthrombi can fragment erythrocytes, producing schistocytes and hemolysis.","optionWhy":["Shearing in partially obstructed small vessels destroys circulating red cells.","Bleeding may coexist in DIC, but it does not explain fragmentation in the microvasculature.","Iron depletion typically reflects chronic loss or insufficient intake or absorption.","Megaloblastosis reflects defective DNA synthesis rather than mechanical red-cell injury."],"src":"Ulvi PDF, p. 130 \u00b7 q1587","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1588","topic":"immunity","q":"Which type of hypersensitivity explains serum sickness?","opts":["Type III","Type I","Type II","Type IV"],"correct":[0],"why":"Serum sickness results from systemic deposition of soluble immune complexes and complement activation.","optionWhy":["Deposited antigen\u2013antibody complexes recruit inflammatory cells.","Type I classically involves allergen-specific IgE and mast-cell activation.","Type II involves antibodies against fixed antigens on cells or in extracellular matrix.","Type IV is T-cell mediated."],"src":"Ulvi PDF, p. 188 \u00b7 q1588","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0880","topic":"blood","q":"Aplastic anemia:","opts":["During antitumor treatment, it is mostly transient in nature","It is mostly an acquired disease that arises from an unclear cause","Patients do not require infusion therapy","Parvovirus B19 infection accounts for 90-95% of severe aplastic anemia","It can develop with the administration of certain antibiotics, e.g. chloramphenicol"],"correct":[0,1,4],"why":"The paper includes transient antitumor-treatment marrow suppression. Clinically, expected reversible myelosuppression is distinguished from acquired aplastic anemia. Many cases of acquired aplastic anemia have no identifiable trigger. Chloramphenicol is a classic rare trigger of idiosyncratic aplastic anemia.","optionWhy":["The paper includes transient antitumor-treatment marrow suppression. Clinically, expected reversible myelosuppression is distinguished from acquired aplastic anemia.","Many cases of acquired aplastic anemia have no identifiable trigger.","Patients with significant cytopenias may require transfusion support.","Parvovirus B19 can cause red-cell aplasia or transient aplastic crisis, but does not account for most severe aplastic anemia.","Chloramphenicol is a classic rare trigger of idiosyncratic aplastic anemia."],"src":"Copy of Czech Ws was 3.pdf, p. 127 \u00b7 q0908","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1591","topic":"blood","q":"Which finding is least typical of established, uncomplicated iron deficiency anemia?","opts":["Low hemoglobin","Low serum iron","Low ferritin","Macrocytosis"],"correct":[3],"why":"Iron deficiency limits hemoglobin synthesis and typically produces microcytosis once established.","optionWhy":["Low hemoglobin is required for the condition to qualify as anemia.","Circulating iron usually falls as available iron declines.","Ferritin generally falls as stores are depleted; inflammation can raise it independently.","Large red cells suggest another process such as B12 or folate deficiency rather than isolated iron deficiency."],"src":"Ulvi PDF, p. 243 \u00b7 q1591","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0581","topic":"liver","q":"Which mechanism drives iron loading in classic HFE-related hereditary hemochromatosis?","opts":["Excess intestinal absorption of iron","Reduced transfer of iron into bile as the primary defect","Accelerated red-cell destruction as the primary defect","Impaired urinary iron excretion"],"correct":[0],"why":"Inappropriately low hepcidin allows ferroportin to export more absorbed iron into the circulation.","optionWhy":["Low hepcidin activity permits increased net iron absorption, mainly in the proximal small intestine.","The body regulates iron chiefly by absorption rather than by biliary excretion.","Hemolysis recycles iron already in the body and does not explain the inherited absorption defect.","Urinary excretion is not the primary regulator of body iron stores."],"src":"Ulvi PDF, p. 248 \u00b7 q0581","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1592","topic":"hemostasis","q":"Which lab measure is least directly useful in assessing suspected DIC?","opts":["Prothrombin time","Albumin concentration","D-dimer","Fibrinogen","Platelet count"],"correct":[1],"why":"PT, fibrin-related markers, fibrinogen, and platelets reflect coagulation activation or consumption. Albumin is not a component of standard DIC scoring.","optionWhy":["PT can prolong when multiple clotting factors are consumed.","Albumin can reflect liver disease or other illness but does not directly measure fibrin turnover or consumptive coagulopathy.","D-dimer can rise as cross-linked fibrin is broken down.","Fibrinogen can fall with consumption, although inflammation may keep it normal or elevated early.","Platelet consumption can reduce the count."],"src":"Ulvi PDF, p. 251 \u00b7 q1592","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1593","topic":"hemostasis","q":"Which are examples of acquired causes of vascular purpura or fragility?","opts":["Glanzmann thrombasthenia","Marfan syndrome","IgA vasculitis (Henoch\u2013Sch\u00f6nlein purpura)","Cushing syndrome","Inherited vascular Ehlers\u2013Danlos syndrome"],"correct":[2,3],"why":"IgA vasculitis inflames small vessels. Excess glucocorticoids can weaken connective tissue supporting vessels.","optionWhy":["Glanzmann thrombasthenia is an inherited platelet aggregation defect involving GPIIb/IIIa.","Marfan syndrome is an inherited connective-tissue disorder.","Small-vessel inflammation can cause palpable purpura.","Chronic glucocorticoid excess can cause skin and capillary fragility with easy bruising.","The vascular subtype is inherited, typically involving type III collagen."],"src":"Ulvi PDF, p. 255 \u00b7 q1593","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1129","topic":"blood","q":"A decrease in the plasma concentration of haptoglobin is indicative of","opts":["iron deficiency","excess iron","extravascular hemolysis","intravascular hemolysis"],"correct":[3],"why":"Hemoglobin released directly into plasma binds haptoglobin, and the complexes are cleared, lowering measured haptoglobin.","optionWhy":["Iron deficiency depletes iron stores and typically lowers ferritin. It does not consume haptoglobin.","Iron overload raises iron stores and often increases transferrin saturation. Low haptoglobin is not its defining marker.","Extravascular hemolysis mainly occurs within macrophages, so less free hemoglobin enters plasma. Haptoglobin can fall in some cases, but intravascular hemolysis is the best answer.","Hemoglobin released directly into plasma binds haptoglobin, and the complexes are cleared, lowering measured haptoglobin."],"src":"Selected.pdf, p. 70 \u00b7 q1668","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0822","topic":"blood","q":"Leukemoid reaction is","opts":["A reactive state with an increased number of leukocytes and immature forms in peripheral blood","The initial stage of leukemia","End stage chronic myeloid leukemia","Characterized by a very low activity of alkaline phosphatase in granulocytes"],"correct":[0],"why":"A leukemoid reaction is a marked reactive leukocytosis. A neutrophilic reaction often shows a left shift with immature granulocytes in peripheral blood.","optionWhy":["A leukemoid reaction is a marked reactive leukocytosis. A neutrophilic reaction often shows a left shift with immature granulocytes in peripheral blood.","A leukemoid reaction can resemble leukemia on a blood count, but it is reactive and does not represent an early stage of a leukemic clone.","The advanced phase of chronic myeloid leukemia reflects progression of a clonal disorder. A leukemoid reaction is a response to a separate stimulus.","Leukocyte alkaline phosphatase is classically normal or elevated in a neutrophilic leukemoid reaction. Low activity is more characteristic of untreated chronic myeloid leukemia."],"src":"Selected.pdf, p. 106 \u00b7 q0822","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1595","topic":"blood","q":"What distinguishes methemoglobin from hemoglobin that can bind oxygen normally?","opts":["A defective globin chain is required in every case","Its heme contains ferric iron (Fe\u00b3\u207a)","It is simply normal deoxygenated hemoglobin","Its heme remains in the ferrous (Fe\u00b2\u207a) state"],"correct":[1],"why":"Methemoglobin forms when heme iron is oxidized from Fe\u00b2\u207a to Fe\u00b3\u207a, preventing oxygen binding at that site.","optionWhy":["Oxidant exposure or impaired reduction can produce methemoglobin without a globin mutation.","Ferric heme cannot bind oxygen normally.","Deoxygenation removes oxygen without changing heme iron to the ferric state.","Ferrous iron is the usual oxygen-binding form."],"src":"Ulvi PDF, p. 270 \u00b7 q1595","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1596","topic":"hemostasis","q":"Which disorder of primary hemostasis is most likely in severe liver cirrhosis with congestive splenomegaly?","opts":["Immune thrombocytopenia","Reduced or missing megakaryocytes in the bone marrow","Thrombocytopenia due to platelet sequestration in an enlarged spleen","Leukemia","Hemolytic uremic syndrome"],"correct":[2],"why":"Portal hypertension enlarges the spleen, which pools more platelets and lowers their circulating count.","optionWhy":["Immune thrombocytopenia is driven by immune-mediated platelet destruction and impaired production.","An enlarged congested spleen points to platelet pooling. Reduced megakaryocytes indicate impaired production.","Congestive splenomegaly increases splenic platelet sequestration.","Leukemia can cause low platelets, but the case points to hypersplenism from cirrhosis.","HUS features microangiopathic hemolysis, thrombocytopenia and kidney injury."],"src":"Ulvi PDF, p. 202 \u00b7 q1596","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1597","topic":"liver","q":"Which statements about steatorrhea are correct?","opts":["It is characteristic of peptic ulcer disease.","It is common in severe pancreatic exocrine dysfunction.","It is characteristic of idiopathic proctocolitis.","It is characteristic of malabsorption syndrome."],"correct":[1,3],"why":"Steatorrhea is excess fecal fat from fat maldigestion or malabsorption. Severe pancreatic exocrine insufficiency reduces lipase delivery. The scan marks the 5 g threshold, which is omitted from scored practice because interpretation depends on the collection protocol.","optionWhy":["Peptic ulcer disease does not typically cause fecal fat loss.","Low pancreatic lipase activity impairs triglyceride digestion.","Idiopathic proctocolitis primarily affects the colon. Fat absorption occurs mainly in the small i

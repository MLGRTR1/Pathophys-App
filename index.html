bin deficiency","Acquired factor VIII inhibitors","Cirrhosis-associated coagulopathy"],"correct":[0,1],"why":"Both inherited disorders reduce physiological anticoagulant control.","src":"TEST 3.docx.pdf, p. 18 \u00b7 q0986","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The inherited variant produces resistance to activated protein C.","Inherited antithrombin deficiency impairs inhibition of Xa and thrombin.","Acquired VIII inhibitors impair hemostasis and generally cause bleeding.","Cirrhosis causes complex acquired changes in coagulation."]},{"id":"midterm3-q0990","topic":"hemostasis","q":"Which coagulation change can occur in the consumptive phase of DIC?","opts":["Prolonged aPTT","Increased platelet count","Falling D-dimer","Shortened PT as the defining finding"],"correct":[0],"why":"Consumption of coagulation factors can prolong PT and aPTT. Platelets may fall and D-dimer typically rises.","src":"TEST 3.docx.pdf, p. 19 \u00b7 q0990","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Consumption of clotting factors can prolong aPTT and PT.","Platelets are consumed in systemic clotting and often fall.","Breakdown of cross-linked fibrin typically raises D-dimer.","Factor consumption can prolong PT."]},{"id":"midterm3-q0992","topic":"hemostasis","q":"What is a typical cause and consequence of pseudothrombocytopenia?","opts":["In vitro platelet clumping falsely lowers the measured count","It typically causes spontaneous bleeding","It reflects reduced marrow platelet production","The laboratory artifact itself has no bleeding consequence"],"correct":[0,3],"why":"Platelet clumps are undercounted by the analyzer even when the true circulating count is adequate.","src":"TEST 3.docx.pdf, p. 19 \u00b7 q0992","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Clumps, often in EDTA samples, can be counted incorrectly by an analyzer.","The artifact itself does not increase bleeding risk.","The apparent reduction reflects counting error, not marrow failure.","There may be an adequate circulating count despite the falsely low result."]},{"id":"midterm3-q0993","topic":"hemostasis","q":"Which can prolong aPTT?","opts":["Factor XII deficiency","Unfractionated heparin","Factor V Leiden","A factor VIII inhibitor"],"correct":[0,1,3],"why":"The intrinsic pathway assay is sensitive to contact factor deficiency, heparin, and factor VIII inhibition.","src":"TEST 3.docx.pdf, p. 19 \u00b7 q0993","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor XII is required for contact activation in the assay, even though its deficiency usually does not cause bleeding.","Unfractionated heparin enhances antithrombin activity and can prolong the aPTT.","Factor V Leiden causes resistance to activated protein C and usually does not prolong routine aPTT.","An inhibitor neutralizes factor VIII and reduces intrinsic pathway activity."]},{"id":"midterm3-q0995","topic":"hemostasis","q":"Which finding is associated with bleeding rather than inherited thrombophilia?","opts":["Factor V Leiden","Protein C deficiency","A factor VIII inhibitor","Antithrombin deficiency"],"correct":[2],"why":"Factor VIII inhibitors impair intrinsic pathway clotting and can cause acquired hemophilia.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q0995","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Activated protein C resistance increases venous thrombosis risk.","Less protein C activity means reduced inactivation of Va and VIIIa.","An inhibitor lowers functional VIII activity and can cause acquired hemophilia.","Reduced antithrombin weakens inhibition of thrombin and Xa, favoring thrombosis."]},{"id":"midterm3-q0996","topic":"hemostasis","q":"How can von Willebrand factor deficiency impair hemostasis?","opts":["Reduced platelet adhesion","Reduced stabilization of circulating factor VIII","Accelerated thrombin generation","Increased activation of factor IX"],"correct":[0,1],"why":"Von Willebrand factor bridges platelets to injured vessel walls and protects factor VIII from clearance.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q0996","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Von Willebrand factor normally bridges exposed vessel-wall matrix to platelet GPIb.","It binds factor VIII and protects it from premature clearance.","Loss of VIII stabilization can reduce rather than accelerate thrombin generation.","The factor primarily helps platelet adhesion and stabilizes VIII, not IX."]},{"id":"midterm3-q0999","topic":"hemostasis","q":"Which of these proteins is affected by warfarin?","opts":["Factor VIII","Fibrinogen","Von Willebrand factor","Protein C"],"correct":[3],"why":"Protein C is vitamin K dependent, as are factors II, VII, IX, and X.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q0999","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor VIII is not vitamin K dependent.","Fibrinogen does not require vitamin K-dependent carboxylation.","Von Willebrand factor supports adhesion and VIII stability independently of vitamin K.","Protein C requires vitamin K-dependent carboxylation and is affected by warfarin."]},{"id":"midterm3-q1000","topic":"hemostasis","q":"Which coagulation protein is not vitamin K dependent?","opts":["Factor X","Prothrombin","Factor VII","Fibrinogen"],"correct":[3],"why":"Factors II, VII, IX, and X require vitamin K-dependent carboxylation. Fibrinogen does not.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q1000","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor X requires vitamin K-dependent carboxylation.","Prothrombin is factor II and is vitamin K dependent.","Factor VII is a vitamin K-dependent tissue-factor pathway component.","Fibrinogen is a substrate for thrombin and does not need vitamin K-dependent carboxylation."]},{"id":"midterm3-q1001","topic":"hemostasis","q":"What directly replaces the missing activity in severe bleeding due to hemophilia A?","opts":["Factor VIII concentrate","A platelet concentrate","Vitamin K alone","An anticoagulant"],"correct":[0],"why":"The deficient coagulation activity in hemophilia A is factor VIII.","src":"TEST 3.docx.pdf, p. 21 \u00b7 q1001","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor VIII concentrate supplies the missing cofactor.","Platelet transfusion does not replace factor VIII activity.","Factor VIII is not one of the vitamin K-dependent factors.","Anticoagulants reduce clot formation rather than replace factor VIII."]},{"id":"midterm3-q1002","topic":"hemostasis","q":"Which phase of primary hemostasis is most directly impaired by reduced von Willebrand factor?","opts":["Platelet adhesion to exposed subendothelium","Fibrin cross-linking","Fibrinolysis","Thrombin cleavage of fibrinogen"],"correct":[0],"why":"Von Willebrand factor bridges exposed collagen and platelet GPIb.","src":"TEST 3.docx.pdf, p. 21 \u00b7 q1002","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Von Willebrand factor supports platelet tethering by linking GPIb to exposed matrix.","Factor XIII cross-links fibrin during secondary hemostasis.","Plasmin degrades fibrin after clot formation.","Thrombin converts fibrinogen to fibrin during secondary hemostasis."]},{"id":"midterm3-q1004","topic":"hemostasis","q":"Which findings can prolong prothrombin time?","opts":["Factor XII deficiency","Factor X deficiency","Warfarin treatment","Isolated hemophilia A"],"correct":[1,2],"why":"Factor X is in the common pathway. Warfarin reduces vitamin K-dependent factor activity, including factor VII.","src":"TEST 3.docx.pdf, p. 21 \u00b7 q1004","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor XII affects the contact pathway and can prolong aPTT while PT stays normal.","Factor X participates in the common pathway measured by PT.","Warfarin reduces activation of vitamin K-dependent factors, including factor VII.","Isolated VIII deficiency typically prolongs aPTT while sparing PT."]},{"id":"midterm3-q1008","topic":"hemostasis","q":"Which statements about D-dimer are correct?","opts":["It is formed from cross-linked fibrin","It indicates fibrin formation followed by degradation","An elevated result alone proves venous thromboembolism","It can be used in validated rule-out strategies"],"correct":[0,1,3],"why":"D-dimer reflects breakdown of cross-linked fibrin and is sensitive but nonspecific.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1008","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Plasmin breakdown of cross-linked fibrin releases D-dimer.","Cross-linked fibrin must first form and then be degraded for D-dimer to appear.","Many conditions increase fibrin turnover, so a positive value alone is nonspecific.","A negative result can help rule out VTE in appropriately selected patients under a validated algorithm."]},{"id":"midterm3-q1009","topic":"hemostasis","q":"Which statements describe the platelet GPIIb/IIIa receptor?","opts":["It binds fibrinogen to support aggregation","It is the main receptor for initial von Willebrand factor-mediated adhesion","It is defective in Glanzmann thrombasthenia","It is a fibrinolytic enzyme"],"correct":[0,2],"why":"GPIIb/IIIa bridges adjacent platelets via fibrinogen. GPIb supports initial adhesion through von Willebrand factor.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1009","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Fibrinogen bridges GPIIb/IIIa receptors on adjacent activated platelets.","Initial adhesion under flow relies on GPIb binding von Willebrand factor.","Glanzmann thrombasthenia impairs GPIIb/IIIa-mediated aggregation.","GPIIb/IIIa is a platelet receptor. Plasmin is the enzyme that degrades fibrin."]},{"id":"midterm3-q1010","topic":"hemostasis","q":"Which pathways are assessed by the Quick test or prothrombin time?","opts":["Extrinsic and common pathways","Intrinsic pathway alone","Platelet adhesion alone","Fibrinolysis alone"],"correct":[0],"why":"Tissue factor initiates the assay and clot formation depends on the common pathway.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1010","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Adding tissue factor initiates the extrinsic pathway, and the assay depends on the common pathway to form fibrin.","The intrinsic and common pathways are assessed by aPTT.","Platelet adhesion is part of primary hemostasis and is not measured by PT.","PT measures time to clot formation rather than fibrin breakdown."]},{"id":"midterm3-q1012","topic":"hemostasis","q":"What does thrombophilia describe?","opts":["A predisposition to thrombosis that can be inherited or acquired","An obligatory deficiency of platelets","A tendency to bleed from an isolated factor VIII deficiency","An inherited disorder in every case"],"correct":[0],"why":"Inherited anticoagulant defects and acquired conditions can both increase thrombosis risk.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1012","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inherited variants or acquired exposures can create a tendency to form thrombi.","Low platelet counts are not part of the definition.","Factor VIII deficiency causes a bleeding tendency.","Conditions such as malignancy or antiphospholipid syndrome can cause acquired thrombophilia."]},{"id":"midterm3-q1013","topic":"hemostasis","q":"Which statements about INR are correct?","opts":["It is calculated from the PT ratio and the reagent's ISI","It primarily measures the intrinsic pathway","It typically rises in isolated hemophilia A","It may rise when hepatic clotting factor synthesis declines"],"correct":[0,3],"why":"INR standardizes the PT ratio. PT reflects the tissue factor and common pathways.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1013","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The patient-to-control PT ratio is raised to the power of the reagent's ISI.","INR standardizes PT, which assesses the extrinsic and common pathways.","Isolated factor VIII deficiency prolongs aPTT rather than PT.","Reduced hepatic synthesis of PT-sensitive factors can increase INR."]},{"id":"midterm3-q1015","topic":"hemostasis","q":"Which change can favor thrombosis by reducing fibrinolysis?","opts":["Reduced tissue plasminogen activator activity","Increased generation of plasmin","Loss of plasminogen activator inhibitor activity","Accelerated fibrin breakdown"],"correct":[0],"why":"Reduced activation of plasminogen decreases the capacity to remove fibrin.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1015","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Less tPA means less conversion of plasminogen to plasmin, so fibrin persists longer.","More plasmin generally increases fibrin breakdown.","Loss of PAI removes inhibition of tPA and can increase fibrinolysis.","Accelerated breakdown reduces fibrin persistence."]},{"id":"midterm3-q1016","topic":"hemostasis","q":"Which statements describe thrombocytopathy?","opts":["Platelet function is impaired","Bleeding may occur despite a normal platelet count","It always means a low platelet count","It is the same as factor IX deficiency"],"correct":[0,1],"why":"Platelet dysfunction impairs primary hemostasis even when the count is normal.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1016","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The term refers to a qualitative defect of platelet activity.","A normal number of platelets can still form an ineffective plug.","A reduced platelet count is thrombocytopenia.","Factor IX deficiency is hemophilia B, a secondary hemostasis defect."]},{"id":"midterm3-q1017","topic":"hemostasis","q":"When can vitamin K administration help correct a prolonged INR?","opts":["When vitamin K deficiency reduces factor carboxylation","When isolated factor XII deficiency prolongs aPTT","When aspirin inhibits platelet COX-1","When the sample has EDTA-induced platelet clumping"],"correct":[0],"why":"Vitamin K is required for activation of factors II, VII, IX, and X through gamma-carboxylation.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1017","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Vitamin K restores the cofactor needed to carboxylate newly synthesized factors II, VII, IX, and X.","Factor XII is not vitamin K dependent, and the abnormality is in aPTT rather than INR.","Vitamin K does not reverse irreversible inhibition of platelet COX-1.","EDTA clumping affects the measured platelet count and is resolved by reassessing the sample."]},{"id":"midterm3-q1018","topic":"hemostasis","q":"What can a prolonged PT help assess?","opts":["Reduced hepatic synthesis of coagulation factors","Reduced tissue-factor and common pathway activity","Impaired platelet adhesion as a direct measure","Isolated intrinsic pathway activity as its main role"],"correct":[0,1],"why":"PT reflects extrinsic and common pathway clotting. It can also serve as a marker of hepatic synthetic function.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1018","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Loss of hepatic synthetic capacity can lower activity of PT-sensitive clotting factors.","PT initiates coagulation with tissue factor and depends on the common pathway.","Adhesion depends on platelet receptors and von Willebrand factor.","aPTT is the routine test for intrinsic pathway activity."]},{"id":"midterm3-q1019","topic":"hemostasis","q":"Which are acquired risk factors for venous thrombosis?","opts":["Estrogen exposure","Nephrotic syndrome","Inherited factor V Leiden","Congenital protein C deficiency"],"correct":[0,1],"why":"Estrogen affects coagulation factors, and nephrotic syndrome can alter circulating anticoagulant and procoagulant proteins.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1019","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Estrogen exposure can shift coagulation toward thrombosis.","Nephrotic syndrome can involve urinary loss of anticoagulant proteins and increased procoagulant activity.","The Leiden variant is a germline risk factor.","Congenital protein C deficiency is inherited."]},{"id":"midterm3-q1022","topic":"hemostasis","q":"How does fibrinogen usually behave during an inflammatory acute-phase response?","opts":["It can rise as a positive acute-phase protein","It is necessarily depleted in every inflammatory state","It remains fixed regardless of inflammation","It rises only through vitamin K activation"],"correct":[0],"why":"Inflammatory signaling increases hepatic production of fibrinogen.","src":"TEST 3.docx.pdf, p. 24 \u00b7 q1022","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammatory signaling can increase hepatic fibrinogen synthesis.","Consumption can lower fibrinogen in some conditions, but inflammation alone need not deplete it.","Its production responds to inflammatory signaling.","Fibrinogen is not a vitamin K-dependent protein."]},{"id":"midterm3-q1023","topic":"hemostasis","q":"Which can prolong both PT and aPTT?","opts":["Consumptive DIC","Severe depletion of multiple vitamin K-dependent factors","Isolated factor VIII deficiency as the usual pattern","Isolated factor XII deficiency as the usual pattern"],"correct":[0,1],"why":"A process affecting several clotting factors or the common pathway can prolong both assays.","src":"TEST 3.docx.pdf, p. 24 \u00b7 q1023","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Systemic clotting consumes several factors and can prolong both tests.","Severe depletion of factors spanning the pathways can prolong both tests.","Isolated factor VIII deficiency typically prolongs aPTT while PT remains normal.","Isolated XII deficiency affects aPTT, with PT generally normal."]},{"id":"midterm3-q1024","topic":"hemostasis","q":"What best explains spontaneous recurrent hemarthrosis in severe hemophilia A?","opts":["Deficient intrinsic pathway amplification due to low factor VIII activity","Increased platelet adhesion","Reduced plasmin formation from excess inhibitor","Isolated reduction of platelet count"],"correct":[0],"why":"Factor VIII deficiency impairs stable fibrin formation, producing deep-tissue and joint bleeding.","src":"TEST 3.docx.pdf, p. 24 \u00b7 q1024","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor VIII supports intrinsic tenase. Severe deficiency reduces thrombin generation and causes deep bleeding.","Stronger adhesion would support the platelet plug and does not explain the bleeding.","Less plasmin would slow fibrin breakdown and does not account for the inherited factor defect.","Thrombocytopenia more typically produces petechiae and mucosal bleeding."]},{"id":"midterm3-q1027","topic":"hemostasis","q":"What screening pattern is expected in isolated factor XIII deficiency?","opts":["Prolonged PT with normal aPTT","Normal PT and aPTT","Prolonged aPTT with normal PT","Low fibrinogen is required"],"correct":[1],"why":"Factor XIII cross-links fibrin after the clot forms, beyond the endpoint of PT and aPTT.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1027","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor XIII acts after initial fibrin formation, so PT usually remains normal.","Both assays stop at initial clot formation, before XIII-dependent cross-linking.","Isolated XIII deficiency does not impair the intrinsic steps measured by aPTT.","The problem is cross-linking formed fibrin, rather than insufficient fibrinogen."]},{"id":"midterm3-q1028","topic":"hemostasis","q":"Which agents inhibit coagulation in vivo through different mechanisms?","opts":["Warfarin","Heparin","A fibrin degradation product used as a laboratory marker","A tissue plasminogen activator acting directly on platelet receptors"],"correct":[0,1],"why":"Warfarin interferes with vitamin K recycling, while heparin enhances antithrombin.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1028","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Warfarin inhibits vitamin K recycling and reduces activity of newly synthesized vitamin K-dependent factors.","Heparin accelerates antithrombin-mediated inhibition of activated factors.","A degradation marker such as D-dimer measures turnover rather than inhibiting the coagulation cascade.","tPA activates plasminogen and promotes fibrinolysis. It does not act directly on platelet receptors."]},{"id":"midterm3-q1029","topic":"hemostasis","q":"How does heparin inhibit coagulation?","opts":["It enhances antithrombin-mediated inhibition of factor Xa","It inhibits vitamin K recycling","Unfractionated heparin enhances antithrombin-mediated inhibition of thrombin","It directly blocks platelet GPIIb/IIIa"],"correct":[0,2],"why":"Heparin potentiates antithrombin. Unfractionated heparin can inhibit both Xa and thrombin.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1029","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Heparin accelerates inhibition of Xa by antithrombin.","Warfarin interferes with recycling of vitamin K.","Unfractionated heparin has chains long enough to bridge antithrombin and thrombin.","GPIIb/IIIa antagonists inhibit aggregation by blocking this platelet receptor."]},{"id":"midterm3-q1030","topic":"hemostasis","q":"When can the historical Duke bleeding time be prolonged?","opts":["Severe thrombocytopenia","Von Willebrand disease","Factor V Leiden as the characteristic finding","Isolated factor XII deficiency as the characteristic finding"],"correct":[0,1],"why":"Bleeding time primarily reflects formation of the initial platelet plug.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1030","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Too few platelets can delay formation of the primary plug.","Poor von Willebrand factor-mediated adhesion can delay formation of the primary plug.","Factor V Leiden increases thrombosis risk without characteristically impairing platelet plug formation.","Factor XII deficiency affects contact activation in aPTT, while platelet-dependent bleeding time is typically normal."]},{"id":"midterm3-q1033","topic":"hemostasis","q":"Which hormone is the main regulator of platelet production?","opts":["Thrombopoietin","Erythropoietin","Aldosterone","Hepcidin"],"correct":[0],"why":"Thrombopoietin stimulates megakaryocyte development and production of platelets.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1033","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Thrombopoietin stimulates megakaryocyte maturation and platelet production.","Erythropoietin primarily supports erythroid precursors.","Aldosterone regulates renal sodium and potassium handling.","Hepcidin regulates iron transport through ferroportin."]},{"id":"midterm3-q0850","topic":"hemostasis","q":"Which contributors to thrombosis can be acquired?","opts":["Endothelial injury or dysfunction","Estrogen therapy","A germline factor V Leiden variant","An inherited antithrombin mutation"],"correct":[0,1],"why":"Acquired thrombosis risk can involve vessel wall injury and altered coagulation.","src":"TEST 3.docx.pdf, p. 26 \u00b7 q0850","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Injury or dysfunction can reduce the vessel wall's antithrombotic properties.","Exogenous estrogen can increase thrombotic risk through changes in coagulation.","A germline Leiden variant is inherited.","An inherited mutation affecting antithrombin is a genetic risk factor."]},{"id":"midterm3-q0853","topic":"liver","q":"Which ion transport protein is disrupted in cystic fibrosis?","opts":["An epithelial sodium pump","A voltage-gated calcium channel","The CFTR chloride and bicarbonate channel","A potassium channel in skeletal muscle"],"correct":[2],"why":"CFTR dysfunction alters epithelial salt and water transport and can obstruct pancreatic ducts.","src":"TEST 3.docx.pdf, p. 26 \u00b7 q0853","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Sodium transport can be affected indirectly, but the defective protein is CFTR.","CFTR is an anion channel rather than a voltage-gated calcium channel.","Disrupted chloride and bicarbonate transport alters epithelial secretions and can obstruct pancreatic ducts.","The affected protein is not a skeletal-muscle potassium channel."]},{"id":"midterm3-q1046","topic":"hemostasis","q":"How can an acute stress response affect hemostasis?","opts":["It can transiently increase platelet and coagulation activity","It obligatorily causes complete fibrinogen depletion","It prevents platelet activation","It eliminates tissue factor expression in injured tissue"],"correct":[0],"why":"Acute stress can shift hemostatic activity in a procoagulant direction.","src":"TEST 3.docx.pdf, p. 28 \u00b7 q1046","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Acute stress can transiently increase platelet activation and plasma coagulability.","Complete fibrinogen depletion is not a routine stress response.","Adrenergic stress can enhance platelet reactivity.","Injured tissue can still expose or express tissue factor during stress."]},{"id":"midterm3-q1356","topic":"liver","q":"What mechanism explains Gilbert syndrome?","opts":["Reduced bilirubin conjugation causing mild unconjugated hyperbilirubinemia","Complete obstruction of the common bile duct","An isolated increase in conjugated bilirubin from duct injury","Excess erythropoietin as the primary defect"],"correct":[0],"why":"Reduced UGT1A1 activity produces intermittent mild unconjugated hyperbilirubinemia.","src":"Test 3-all gathered.docx, p. 1 \u00b7 q1356","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced UGT1A1 activity lowers conjugation capacity, causing mild intermittent unconjugated hyperbilirubinemia.","Common duct obstruction mainly raises conjugated bilirubin.","Cholestatic duct injury can cause a conjugated rise, but Gilbert syndrome affects conjugation.","Erythropoietin controls red-cell production and does not explain reduced conjugation."]},{"id":"midterm3-q0253","topic":"liver","q":"Which bilirubin fraction typically increases in Gilbert syndrome during fasting or illness?","opts":["Unconjugated bilirubin","Only conjugated bilirubin","Neither fraction can increase","Bilirubin in urine from albumin-bound unconjugated bilirubin"],"correct":[0],"why":"Reduced conjugation leads to intermittent unconjugated hyperbilirubinemia.","src":"Test 3-all gathered.docx.pdf, p. 1 \u00b7 q0253","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Fasting or illness can expose the limited UGT1A1 conjugation capacity, raising unconjugated bilirubin.","A conjugated rise suggests impaired biliary excretion instead.","The unconjugated fraction can rise intermittently.","Unconjugated bilirubin is albumin-bound and cannot readily be filtered."]},{"id":"midterm3-q0313","topic":"hemostasis","q":"Why can INR increase in advanced liver disease?","opts":["Reduced production of some clotting factors prolongs PT","Loss of factor VIII is the only mechanism","A higher platelet count directly prolongs PT","Increased bilirubin directly creates a longer intrinsic pathway"],"correct":[0],"why":"Loss of hepatic synthetic function can lower factor activity measured by the PT.","src":"Test 3-all gathered.docx.pdf, p. 4 \u00b7 q0313","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced hepatic synthesis lowers clotting factor activity, prolonging PT and raising INR.","Isolated VIII deficiency chiefly affects aPTT. Several liver-synthesized factors can affect INR.","The platelet count does not directly determine this plasma clotting assay.","INR is derived from PT and reflects tissue-factor and common pathway function."]},{"id":"midterm3-q0316","topic":"blood","q":"What erythropoietin pattern can be seen in secondary erythrocytosis caused by chronic hypoxia?","opts":["Increased or inappropriately normal erythropoietin","Suppressed erythropoietin as the required finding","Absent erythropoietin in all cases","A level determined exclusively by the platelet count"],"correct":[0],"why":"Hypoxic signaling stimulates EPO. In polycythemia vera, autonomous marrow production often suppresses EPO.","src":"Test 3-all gathered.docx.pdf, p. 4 \u00b7 q0316","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Renal oxygen sensing stimulates EPO. A normal result can be inappropriately high relative to the increased red-cell mass.","Suppressed EPO more strongly suggests autonomous erythrocytosis such as polycythemia vera.","Hypoxia normally stimulates EPO production.","Oxygen delivery to the kidney is the main signal, independent of platelet count."]},{"id":"midterm3-q0331","topic":"blood","q":"Which findings can occur in multiple myeloma?","opts":["A monoclonal immunoglobulin or light chain","Lytic bone lesions","Anemia or renal impairment","An isolated inherited platelet adhesion defect as the cause"],"correct":[0,1,2],"why":"Clonal plasma cells and their secreted proteins can damage bone and kidney and suppress normal marrow function.","src":"Test 3-all gathered.docx.pdf, p. 7 \u00b7 q0331","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A plasma-cell clone can secrete a monoclonal immunoglobulin or excess light chains.","Myeloma increases osteoclast activity and promotes bone resorption.","Marrow involvement can cause anemia, and light chains can contribute to kidney injury.","Inherited platelet adhesion defects are a separate disorder of primary hemostasis."]},{"id":"midterm3-q0350","topic":"blood","q":"What commonly explains neutrophilia after glucocorticoid administration?","opts":["Demargination of neutrophils into the circulating pool","Immediate conversion of lymphocytes into neutrophils","Obligate marrow aplasia","An increase in eosinophil recruitment as its main mechanism"],"correct":[0],"why":"Glucocorticoids alter neutrophil distribution and trafficking, increasing the measured circulating count.","src":"Test 3-all gathered.docx.pdf, p. 10 \u00b7 q0350","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced adhesion and redistribution move neutrophils from the marginal pool into sampled blood.","These are distinct cell lineages and do not rapidly convert into one another.","Marrow aplasia lowers granulocyte production.","Glucocorticoids typically reduce circulating eosinophils. Their neutrophil effect is largely redistribution."]},{"id":"midterm3-q0384","topic":"blood","q":"Which situation can cause reticulocytosis when marrow function is intact?","opts":["Recovery after blood loss","Compensated hemolysis","Untreated severe marrow aplasia","Severe isolated lack of erythropoietin as the expected direct response"],"correct":[0,1],"why":"Reticulocytosis indicates a marrow response to increased red cell demand.","src":"Test 3-all gathered.docx.pdf, p. 15 \u00b7 q0384","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Blood loss can stimulate EPO and increase release of immature red cells after a delay.","An intact marrow can compensate for shortened red-cell survival by increasing output.","Marrow aplasia leaves too few functioning precursors to mount a response.","Low EPO reduces the production signal and typically blunts the reticulocyte response."]},{"id":"midterm3-q1507","topic":"blood","q":"Which mechanism defines pernicious anemia?","opts":["Impaired B12 absorption due to loss of intrinsic factor","Reduced iron intake alone","Excess erythropoietin","A germline defect of globin synthesis"],"correct":[0],"why":"Autoimmune injury to gastric parietal cells and intrinsic factor can cause B12 deficiency.","src":"Test 3-all gathered.docx.pdf, p. 28 \u00b7 q1507","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Autoimmune gastric injury or antibodies against intrinsic factor impair ileal uptake of B12.","Low iron intake produces iron deficiency rather than autoimmune loss of intrinsic factor.","EPO promotes erythropoiesis and does not explain loss of intrinsic factor.","Globin-gene defects cause thalassemia and do not alter B12 absorption."]},{"id":"midterm3-q0195","topic":"blood","q":"Which gastrointestinal conditions can lead to vitamin B12 deficiency and megaloblastic anemia?","opts":["Autoimmune atrophic gastritis","Gastrectomy","Terminal ileal resection","Isolated duodenal resection as its classic cause"],"correct":[0,1,2],"why":"B12 absorption requires gastric intrinsic factor and an intact terminal ileum.","src":"Test 3-all gathered.docx.pdf, p. 32 \u00b7 q0195","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Autoimmune loss of parietal cells can reduce intrinsic factor production.","Removing the stomach removes or reduces the source of intrinsic factor.","The terminal ileum absorbs the B12\u2013intrinsic factor complex.","The classic absorption site for B12 is the terminal ileum, not the duodenum."]},{"id":"midterm3-q0202","topic":"liver","q":"Which findings can accompany decompensated cirrhosis?","opts":["Hepatic encephalopathy","Prolonged prothrombin time","Jaundice","Ascites"],"correct":[0,1,2,3],"why":"Impaired liver function, portal hypertension, and circulatory dysfunction explain these findings.","src":"Test 3-all gathered.docx.pdf, p. 32 \u00b7 q0202","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced clearance and portosystemic shunting can expose the brain to ammonia and other gut-derived compounds.","Reduced liver synthesis can lower clotting factor activity.","Impaired bilirubin handling can increase circulating bilirubin.","Portal hypertension and renal sodium retention promote fluid accumulation."]},{"id":"midterm3-q0203","topic":"liver","q":"Which can cause cirrhosis?","opts":["Chronic hepatitis C","Wilson disease","Alpha-1 antitrypsin deficiency","Resolved hepatitis A"],"correct":[0,1,2],"why":"Chronic viral injury and inherited metabolic or protein-folding disorders can produce progressive fibrosis. Hepatitis A does not usually become chronic.","src":"Test 3-all gathered.docx.pdf, p. 32 \u00b7 q0203","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Persistent viral inflammation can cause progressive fibrosis.","Retained copper causes chronic hepatocyte injury.","Abnormal protein can accumulate in hepatocytes and promote fibrosis.","Resolved hepatitis A does not persist as chronic hepatitis."]},{"id":"midterm3-q1073","topic":"liver","q":"Which hepatitis viruses are classically associated with transmission through infected blood?","opts":["HBV","HCV","HAV as its principal route","HEV as its principal route"],"correct":[0,1],"why":"HBV and HCV can spread parenterally. HAV and HEV typically spread by other routes.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1073","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["HBV can be transmitted by infected blood as well as sexually and perinatally.","HCV is classically blood-borne.","HAV is usually spread by the fecal\u2013oral route.","HEV is usually spread enterically, although transfusion transmission can occur."]},{"id":"midterm3-q1074","topic":"liver","q":"Which of these is a product of hepatic ammonia detoxification rather than a precipitant of hepatic encephalopathy?","opts":["Ammonia","Urea","Gastrointestinal bleeding","Portosystemic shunting"],"correct":[1],"why":"The liver converts ammonia to urea. Reduced clearance of ammonia, shunting, and GI bleeding can contribute to encephalopathy.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1074","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Ammonia is the nitrogenous substrate whose accumulation contributes to encephalopathy.","The liver packages ammonia-derived nitrogen into urea for renal excretion.","Digested blood increases the nitrogen available for intestinal ammonia production.","Shunting allows portal blood to bypass hepatic detoxification."]},{"id":"midterm3-q1075","topic":"liver","q":"What promotes renal sodium retention in cirrhosis with ascites?","opts":["Reduced effective arterial filling","Activation of the renin\u2013angiotensin\u2013aldosterone system","Suppression of aldosterone in every case","Increased effective arterial volume as the main stimulus"],"correct":[0,1],"why":"Splanchnic vasodilation reduces effective arterial filling and activates sodium-retaining responses.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1075","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Splanchnic vasodilation can leave the arterial circulation underfilled despite excess total fluid.","Renin, angiotensin II, and aldosterone promote retention to compensate for underfilling.","Aldosterone often increases when arterial filling is inadequate.","Reduced effective arterial filling, even with total-body fluid excess, is the stimulus."]},{"id":"midterm3-q1076","topic":"liver","q":"Which finding is least consistent with sustained complete bile duct obstruction?","opts":["Pruritus","Pale stool","Increased urinary urobilinogen","Vitamin K malabsorption"],"correct":[2],"why":"Complete obstruction prevents bilirubin from reaching the intestine, reducing formation of urobilinogen.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1076","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Cholestasis can cause pruritus through retention of bile-associated mediators.","Reduced intestinal bile pigment delivery can produce pale stool.","Complete obstruction reduces intestinal bilirubin delivery and therefore reduces formation of urobilinogen.","Lack of bile salts impairs absorption of fat-soluble vitamins, including vitamin K."]},{"id":"midterm3-q1077","topic":"liver","q":"Which condition is least likely to cause ascites through its characteristic mechanism?","opts":["Isolated acute left-sided heart failure","Right-sided heart failure","Budd\u2013Chiari syndrome","Nephrotic syndrome"],"correct":[0],"why":"Isolated acute left ventricular failure primarily causes pulmonary congestion. The other conditions can produce systemic or abdominal fluid accumulation.","src":"Test 3-all gathered.docx.pdf, p. 34 \u00b7 q1077","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Isolated acute left failure mainly raises pulmonary venous pressure and causes pulmonary edema.","Systemic venous hypertension can raise hepatic and abdominal hydrostatic pressure.","Hepatic venous outflow obstruction can raise sinusoidal pressure and cause ascites.","Protein loss can lower oncotic pressure, and renal sodium retention can contribute to edema and ascites."]},{"id":"midterm3-q1083","topic":"liver","q":"Which processes contribute to tissue injury in acute pancreatitis?","opts":["Premature intracellular trypsin activation","Reduced activation of all digestive enzymes","Elastase-mediated injury","Increased hepcidin"],"correct":[0,2],"why":"Premature protease activation triggers autodigestion and inflammation. Elastase can damage tissue and vessels.","src":"Test 3-all gathered.docx.pdf, p. 35 \u00b7 q1083","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Early intracellular trypsin activation starts a cascade of pancreatic enzyme activation.","Premature enzyme activation drives autodigestion.","Activated elastase can injure vessels and surrounding tissue.","Hepcidin regulates iron rather than initiating pancreatic autodigestion."]},{"id":"midterm3-q1084","topic":"liver","q":"Which exposure is a classic risk factor for chronic pancreatitis?","opts":["Long-term heavy alcohol exposure","Brief acid reflux","Treated iron deficiency","An isolated increase in gastrin as the usual cause"],"correct":[0],"why":"Recurrent acinar injury and chronic inflammation can lead to fibrosis and loss of pancreatic tissue.","src":"Test 3-all gathered.docx.pdf, p. 35 \u00b7 q1084","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Repeated alcohol-related pancreatic injury can lead to fibrosis and loss of exocrine tissue.","Transient reflux affects the esophagus rather than repeatedly injuring the pancreas.","Iron deficiency is not a recognized usual cause of chronic pancreatitis.","Gastrin primarily regulates gastric acid secretion rather than causing progressive pancreatic fibrosis."]},{"id":"midterm3-q1111","topic":"immunity","q":"Which defects characterize chronic granulomatous disease?","opts":["Impaired intracellular killing in phagocytes","Defective neutrophil adhesion as the primary mechanism","Reduced production of reactive oxygen species by phagocytes","Absent circulating neutrophils in every case"],"correct":[0,2],"why":"Defective NADPH oxidase limits the phagocyte oxidative burst.","src":"YD folder.pdf, p. 22 \u00b7 q1111","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Phagocytes ingest organisms but cannot kill some microbes effectively.","Impaired leukocyte adhesion and extravasation point toward leukocyte adhesion deficiency.","Defective NADPH oxidase limits the respiratory burst.","Cell number can be normal. The problem is oxidative killing."]},{"id":"midterm3-q1113","topic":"immunity","q":"Which is not a classic example of type I hypersensitivity?","opts":["Allergic urticaria","Allergic rhinitis","Systemic lupus erythematosus","Allergic asthma"],"correct":[2],"why":"Lupus features immune-complex and other autoimmune mechanisms. Type I hypersensitivity involves IgE and mast cells.","src":"YD folder.pdf, p. 32 \u00b7 q1113","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["IgE-mediated activation of skin mast cells can produce wheals.","Allergen-specific IgE can drive immediate nasal mucosal inflammation.","Lupus involves autoantibodies and immune-complex injury rather than a classic immediate allergic reaction.","Allergic asthma can include IgE-mediated bronchoconstriction and airway inflammation."]},{"id":"midterm3-q1206","topic":"hemostasis","q":"Which protein mediates the anticoagulant effect of heparin?","opts":["Protein C","Antithrombin","Thrombomodulin","Fibrinogen"],"correct":[1],"why":"Heparin potentiates antithrombin-mediated inhibition of activated coagulation factors.","src":"YD folder.pdf, p. 54 \u00b7 q1206","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Activated protein C inactivates Va and VIIIa but does not mediate heparin's effect.","Heparin potentiates antithrombin inhibition of factor Xa and, particularly with unfractionated heparin, thrombin.","Thrombomodulin alters thrombin activity to promote protein C activation.","Fibrinogen is a substrate for thrombin, not a heparin-activated inhibitor."]},{"id":"midterm3-q0855","topic":"blood","q":"What can happen after repeated red cell transfusions?","opts":["Systemic iron deposition increases","Transferrin saturation can increase","Iron stores inevitably decline","Copper deposition is the defining complication"],"correct":[0,1],"why":"Each transfusion adds iron, and humans have limited capacity to excrete excess iron.","src":"YE.pdf.pdf, p. 1 \u00b7 q0855","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Red cell transfusions deliver iron, which can accumulate in tissue.","Iron loading can increase the proportion of transferrin carrying iron.","Repeated transfusions usually add iron to the body.","Iron deposition is the classic overload complication."]},{"id":"midterm3-q0857","topic":"liver","q":"Which are common triggers of acute pancreatitis?","opts":["Gallstones","Alcohol exposure","Isolated hyperglycemia","Gastrin hypersecretion"],"correct":[0,1],"why":"Gallstones can obstruct pancreatic outflow, and alcohol can promote acinar injury.","src":"YE.pdf.pdf, p. 7 \u00b7 q0857","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A migrating stone can transiently obstruct pancreatic outflow at the ampulla.","Alcohol can damage acinar cells and promote premature enzyme activation.","Hyperglycemia alone is not a common initiating cause and can be a consequence of pancreatic injury.","Gastrin regulates acid secretion and is not a usual trigger of acute pancreatitis."]},{"id":"midterm3-q0596","topic":"liver","q":"How does lactulose reduce gut-derived ammonia in hepatic encephalopathy?","opts":["It acidifies colonic contents, trapping ammonia as ammonium","It directly increases hepatic UGT1A1 activity","It blocks platelet GPIIb/IIIa","It increases absorption of ammonia into portal blood"],"correct":[0],"why":"Colonic acidification and faster transit reduce the amount of ammonia absorbed.","src":"YE.pdf.pdf, p. 42 \u00b7 q0596 \u00b7 Ulvi PDF, p. 258 \u00b7 q0596","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Bacterial metabolism lowers colonic pH, shifting diffusible ammonia toward less absorbable ammonium.","UGT1A1 conjugates bilirubin and does not account for lactulose's action in the gut.","GPIIb/IIIa mediates platelet aggregation and is unrelated to ammonia removal.","Lactulose reduces ammonia absorption and can speed intestinal transit."]},{"id":"midterm3-q1120","topic":"immunity","q":"What is atopy?","opts":["A predisposition to produce IgE against common environmental allergens","Circulating immune complex deposition","Acquired failure of complement synthesis","An immediate reaction to any foreign protein"],"correct":[0],"why":"Atopy is an individual predisposition to IgE sensitization and associated allergic disease.","src":"YE.pdf.pdf, p. 63 \u00b7 q1120","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Atopy is a predisposition to IgE sensitization to common allergens.","Deposited soluble immune complexes drive type III hypersensitivity.","Complement deficiency is a different class of immune disorder.","Atopy is a predisposition to allergen-specific sensitization, not a reaction to every protein."]},{"id":"midterm3-q0865","topic":"blood","q":"Which statements describe megaloblastic anemia?","opts":["Iron deficiency is its classic cause","Autoimmune atrophic gastritis can lead to it","Increased hepcidin directly causes megaloblastosis","Vitamin B12 or folate deficiency can cause it"],"correct":[1,3],"why":"Both deficiencies impair DNA synthesis. Autoimmune gastritis can cause B12 malabsorption through loss of intrinsic factor.","src":"YE.pdf.pdf, p. 68 \u00b7 q0865","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Iron deficiency restricts hemoglobin production and tends toward microcytosis.","Loss of gastric intrinsic factor can impair vitamin B12 absorption.","Hepcidin restricts iron availability. It does not directly block DNA synthesis in erythroid cells.","Either deficiency can impair DNA synthesis and delay nuclear maturation."]},{"id":"midterm3-q0869","topic":"hemostasis","q":"How can von Willebrand disease affect screening tests?","opts":["Bleeding time may be prolonged","aPTT may be prolonged if factor VIII falls sufficiently","PT must be prolonged","An elevated D-dimer is its characteristic finding"],"correct":[0,1],"why":"Von Willebrand factor supports primary hemostasis and stabilizes factor VIII. The aPTT can be normal in milder disease.","src":"YE.pdf.pdf, p. 82 \u00b7 q0869","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Impaired platelet adhesion can prolong this historical measure of primary hemostasis.","Loss of VIII stabilization can reduce VIII activity enough to prolong aPTT.","PT generally remains normal in isolated von Willebrand disease.","D-dimer reflects degradation of cross-linked fibrin and is not a characteristic diagnostic change."]},{"id":"midterm3-q0601","topic":"blood","q":"What mechanism underlies hemolysis in paroxysmal nocturnal hemoglobinuria?","opts":["Complement attack on cells lacking GPI-anchored protective proteins","Inherited isolated factor VIII deficiency","Iron transport blockade due to excess hepcidin","An alpha-globin gene deletion"],"correct":[0],"why":"A somatic PIGA defect can cause loss of complement regulators such as CD55 and CD59.","src":"YE.pdf.pdf, p. 86 \u00b7 q0601","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Loss of GPI-anchored CD55 and CD59 leaves red cells vulnerable to complement attack.","Isolated factor VIII deficiency impairs clot formation and causes hemophilia A.","High hepcidin restricts iron and can produce anemia of inflammation.","Alpha-globin loss causes alpha thalassemia and does not remove complement regulators."]},{"id":"midterm3-q1121","topic":"hemostasis","q":"Which statements about INR are correct?","opts":["Warfarin usually increases INR","A markedly elevated INR can indicate increased bleeding risk","Aspirin routinely raises INR","INR directly measures platelet aggregation"],"correct":[0,1],"why":"INR is derived from prothrombin time. Warfarin affects vitamin K-dependent coagulation factors, while aspirin acts on platelets.","src":"YE.pdf.pdf, p. 96 \u00b7 q1121","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Warfarin reduces activation of vitamin K-dependent factors and prolongs PT.","A high INR during warfarin treatment can signal an increased bleeding risk.","Aspirin acts on platelet COX-1 and does not routinely prolong PT.","INR is calculated from PT, which measures plasma clotting time."]},{"id":"midterm3-q0875","topic":"blood","q":"Which mechanisms can cause anemia?","opts":["Reduced erythrocyte production","Increased erythrocyte destruction","Blood loss","Red cell production exceeding loss in steady state"],"correct":[0,1,2],"why":"Anemia occurs when red cell production cannot keep up with loss or destruction.","src":"YE.pdf.pdf, p. 101 \u00b7 q0875","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["An inadequate marrow output cannot replace the red cells that are normally cleared.","Accelerated destruction can exceed the marrow's ability to compensate.","Bleeding removes circulating erythrocytes and can deplete iron over time.","Production exceeding loss would increase red-cell mass rather than cause anemia."]},{"id":"midterm3-q0876","topic":"immunity","q":"Which events can follow tissue deposition of soluble immune complexes?","opts":["Complement activation","Recruitment of inflammatory leukocytes","Local tissue injury","Immediate direct IgE cross-linking as the defining reaction"],"correct":[0,1,2],"why":"Type III hypersensitivity involves deposited immune complexes, complement, and recruited inflammatory cells.","src":"YE.pdf.pdf, p. 103 \u00b7 q0876","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Immune complexes can activate complement where they deposit.","Complement fragments and other signals recruit inflammatory cells such as neutrophils.","Activated cells release products that injure nearby tissue.","IgE cross-linking on mast cells defines a type I mechanism."]},{"id":"midterm3-q1125","topic":"hemostasis","q":"Which findings are shared by thrombotic thrombocytopenic purpura and hemolytic uremic syndrome?","opts":["Thrombocytopenia","Microangiopathic hemolytic anemia","Red cell fragmentation on the blood film","Isolated factor VIII deficiency"],"correct":[0,1,2],"why":"Both are thrombotic microangiopathies. Small-vessel platelet thrombi consume platelets and shear red cells.","src":"midterm 3 long Copy.pdf, p. 18 \u00b7 q1125","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Platelets are consumed in small-vessel thrombi.","Red cells shear in partially obstructed small vessels.","Fragmented cells appear as schistocytes on the blood film.","Isolated factor VIII deficiency causes hemophilia A, a different mechanism."]},{"id":"midterm3-q1131","topic":"hemostasis","q":"Which finding is more characteristic of defective secondary hemostasis than defective primary hemostasis?","opts":["Petechiae","Epistaxis","Hemarthrosis","Mucosal bleeding"],"correct":[2],"why":"Deep joint bleeding suggests a coagulation factor disorder. Platelet defects more often cause mucocutaneous bleeding.","src":"midterm 3 long Copy.pdf, p. 36 \u00b7 q1131 \u00b7 Ulvi PDF, p. 249 \u00b7 q1131","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Petechiae suggest failure of platelet or vessel-wall hemostasis.","Nosebleeds are commonly mucocutaneous manifestations of primary hemostatic defects.","Bleeding into joints is characteristic of a deficiency in clotting factors such as VIII or IX.","Mucosal bleeding is more typical of platelet or vessel-wall defects."]},{"id":"midterm3-q1209","topic":"hemostasis","q":"What complex converts prothrombin into thrombin in the common pathway?","opts":["Factor Xa and factor Va assembled on a phospholipid surface","Factor XII and prekallikrein","Factor IXa and factor VIIIa alone","Plasmin with tPA"],"correct":[0],"why":"The Xa\u2013Va prothrombinase complex catalyzes thrombin formation.","src":"midterm 3 long Copy.pdf, p. 37 \u00b7 q1209","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Xa combines with its cofactor Va on phospholipid to accelerate thrombin generation.","Factor XII and prekallikrein participate in contact activation upstream.","IXa and VIIIa form intrinsic tenase, which activates X.","tPA generates plasmin, which degrades fibrin."]},{"id":"midterm3-q1132","topic":"hemostasis","q":"Which disorder can lower factor VIII activity by reducing its stability in plasma?","opts":["Hemophilia B","Von Willebrand disease","Isolated vitamin K deficiency","Factor XI deficiency"],"correct":[1],"why":"Von Willebrand factor carries and stabilizes factor VIII in circulation.","src":"midterm 3 long Copy.pdf, p. 39 \u00b7 q1132","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hemophilia B is a deficiency of factor IX.","Von Willebrand factor protects VIII from clearance, so its loss can lower VIII activity.","Factor VIII is not vitamin K dependent.","Factor XI deficiency affects intrinsic pathway activity without reducing VIII stability."]},{"id":"midterm3-q1134","topic":"blood","q":"Which findings are characteristic of megaloblastic anemia due to B12 or folate deficiency?","opts":["Macrocytosis","Marrow megaloblasts","Uniform microcytosis","Accelerated nuclear maturation"],"correct":[0,1],"why":"Impaired DNA synthesis delays nuclear maturation and produces enlarged precursors.","src":"midterm 3 long Copy.pdf, p. 42 \u00b7 q1134","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Delayed nuclear maturation produces enlarged erythroid cells.","Marrow erythroid precursors become enlarged with nuclear\u2013cytoplasmic asynchrony.","Microcytosis points more toward impaired hemoglobin synthesis.","B12 and folate deficiency impair DNA synthesis and therefore delay nuclear maturation."]},{"id":"midterm3-q1143","topic":"blood","q":"In which settings can anemia of chronic inflammation occur?","opts":["Chronic infection","Chronic inflammatory rheumatic disease","Isolated acute blood loss without inflammation as its defining cause","An isolated dietary folate deficiency"],"correct":[0,1],"why":"Sustained inflammatory cytokines alter iron handling and erythropoiesis.","src":"send rony.pdf, p. 19 \u00b7 q1143","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Persistent inflammatory signals in chronic infection can raise hepcidin and impair erythropoiesis.","Chronic rheumatic inflammation can restrict circulating iron despite retained stores.","Acute blood loss lowers red-cell mass by loss rather than chronic inflammatory iron sequestration.","Folate deficiency impairs DNA synthesis and causes megaloblastic anemia."]},{"id":"midterm3-q1211","topic":"liver","q":"Which statements describe hepatorenal syndrome?","opts":["It is primarily caused by direct nephrotoxicity from ammonia","It involves functional renal failure associated with advanced liver disease","It often occurs in cirrhosis with ascites","It starts as primary kidney disease that subsequently causes cirrhosis"],"correct":[1,2],"why":"Splanchnic vasodilation and reduced effective arterial filling contribute to renal vasoconstriction and impaired filtration.","src":"send rony.pdf, p. 29 \u00b7 q1211","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hepatorenal syndrome is driven mainly by circulatory dysfunction and renal vasoconstriction.","Renal filtration falls in advanced liver disease even without primary structural renal injury.","Ascites commonly accompanies the advanced circulatory disturbance in cirrhosis.","Advanced hepatic disease is the initiating condition in this syndrome."]},{"id":"midterm3-q0126","topic":"immunity","q":"Which mechanism and example fit type III hypersensitivity?","opts":["Soluble immune complexes deposit and activate complement","Serum sickness is a classic example","It is initiated by allergen-specific IgE on mast cells","It requires antibodies against a fixed cell surface as its defining mechanism"],"correct":[0,1],"why":"Immune complexes can deposit in vessels and tissues and trigger complement-dependent inflammation.","src":"test 4 pp.docx, p. 1 \u00b7 q0126","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Deposited soluble complexes activate complement and recruit inflammatory cells.","Serum sickness is a systemic immune-complex reaction.","IgE and mast-cell activation define type I hypersensitivity.","Antibodies directed against fixed surface or matrix antigens define type II."]},{"id":"midterm3-q0130","topic":"blood","q":"Which complications can follow transfusion?","opts":["Acute hemolytic transfusion reaction","Transfusion-related acute lung injury","Transfusion-associated circulatory overload","An inherited factor V Leiden mutation"],"correct":[0,1,2],"why":"Transfusion complications can involve antibody-mediated hemolysis, inflammatory lung injury, or excess volume.","src":"test 4 pp.docx, p. 1 \u00b7 q0130","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Recipient antibodies can destroy transfused red cells.","TRALI can cause permeability pulmonary edema after transfusion.","TACO reflects circulatory overload and hydrostatic pulmonary edema.","Factor V Leiden is inherited rather than acquired from a transfusion."]},{"id":"midterm3-q0131","topic":"blood","q":"Which are intrinsic red-cell causes of hemolysis?","opts":["Hereditary spherocytosis","G6PD deficiency","Sickle cell disease","Mechanical fragmentation across a damaged valve"],"correct":[0,1,2],"why":"Intrinsic defects affect the red-cell membrane, enzymes, or hemoglobin. Mechanical injury is extrinsic.","src":"test 4 pp.docx, p. 1 \u00b7 q0131","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A membrane or cytoskeletal defect reduces red-cell deformability and promotes splenic removal.","An intrinsic enzyme defect reduces protection against oxidative stress.","A hemoglobin variant can polymerize and make red cells fragile.","A damaged valve applies an external mechanical force to red cells."]},{"id":"midterm3-q0139","topic":"immunity","q":"Which example illustrates destruction of a cell by antibodies directed against its surface antigens?","opts":["Autoimmune hemolytic anemia","Contact dermatitis","Serum sickness","Allergic rhinitis"],"correct":[0],"why":"Antibodies directed against red cell surface antigens can promote clearance or complement-mediated injury.","src":"test 4 pp.docx, p. 1 \u00b7 q0139","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Antibodies bind erythrocyte surface targets and promote clearance or complement injury.","Allergic contact dermatitis is delayed and T-cell mediated.","Serum sickness involves soluble immune complexes rather than antibodies against red-cell surfaces.","Allergic rhinitis is typically a type I IgE reaction."]},{"id":"midterm3-q0141","topic":"immunity","q":"Which example illustrates delayed T-cell-mediated hypersensitivity?","opts":["Allergic contact dermatitis","Acute IgE-mediated anaphylaxis","Serum sickness","Immediate allergic rhinitis"],"correct":[0],"why":"Contact allergens can produce delayed inflammation mediated by previously sensitized T cells.","src":"test 4 pp.docx, p. 1 \u00b7 q0141","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Sensitized T cells respond after re-exposure to contact antigens, often with delayed inflammation.","Anaphylaxis is usually a rapid type I reaction involving mast-cell mediators.","Serum sickness is mediated by immune-complex deposition.","Immediate allergic rhinitis is classically IgE mediated."]},{"id":"midterm3-q0149","topic":"immunity","q":"What immune defect is characteristic of DiGeorge syndrome?","opts":["T-cell deficiency due to thymic hypoplasia","Absent phagocyte oxidative burst as the primary defect","Terminal complement deficiency","Selective loss of platelet adhesion as the primary defect"],"correct":[0],"why":"The thymus is needed for maturation of T cells.","src":"test 4 pp.docx, p. 1 \u00b7 q0149","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced thymic tissue impairs T-cell maturation.","NADPH oxidase deficiency causes chronic granulomatous disease.","Terminal complement deficiency predisposes to invasive Neisseria infection.","Platelet adhesion is not the primary defect in DiGeorge syndrome."]},{"id":"midterm3-q0150","topic":"blood","q":"How do alpha and beta thalassemia differ?","opts":["Alpha thalassemia reduces alpha-globin synthesis","Beta thalassemia reduces beta-globin synthesis","Both result from polymerization of HbS","Both arise from iron deficiency alone"],"correct":[0,1],"why":"In both disorders, imbalance between globin chains contributes to ineffective erythropoiesis and hemolysis.","src":"test 4 pp.docx, p. 1 \u00b7 q0150","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Deficient alpha-chain production leaves excess unmatched non-alpha chains.","Deficient beta-chain production leaves excess alpha chains.","HbS polymerization is the mechanism of sickle cell disease.","Iron deficiency reduces heme availability. Thalassemia reduces globin-chain synthesis."]},{"id":"midterm3-q0153","topic":"blood","q":"What distinguishes relative erythrocytosis from absolute erythrocytosis?","opts":["Relative erythrocytosis can result from reduced plasma volume","Absolute erythrocytosis involves increased red cell mass","Relative erythrocytosis requires increased red cell mass","Absolute erythrocytosis is defined by dehydration alone"],"correct":[0,1],"why":"Hematocrit can rise through hemoconcentration or through a genuine expansion in red cell mass.","src":"test 4 pp.docx, p. 1 \u00b7 q0153","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced plasma volume concentrates existing red cells and raises measured hematocrit.","An actual increase in circulating red-cell mass defines absolute erythrocytosis.","Relative erythrocytosis can occur with normal red-cell mass.","Dehydration mainly causes hemoconcentration rather than expansion of red-cell mass."]},{"id":"midterm3-q0166","topic":"immunity","q":"What drives hyperacute rejection of a transplanted organ?","opts":["Pre-existing recipient antibodies against donor antigens","Delayed sensitization requiring several months","Loss of erythropoietin from transplanted marrow","Primary antibody production by mature donor red cells"],"correct":[0],"why":"Preformed antibodies can rapidly activate complement and injure graft vessels.","src":"test 4 pp.docx, p. 1 \u00b7 q0166","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Pre-existing recipient antibodies bind graft vascular antigens and can quickly trigger complement and thrombosis.","Hyperacute rejection occurs rapidly because relevant antibodies are already present.","Erythropoietin production does not explain rapid graft vascular injury.","Mature donor erythrocytes do not make antibodies."]},{"id":"midterm3-q0174","topic":"immunity","q":"Which target can produce autoimmune disease through receptor stimulation?","opts":["The TSH receptor in Graves disease","The hemoglobin molecule in iron deficiency anemia","Factor IX in inherited hemophilia B","CFTR in cystic fibrosis as the usual mechanism"],"correct":[0],"why":"Thyroid-stimulating autoantibodies activate the receptor and increase thyroid hormone production.","src":"test 4 pp.docx, p. 2 \u00b7 q0174","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Autoantibodies activate the TSH receptor, stimulating thyroid hormone production.","Iron deficiency limits hemoglobin synthesis rather than activating an autoantibody target.","Inherited hemophilia B reflects deficient factor IX activity.","Cystic fibrosis results from inherited CFTR dysfunction."]},{"id":"midterm3-q0179","topic":"blood","q":"Which are extrinsic causes of hemolysis?","opts":["Autoantibodies to red cells","Mechanical injury from a prosthetic valve","Shearing in microangiopathic disease","Inherited spectrin deficiency"],"correct":[0,1,2],"why":"Extrinsic processes damage otherwise normal red cells through external immune or mechanical mechanisms.","src":"test 4 pp.docx, p. 2 \u00b7 q0179","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Antibodies from outside red cells can mark them for clearance or complement attack.","Turbulence or mechanical contact can damage otherwise normal red cells.","Small-vessel obstruction creates shear that fragments red cells.","Spectrin deficiency is an intrinsic defect of the red-cell membrane skeleton."]},{"id":"midterm3-q0182","topic":"blood","q":"Which can cause neutropenia?","opts":["Cytotoxic chemotherapy","Severe marrow failure","Some drug-induced immune reactions","Glucocorticoid-mediated demargination as the typical effect"],"correct":[0,1,2],"why":"Neutrophil counts can fall from impaired production or increased peripheral destruction.","src":"test 4 pp.docx, p. 2 \u00b7 q0182","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Chemotherapy can suppress proliferating granulocyte precursors in marrow.","Marrow failure reduces production of multiple blood-cell lineages.","Drug-dependent immune mechanisms can increase peripheral destruction.","Demargination moves neutrophils into circulating blood and raises the measured count."]},{"id":"midterm3-q1159","topic":"immunity","q":"Which statements about HLA alleles are correct?","opts":["They can mark susceptibility to specific diseases","Only class II alleles are associated with disease","They can contribute to autoimmune susceptibility via antigen presentation","Only class I alleles are associated with disease"],"correct":[0,2],"why":"HLA variation in both classes can affect peptide presentation and predisposition to immune-mediated disease.","src":"\u05e9\u05d7\u05d6\u05d5\u05e8 \u05de\u05d9\u05d3\u05d8\u05e8\u05dd 3 A.pdf, p. 20 \u00b7 q1159","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Some alleles occur more often in people with particular diseases and indicate increased susceptibility.","Class I associations also occur, such as HLA-B27 and ankylosing spondylitis.","Different antigen-binding properties can change presentation of self peptides and influence tolerance.","Class II associations also occur, such as HLA-DQ2 or DQ8 in celiac disease."]},{"id":"midterm3-q1162","topic":"blood","q":"Which statements about iron deficiency are correct?","opts":["Is often caused by rheumatoid arthritis","Can be a consequence of decreased stomach acidity","Can be caused by chronic occult bleeding","Can manifest as a microcytic anemia, dysphagia and angular stomatitis","Is characterized by increased level of ferritin"],"correct":[1,2,3],"why":"Poor iron absorption or chronic blood loss can deplete iron. Longstanding deficiency may cause mucosal changes and microcytic anemia.","src":"\u05e9\u05d7\u05d6\u05d5\u05e8 \u05de\u05d9\u05d3\u05d8\u05e8\u05dd 3 A.pdf, p. 25 \u00b7 q1162","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Rheumatoid arthritis more classically causes inflammatory iron restriction, though true iron deficiency can coexist.","Low gastric acidity can reduce dietary iron absorption.","Repeated occult bleeding drains iron contained in erythrocytes.","Reduced hemoglobin synthesis causes microcytosis and longstanding deficiency can cause mucosal manifestations.","Ferritin usually decreases as iron stores become depleted."]},{"id":"midterm3-q1181","topic":"blood","q":"Which statements about allogeneic hematopoietic stem cell transplantation are correct?","opts":["Peripheral blood can be a source of stem cells","HLA matching helps reduce immune complications","Donor immune cells can cause graft-versus-host disease","The cells always come from an animal donor"],"correct":[0,1,2],"why":"Allogeneic transplantation uses another human donor. HLA matching affects rejection and graft-versus-host risk.","src":"\u05ea\u05de\u05d5\u05e0\u05d5\u05ea \u05e6\u2019\u05db\u05d9\u05dd.pdf, p. 72 \u00b7 q1181","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Mobilized peripheral blood can provide hematopoietic stem and progenitor cells.","Closer HLA matching can reduce immunologic incompatibility and related complications.","Donor immune cells can recognize and attack recipient tissues.","Allogeneic transplantation uses a genetically distinct donor of the same species."]},{"id":"midterm3-q1578","topic":"hemostasis","q":"Which factor deficiencies distinguish hemophilia A and B?","opts":["Hemophilia A involves factor VIII","Hemophilia B involves factor IX","Hemophilia A involves factor VII","Hemophilia B involves fibrinogen"],"correct":[0,1],"why":"Both disorders impair the intrinsic pathway, but they affect different coagulation factors.","src":"IMG_7319.jpg, p. 1 \u00b7 q1578","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hemophilia A is the inherited factor VIII deficiency.","Hemophilia B is the inherited factor IX deficiency.","Factor VII deficiency affects the extrinsic pathway and is a separate disorder.","Fibrinogen deficiency affects fibrin generation and is a separate disorder."]},{"id":"midterm3-q0788","topic":"immunity","q":"Which cells are central to delayed type IV hypersensitivity?","opts":["Basophils and B lymphocytes","Neutrophils and eosinophils alone","Basophils and plasma cells","Basophils and eosinophils","T cells, monocytes, and macrophages"],"correct":[4],"why":"Type IV hypersensitivity is driven by antigen-specific T cells. In delayed inflammatory reactions, T-cell cytokines recruit and activate macrophages.","optionWhy":["B cells produce antibodies, and basophils participate in allergic responses. They are not the central delayed effectors.","These granulocytes may enter inflamed tissue, but T cells initiate the delayed reaction.","Plasma cells secrete antibodies. Type IV can proceed without antibodies.","Basophils and eosinophils are more characteristic of immediate allergic inflammation.","Sensitized T cells can recruit monocytes and activate macrophages during a delayed inflammatory response."],"src":"Ulvi PDF, p. 129 \u00b7 q0788","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1587","topic":"blood","q":"What type of anemia can develop from red-cell injury during the thrombotic phase of DIC?","opts":["Microangiopathic hemolytic anemia","Anemia from blood loss alone","Iron deficiency anemia","Megaloblastic anemia"],"correct":[0],"why":"Fibrin-rich microthrombi can fragment erythrocytes, producing schistocytes and hemolysis.","optionWhy":["Shearing in partially obstructed small vessels destroys circulating red cells.","Bleeding may coexist in DIC, but it does not explain fragmentation in the microvasculature.","Iron depletion typically reflects chronic loss or insufficient intake or absorption.","Megaloblastosis reflects defective DNA synthesis rather than mechanical red-cell injury."],"src":"Ulvi PDF, p. 130 \u00b7 q1587","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1588","topic":"immunity","q":"Which type of hypersensitivity explains serum sickness?","opts":["Type III","Type I","Type II","Type IV"],"correct":[0],"why":"Serum sickness results from systemic deposition of soluble immune complexes and complement activation.","optionWhy":["Deposited antigen\u2013antibody complexes recruit inflammatory cells.","Type I classically involves allergen-specific IgE and mast-cell activation.","Type II involves antibodies against fixed antigens on cells or in extracellular matrix.","Type IV is T-cell mediated."],"src":"Ulvi PDF, p. 188 \u00b7 q1588","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0880","topic":"blood","q":"Which statements about acquired aplastic anemia are correct?","opts":["Rare cases can follow chloramphenicol exposure","Transfusion support is never needed","Parvovirus B19 causes most severe aplastic anemia","Many cases lack an identifiable cause","Transient chemotherapy-induced myelosuppression is always the same as acquired aplastic anemia"],"correct":[0,3],"why":"Aplastic anemia causes pancytopenia with a hypocellular marrow. Many cases are idiopathic; some follow drug exposure.","optionWhy":["Chloramphenicol is a recognized rare cause of aplastic marrow failure.","Severe cytopenias can require red-cell or platelet transfusion support.","Parvovirus B19 classically suppresses erythropoiesis and can cause a transient aplastic crisis or pure red-cell aplasia.","Many acquired cases are termed idiopathic, and an immune-mediated process is often suspected.","Expected transient marrow suppression after cytotoxic therapy is distinct from persistent aplastic marrow failure."],"src":"Ulvi PDF, p. 241 \u00b7 q0880","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1591","topic":"blood","q":"Which finding is least typical of established, uncomplicated iron deficiency anemia?","opts":["Low hemoglobin","Low serum iron","Low ferritin","Macrocytosis"],"correct":[3],"why":"Iron deficiency limits hemoglobin synthesis and typically produces microcytosis once established.","optionWhy":["Low hemoglobin is required for the condition to qualify as anemia.","Circulating iron usually falls as available iron declines.","Ferritin generally falls as stores are depleted; inflammation can raise it independently.","Large red cells suggest another process such as B12 or folate deficiency rather than isolated iron deficiency."],"src":"Ulvi PDF, p. 243 \u00b7 q1591","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0581","topic":"liver","q":"Which mechanism drives iron loading in classic HFE-related hereditary hemochromatosis?","opts":["Excess intestinal absorption of iron","Reduced transfer of iron into bile as the primary defect","Accelerated red-cell destruction as the primary defect","Impaired urinary iron excretion"],"correct":[0],"why":"Inappropriately low hepcidin allows ferroportin to export more absorbed iron into the circulation.","optionWhy":["Low hepcidin activity permits increased net iron absorption, mainly in the proximal small intestine.","The body regulates iron chiefly by absorption rather than by biliary excretion.","Hemolysis recycles iron already in the body and does not explain the inherited absorption defect.","Urinary excretion is not the primary regulator of body iron stores."],"src":"Ulvi PDF, p. 248 \u00b7 q0581","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1592","topic":"hemostasis","q":"Which lab measure is least directly useful in assessing suspected DIC?","opts":["Prothrombin time","Albumin concentration","D-dimer","Fibrinogen","Platelet count"],"correct":[1],"why":"PT, fibrin-related markers, fibrinogen, and platelets reflect coagulation activation or consumption. Albumin is not a component of standard DIC scoring.","optionWhy":["PT can prolong when multiple clotting factors are consumed.","Albumin can reflect liver disease or other illness but does not directly measure fibrin turnover or consumptive coagulopathy.","D-dimer can rise as cross-linked fibrin is broken down.","Fibrinogen can fall with consumption, although inflammation may keep it normal or elevated early.","Platelet consumption can reduce the count."],"src":"Ulvi PDF, p. 251 \u00b7 q1592","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1593","topic":"hemostasis","q":"Which are examples of acquired causes of vascular purpura or fragility?","opts":["Glanzmann thrombasthenia","Marfan syndrome","IgA vasculitis (Henoch\u2013Sch\u00f6nlein purpura)","Cushing syndrome","Inherited vascular Ehlers\u2013Danlos syndrome"],"correct":[2,3],"why":"IgA vasculitis inflames small vessels. Excess glucocorticoids can weaken connective tissue supporting vessels.","optionWhy":["Glanzmann thrombasthenia is an inherited platelet aggregation defect involving GPIIb/IIIa.","Marfan syndrome is an inherited connective-tissue disorder.","Small-vessel inflammation can cause palpable purpura.","Chronic glucocorticoid excess can cause skin and capillary fragility with easy bruising.","The vascular subtype is inherited, typically involving type III collagen."],"src":"Ulvi PDF, p. 255 \u00b7 q1593","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1129","topic":"blood","q":"Which process most directly explains a marked fall in plasma haptoglobin?","opts":["Iron deficiency","Iron overload","Isolated extravascular red-cell clearance","Intravascular hemolysis"],"correct":[3],"why":"Haptoglobin binds free plasma hemoglobin. Intravascular red-cell destruction can deplete it as the complexes are cleared.","optionWhy":["Iron deficiency depletes stored and available iron, rather than releasing cell-free hemoglobin.","Iron overload increases body iron stores and does not itself explain rapid haptoglobin consumption.","Macrophages digest red cells internally in extravascular hemolysis, so a marked fall is less characteristic than in intravascular hemolysis.","Red cells rupture in the circulation, releasing hemoglobin that binds haptoglobin."],"src":"Ulvi PDF, p. 265 \u00b7 q1129","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0822","topic":"blood","q":"Which statement best describes a leukemoid reaction?","opts":["Reactive leukocytosis with immature forms in peripheral blood","The initial stage of leukemia","The terminal stage of chronic myeloid leukemia","A reactive state defined by very low leukocyte alkaline phosphatase"],"correct":[0],"why":"A leukemoid reaction is a marked reactive rise in leukocytes, often neutrophils with a left shift.","optionWhy":["Severe infection or another inflammatory stimulus can increase production and release of immature neutrophils.","The reactive increase is distinct from a clonal leukemic process.","It is not blast-phase CML, which involves progression of a clonal malignancy.","A low leukocyte alkaline phosphatase score was classically associated with CML, not a typical leukemoid reaction."],"src":"Ulvi PDF, p. 268 \u00b7 q0822","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1595","topic":"blood","q":"What distinguishes methemoglobin from hemoglobin that can bind oxygen normally?","opts":["A defective globin chain is required in every case","Its heme contains ferric iron (Fe\u00b3\u207a)","It is simply normal deoxygenated hemoglobin","Its heme remains in the ferrous (Fe\u00b2\u207a) state"],"correct":[1],"why":"Methemoglobin forms when heme iron is oxidized from Fe\u00b2\u207a to Fe\u00b3\u207a, preventing oxygen binding at that site.","optionWhy":["Oxidant exposure or impaired reduction can produce methemoglobin without a globin mutation.","Ferric heme cannot bind oxygen normally.","Deoxygenation removes oxygen without changing heme iron to the ferric state.","Ferrous iron is the usual oxygen-binding form."],"src":"Ulvi PDF, p. 270 \u00b7 q1595","conf":"inferred","seen":1,"recall":f

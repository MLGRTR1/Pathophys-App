<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Pathophysiology Test 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#f5f5f7;--surface:#fff;--rule:rgba(0,0,0,.08);--rule-strong:rgba(0,0,0,.14);
  --text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--danger:#d70015;--ok:#248a3d;
  --ok-bg:rgba(52,199,89,.10);--ok-line:rgba(52,199,89,.45);--bad-bg:rgba(255,59,48,.08);--bad-line:rgba(255,59,48,.45);
  --sel-bg:rgba(0,113,227,.08);--sel-line:rgba(0,113,227,.55);--warn:#b25000;--warn-bg:rgba(255,149,0,.12);
  --glass:hsla(0,0%,100%,.72);
  --grad:linear-gradient(100deg,#f0506e 0%,#b35ce6 50%,#3d82f5 100%);
  --ground:radial-gradient(1100px 640px at 12% 8%,rgba(240,80,110,.08),transparent 60%),radial-gradient(1000px 600px at 90% 92%,rgba(61,130,245,.09),transparent 60%),#f5f5f7;
  --shadow:0 4px 14px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--surface:#1c1c1e;--rule:hsla(0,0%,100%,.08);--rule-strong:hsla(0,0%,100%,.16);
  --text:#f5f5f7;--muted:#98989d;--accent:#0a84ff;--danger:#ff6961;--ok:#30d158;
  --ok-bg:rgba(48,209,88,.13);--ok-line:rgba(48,209,88,.5);--bad-bg:rgba(255,69,58,.13);--bad-line:rgba(255,69,58,.5);
  --sel-bg:rgba(10,132,255,.14);--sel-line:rgba(10,132,255,.6);--warn:#ffb340;--warn-bg:rgba(255,159,10,.14);
  --glass:rgba(20,20,22,.66);
  --ground:radial-gradient(1100px 640px at 12% 12%,rgba(240,80,110,.12),transparent 60%),radial-gradient(1000px 600px at 90% 88%,rgba(61,130,245,.14),transparent 60%),#000;
  --shadow:0 4px 14px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--surface:#1c1c1e;--rule:hsla(0,0%,100%,.08);--rule-strong:hsla(0,0%,100%,.16);
  --text:#f5f5f7;--muted:#98989d;--accent:#0a84ff;--danger:#ff6961;--ok:#30d158;
  --ok-bg:rgba(48,209,88,.13);--ok-line:rgba(48,209,88,.5);--bad-bg:rgba(255,69,58,.13);--bad-line:rgba(255,69,58,.5);
  --sel-bg:rgba(10,132,255,.14);--sel-line:rgba(10,132,255,.6);--warn:#ffb340;--warn-bg:rgba(255,159,10,.14);
  --glass:rgba(20,20,22,.66);
  --ground:radial-gradient(1100px 640px at 12% 12%,rgba(240,80,110,.12),transparent 60%),radial-gradient(1000px 600px at 90% 88%,rgba(61,130,245,.14),transparent 60%),#000;
  --shadow:0 4px 14px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:var(--ground);background-attachment:fixed;min-height:100vh;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--rule)}
.nav-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:1.15rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;border:0;padding:0;background-color:transparent}
.pill{border:1px solid var(--rule-strong);background:var(--surface);border-radius:980px;padding:8px 16px;cursor:pointer;font-size:.95rem;white-space:nowrap}
.pill:hover{border-color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:48px 96px}
.narrow{max-width:760px;margin:0 auto}
.eyebrow{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.04;letter-spacing:-.03em;margin:.35em 0 .3em;font-weight:800;text-wrap:balance}
h2{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 .4em;text-wrap:balance}
.lede{color:var(--muted);font-size:1.15rem;max-width:62ch;margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:40px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:28px 30px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card h3{font-size:1.75rem;margin:0;letter-spacing:-.02em}
.card p{margin:0;color:var(--muted)}
.card .go{display:flex;justify-content:space-between;margin-top:10px;font-size:.95rem}
.card.hero{background:var(--grad);color:#fff;border-color:transparent}
.card.hero p,.card.hero .eyebrow{color:rgba(255,255,255,.88)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:56px 0 16px;gap:12px;flex-wrap:wrap}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.topic{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;text-align:left}
.topic:hover{border-color:var(--rule-strong)}
.topic b{font-weight:600}
.topic small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:980px;padding:6px 14px;font-size:.92rem}
.chip.src{color:var(--muted)}
.chip.ask{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip.unoff{color:var(--muted);border-style:dashed}
.tagline{font-size:.78rem;font-weight:600;color:var(--warn);margin-right:6px}
.why .rn{margin-top:10px;color:var(--muted);font-size:.9rem}
.card.link{text-decoration:none;color:inherit}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.bar{height:6px;background:var(--rule);border-radius:9px;margin:18px 0 30px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .25s}
.q{font-size:clamp(1.3rem,3vw,1.75rem);font-weight:700;letter-spacing:-.015em;line-height:1.3;margin:0 0 8px;text-wrap:pretty}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;cursor:pointer;text-align:left;width:100%;font-size:1.05rem}
.opt:hover:not([disabled]){border-color:var(--rule-strong)}
.opt .k{flex:none;width:32px;height:32px;border:1px solid var(--rule-strong);border-radius:8px;display:grid;place-items:center;font-size:.9rem;font-weight:600}
.opt .t{flex:1;min-width:0;padding-top:4px}
.opt .tag{flex:none;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:980px;margin-top:5px}
.opt.sel{background:var(--sel-bg);border-color:var(--sel-line)}
.opt.sel .k{border-color:var(--sel-line);color:var(--accent)}
.opt.right{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.right .k{border-color:var(--ok-line)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--danger)}
.opt.wrong .k{border-color:var(--bad-line)}
.opt.missed{border:1.5px dashed var(--ok-line);color:var(--ok)}
.opt.dim{opacity:.6}
.tag.r{background:var(--ok-bg)} .tag.w{background:var(--bad-bg)} .tag.m{background:var(--ok-bg)}
.why{margin-top:20px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 20px;font-size:.98rem}
.why b{display:block;margin-bottom:4px}
.why .unc{margin-top:10px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem}
.btn{display:block;width:100%;margin-top:26px;border:0;border-radius:980px;padding:17px;font-size:1.1rem;font-weight:600;color:#fff;background:var(--grad);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--rule-strong)}
.foot{text-align:center;color:var(--muted);font-size:.9rem;margin-top:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .btn{flex:1;min-width:200px}
.mock{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:36px}
.mock .card h3{font-size:1.45rem}
.mono{font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--danger)}
.custom{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:24px 28px;margin-top:16px}
.custom label{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.custom input[type=number]{width:90px;padding:8px 10px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--bg);color:var(--text);font:inherit}
.search{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--text);font:inherit;font-size:1.05rem;margin:24px 0}
.sheet{display:flex;flex-direction:column;gap:12px}
.sheet .item{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 20px}
.sheet .item .qq{font-weight:600;margin-bottom:6px}
.sheet ul{margin:6px 0 0;padding-left:0;list-style:none}
.sheet li{padding:2px 0 2px 26px;position:relative;font-size:.97rem}
.sheet li::before{position:absolute;left:0;font-weight:700}
.sheet li.y{color:var(--ok)} .sheet li.y::before{content:"T"}
.sheet li.n{color:var(--muted)} .sheet li.n::before{content:"F"}
.sheet .r{color:var(--muted);font-size:.9rem;margin-top:6px}
.pat{display:grid;gap:14px;margin-top:28px}
.pat .item{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 22px}
.pat .item h3{margin:0 0 6px;font-size:1.1rem}
.pat .item p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:28px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 20px}
.stat .n{font-size:2rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.9rem}
.tbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 56px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.tbar .track{height:8px;background:var(--rule);border-radius:9px;overflow:hidden}
.tbar .track i{display:block;height:100%;background:var(--grad)}
.tbar .pc{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.result{text-align:center;padding:30px 0}
.result .big{font-size:clamp(3rem,10vw,5.5rem);font-weight:800;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pass{display:inline-block;padding:6px 16px;border-radius:980px;font-weight:600}
.pass.y{background:var(--ok-bg);color:var(--ok)} .pass.n{background:var(--bad-bg);color:var(--danger)}
.review{margin-top:30px;display:flex;flex-direction:column;gap:10px}
.review .item{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;text-align:left;width:100%}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.dot.y{background:var(--ok)} .dot.p{background:var(--warn)} .dot.n{background:var(--danger)}
.theme{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;z-index:6}
.theme svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:1.8}
.empty{color:var(--muted);padding:20px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.wrap{padding-block:28px 80px}.card{padding:22px}.opt{padding:14px 16px;gap:12px;font-size:1rem}.tbar{grid-template-columns:minmax(0,1fr) 70px 46px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body.quizmode{margin:0;min-height:0}
body.quizmode .wrap{padding-block:10px}
body.quizmode .theme{display:none}
body.quizmode .bar{margin:10px 0 14px}
body.quizmode .q{font-size:clamp(1.1rem,2.6vw,1.5rem);margin-bottom:4px}
body.quizmode .hint{margin:0 0 10px;font-size:.85rem}
body.quizmode .opts{gap:8px}
body.quizmode .opt{padding:10px 12px;gap:10px;font-size:.98rem}
body.quizmode .opt .k{width:28px;height:28px}
body.quizmode .opt .t{padding-top:2px}
body.quizmode .opt .tag{margin-top:3px}
body.quizmode .why{margin-top:10px;padding:10px 14px;font-size:.92rem}
body.quizmode .btn{margin-top:12px;padding:13px;font-size:1.02rem}
body.quizmode .foot{margin-top:6px;font-size:.8rem}
@media (hover:none){body.quizmode .foot{display:none}}
</style>
</head>

<script>
const REVIEW_BANK = [{"id":"midterm3-q0002","topic":"liver","q":"Select the correct statement about pain in patients with acute pancreatitis","opts":["Pain is usually not severe and patients rarely require analgesic treatment","Pancreatic enzymes are one of the key factors leading to the development of pain","Prostaglandins contribute to the pain","The pain radiates to the back","After vomiting, the pain usually subsides"],"correct":[1,2,3],"why":"Inflammatory mediators and enzyme-mediated tissue injury contribute to pain. Pancreatic pain commonly radiates to the back and is often severe.","src":"3. test verze 1-2.pdf.pdf, p. 1 \u00b7 q0002","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Acute pancreatic inflammation can produce severe pain requiring analgesia.","Activated enzymes injure pancreatic and surrounding tissue, triggering inflammation and pain.","Prostaglandins sensitize pain pathways during inflammation.","The retroperitoneal location helps explain radiation to the back.","Vomiting does not remove the pancreatic inflammation driving the pain."]},{"id":"midterm3-q0003","topic":"liver","q":"Symptoms of cirrhosis of the liver and portal hypertension include:","opts":["Coagulation disorder","Ascites","Hyperalbuminemia","Anemia","Esophageal varices"],"correct":[0,1,3,4],"why":"Portal hypertension favors ascites and varices. Reduced hepatic synthesis can impair coagulation, and bleeding, nutrition, or hypersplenism may contribute to anemia.","src":"3. test verze 1-2.pdf.pdf, p. 2 \u00b7 q0003","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Loss of hepatic synthetic capacity can alter coagulation.","Portal pressure and renal salt retention favor peritoneal fluid accumulation.","Advanced liver dysfunction often lowers albumin synthesis.","Bleeding, nutritional deficiencies and hypersplenism can contribute to anemia.","Portosystemic collaterals form when portal pressure rises."]},{"id":"midterm3-q0008","topic":"liver","q":"Which manifestations can follow portal hypertension?","opts":["Esophageal varices","Congestive splenomegaly","Ascites","Hyperalbuminemia from increased hepatic synthesis"],"correct":[0,1,2],"why":"Portal pressure promotes collateral formation and splenic congestion. Increased hydrostatic pressure and sodium retention contribute to ascites.","src":"3. test verze 1-2.pdf.pdf, p. 4 \u00b7 q0008","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["High portal pressure diverts flow through esophageal collaterals.","Venous congestion enlarges the spleen and can increase sequestration of blood cells.","Portal hydrostatic pressure and renal sodium retention promote ascites.","Cirrhosis can reduce albumin synthesis. Portal hypertension does not cause hyperalbuminemia."]},{"id":"midterm3-q0534","topic":"hemostasis","q":"What is typical at an isolated platelet count of 110 \u00d7 10\u2079/L?","opts":["Usually without symptoms (asymptomatic)","It is a typical sign of the Leiden mutation","It is an important cause of hemarthrosis","Means there is a risk of spontaneous intracranial bleeding","Associated with purpura and ecchymosis"],"correct":[0],"why":"Mild isolated thrombocytopenia is usually asymptomatic. The count alone does not indicate a high risk of spontaneous intracranial bleeding.","src":"3. test verze 1-2.pdf.pdf, p. 5 \u00b7 q0534","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["A count of 110 is mildly reduced, and isolated mild thrombocytopenia is often asymptomatic.","Factor V Leiden raises venous thrombosis risk and does not characteristically lower platelets.","Joint bleeding is more characteristic of a coagulation factor deficiency.","This count alone does not imply a high risk of spontaneous intracranial bleeding.","Purpura can occur with platelet disorders, but this count alone does not predict it."]},{"id":"midterm3-q0013","topic":"hemostasis","q":"Which statements about thrombocytopenia are correct?","opts":["It is one of the causes of impaired primary hemostasis","Associated with hematomas but never with hemarthrosis","It is a typical sign of ulcerative colitis","It can be treated with aspirin","May result from portal hypertension"],"correct":[0,4],"why":"Low platelet numbers impair primary hemostasis. Portal hypertension can cause splenomegaly and platelet sequestration. Aspirin impairs platelet function.","src":"3. test verze 2-2.pdf.pdf, p. 2 \u00b7 q0013","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Fewer circulating platelets can impair formation of the initial plug.","Platelet defects more often cause mucocutaneous bleeding. The absolute claim about joint bleeding is too strong.","Ulcerative colitis does not characteristically cause a low platelet count.","Aspirin reduces platelet aggregation and can worsen bleeding.","An enlarged congested spleen can sequester platelets."]},{"id":"midterm3-q0017","topic":"liver","q":"Which findings support acute calculous cholecystitis?","opts":["Persistent right upper quadrant pain","Fever","Inspiratory arrest during deep right upper quadrant palpation","Painless unconjugated hyperbilirubinemia as the defining presentation"],"correct":[0,1,2],"why":"Persistent cystic duct obstruction inflames the gallbladder and can produce a positive Murphy sign.","src":"3. test verze 2-2.pdf.pdf, p. 4 \u00b7 q0017","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Persistent cystic duct obstruction causes sustained pain and local inflammation.","An inflamed gallbladder can produce a systemic febrile response.","A positive Murphy sign reflects pain when the descending gallbladder contacts the examiner\u2019s hand.","Acute calculous cholecystitis usually causes pain. Marked jaundice warrants consideration of common duct pathology."]},{"id":"midterm3-q0019","topic":"hemostasis","q":"Choose the correct statement about hemophilia A.","opts":["PT is extended","APTT is prolonged","It is a disease linked to the Y chromosome, therefore only men can have it","Petechial hemorrhage and purpura are typical","If the patient has approximately 10% factor VIII, this indicates a high risk of spontaneous bleeding"],"correct":[1],"why":"Factor VIII deficiency impairs the intrinsic pathway, prolonging aPTT with a usually normal PT. Inherited hemophilia A is X-linked.","src":"3. test verze 2-2.pdf.pdf, p. 5 \u00b7 q0019","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["PT tests the tissue-factor and common pathways and is usually normal in isolated factor VIII deficiency.","Factor VIII supports intrinsic pathway amplification, so low activity prolongs aPTT.","Inherited hemophilia A is X-linked.","Petechiae suggest a platelet or vessel-wall defect. Hemophilia more often causes deep bleeding or hemarthrosis.","Around 10% factor VIII activity generally falls in the mild range. Frequent spontaneous bleeding is more characteristic of severe deficiency."]},{"id":"midterm3-q0020","topic":"liver","q":"Which complications can directly result from an obstructing stone at the ampulla of Vater?","opts":["Acute pancreatitis","Obstructive jaundice","Isolated cystic duct obstruction as the direct mechanism","Unconjugated hyperbilirubinemia as the expected pattern"],"correct":[0,1],"why":"An ampullary stone may block both pancreatic juice and bile. Acute cholecystitis generally follows cystic duct obstruction.","src":"3. test verze 2-2.pdf.pdf, p. 5 \u00b7 q0020","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["An ampullary stone can block pancreatic drainage and trigger acute pancreatitis.","The same stone can obstruct bile drainage and cause conjugated jaundice.","The cystic duct drains the gallbladder and is anatomically upstream from the ampulla.","Obstruction impairs excretion of bilirubin that has already been conjugated."]},{"id":"midterm3-q0021","topic":"hemostasis","q":"A 19-year-old recovering from a respiratory infection has platelets of 82 \u00d7 10\u2079/L, INR 1.12, aPTT 29 seconds, and Duke bleeding time 4 minutes 40 seconds. Which finding is most likely?","opts":["Has no clinical signs of bleeding disorders","Has to be hospitalized to ICU for high risk of life-threatening bleeding","Has acquired hemophilia A \u2013type disorder due to formation of antibodies to f.VIII","Has mother heterozygotic for hemophilia A or B","Has vitamin K deficiency due to treatment by antibiotics"],"correct":[0],"why":"This degree of thrombocytopenia can occur without clinical bleeding. PT and aPTT do not point to a severe coagulation factor deficiency here.","src":"3rd test Lian.docx.pdf, p. 1 \u00b7 q0021","conf":"key","seen":2,"recall":false,"scored":true,"optionWhy":["Moderate thrombocytopenia with otherwise unremarkable coagulation tests can be clinically silent.","The count and tests alone do not indicate a high risk of life-threatening bleeding.","A factor VIII inhibitor typically prolongs aPTT and can cause deep bleeding.","The lab results provide no information about the mother's carrier status.","Vitamin K deficiency usually raises PT or INR before affecting aPTT."]},{"id":"midterm3-q0206","topic":"blood","q":"Which statements about leukocyte counts are correct?","opts":["An increased number of eosinophils with 4% of basophils and 9% of neutrophils can be related to bacterial infection","An increased number of macrophages with 14% of basophils and 62% of lymphocytes can be related to bacterial infection","Chemotherapy is an important risk factor of neutropenia","An increased number of neutrophils with 4% of metamyelocytes and 9% of bands can be related to bacterial infection","Amount of leucocytes in peripheral blood is approximately 0,5 kg"],"correct":[2,3],"why":"Chemotherapy may suppress marrow production. An increase in bands and metamyelocytes is a left shift, which can occur in bacterial infection.","src":"4th test Lian.docx.pdf, p. 2 \u00b7 q0206","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Eosinophilia is more typical of allergic or parasitic responses than of a bacterial left shift.","Macrophages are generally tissue cells. A lymphocyte-predominant differential does not show a neutrophilic left shift.","Cytotoxic drugs can suppress granulocyte production in marrow.","Bands and metamyelocytes are immature neutrophil forms released during increased marrow demand.","Peripheral leukocytes are reported as a concentration and differential, and the quoted mass is not a standard finding."]},{"id":"midterm3-q0207","topic":"immunity","q":"Which mediator contributes to bronchoconstriction during type I hypersensitivity?","opts":["Leukotrienes released after mast-cell activation","Hepcidin released from hepatocytes","Factor XIII released to cross-link fibrin","Erythropoietin released from the kidney"],"correct":[0],"why":"Allergen exposure can cross-link mast cell-bound IgE and cause leukotriene release, bronchoconstriction, and edema.","src":"4th test Lian.docx.pdf, p. 2 \u00b7 q0207","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Cysteinyl leukotrienes released during mast-cell activation contract bronchial smooth muscle.","Hepcidin limits iron export through ferroportin.","Factor XIII cross-links fibrin after a clot forms.","Erythropoietin stimulates red-cell production."]},{"id":"midterm3-q0210","topic":"immunity","q":"Which statements about hypersensitivity are correct?","opts":["A type III hypersensitivity reaction is important in the pathogenesis of systemic lupus erythematosus","Type I hypersensitivity reaction is associated with increased IgE levels","The most severe type II hypersensitivity reaction is anaphylactic shock","A type II hypersensitivity reaction is the major cause of bronchial asthma","The mechanism of development of glomerulonephritis is most frequently related to type IV hypersensitivity reaction"],"correct":[0,1],"why":"Immune complexes contribute to lupus pathology. Type I reactions involve antigen-specific IgE and include anaphylaxis.","src":"4th test Lian.docx.pdf, p. 4 \u00b7 q0210","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Soluble immune complexes contribute to tissue injury in lupus.","Allergen-specific IgE sensitizes mast cells for rapid activation.","Anaphylaxis is a systemic type I reaction.","Allergic asthma commonly includes IgE-mediated inflammation and additional airway mechanisms.","Many forms of glomerulonephritis involve immune complexes or antibodies to fixed targets."]},{"id":"midterm3-q0211","topic":"blood","q":"Which statements describe anemia of chronic inflammation?","opts":["Hepcidin level increases due to pro-inflammatory mediators","It is associated with decreased plasma concentrations of ferritin and transferrin","Patients usually have severe iron deficiency and very low plasma iron level","It can be caused by Crohn\u2019s disease","IL 2 and IL 8 play a major role in the pathogenesis of this anemia"],"correct":[0,3],"why":"Inflammation raises hepcidin and restricts iron availability. Inflammatory bowel disease can supply that inflammatory stimulus.","src":"4th test Lian.docx.pdf, p. 4 \u00b7 q0211","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammatory signals such as IL-6 increase hepatic hepcidin.","Transferrin can fall, while ferritin often stays normal or rises as an acute-phase protein.","Serum iron may fall because it is sequestered. Total iron stores need not be depleted.","Sustained inflammation in Crohn disease can restrict iron availability and erythropoiesis.","IL-6 is a major hepcidin signal. Other inflammatory cytokines can suppress erythropoiesis."]},{"id":"midterm3-q0214","topic":"liver","q":"Which findings fit acute common bile duct obstruction from a gallstone?","opts":["Conjugated hyperbilirubinemia","Colicky abdominal pain","Dark stool and pale urine as the expected pattern","ALP typically falls"],"correct":[0,1],"why":"Obstruction impairs excretion of conjugated bilirubin. Urine can darken, stool can pale, and a stone may produce colicky pain.","src":"4th test Lian.docx.pdf, p. 6 \u00b7 q0214","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Conjugated bilirubin backs up when the common duct cannot drain.","A stone can cause intermittent obstruction and biliary colic.","Conjugated bilirubin darkens urine. Less pigment reaches the intestine, which can lighten stool.","Cholestasis generally raises ALP, particularly if obstruction persists."]},{"id":"midterm3-q0215","topic":"immunity","q":"Which mechanisms contribute to anaphylactic shock or airway compromise?","opts":["Leukotriene-mediated bronchoconstriction","Histamine-mediated vasodilation","Increased vascular permeability and airway edema","Hyperkalemia as the usual primary mechanism"],"correct":[0,1,2],"why":"Mast cell mediators cause vasodilation, capillary leakage, bronchospasm, and edema.","src":"4th test Lian.docx.pdf, p. 7 \u00b7 q0215","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Mast-cell leukotrienes contract bronchial smooth muscle.","Histamine dilates vessels and reduces systemic vascular resistance.","Vascular leakage can cause airway edema and reduce effective circulating volume.","Distributive shock is driven by vasodilation and leakage. Hyperkalemia is a different mechanism."]},{"id":"midterm3-q0216","topic":"blood","q":"Which statements describe sickle cell disease?","opts":["Infection can precipitate a crisis","It is an extrinsic red-cell disorder","It can cause acute crises and chronic pain","It can cause cerebral vaso-occlusive injury"],"correct":[0,2,3],"why":"Deoxygenated HbS polymerizes, promoting sickling, hemolysis, and microvascular obstruction.","src":"4th test Lian.docx.pdf, p. 8 \u00b7 q0216","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Infection can increase hypoxia and inflammation, promoting HbS polymerization.","The defect is within the erythrocyte. HbS polymerizes as oxygen tension falls.","Microvascular obstruction causes acute crises, and recurrent injury can contribute to chronic pain.","Sickling and vascular injury can compromise cerebral perfusion and cause stroke."]},{"id":"midterm3-q0219","topic":"blood","q":"Which conditions or mechanisms can produce microcytic or hypochromic anemia?","opts":["Anemia due to impaired heme synthesis","thalassemia","impaired synthesis of the globin component of hemoglobin","anemia of chronic diseases","B12 deficiency anemia"],"correct":[0,1,2,3],"why":"Heme synthesis disorders and reduced globin synthesis can produce microcytosis. Anemia of chronic inflammation is often normocytic but can become microcytic.","src":"4th test Lian.docx.pdf, p. 10 \u00b7 q0219","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Impaired heme production limits hemoglobin synthesis and can reduce red-cell size.","Thalassemia reduces globin-chain synthesis and often produces marked microcytosis.","Reduced globin production limits how much hemoglobin each cell can make.","Inflammatory iron restriction can produce microcytosis, though many cases are normocytic.","B12 deficiency impairs DNA synthesis and usually produces macrocytosis."]},{"id":"midterm3-q0220","topic":"blood","q":"Which products help neutrophils kill microbes inside phagolysosomes?","opts":["Defensins","Lysozyme","IgA secreted by neutrophils","Histamine as their main intracellular antimicrobial agent"],"correct":[0,1],"why":"Neutrophil granules contain antimicrobial peptides and enzymes, including defensins and lysozyme.","src":"4th test Lian.docx.pdf, p. 10 \u00b7 q0220","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Defensins are antimicrobial peptides that disrupt microbial membranes.","Lysozyme cleaves bacterial peptidoglycan.","IgA is produced by plasma cells and mainly supports mucosal defense.","Histamine is an inflammatory mediator, especially in mast-cell granules."]},{"id":"midterm3-q0222","topic":"immunity","q":"Which diseases are classic examples of autoimmunity?","opts":["Hashimoto thyroiditis","Systemic lupus erythematosus","Inherited hemophilia A","Down syndrome"],"correct":[0,1],"why":"Hashimoto thyroiditis targets the thyroid and lupus can affect multiple organs through autoantibodies and immune complexes.","src":"4th test Lian.docx.pdf, p. 11 \u00b7 q0222","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Immune responses against thyroid antigens damage the gland.","Loss of self-tolerance drives autoantibody and immune-complex injury.","Inherited hemophilia A is caused by a pathogenic variant affecting factor VIII.","Down syndrome results from an extra copy of chromosome 21."]},{"id":"midterm3-q0223","topic":"liver","q":"Which laboratory findings can occur during symptomatic hepatitis A?","opts":["Blood ALT and AST levels increase","More than half of the patients rapidly develop hepatic encephalopathy","Stool color is usually hypercholic","Conjugated and unconjugated bilirubin concentrations in the blood increase","Patients usually do not have jaundice"],"correct":[0,3],"why":"Acute hepatitis can raise AST and ALT through hepatocyte injury. Both bilirubin fractions can rise when bilirubin handling is impaired.","src":"4th test Lian.docx.pdf, p. 12 \u00b7 q0223","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Hepatocyte injury releases aminotransferases into blood.","Fulminant liver failure with encephalopathy is uncommon in hepatitis A.","If intrahepatic cholestasis limits pigment delivery, stool may lighten.","Inflamed hepatocytes may handle, conjugate, and excrete bilirubin less efficiently, giving a mixed rise.","Jaundice can occur in clinically apparent hepatitis A, especially in adults."]},{"id":"midterm3-q0898","topic":"blood","q":"Which findings or causes fit iron deficiency anemia?","opts":["Chronic atrophic gastritis","Chronic occult bleeding","High ferritin as the expected pattern","Dysphagia and oral mucosal atrophy in longstanding disease"],"correct":[0,1,3],"why":"Poor absorption or chronic blood loss can deplete iron. Longstanding deficiency may cause mucosal changes.","src":"Copy of Czech Ws was 3.pdf, p. 5 \u00b7 q0898","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced gastric acidity can impair dietary iron absorption.","Repeated occult bleeding gradually depletes iron stores.","Ferritin usually falls in uncomplicated iron deficiency. Inflammation can raise it independently.","Longstanding iron deficiency can produce oral mucosal changes and dysphagia."]},{"id":"midterm3-q0900","topic":"hemostasis","q":"Where is von Willebrand factor found?","opts":["Hepatocytes are its primary site of synthesis","The subendothelial matrix","Only inside red blood cells","Only in the fibrin clot"],"correct":[1],"why":"Endothelial cells deposit von Willebrand factor in the subendothelial matrix, where it supports platelet adhesion.","src":"Copy of Czech Ws was 3.pdf, p. 8 \u00b7 q0900","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Endothelial cells and megakaryocytes synthesize von Willebrand factor.","Endothelial von Willebrand factor binds exposed subendothelial matrix and helps recruit platelets.","Red cells are not its source or exclusive location.","It circulates in plasma and is stored in endothelial cells and platelet granules before clotting."]},{"id":"midterm3-q0787","topic":"hemostasis","q":"What is the effect of factor V Leiden?","opts":["Prolonged PT","Increased risk of venous thrombosis","Spontaneous bleeding","Shortened aPTT as its characteristic finding"],"correct":[1],"why":"Factor V Leiden makes activated factor V resistant to cleavage by activated protein C.","src":"Copy of Czech Ws was 3.pdf, p. 15 \u00b7 q0787","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The mutation alters regulation of factor Va, and routine PT is usually normal.","Resistance to activated protein C prolongs factor Va activity and increases venous thrombosis risk.","Persistent factor Va activity favors clotting rather than bleeding.","Routine aPTT shortening is not the characteristic diagnostic finding."]},{"id":"midterm3-q0795","topic":"liver","q":"Which inherited disorders can cause chronic liver damage?","opts":["Wilson disease","Hereditary hemochromatosis","Alpha-1 antitrypsin deficiency","Inherited hemophilia A as a direct cause of cirrhosis"],"correct":[0,1,2],"why":"Copper accumulation, iron overload, and hepatocyte retention of abnormal alpha-1 antitrypsin can injure the liver.","src":"Copy of Czech Ws was 3.pdf, p. 44 \u00b7 q0795","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Impaired biliary copper excretion leads to copper accumulation in hepatocytes.","Iron loading can cause chronic oxidative injury and fibrosis.","Misfolded alpha-1 antitrypsin can accumulate in hepatocytes.","Factor VIII deficiency causes bleeding. It does not directly produce chronic hepatocyte injury."]},{"id":"midterm3-q0801","topic":"immunity","q":"Which cell releases preformed mediators immediately after allergen cross-links receptor-bound IgE?","opts":["Mast cell","Erythrocyte","Megakaryocyte","Hepatocyte"],"correct":[0],"why":"Mast cells carry Fc\u03b5RI-bound IgE and degranulate after antigen-dependent cross-linking.","src":"Copy of Czech Ws was 3.pdf, p. 61 \u00b7 q0801","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Mast cells bind IgE via Fc\u03b5RI and can degranulate within minutes of cross-linking.","Erythrocytes transport oxygen and do not have mast-cell granules.","Megakaryocytes produce platelets.","Hepatocytes synthesize plasma proteins and do not mediate rapid IgE degranulation."]},{"id":"midterm3-q0814","topic":"immunity","q":"Which disorders can result from antibodies directed against cell-surface receptors?","opts":["Myasthenia gravis","Graves disease","Iron deficiency anemia","Hereditary hemophilia A"],"correct":[0,1],"why":"Antibodies impair acetylcholine receptor function in myasthenia gravis and stimulate the TSH receptor in Graves disease.","src":"Copy of Czech Ws was 3.pdf, p. 114 \u00b7 q0814","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Antibodies can reduce functional acetylcholine receptors at the neuromuscular junction.","Autoantibodies can stimulate the TSH receptor and increase thyroid hormone production.","Iron deficiency limits heme production and does not require an antibody to a receptor.","Inherited hemophilia A is caused by a genetic deficiency of factor VIII."]},{"id":"midterm3-q0550","topic":"immunity","q":"Which can cause secondary immunodeficiency?","opts":["Immunosuppressive medication","Severe malnutrition","DiGeorge syndrome","HIV infection"],"correct":[0,1,3],"why":"Secondary immunodeficiency is acquired. DiGeorge syndrome is a primary developmental disorder.","src":"Copy of Czech Ws was 3.pdf, p. 115 \u00b7 q0550","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Drugs can suppress immune cell activation, proliferation, or survival.","Malnutrition can undermine barriers and immune responses.","Thymic hypoplasia causes a primary developmental T-cell defect.","HIV depletes CD4 T cells and progressively disrupts immune coordination."]},{"id":"midterm3-q0816","topic":"immunity","q":"Which statements about immune disorders are correct?","opts":["HIV primarily targets CD4 T cells","Severe malnutrition can impair immunity","Selective IgA deficiency is a form of primary immunodeficiency","Eosinophilia excludes allergic inflammation"],"correct":[0,1,2],"why":"HIV and malnutrition cause secondary immune dysfunction. Selective IgA deficiency is primary, and eosinophilia can accompany allergic disease.","src":"Copy of Czech Ws was 3.pdf, p. 121 \u00b7 q0816","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The virus uses CD4 and a coreceptor for entry and can deplete helper T cells.","Nutrient deficiency can impair barrier integrity and immune cell function.","Selective IgA deficiency is a primary antibody deficiency.","Eosinophils commonly participate in allergic inflammation."]},{"id":"midterm3-q1532","topic":"immunity","q":"A translocation places MYC under an immunoglobulin enhancer. Which disease is the classic example?","opts":["Burkitt lymphoma","Iron deficiency anemia","Systemic lupus erythematosus","Polycythemia vera"],"correct":[0],"why":"The immunoglobulin enhancer drives inappropriate MYC expression in the B cell.","src":"Copy of Czech Ws was 3.pdf, p. 132 \u00b7 q1532","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The classic translocation places MYC near an immunoglobulin locus, increasing MYC expression in B cells.","Iron depletion limits hemoglobin synthesis.","Lupus is driven by loss of self-tolerance and immune responses to self antigens.","Polycythemia vera commonly involves a JAK2 mutation and autonomous myeloid proliferation."]},{"id":"midterm3-q0917","topic":"blood","q":"Which neutrophil function is impaired in lazy leukocyte syndrome?","opts":["Oxidative burst","Chemotaxis","Antibody production","Complement activation"],"correct":[1],"why":"This disorder impairs directed neutrophil migration.","src":"Copy of Czech Ws was 3.pdf, p. 189 \u00b7 q0917 \u00b7 Ulvi PDF, p. 169 \u00b7 q0917","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A defective oxidative burst is characteristic of chronic granulomatous disease.","The neutrophils have difficulty following chemical gradients to sites of infection.","Plasma cells produce antibodies.","Complement activation is a plasma protein cascade."]},{"id":"midterm3-q1189","topic":"blood","q":"What red cell pattern is typical of anemia due to reduced erythropoietin in chronic kidney disease?","opts":["Normocytic hypoproliferative anemia","Severe macrocytosis from impaired DNA synthesis","Hypochromic microcytosis in every case","Reticulocytosis from marrow overstimulation"],"correct":[0],"why":"Reduced renal erythropoietin lowers marrow red cell production without directly impairing hemoglobin synthesis or DNA replication.","src":"Copy of Czech Ws was 3.pdf, p. 190 \u00b7 q1189","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced EPO lowers erythrocyte production, so the marrow response is inadequate and MCV is usually normal.","Megaloblastic macrocytosis suggests impaired DNA synthesis, such as B12 deficiency.","Iron deficiency can coexist, but reduced EPO itself does not require microcytosis.","An inadequate EPO signal does not produce a robust reticulocyte response."]},{"id":"midterm3-q0023","topic":"immunity","q":"Which findings can result from a systemic type I hypersensitivity reaction?","opts":["Bronchospasm","Diarrhea","Distributive shock","Delayed granuloma formation as its defining manifestation"],"correct":[0,1,2],"why":"Mast-cell mediators affect the airways, gut, and circulation.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0023","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammatory mediators such as leukotrienes contract airway smooth muscle.","Mediator effects on the gut can increase secretion and motility.","Systemic vasodilation and capillary leakage reduce effective circulating volume.","Granuloma formation develops through sustained cell-mediated inflammation."]},{"id":"midterm3-q0027","topic":"liver","q":"Which statements about cirrhosis are correct?","opts":["Can cause secondary immunodeficiency","Can develop as a complication of nonalcoholic fatty liver disease","Is a risk factor for hypoaldosteronism","Is a risk factor for hypoglycemia","Often develops as a complication of viral hepatitis A"],"correct":[0,1,3],"why":"Cirrhosis can impair immune defenses and glucose regulation. Steatotic liver disease can progress to cirrhosis. Hepatitis A does not establish chronic infection.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0027","conf":"key","seen":2,"recall":false,"scored":true,"optionWhy":["Advanced liver disease can impair innate and adaptive immune defenses.","Steatotic liver disease can progress through inflammation and fibrosis to cirrhosis.","Effective arterial underfilling commonly activates aldosterone rather than suppressing it.","Loss of hepatic reserve can impair glycogen storage and glucose production.","Hepatitis A generally does not establish the chronic infection that drives progressive fibrosis."]},{"id":"midterm3-q0028","topic":"hemostasis","q":"Which statement is correct about platelet dysfunction?","opts":["Can be caused by aspirin","aPTT is prolonged","INR is prolonged","Can be treated by heparin","D-dimer level is increased"],"correct":[0],"why":"Aspirin lowers platelet thromboxane A\u2082 production. PT and aPTT measure plasma coagulation rather than platelet aggregation.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0028","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Aspirin irreversibly inhibits platelet COX-1 and lowers thromboxane A\u2082 production.","aPTT measures plasma clotting pathways, rather than platelet aggregation.","INR is derived from PT and does not directly measure platelet dysfunction.","Heparin enhances antithrombin and does not restore platelet function.","D-dimer reflects cross-linked fibrin turnover."]},{"id":"midterm3-q0030","topic":"blood","q":"Which statements about leukocytes in inflammation are correct?","opts":["During degranulation, mast cells release histamine, heparin and serotonin","Neutrophils are macrophages which cannot phagocyte microorganism without opsonization","IL-6 directly induces hepatocytes to produce acute phase reactants","Tissue macrophages are the important producers of interleukin-1 and TNF-\u03b1","Neutrophilic granulocytes are key cells in defense against multicellular parasites"],"correct":[0,2,3],"why":"Mast-cell granules contain inflammatory mediators. IL-6 stimulates hepatic acute-phase reactants, and activated macrophages produce IL-1 and TNF.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0030","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Mast-cell granules supply preformed inflammatory mediators. Histamine and heparin are classic examples.","Neutrophils and macrophages are distinct phagocytes. Opsonization enhances uptake but is not obligatory for every target.","IL-6 signals hepatocytes to increase proteins such as CRP and fibrinogen.","Activated macrophages release IL-1 and TNF, which promote local and systemic inflammation.","Eosinophils are classically associated with responses to helminths."]},{"id":"midterm3-q0038","topic":"hemostasis","q":"Which situations can prolong aPTT?","opts":["Usually in patients with increased D-dimers","Usually in patients treated with heparin","Usually in patients with hemophilia B","Often in patients with liver failure","Usually in patients with thrombocytopenia"],"correct":[1,2,3],"why":"Unfractionated heparin, factor IX deficiency, and some cases of advanced liver failure can prolong aPTT. The platelet count and D-dimer do not directly determine it.","src":"D8F043B3-4693-45BD-810F-8CAF38873756 2.pdf, p. 1 \u00b7 q0038","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["D-dimer elevation signals fibrin turnover and does not directly prolong aPTT.","Unfractionated heparin enhances antithrombin activity and can prolong aPTT.","Factor IX deficiency reduces intrinsic pathway activity.","Severe liver dysfunction can reduce multiple circulating clotting factors.","aPTT is performed in plasma with added phospholipid and does not directly reflect the platelet count."]},{"id":"midterm3-q0040","topic":"liver","q":"Which statements about liver cirrhosis are correct?","opts":["Often develops as complication of hepatitis type A","May cause secondary hyperaldosteronism","Is a risk factor for hypoglycemia","Can cause secondary immunodeficiency","Can develop as complication of nonalcoholic fatty liver disease"],"correct":[1,2,3,4],"why":"Portal circulatory changes can activate aldosterone. Loss of hepatic reserve can cause hypoglycemia, and cirrhosis can impair immune defense.","src":"D8F043B3-4693-45BD-810F-8CAF38873756 2.pdf, p. 1 \u00b7 q0040","conf":"key","seen":2,"recall":false,"scored":true,"optionWhy":["Hepatitis A does not commonly cause chronic infection or progressive cirrhosis.","Low effective arterial filling activates the renin\u2013angiotensin\u2013aldosterone system.","Loss of hepatic metabolic reserve can impair maintenance of blood glucose.","Cirrhosis can impair systemic defenses against infection.","Steatotic liver injury may lead to progressive fibrosis."]},{"id":"midterm3-q0044","topic":"liver","q":"Which laboratory results directly support pancreatic injury in acute pancreatitis?","opts":["Elevated lipase","Elevated amylase","Elevated GGT alone","Low leukocyte count alone"],"correct":[0,1],"why":"Lipase and amylase reflect pancreatic injury, with lipase generally more specific. GGT can reflect concurrent hepatobiliary disease or alcohol exposure.","src":"D8F043B3-4693-45BD-810F-8CAF38873756 2.pdf, p. 1 \u00b7 q0044","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Lipase released from injured acinar cells is relatively specific for pancreatic injury.","Amylase can rise with acinar injury, although other conditions can also elevate it.","GGT is more useful as a hepatobiliary marker and does not by itself demonstrate pancreatic injury.","A low leukocyte count is not a direct measure of injury to acinar cells."]},{"id":"midterm3-q0045","topic":"hemostasis","q":"Which statement describes factor V Leiden?","opts":["in asymptomatic patients measurement of D-dimers is important for diagnosis","Factor V increased resistance to degradation by protein C action, leading to activation of fibrinolysis","Factor V decreased resistance to degradation by protein C action, leading to activation of coagulation cascade","Factor V increased resistance to degradation by protein C action, leading to activation of coagulation cascade","Factor V decreased resistance to degradation by protein C action, leading to activation of fibrinolysis"],"correct":[3],"why":"Factor V Leiden makes activated factor V resistant to inactivation by activated protein C, prolonging procoagulant activity.","src":"D8F043B3-4693-45BD-810F-8CAF38873756 2.pdf, p. 1 \u00b7 q0045","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["D-dimer measures fibrin turnover. It cannot identify the inherited factor V variant.","Persistent factor Va supports thrombin generation, rather than activating fibrinolysis.","Leiden increases resistance to cleavage by activated protein C.","Factor Va stays active longer and promotes conversion of prothrombin to thrombin.","Cleavage by activated protein C normally limits coagulation, and the mutation reduces that cleavage."]},{"id":"midterm3-q0227","topic":"blood","q":"Which statements about anemia are correct?","opts":["A hyperdynamic circulation can compensate for reduced oxygen delivery","Occult bleeding can lead to iron deficiency anemia","Hemolytic anemias characterized by increased level of conjugated bilirubin and normal level of unconjugated bilirubin","Iron deficiency anemia is usually macrocytic","Anemia of chronic diseases associated with decreased level of ferritin"],"correct":[0,1],"why":"A higher cardiac output can partly compensate for reduced oxygen-carrying capacity. Chronic occult bleeding can deplete iron stores.","src":"D8F043B3-4693-45BD-810F-8CAF38873756.pdf.pdf, p. 2 \u00b7 q0227","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["A rise in cardiac output can partly offset reduced arterial oxygen content.","Repeated blood loss removes iron contained in hemoglobin.","Heme breakdown typically raises unconjugated bilirubin.","Iron restriction limits hemoglobin synthesis and tends toward microcytosis.","Inflammation can raise ferritin even when serum iron and transferrin saturation are low."]},{"id":"midterm3-q0228","topic":"liver","q":"Which laboratory patterns can occur in advanced cirrhosis?","opts":["Increased ammonia","Increased conjugated bilirubin","A reliably normal platelet count","A mandatory 40-fold rise in both AST and ALT"],"correct":[0,1],"why":"Reduced hepatic clearance and shunting can increase ammonia. Impaired bilirubin processing can raise the conjugated fraction, and severe dysfunction need not produce extreme aminotransferase elevations.","src":"D8F043B3-4693-45BD-810F-8CAF38873756.pdf.pdf, p. 3 \u00b7 q0228","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Shunting and reduced hepatic detoxification can increase circulating ammonia.","Impaired excretion of conjugated bilirubin can raise its plasma concentration.","Portal hypertension and reduced thrombopoietin can lower the count.","Advanced cirrhosis can exist with modest or near-normal aminotransferase values."]},{"id":"midterm3-q0230","topic":"hemostasis","q":"Which tests help assess suspected DIC after severe trauma?","opts":["Albumin concentration","D-dimer concentration","Platelet count","Fibrinogen concentration","Erythrocyte count"],"correct":[1,2,3],"why":"Platelets and fibrinogen help assess consumption, while D-dimer reflects fibrin breakdown. PT and aPTT can also inform the overall evaluation.","src":"D8F043B3-4693-45BD-810F-8CAF38873756.pdf.pdf, p. 4 \u00b7 q0230","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Albumin may reflect liver synthesis or other illness, but does not measure factor consumption or fibrin turnover.","D-dimer rises when cross-linked fibrin is degraded.","Platelets can fall as they are consumed in widespread clotting.","Fibrinogen helps assess consumption, though an acute-phase rise can mask a decrease.","An erythrocyte count does not directly measure coagulation activation or factor consumption."]},{"id":"midterm3-q1281","topic":"hemostasis","q":"Which factors make up Virchow's triad?","opts":["Endothelial injury","Abnormal blood flow","Hypercoagulability","Increased fibrinolysis"],"correct":[0,1,2],"why":"Vessel injury, stasis or turbulence, and increased coagulability promote thrombosis.","src":"Open qs 3.pdf, p. 1 \u00b7 q1281","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Endothelial damage exposes procoagulant surfaces and can activate platelets.","Stasis or turbulence can promote coagulation and impair clearance of activated factors.","A shift toward procoagulant activity raises thrombus risk.","Fibrinolysis removes fibrin and is not a component of the triad."]},{"id":"midterm3-q1285","topic":"liver","q":"What pattern is expected in jaundice due to isolated hemolysis?","opts":["Increased unconjugated bilirubin","Absent bilirubinuria","Urinary urobilinogen can increase","A marked increase in conjugated bilirubin is the defining change"],"correct":[0,1,2],"why":"Excess heme breakdown raises the unconjugated fraction, which is albumin-bound and cannot enter urine directly.","src":"Open qs 3.pdf, p. 1 \u00b7 q1285","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Accelerated heme breakdown raises unconjugated bilirubin production.","Unconjugated bilirubin is albumin-bound and is not filtered into urine.","More pigment can reach the gut, increasing formation and urinary excretion of urobilinogen.","A predominantly conjugated rise suggests impaired excretion or cholestasis."]},{"id":"midterm3-q1304","topic":"hemostasis","q":"How can a venous clot cause a paradoxical arterial embolism?","opts":["It crosses a right-to-left shunt","It travels through an intact pulmonary capillary bed by its usual route","It first becomes an immune complex","It must originate in the left ventricle"],"correct":[0],"why":"A right-to-left communication can let venous embolic material bypass the pulmonary circulation.","src":"Open qs 3.pdf, p. 1 \u00b7 q1304","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A right-to-left communication lets venous embolic material reach systemic arteries.","An intact pulmonary circulation typically traps larger venous emboli.","Immune complexes are antigen\u2013antibody aggregates and are not required for clot embolization.","A paradoxical embolus starts on the venous side."]},{"id":"midterm3-q1325","topic":"liver","q":"Which mechanisms favor cholesterol gallstone formation?","opts":["Cholesterol supersaturation of bile","Gallbladder hypomotility","Crystal nucleation","Rapid and complete gallbladder emptying as a risk factor"],"correct":[0,1,2],"why":"Supersaturation permits cholesterol crystallization, and stasis supports growth of stones.","src":"Open qs 3.pdf, p. 2 \u00b7 q1325","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Excess cholesterol relative to bile salts and phospholipids makes bile prone to crystallization.","Slow emptying allows crystals to remain and grow.","Nucleation initiates formation of cholesterol crystals.","Effective emptying reduces stasis."]},{"id":"midterm3-q0947","topic":"blood","q":"Which measurement usually remains normal in isolated anemia?","opts":["Arterial oxygen content","Hemoglobin concentration","Arterial oxygen partial pressure","Red cell mass"],"correct":[2],"why":"Anemia reduces the amount of hemoglobin available to carry oxygen. It does not directly lower dissolved arterial oxygen pressure.","src":"Selected.pdf, p. 6 \u00b7 q0947","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Low hemoglobin reduces arterial oxygen content even when arterial oxygen pressure is normal.","Low hemoglobin is the defining finding.","Arterial oxygen partial pressure reflects dissolved oxygen and pulmonary gas exchange. Isolated anemia changes oxygen carriage.","True anemia lowers circulating red cell mass, although dilution can lower measured hemoglobin without that mechanism."]},{"id":"midterm3-q0948","topic":"immunity","q":"Which cells directly mediate cytotoxic tissue injury in type IV hypersensitivity?","opts":["IgE-producing plasma cells","Mast cells","Cytotoxic T cells","Eosinophils"],"correct":[2],"why":"Type IV hypersensitivity is T-cell mediated. Cytotoxic T cells directly injure target cells in some forms.","src":"Selected.pdf, p. 7 \u00b7 q0948","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["IgE-producing cells contribute to type I sensitization.","Mast cells drive rapid IgE-associated reactions.","CD8 T cells can recognize antigen on target cells and directly induce cell death.","Eosinophils are associated with allergic inflammation and helminth defense."]},{"id":"midterm3-q0949","topic":"blood","q":"What is the typical MCV pattern in aplastic anemia?","opts":["Marked microcytosis is required","Usually normocytic","Always severely macrocytic","MCV is unmeasurable"],"correct":[1],"why":"Aplastic anemia reflects marrow failure and is commonly normocytic, although mild macrocytosis can occur.","src":"Selected.pdf, p. 12 \u00b7 q0949","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Microcytosis more often suggests a problem with hemoglobin synthesis.","Marrow failure reduces red-cell production without necessarily changing cell size.","Mild macrocytosis can occur, but severe macrocytosis is not obligatory.","MCV can be measured even when the red-cell count is low."]},{"id":"midterm3-q0950","topic":"liver","q":"What is the underlying process in primary biliary cholangitis?","opts":["Alcohol-induced acinar injury","Autoimmune injury to small intrahepatic bile ducts","Obstruction of the cystic duct by a stone","Increased red cell destruction"],"correct":[1],"why":"Immune-mediated injury to small intrahepatic ducts causes chronic cholestasis.","src":"Selected.pdf, p. 13 \u00b7 q0950","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Alcohol-associated acinar injury is a pancreatic process.","Immune-mediated destruction of small intrahepatic ducts produces chronic cholestasis.","Cystic duct obstruction primarily affects gallbladder drainage.","Hemolysis raises unconjugated bilirubin and does not cause autoimmune duct injury."]},{"id":"midterm3-q0951","topic":"blood","q":"Which finding is inconsistent with uncomplicated iron deficiency anemia?","opts":["Low transferrin saturation","Microcytosis","High ferritin","A history of chronic blood loss"],"correct":[2],"why":"Ferritin usually falls as iron stores are depleted. Inflammation can complicate interpretation.","src":"Selected.pdf, p. 22 \u00b7 q0951","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Low transferrin saturation indicates less circulating iron available for erythropoiesis.","Limited hemoglobin synthesis can produce small red cells.","Ferritin reflects stored iron and usually falls as stores are depleted.","Chronic blood loss is a common route to iron depletion."]},{"id":"midterm3-q0954","topic":"immunity","q":"Which mechanism defines type II hypersensitivity?","opts":["Antibodies target antigens on cell surfaces or in extracellular matrix","Soluble immune complexes deposit in tissues","Mast cells are activated through allergen-specific IgE","Memory T cells produce a delayed response without antibodies"],"correct":[0],"why":"Type II involves antibody binding to a fixed target, which may cause tissue injury or alter receptor function.","src":"Selected.pdf, p. 30 \u00b7 q0954","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The antibody binds a fixed cell or matrix target and can cause injury or alter receptor signaling.","Deposition of soluble antigen\u2013antibody complexes defines type III.","Allergen-specific IgE activating mast cells defines type I.","Delayed cellular responses are characteristic of type IV."]},{"id":"midterm3-q0957","topic":"blood","q":"Which changes explain iron restriction in anemia of chronic inflammation?","opts":["Increased hepatic hepcidin production","Accelerated export of iron from macrophages","Reduced ferroportin-mediated iron export","Increased intestinal iron absorption"],"correct":[0,2],"why":"Hepcidin reduces ferroportin activity, retaining iron in macrophages and limiting delivery to the marrow.","src":"Selected.pdf, p. 45 \u00b7 q0957 \u00b7 Ulvi PDF, p. 230 \u00b7 q0957","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammatory signaling, particularly IL-6, raises hepatic hepcidin production.","Hepcidin impairs iron release from macrophages.","Hepcidin causes ferroportin internalization, holding iron inside storage cells.","Loss of intestinal ferroportin reduces iron transfer into blood."]},{"id":"midterm3-q0958","topic":"hemostasis","q":"Which pair consists of inherited bleeding disorders?","opts":["Factor V Leiden and antithrombin deficiency","Hemophilia A and von Willebrand disease","DIC and liver failure","Hypersplenism and immune thrombocytopenia"],"correct":[1],"why":"Hemophilia A affects factor VIII, while inherited von Willebrand disease affects platelet adhesion and can reduce circulating factor VIII.","src":"Selected.pdf, p. 46 \u00b7 q0958","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Both changes increase thrombosis risk by impairing anticoagulant regulation.","Hemophilia reduces factor VIII activity, while von Willebrand disease impairs platelet adhesion and can lower factor VIII.","Both can cause acquired coagulopathy.","Both can reduce the platelet count through acquired processes."]},{"id":"midterm3-q0960","topic":"liver","q":"Which mechanisms contribute to ascites in cirrhosis?","opts":["Splanchnic vasodilation","Elevated serum bilirubin acting as an osmole","Secondary aldosterone-mediated sodium retention","Elevated plasma albumin"],"correct":[0,2],"why":"Splanchnic vasodilation reduces effective arterial filling and activates sodium retention. Portal hypertension also drives fluid into the peritoneal cavity.","src":"Selected.pdf, p. 49 \u00b7 q0960","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Splanchnic vasodilation reduces effective arterial filling and activates renal salt retention.","Bilirubin elevation does not generate the hydrostatic and circulatory changes that drive ascites.","Secondary aldosterone release increases renal sodium reabsorption.","Higher plasma albumin tends to retain fluid intravascularly. Albumin can fall in cirrhosis."]},{"id":"midterm3-q0844","topic":"blood","q":"Which conditions can produce microcytic or hypochromic red cells?","opts":["Folate deficiency","Sideroblastic anemia","Vitamin B12 deficiency","Iron deficiency","Lead toxicity"],"correct":[1,3,4],"why":"Defects in heme production or reduced iron availability can reduce hemoglobin content and cell size.","src":"Selected.pdf, p. 50 \u00b7 q0844","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Folate deficiency impairs DNA synthesis, producing megaloblastic macrocytosis.","Defective heme synthesis can yield hypochromic or microcytic cells.","B12 deficiency impairs nuclear maturation and usually causes macrocytosis.","Insufficient iron limits hemoglobin synthesis, reducing cell size and hemoglobin content.","Lead interferes with heme synthesis and can produce microcytosis."]},{"id":"midterm3-q0961","topic":"liver","q":"Which statements describe hepatic encephalopathy?","opts":["It can alter mental status and neuromuscular function","It is defined by hemolysis","It is caused by hyperuricemia","It can occur with liver failure or portosystemic shunting"],"correct":[0,3],"why":"Impaired hepatic clearance and shunting expose the brain to gut-derived compounds, including ammonia.","src":"Selected.pdf, p. 51 \u00b7 q0961","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Brain dysfunction can range from subtle cognitive changes to confusion, asterixis, and coma.","Red-cell destruction is a separate process and is not required.","The mechanism involves impaired clearance of gut-derived compounds such as ammonia.","Both failing hepatocytes and blood bypassing the liver reduce detoxification."]},{"id":"midterm3-q1536","topic":"blood","q":"Which cell sources can be used for an allogeneic hematopoietic stem cell transplant?","opts":["A genetically distinct related human donor","The patient's own cells","A genetically distinct unrelated human donor","An animal donor"],"correct":[0,2],"why":"Allogeneic means the donor is another person. The patient's own cells are autologous.","src":"Selected.pdf, p. 56 \u00b7 q1536","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A genetically distinct relative can donate cells for allogeneic transplantation.","Using the patient's own cells is autologous transplantation.","A suitably matched unrelated human donor is also an allogeneic source.","Transplantation across species is xenogeneic."]},{"id":"midterm3-q0845","topic":"liver","q":"Which is least characteristic of decompensated cirrhosis?","opts":["Hepatic encephalopathy","Ascites","Prolonged PT","Isolated dehydration as the defining feature"],"correct":[3],"why":"Decompensation presents with major complications of hepatic dysfunction and portal hypertension, including ascites and encephalopathy.","src":"Selected.pdf, p. 62 \u00b7 q0845 \u00b7 Ulvi PDF, p. 250 \u00b7 q0845","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Neurologic dysfunction from impaired detoxification is a major manifestation of decompensation.","Ascites is a common sign of decompensation and portal hypertension.","Reduced coagulation factor synthesis can prolong PT.","Dehydration can coexist or precipitate symptoms, but it does not define decompensation."]},{"id":"midterm3-q0846","topic":"blood","q":"Which lab findings support hemolysis?","opts":["Elevated LDH","Low haptoglobin","Elevated unconjugated bilirubin","Unconjugated bilirubin filtered into the urine"],"correct":[0,1,2],"why":"Red cell destruction releases LDH and hemoglobin. Heme breakdown raises unconjugated bilirubin, which remains albumin-bound in plasma.","src":"Selected.pdf, p. 78 \u00b7 q0846","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Red cell destruction releases LDH.","Haptoglobin binds free hemoglobin and is consumed, especially in intravascular hemolysis.","More heme breakdown produces more unconjugated bilirubin.","Albumin-bound unconjugated bilirubin cannot enter urine by glomerular filtration."]},{"id":"midterm3-q1541","topic":"liver","q":"Which bilirubin change is least characteristic of isolated cholestasis?","opts":["Increase in conjugated bilirubin","Increase in unconjugated bilirubin","Increase GGT","Increase ALP"],"correct":[1],"why":"Impaired bile flow chiefly raises conjugated bilirubin. ALP and GGT can also rise in hepatobiliary cholestasis.","src":"TEST 3 GIT.doc.pdf, p. 1 \u00b7 q1541","conf":"key","seen":1,"recall":true,"scored":true,"optionWhy":["Bilirubin that has already been conjugated accumulates when excretion into bile is impaired.","Isolated cholestasis primarily increases the conjugated fraction.","GGT commonly rises alongside ALP in hepatobiliary cholestasis.","ALP commonly rises with bile duct or canalicular dysfunction."]},{"id":"midterm3-q1542","topic":"liver","q":"Which finding is least characteristic of hemolytic jaundice?","opts":["Reticulocytosis","Anaemia","Decreased survival of RBCs","Pale stool"],"correct":[3],"why":"Reticulocytosis can reflect the marrow response to hemolysis. Pale stools instead suggest reduced delivery of bile pigments to the intestine.","src":"TEST 3 GIT.doc.pdf, p. 1 \u00b7 q1542","conf":"key","seen":1,"recall":true,"scored":true,"optionWhy":["Marrow usually releases more reticulocytes to compensate for red-cell destruction.","Accelerated destruction can reduce circulating hemoglobin.","Shortened red-cell survival is central to hemolysis.","Pale stool suggests reduced bile pigment delivery, as in major biliary obstruction."]},{"id":"midterm3-q1543","topic":"liver","q":"Which urinary finding can occur in hepatocellular jaundice?","opts":["Conjugated bilirubin in urine","Direct filtration of albumin-bound unconjugated bilirubin","Obligate absence of urine urobilinogen in all cases","Urine bilirubin proves isolated hemolysis"],"correct":[0],"why":"Conjugated bilirubin is water soluble. Urinary urobilinogen varies with hepatic clearance and bile flow.","src":"TEST 3 GIT.doc.pdf, p. 1 \u00b7 q1543","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Water-soluble conjugated bilirubin can spill into urine when hepatic excretion is impaired.","Albumin-bound unconjugated bilirubin is not appreciably filtered.","Urobilinogen may vary with intestinal pigment delivery and hepatic handling.","Bilirubinuria points to circulating conjugated bilirubin rather than isolated hemolysis."]},{"id":"midterm3-q0062","topic":"liver","q":"What are typical consequences of exocrine pancreatic insufficiency?","opts":["Steatorrhea","Fat-soluble vitamin deficiency","Increased capacity to digest dietary fat","Elevated production of pancreatic enzymes"],"correct":[0,1],"why":"Lack of pancreatic digestive enzymes causes maldigestion. Fat malabsorption can lead to steatorrhea and deficiencies of vitamins A, D, E, and K.","src":"TEST 3 GIT.doc.pdf, p. 3 \u00b7 q0062","conf":"inferred","seen":1,"recall":true,"scored":true,"optionWhy":["Low pancreatic lipase activity causes fat maldigestion and greasy stools.","Poor fat absorption can reduce uptake of vitamins A, D, E and K.","Fat digestion worsens when pancreatic enzyme output falls.","Exocrine insufficiency means less effective enzyme delivery to the intestinal lumen."]},{"id":"midterm3-q0064","topic":"liver","q":"Which results best distinguish a predominantly cholestatic from a predominantly hepatocellular pattern?","opts":["Relative elevations of ALP and GGT versus AST and ALT","Total bilirubin alone","Hemoglobin alone","Isolated serum sodium"],"correct":[0],"why":"ALP and GGT predominate in cholestasis, while AST and ALT usually predominate in hepatocellular injury.","src":"TEST 3 GIT.doc.pdf, p. 3 \u00b7 q0064","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Aminotransferase predominance suggests hepatocyte injury, while disproportionate ALP with GGT supports cholestasis.","Bilirubin can rise in both patterns.","Hemoglobin assesses anemia and does not distinguish the two hepatic patterns.","Sodium reflects fluid balance and does not localize hepatic injury."]},{"id":"midterm3-q0067","topic":"liver","q":"Which can contribute to bleeding abnormalities in advanced liver disease?","opts":["Reduced synthesis of clotting factors","Platelet sequestration from hypersplenism","Obligate elevation of platelet count","Increased synthesis of every clotting factor"],"correct":[0,1],"why":"Hepatic synthetic dysfunction can lower factor activity, and portal hypertension can reduce the circulating platelet count.","src":"TEST 3 GIT.doc.pdf, p. 4 \u00b7 q0067","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hepatic failure can reduce plasma coagulation factor activity.","Portal hypertension can enlarge the spleen and lower circulating platelet counts.","Thrombocytopenia is common, and a rise is not obligatory.","Synthesis of many clotting factors can decline as hepatic reserve falls."]},{"id":"midterm3-q0071","topic":"liver","q":"Which systemic complications can occur in severe acute pancreatitis?","opts":["Circulatory shock","Acute respiratory distress syndrome","Acute kidney injury","Isolated chronic hyperalbuminemia as the defining complication"],"correct":[0,1,2],"why":"Severe pancreatic inflammation can produce capillary leakage, systemic inflammation, and multiorgan dysfunction.","src":"TEST 3 GIT.doc.pdf, p. 4 \u00b7 q0071","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammation and capillary leakage can reduce circulating volume and tissue perfusion.","Systemic inflammation can injure pulmonary capillaries and cause permeability edema.","Hypoperfusion and systemic inflammation can injure the kidneys.","Albumin is not characteristically increased as a defining systemic complication."]},{"id":"midterm3-q0095","topic":"liver","q":"Which changes favor hepatic triglyceride accumulation?","opts":["Increased fatty acid delivery to the liver","Increased hepatic lipogenesis","Reduced fatty acid oxidation or lipid export","A large sustained increase in lipid export relative to production"],"correct":[0,1,2],"why":"Steatosis develops when hepatic lipid input and synthesis exceed oxidation and export.","src":"TEST 3.docx (1).pdf, p. 1 \u00b7 q0095","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Greater delivery of circulating fatty acids increases the substrate available for triglyceride synthesis.","Increased production of fatty acids supplies more substrate for storage.","Reduced oxidation or impaired VLDL export leaves more lipid inside hepatocytes.","Effective export removes lipid from the liver and reduces accumulation."]},{"id":"midterm3-q0096","topic":"liver","q":"How does the healthy liver detoxify much of the ammonia arriving from the gut?","opts":["It converts nitrogen to urea through the urea cycle","It converts ammonia directly to bilirubin","It secretes ammonia as albumin","It uses erythropoietin to neutralize ammonia"],"correct":[0],"why":"Urea is less toxic and can be excreted by the kidneys.","src":"TEST 3.docx (1).pdf, p. 1 \u00b7 q0096","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hepatocytes incorporate ammonia-derived nitrogen into urea for renal excretion.","Bilirubin comes from heme breakdown.","Albumin is a hepatic transport protein, not the main means of disposing of ammonia nitrogen.","Erythropoietin regulates red-cell production."]},{"id":"midterm3-q0108","topic":"liver","q":"Which presentations can occur in porphyrias, depending on subtype?","opts":["Acute neurovisceral attacks with abdominal pain","Cutaneous photosensitivity","A defining increase in factor VIII activity","Obligate obstructive jaundice in every subtype"],"correct":[0,1],"why":"Accumulated intermediates of heme synthesis differ by enzyme defect, producing different clinical syndromes.","src":"TEST 3.docx (1).pdf, p. 2 \u00b7 q0108","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Some acute porphyrias cause severe abdominal pain and neurologic manifestations.","Accumulated porphyrins can react to light and damage exposed skin.","Porphyrias are disorders of heme synthesis rather than factor VIII regulation.","Biliary obstruction does not define porphyria and is not required."]},{"id":"midterm3-q0110","topic":"liver","q":"Which can cause acute liver failure?","opts":["Severe acetaminophen toxicity","Acute viral hepatitis","Ischemic hepatic injury","Uncomplicated Gilbert syndrome"],"correct":[0,1,2],"why":"Massive or severe acute hepatocellular injury can impair synthesis and lead to encephalopathy.","src":"TEST 3.docx (1).pdf, p. 2 \u00b7 q0110","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Accumulation of the reactive metabolite NAPQI can cause extensive hepatocyte necrosis.","Acute viral injury can occasionally cause severe loss of hepatic function.","Insufficient oxygen delivery can cause widespread hepatocellular injury.","Gilbert syndrome produces mild unconjugated hyperbilirubinemia with preserved liver function."]},{"id":"midterm3-q0116","topic":"liver","q":"What can excess ammonia promote in astrocytes during acute liver failure?","opts":["Glutamine accumulation and cellular swelling","Immediate bilirubin conjugation","Erythropoietin release as the main response","Synthesis of factor VIII as the defining response"],"correct":[0],"why":"Astrocytes metabolize ammonia to glutamine. Osmotic and metabolic effects contribute to swelling.","src":"TEST 3.docx (1).pdf, p. 2 \u00b7 q0116","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Astrocytes incorporate ammonia into glutamine. Intracellular accumulation contributes to swelling.","Bilirubin conjugation is performed by hepatic UGT1A1.","Erythropoietin is primarily a renal response to hypoxia.","Production of coagulation factors does not explain ammonia-related astrocyte injury."]},{"id":"midterm3-q0982","topic":"blood","q":"Which vascular disorders can cause congestive splenomegaly?","opts":["Portal vein thrombosis","Isolated renal vein thrombosis","Splenic vein thrombosis","Budd\u2013Chiari syndrome"],"correct":[0,2,3],"why":"Portal, splenic, and hepatic venous obstruction can increase upstream portal-system pressure.","src":"TEST 3.docx.pdf, p. 18 \u00b7 q0982","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Portal vein obstruction raises upstream pressure and can congest the spleen.","Renal venous drainage is separate from splenic portal drainage.","Splenic vein obstruction directly impedes splenic drainage.","Hepatic venous outflow obstruction can raise portal pressure."]},{"id":"midterm3-q0985","topic":"hemostasis","q":"Which mechanisms can lower platelet counts?","opts":["Splenic sequestration","Immune-mediated platelet destruction","Reduced marrow platelet production","Isolated factor VIII deficiency as its characteristic effect"],"correct":[0,1,2],"why":"Thrombocytopenia can reflect increased sequestration, increased destruction, or reduced production.","src":"TEST 3.docx.pdf, p. 18 \u00b7 q0985","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["An enlarged spleen can trap more platelets and reduce the circulating count.","Antibodies can promote platelet clearance, as in immune thrombocytopenia.","Fewer functioning megakaryocytes means fewer platelets produced.","Factor VIII deficiency changes plasma coagulation rather than platelet number."]},{"id":"midterm3-q0986","topic":"hemostasis","q":"Which are inherited thrombophilias?","opts":["Factor V Leiden","Antithrom

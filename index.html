<title>Pathophysiology Test 3</title>

<style>
[hidden]{display:none!important}
:root{
  --bg:#f5f5f7;--surface:#fff;--rule:rgba(0,0,0,.08);--rule-strong:rgba(0,0,0,.14);
  --text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--danger:#d70015;--ok:#248a3d;
  --ok-bg:rgba(52,199,89,.10);--ok-line:rgba(52,199,89,.45);--bad-bg:rgba(255,59,48,.08);--bad-line:rgba(255,59,48,.45);
  --sel-bg:rgba(0,113,227,.08);--sel-line:rgba(0,113,227,.55);--warn:#b25000;--warn-bg:rgba(255,149,0,.12);
  --glass:hsla(0,0%,100%,.72);
  --grad:linear-gradient(100deg,#f0506e 0%,#b35ce6 50%,#3d82f5 100%);
  --ground:radial-gradient(1100px 640px at 12% 8%,rgba(240,80,110,.08),transparent 60%),radial-gradient(1000px 600px at 90% 92%,rgba(61,130,245,.09),transparent 60%),#f5f5f7;
  --shadow:0 4px 14px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--surface:#1c1c1e;--rule:hsla(0,0%,100%,.08);--rule-strong:hsla(0,0%,100%,.16);
  --text:#f5f5f7;--muted:#98989d;--accent:#0a84ff;--danger:#ff6961;--ok:#30d158;
  --ok-bg:rgba(48,209,88,.13);--ok-line:rgba(48,209,88,.5);--bad-bg:rgba(255,69,58,.13);--bad-line:rgba(255,69,58,.5);
  --sel-bg:rgba(10,132,255,.14);--sel-line:rgba(10,132,255,.6);--warn:#ffb340;--warn-bg:rgba(255,159,10,.14);
  --glass:rgba(20,20,22,.66);
  --ground:radial-gradient(1100px 640px at 12% 12%,rgba(240,80,110,.12),transparent 60%),radial-gradient(1000px 600px at 90% 88%,rgba(61,130,245,.14),transparent 60%),#000;
  --shadow:0 4px 14px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--surface:#1c1c1e;--rule:hsla(0,0%,100%,.08);--rule-strong:hsla(0,0%,100%,.16);
  --text:#f5f5f7;--muted:#98989d;--accent:#0a84ff;--danger:#ff6961;--ok:#30d158;
  --ok-bg:rgba(48,209,88,.13);--ok-line:rgba(48,209,88,.5);--bad-bg:rgba(255,69,58,.13);--bad-line:rgba(255,69,58,.5);
  --sel-bg:rgba(10,132,255,.14);--sel-line:rgba(10,132,255,.6);--warn:#ffb340;--warn-bg:rgba(255,159,10,.14);
  --glass:rgba(20,20,22,.66);
  --ground:radial-gradient(1100px 640px at 12% 12%,rgba(240,80,110,.12),transparent 60%),radial-gradient(1000px 600px at 90% 88%,rgba(61,130,245,.14),transparent 60%),#000;
  --shadow:0 4px 14px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:var(--ground);background-attachment:fixed;min-height:100vh;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--rule)}
.nav-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:1.15rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;border:0;padding:0;background-color:transparent}
.pill{border:1px solid var(--rule-strong);background:var(--surface);border-radius:980px;padding:8px 16px;cursor:pointer;font-size:.95rem;white-space:nowrap}
.pill:hover{border-color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:48px 96px}
.narrow{max-width:760px;margin:0 auto}
.eyebrow{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.04;letter-spacing:-.03em;margin:.35em 0 .3em;font-weight:800;text-wrap:balance}
h2{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 .4em;text-wrap:balance}
.lede{color:var(--muted);font-size:1.15rem;max-width:62ch;margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:40px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:28px 30px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card h3{font-size:1.75rem;margin:0;letter-spacing:-.02em}
.card p{margin:0;color:var(--muted)}
.card .go{display:flex;justify-content:space-between;margin-top:10px;font-size:.95rem}
.card.hero{background:var(--grad);color:#fff;border-color:transparent}
.card.hero p,.card.hero .eyebrow{color:rgba(255,255,255,.88)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:56px 0 16px;gap:12px;flex-wrap:wrap}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.topic{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;text-align:left}
.topic:hover{border-color:var(--rule-strong)}
.topic b{font-weight:600}
.topic small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:980px;padding:6px 14px;font-size:.92rem}
.chip.src{color:var(--muted)}
.chip.ask{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip.unoff{color:var(--muted);border-style:dashed}
.tagline{font-size:.78rem;font-weight:600;color:var(--warn);margin-right:6px}
.why .rn{margin-top:10px;color:var(--muted);font-size:.9rem}
.card.link{text-decoration:none;color:inherit}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.bar{height:6px;background:var(--rule);border-radius:9px;margin:18px 0 30px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .25s}
.q{font-size:clamp(1.3rem,3vw,1.75rem);font-weight:700;letter-spacing:-.015em;line-height:1.3;margin:0 0 8px;text-wrap:pretty}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;cursor:pointer;text-align:left;width:100%;font-size:1.05rem}
.opt:hover:not([disabled]){border-color:var(--rule-strong)}
.opt .k{flex:none;width:32px;height:32px;border:1px solid var(--rule-strong);border-radius:8px;display:grid;place-items:center;font-size:.9rem;font-weight:600}
.opt .t{flex:1;min-width:0;padding-top:4px}
.opt .tag{flex:none;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:980px;margin-top:5px}
.opt.sel{background:var(--sel-bg);border-color:var(--sel-line)}
.opt.sel .k{border-color:var(--sel-line);color:var(--accent)}
.opt.right{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.right .k{border-color:var(--ok-line)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--danger)}
.opt.wrong .k{border-color:var(--bad-line)}
.opt.missed{border:1.5px dashed var(--ok-line);color:var(--ok)}
.opt.dim{opacity:.6}
.tag.r{background:var(--ok-bg)} .tag.w{background:var(--bad-bg)} .tag.m{background:var(--ok-bg)}
.why{margin-top:20px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 20px;font-size:.98rem}
.why b{display:block;margin-bottom:4px}
.why .unc{margin-top:10px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem}
.btn{display:block;width:100%;margin-top:26px;border:0;border-radius:980px;padding:17px;font-size:1.1rem;font-weight:600;color:#fff;background:var(--grad);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--rule-strong)}
.foot{text-align:center;color:var(--muted);font-size:.9rem;margin-top:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .btn{flex:1;min-width:200px}
.mock{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:36px}
.mock .card h3{font-size:1.45rem}
.mono{font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--danger)}
.custom{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:24px 28px;margin-top:16px}
.custom label{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.custom input[type=number]{width:90px;padding:8px 10px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--bg);color:var(--text);font:inherit}
.search{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--text);font:inherit;font-size:1.05rem;margin:24px 0}
.sheet{display:flex;flex-direction:column;gap:12px}
.sheet .item{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 20px}
.sheet .item .qq{font-weight:600;margin-bottom:6px}
.sheet ul{margin:6px 0 0;padding-left:0;list-style:none}
.sheet li{padding:2px 0 2px 26px;position:relative;font-size:.97rem}
.sheet li::before{position:absolute;left:0;font-weight:700}
.sheet li.y{color:var(--ok)} .sheet li.y::before{content:"T"}
.sheet li.n{color:var(--muted)} .sheet li.n::before{content:"F"}
.sheet .r{color:var(--muted);font-size:.9rem;margin-top:6px}
.pat{display:grid;gap:14px;margin-top:28px}
.pat .item{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 22px}
.pat .item h3{margin:0 0 6px;font-size:1.1rem}
.pat .item p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:28px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 20px}
.stat .n{font-size:2rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.9rem}
.tbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 56px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.tbar .track{height:8px;background:var(--rule);border-radius:9px;overflow:hidden}
.tbar .track i{display:block;height:100%;background:var(--grad)}
.tbar .pc{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.result{text-align:center;padding:30px 0}
.result .big{font-size:clamp(3rem,10vw,5.5rem);font-weight:800;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pass{display:inline-block;padding:6px 16px;border-radius:980px;font-weight:600}
.pass.y{background:var(--ok-bg);color:var(--ok)} .pass.n{background:var(--bad-bg);color:var(--danger)}
.review{margin-top:30px;display:flex;flex-direction:column;gap:10px}
.review .item{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;text-align:left;width:100%}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.dot.y{background:var(--ok)} .dot.p{background:var(--warn)} .dot.n{background:var(--danger)}
.theme{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;z-index:6}
.theme svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:1.8}
.empty{color:var(--muted);padding:20px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.wrap{padding-block:28px 80px}.card{padding:22px}.opt{padding:14px 16px;gap:12px;font-size:1rem}.tbar{grid-template-columns:minmax(0,1fr) 70px 46px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body.quizmode{margin:0;min-height:0}
body.quizmode .wrap{padding-block:10px}
body.quizmode .theme{display:none}
body.quizmode .bar{margin:10px 0 14px}
body.quizmode .q{font-size:clamp(1.1rem,2.6vw,1.5rem);margin-bottom:4px}
body.quizmode .hint{margin:0 0 10px;font-size:.85rem}
body.quizmode .opts{gap:8px}
body.quizmode .opt{padding:10px 12px;gap:10px;font-size:.98rem}
body.quizmode .opt .k{width:28px;height:28px}
body.quizmode .opt .t{padding-top:2px}
body.quizmode .opt .tag{margin-top:3px}
body.quizmode .why{margin-top:10px;padding:10px 14px;font-size:.92rem}
body.quizmode .btn{margin-top:12px;padding:13px;font-size:1.02rem}
body.quizmode .foot{margin-top:6px;font-size:.8rem}
@media (hover:none){body.quizmode .foot{display:none}}
</style>
</head>

ipate in the development of acute coronary syndrome e"],"correct":[0,2,3],"why":"Thrombophilia can be inherited or acquired and may contribute to arterial thrombosis, although classic inherited thrombophilias are chiefly venous risk factors.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1012","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1013","topic":"hemostasis","q":"INR (International normalized ratio)","opts":["is defined as the ratio of the patient plasma Quick test time and of the control plasma, raised to the power of the ISI value for the used analytical system e","correlates with the activity of the intrinsic hemocoagulation cascade \u00b0","is increased in hemophilia A \u00b0","can be increased in liver disease e"],"correct":[0,3],"why":"INR is the PT ratio raised to the ISI and may rise when hepatic clotting-factor synthesis falls.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1013","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1015","topic":"hemostasis","q":"Which of the following pathological conditions are a risk factor of venous thrombosis","opts":["excess of tPA (tissue plasminogen activator) [unclear]","fibrinogen deficiency \u00b0","tPA (tissue plasminogen activator) deficiency \u00b0","PAI (plasminogen activator inhibitor) deficiency e"],"correct":[2],"why":"Reduced tPA activity reduces plasmin generation and impairs fibrinolysis.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1015","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1016","topic":"hemostasis","q":"Thrombocytopathy","opts":["is defined as an impaired platelet function e","is characterized by reduced platelet count \u00b0","may be associated with pathological bleeding. even with normal platelet counts [unclear]","is synonymous with thrombocytopenia \u00b0"],"correct":[0,2],"why":"Thrombocytopathy is impaired platelet function and can cause bleeding with a normal platelet count.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1016","con culation, right\nheart failure), hypoalbuminemia - decreased plasma\noncotic pressure, hepatorenal syndrome - functional renal\nfailure in severe liver disease - leads to secondary\nhyperaldosteronism (in turn, retention of sodium and\n.water)\nPortal hypertension -\nPancreatitis -\nPeritonitis -\nHypoalbuminia nephrotic syndrome -\nCardiac failure -","src":"Test 3-all gathered.docx.pdf, p. 44 \u00b7 q0485","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0489","topic":"liver","q":"Subjects of Chronic Liver Disease 3","opts":[],"correct":[],"why":"Viral Hepatitis, Toxonutritive Changes, Wilson's Disease,\nAlpha 1 Deficiency Antitrypsin, Metabolic Liver\n.Disease\nBudd chiari, hepatic vein stensos, alcohol abuse, -\nhepatisis bcd","src":"Test 3-all gathered.docx.pdf, p. 45 \u00b7 q0489","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0490","topic":"hemostasis","q":"Hemostasis - parts that include","opts":[],"correct":[],"why":"Vessel response at the site of injury = vasoconstriction, .1\n2. Platelet activity (adhesion, activation, degranulation),\n.3. haemocoagulation (blood clotting)","src":"Test 3-all gathered.docx.pdf, p. 46 \u00b7 q0490","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0494","topic":"liver","q":"Laboratory values, skin color, urine, faeces in :hepatic jaundice","opts":[],"correct":[],"why":"It is caused by liver disorders (uptake / conjugation /\nexcretion of bilirubin from hepatocytes / hepatocyte\nbreakdown - damage to their healing in hepatic diseases -\nhepatitis, cirrhosis / familial hyperbilirubinaemia /\nCrigler-Najjar syndrome). Skin: ruby shade. Stolice:\nlighter. Serum: Bilirubin is conjugated and unconjugated.\nUrine: dark (urobilinogen and bilirubin). Lab. values:\nikterus = bilirubin above 50 umol / l, subicterus = 35 - 40\numol / l, elevated ALT (above 0.78 ukat / l, AST (above\n!0.72 ukat / l)","src":"Test 3-all gathered.docx.pdf, p. 47 \u00b7 q0494","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0495","topic":"liver","q":"Causes of Acute and Chronic Pancreatitis 3","opts":[],"correct":[],"why":"Acute = Premature Activation of Trypsin. Causes:\nAlcohol abuse, viral and bacterial diseases, obstructive\nbiliary tract obstruction, abdominal trauma,\nhypecalcemia, hyperlipidemia, some medications.\nChronic: Long-term alcohol abuse, hyperlipidemia and\nhypercalcaemia, protein malnutrition, hepatic cirrhosis,\nsenile chronic pancreatitis (small duct obstruction and\nstones formation), hereditary chronic pancreatitis, cystic\n.fibrosis of the pancreas\nI GET SMASHED","src":"Test 3-all gathered.docx.pdf, p. 47 \u00b7 q0495","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0498","topic":"liver","q":"Cholestasis Clinic","opts":[],"correct":[],"why":"Cholestasis is a disorder of bile formation and discharge,\nthe basic division is intrahepatic and extrahepatic. The\nmost frequent cause of acute intrahepatic cholestasis is\npollage damage or cholestatic course of common acute\nliver disease. Chronic intrahepatic cholestasis in\nadulthood is most often caused by primary biliary\ncirrhosis, primary sclerosing cholangitis, or cholestatic\ncourse of liver cirrhosis. Extrahepatic cholestasis is\ncaused by a mechanical obstruction in the bile ducts\n(lithiasis, tumor, benign stenosis). The primary clinical\nmanifestations of cholestasis include fatigue, pruritus and\nicterus, laboratory elevations of alkaline phosphatase\n(ALP), gamaglutamyltranspeptidase (GGT) and\nincreased conjugated bilirubin. It is always necessary to\neliminate the mechanical obstruction in bile ducts.\nDiagnosis of gall bladder disease nowadays uses non\ufffeinvasive examinations (ultrasound, endosonography,\nMR); Advanced liver cirrhosis due to chronic cholestasis\nmay lead to consideration of the indication of liver\ntransplantation. Mechanical obstruction must always be\n.addressed by surgical removal of the obstruction\nCholestasis is a condition where bile cannot flow from\nthe liver to the duodenum. The two basic distinctions are\nan obstructive type of cholestasis where there is a\nmechanical blockage in the duct system that can occur\nfrom a gallstone or malignancy, and metabolic types of\ncholestasis which are disturbances in bile formation that\ncan occur because of genetic defects or acquired as a side\n.effect of many medications","src":"Test 3-all gathered.docx.pdf, p. 49 \u00b7 q0498","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0499","topic":"liver","q":"Porphyria","opts":[],"correct":[],"why":"A group of metabolic disorders with heme synthesis\ndisorder characterized by accumulation or increased\nexcretion of porphyrins. Porphyria can be divided into\nerythropoietic, hepatic and erythropathic. The most\ncommon of these diseases is porphyria cutanea tarda (AD\ninherited defect uroporphyrinogendecarboxylases =\nphotosensitivity, blisters, ...). Or the second definition of\nporphyria: Hereditary disorders of metabolism caused by\ngene mutations that control the synthesis of enzymes\n:involved in heme synthesis. Split by\n:the most affected organs producing porphyrins .1\nHepatic - Acute Intermittent Porphyria (AIP), \u2022\nPorphyria deficiency of 5-aminolevulate dehydratase\n(ADP, Doss porphyria), Hereditary Coproporphyria\n(HCP), Porphyria variegata (VP)\nerythropoietic \u2022\nerythropathy \u2022\n:2nd speeches\nPorphyria cutanea tarda (PCT), Congenital \u2022\nerythropoietic porphyria (CEP, G\u00fcnther disease),\nProtoporphyria (EPP) = Ferrochelatase defect\n;liver - AIP, ADP, VP, HCP \u2022\n:3rd course\n;Acute - AIP, VP, HCP, ADP \u2022\n;chronic - PCT, EPP, CEP \u2022\nTreatment: Health news (mainly enough vitamins), blood\n.transfusion, and heme injection","src":"Test 3-all gathered.docx.pdf, p. 49 \u00b7 q0499","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0501","topic":"hemostasis","q":"natural anticoagulant agents 3","opts":[],"correct":[],"why":"Intact endothelium (inaccessible tissue factor and NO .1\nproduction, production of tPA (plasminogen activator)),\n2. Muscle of the vascular wall, 3. Inactivated platelets, 4.\nContinuous blood flow (diluted coagulation factors) 5.\n.Protein C and protein S (vitamin K dependent)\nNO, PG from endothelium, bradykinin from -\nplasma","src":"Test 3-all gathered.docx.pdf, p. 51 \u00b7 q0501","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0502","topic":"liver","q":"Liver steatosis pathogenesis","opts":[],"correct":[],"why":"Liver steatosis = fat accumulation in hepatic cells. Blood\nlipid / lipid synthesis degradation / breakdown /\nlipoprotein synthesis disorder (causes: excessive MK\nsupply / increased synthesis / MK beta-oxidation\ndisorder, ...). Steatohepatitis = steatosis + minor necrosis,\nsigns of inflammation and fibrotization = clinical\n!seriousness\n:Types\nAlcohol-dependent - MK beta-oxidation disorder .1\nAlcohol unconditional - insulin resistance syndrome .2\n(type 2 DM, obesity, hyperlipoproteinemia) = increased\nMK supply to hepatocytes --- increased lipoperoxidation\n--- oxidative stress. 3. Overeating = excess energy. 4.\nMalnutrition = increased supply of fat in the liver. 5.\nHyperlipidemia. 6. Jejuno-ileal bypass. 7. Drugs, toxic\nsubstances = mitochondrial damage. 8. Rey syndrome =\nafter viral infection (also associated with encephalopathy\n.and brain edema). 9. Acute steatosis","src":"Test 3-all gathered.docx.pdf, p. 51 \u00b7 q0502","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0507","topic":"hemostasis","q":"Quick Test and aPTT - What They Describe, The Physiological Value That Determines the Heparin and :Warfarin Efficacy","opts":[],"correct":[],"why":"Quick test = prothrombin time = external and common\nhemocoagulation pathway test. It indicates the rate of\nconversion of prothrombin to thrombin due to tissue\nthromboplastin (coagulation factor III). Physiologically:\n12-15 s. Determines the efficacy of warfarin therapy.\nExtensions: Physiologically in neonates (fewer than VII),\n.warfarin therapy, hepatic proteosynthesis disorder, DIC\naPTT = activated partial thromboplastin time = internal\nand joint hemocoagulation pathway test. It is mainly\ndependent on the initial stages of hemocoagulation in the\ninner path (XII, XI, IX and VIII). Physiologically: 25.9-\n40 s. Determines the efficacy of heparin (increases the\neffectiveness of anti-coagulant antithrombin III).\nExtensions: Hemophilia A, B, C, heparin, von\n.Willebrand's disease, antiphospholipid syndrome, DIC","src":"Test 3-all gathered.docx.pdf, p. 53 \u00b7 q0507","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0508","topic":"hemostasis","q":"Haemophilia A - nature of the disease, symptoms","opts":[],"correct":[],"why":"Gender-linked gonosomally recessive hereditary disease\n(boys are more affected). The cause is a lack of\ncoagulation factor VIII or a decrease in its functional\nactivity below 10% (mutation of the respective gene).\nSymptoms: Severe form occurs immediately after birth,\notherwise spontaneous bleeding (epistaxis), haemorrhage\nafter minor traumas (the appearance of ecchymoses,\nhematomas), bleeding mostly does not resolve after\ncompression, bleeding into joints = hemarthros, bleeding\nafter physical activity, bleeding into GIT melanes).\n.Prolonged aPTT","src":"Test 3-all gathered.docx.pdf, p. 54 \u00b7 q0508","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0509","topic":"liver","q":"Pancreatic Alcohol Damage Mechanism","opts":[],"correct":[],"why":"Alcohol damages pancreatic acin cells, can cause Oddi's\nsphincter inflammation leading to pancreatic juice\nretention and proteolytic enzymes in acne and pancreatic\neffusions, and can also reduce Oddi sphincter tonus, thus\nallowing reflux of bile and duodenal content in the\npancreas = acute pancreatitis. Chronic Pancreatitis:\nLong-term alcohol abuse - toxic effects on pancreatic\ncells, development of inflammatory reaction associated\nwith scarring of ducts, increased pressure, pancreatic\nstagnation, protein precipitation and stones formation =\n.duct obstruction","src":"Test 3-all gathered.docx.pdf, p. 54 \u00b7 q0509","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0513","topic":"hemostasis","q":"DIC = disseminated intravascular coagulation","opts":[],"correct":[],"why":"Coagulation disorder obtained. Exhaustion of\ncoagulation factors causes increased bleeding = nasal\ncoagulopathy. The coagulation process is initiated and\ninsufficiently controlled at many sites in the vascular\nsystem. Beginning of DIC - factor VII activation by\ntissue factor (TF). Source TF - cells from other tissues\nthat get into the blood - injuries, birth, surgery, ...;\npathological blood cells; activated endothelium and\nmonocytes; hemolysis of erythrocytes. The DIC\ncombines defect of coagulation with primary haemostasis\ndefect (thrombocytopenia). Symptoms: GIT\nhaemorrhage, haematuria, epistaxis, hematoma, brain\nhaemorrhage, hypotension, tachycardia, shock\ndevelopment, consciousness disorders, small vessel\nobliterations - microtrombies = liver, kidney, heart -\nMODS development. At the same time, fibrinolysis is\nactivated = increased D-dimer - its plasma level is\ndetermined. Significantly decreased fibrinogen\n.concentration\nCANCER, SEPSIS, TRAUMA\nRisk factors: Sepsis, traumas, tumors, liver failure, shock\nstates, extracorporeal circulation, embolic amniotic fluid,\n.eclampsia, severe post-respiratory reaction\nRule four P (organs most commonly involved in DIC) =\n:Institutions that are rich in thrombokinase\n.Lungs \u2022\n.Prostate\n.Pancreas \u2022\n.Placenta \u2022","src":"Test 3-all gathered.docx.pdf, p. 56 \u00b7 q0513","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0517","topic":"liver","q":"causes of acute liver failure 5","opts":[],"correct":[],"why":"Severe hepatitis (viral-fulminant), poisoning by\nhepatotoxic agents (paracetamol, fungi, drugs), severe\ncirculatory disorders (right heart failure and subsequent\nvenostasis), acute steatosis, extensive tumor affection,\nmetabolic disorders Wilson's disease - abnormal copper,\nRey's syndrome - encephalopathy, acyl-CoA-\n.(dehydrogenase defect\nPOUISNOUS; TOO MUCH OF NON TOXIC;\n; HEPATITIS; TRAUMA; ALCOHOL; REY","src":"Test 3-all gathered.docx.pdf, p. 58 \u00b7 q0517","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0518","topic":"liver","q":"factors of bile stones formation 4","opts":[],"correct":[],"why":"crystalline structures that cause the precipitation of\ninsoluble bile components (cholecystolithiasis /\ncholedocholithiasis). Factors: 1. Increase in cholesterol in\nbile (obesity, hypercholesterolaemia), 2. Increase in\ncholesterol in bile and decrease bile acid secretion (in\nweight loss, estrogens, higher age), 3. Reduction of bile\nacid secretion (ileal resection - enterohepatic circulation ,\nintrahepatic cholestasis, primary biliary cirrhosis), 4.\nReduction of gall bladder motility (fasting, parenteral\n.nutrition, progesterone - pregnancy, somatostatin)","src":"Test 3-all gathered.docx.pdf, p. 58 \u00b7 q0518","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0520","topic":"liver","q":"Manifestation and etiology of the pseudo-nicter","opts":[],"correct":[],"why":"False jaundice, yellow skin and mucous membranes (NO\nsclera!) Caused by dyes other than bile (eg picric acid,\ncarotene) - for example, when excessive carbohydrate\n.consumption","src":"Test 3-all gathered.docx.pdf, p. 59 \u00b7 q0520","conf":"none","seen":1,"recall":false,"scored":false},{"id":"midterm3-q0521","topic":"hemostasis","q":"Virchow Trias","opts":[],"correct":[],"why":"Includes three factors that cause venous thrombosis =\nthrombophilic status: Hypercoagulation, Damage to the\n.vascular wall (endothelium), Slow blood flow","src":"Test 3-all gathered const WRITTEN = [{"q":"A gallstone obstructs the common bile duct. Which bilirubin fraction rises and what happens to urine and stool?","a":"Conjugated bilirubin rises. Water-soluble conjugated bilirubin enters urine, darkening it. Less bile pigment reaches the gut, so stool can become pale. Hemolytic jaundice instead predominantly raises unconjugated bilirubin."},{"q":"Which findings fit advanced cirrhosis: hypoglycemia, secondary hyperaldosteronism, secondary immunodeficiency, or routine progression from hepatitis A?","a":"The first three fit. Reduced hepatic glucose reserve, reduced effective arterial filling, and cirrhosis-associated immune dysfunction explain them. HAV typically causes acute rather than chronic hepatitis."},{"q":"Explain three manifestations of portal hypertension.","a":"Varices form as blood is diverted through portosystemic collaterals. Splenomegaly results from congestion and can cause hypersplenism. Ascites reflects increased portal pressure plus renal sodium and water retention."},{"q":"Explain three findings of acute cholecystitis.","a":"Persistent cystic duct obstruction and inflammation cause RUQ pain and local tenderness. Inflammation causes fever. Inspiratory arrest during RUQ palpation reflects contact with the inflamed gallbladder. Marked jaundice prompts consideration of common duct involvement."},{"q":"Which findings fit alcohol-associated acute pancreatitis: raised amylase, raised lipase, raised calcium or raised GGT?","a":"The past-paper key lists raised amylase, lipase and GGT. Lipase and amylase reflect pancreatic injury. GGT is nonspecific and can reflect alcohol exposure or hepatobiliary disease. Raised calcium is not the expected consequence."},{"q":"Aspirin causes a thrombocytopathy. What pattern is expected?","a":"Impaired platelet aggregation with a generally normal PT and aPTT. Those assays assess factor pathways. A platelet count measures quantity rather than function."},{"q":"Which finding fits hemophilia A: prolonged PT, prolonged aPTT or predominantly petechial bleeding?","a":"Prolonged aPTT fits isolated VIII deficiency. PT is usually normal and deep bleeding is more typical than petechiae."},{"q":"Why does factor V Leiden cause thrombophilia?","a":"Factor Va resists inactivation by activated protein C, maintaining prothrombinase activity and increasing thrombin generation. An elevated INR is not its characteristic finding."},{"q":"Which tests help assess DIC after severe trauma: albumin, D-dimer, platelet count, fibrinogen or erythrocyte count?","a":"The past-paper key lists D-dimer, platelet count and fibrinogen. They sample fibrin breakdown and consumption. PT and aPTT are also relevant to the broader workup."},{"q":"What causes iron deficiency and what findings support it?","a":"Chronic occult blood loss and impaired iron absorption are possible causes. Microcytosis, low ferritin and low transferrin saturation support it. Angular stomatitis and dysphagia can occur. Increased ferritin alone is not the classic pattern."},{"q":"What differentiates sickle cell anemia from thalassemia?","a":"Sickle cell disease involves an abnormal hemoglobin that polymerizes on deoxygenation. Thalassemia involves reduced production of a globin chain. Both can produce hemolysis, but vaso-occlusion is characteristic of sickling."},{"q":"Why can polycythemia cause thrombosis?","a":"Increased red-cell mass raises viscosity. In polycythemia vera, clonal changes affecting other blood cells can also contribute to thrombotic risk."},{"q":"Which are compatible with bacterial infection or treatment effects: metamyelocytes and bands, or chemotherapy-associated neutropenia?","a":"The past-paper key accepts both findings in their respective contexts. Bands and metamyelocytes represent a left shift during infection. Chemotherapy can suppress granulocyte production."},{"q":"Which processes distinguish leukocyte adhesion deficiency and chronic granulomatous disease?","a":"Adhesion deficiency impairs recruitment into tissues despite circulating leukocytes. Chronic granulomatous disease impairs NADPH oxidase-dependent oxidative killing after phagocytosis."},{"q":"Which disorder links thrombocytopenia to immune dysfunction and eczema?","a":"Wiskott\u2013Aldrich syndrome. The platelet finding links this immune disorder to the hemostasis block."},{"q":"Which mechanisms contribute to anaphylactic shock and respiratory compromise?","a":"Vasodilation and vascular leakage reduce effective circulating volume. Bronchoconstriction and mucosal edema compromise airflow. The lecture links these effects to mast-cell mediators including histamine and leukotrienes."},{"q":"Who attacks whom in graft-versus-host disease?","a":"Donor immune cells attack recipient tissues. In host-versus-graft rejection, recipient immune responses target the graft."}];

function grade(q, picked) {
  const set = new Set(q.correct);
  let hits = 0, wrongs = 0;
  picked.forEach(k => { set.has(k) ? hits++ : wrongs++; });
  const score = Math.max(0, hits - wrongs) / set.size;
  return { exact: hits === set.size && wrongs === 0, part: score, hits, wrongs, k: set.size };
}

  <h1>Practise, topic by topic.</h1>
  <p class="lede">Liver and pancreas, hemostasis, hematology and immunity. ${total} scored questions, including ${ky} source keys and ${total - ky} unverified answers. ${ak} entries are repeated in the bank or marked as recollections. Several options can be right. Wrong picks cost points. Your stats stay in this browser.</p>
  <div class="grid2">
    <button class="card hero" data-go="mock"><span class="eyebrow">Exam mode</span><h3>Mock Exams</h3><p>A Moodle-style 10, a quick mock, the asked-before set, or a custom test.</p><span class="go">Choose a mock<span>→</span></span></button>
    <button class="card" data-go="sheet"><span class="eyebrow">Reference</span><h3>Cheat Sheet</h3><p>Search the full question bank, answer keys and explanations.</p><span class="go">Look something up<span>→</span></span></button>
    <button class="card" data-go="patterns"><span class="eyebrow">Shortcuts</span><h3>Exam Patterns</h3><p>Exam topics, question patterns and how practice is scored.</p><span class="go">See the patterns<span>→</span></span></button>
    <button class="card" data-go="written"><span class="eyebrow">Written part</span><h3>Written questions</h3><p>Short-answer practice with worked responses.</p><span class="go">${WRITTEN.length} prompts<span>→</span></span></button>
    <button class="card" data-go="stats"><span class="eyebrow">Stats</span><h3>Your progress</h3><p>Accuracy by topic, weakest questions, recent sessions.</p><span class="go">Review<span>→</span></span></button>
    <a class="card link" href="https://pathophys-quiz.vercel.app/part2/"><span class="eyebrow">Midterm test 2</span><h3>Part 2</h3><p>Nutrition, water and salt, acid-base and gastrointestinal disorders.</p><span class="go">Go to Part 2<span>→</span></span></a>
  </div>
  <div class="section-h"><span class="eyebrow">Topics · ${total} questions</span><span class="row"><button class="pill" id="askd">Asked before only</button><button class="pill" id="weak">Drill my weakest 20</button></span></div>
  <div class="topics">${TOPICS.map(t => {
    const n = BANK.filter(q => q.topic === t.id).length;
    return `<button class="topic" data-topic="${t.id}"><span><b>${esc(t.name)}</b><small>${esc(t.day)}</small></span><span class="count">${n}</span></button>`;
  }).join('')}</div>`;
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => ({ mock, sheet, patterns, stats, written })[b.dataset.go]());
  app.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => {
    const t = TOPICS.find(x => x.id === b.dataset.topic);
    practice(BANK.filter(q => q.topic === t.id), t.name, false);
  });
  $('#weak').onclick = () => practice(weakest(20), 'Weakest 20', false);
  $('#askd').onclick = () => practice(BANK.filter(asked), 'Asked before', false);
}

function weakest(n) {
  const s = store.get('q', {});
  return BANK.slice().sort((a, b) => {
    const ra = s[a.id], rb = s[b.id];
    const sa = ra ? ra.part / ra.seen : 0.5, sb = rb ? rb.part / rb.seen : 0.5;
    return sa - sb;
  }).slice(0, n);
}

function practice(list, label, exam, minutes) {
  nav('quiz');
  if (!list.length) {
    nav('empty');
    app.innerHTML = '<div class="narrow"><h1>No questions in this set.</h1><p class="lede">Choose another topic or mock from the hub.</p></div>';
    return;
  }
  const qs = fresh(list).map(q => {
    const order = shuffle(q.opts.map((_, k) => k));
    return { ...q, opts: order.map(k => q.opts[k]), correct: order.map((k, n) => q.correct.includes(k) ? n : -1).filter(n => n >= 0) };
  });
  const picks = qs.map(() => new Set());
  const checked = qs.map(() => false);
  let i = 0, exact = 0, part = 0, done = 0;
  let endAt = minutes ? Date.now() + minutes * 60000 : 0;

  function render() {
    const q = qs[i];
    const p = picks[i];
    const shown = !exam && checked[i];
    const g = shown ? grade(q, p) : null;
    const right = new Set(q.correct);
    app.innerHTML = `<div class="narrow">
      <div class="meta"><span class="row"><span class="chip">Question ${i + 1} of ${qs.length}</span>${chips(q)}</span>
      <span class="score">${exam ? `<span class="timer" id="clock"></span>` : `${fmt(part)}/${done} points · ${done ? Math.round(part / done * 100) : 0}%`}</span></div>
      <div class="bar"><i style="width:${(i + 1) / qs.length * 100}%"></i></div>
      <p class="q">${esc(q.q)}</p>
      <p class="hint">Select every correct option. Wrong picks cost points.</p>
      <div class="opts">${q.opts.map((o, k) => {
        let cls = '', tag = '';
        if (shown) {
          if (right.has(k) && p.has(k)) { cls = 'right'; tag = '<span class="tag r">Correct</span>'; }
          else if (!right.has(k) && p.has(k)) { cls = 'wrong'; tag = '<span class="tag w">Wrong</span>'; }
          else if (right.has(k)) { cls = 'missed'; tag = '<span class="tag m">Missed</span>'; }
          else cls = 'dim';
        } else if (p.has(k)) cls = 'sel';
        return `<button class="opt ${cls}" data-k="${k}" ${shown ? 'disabled' : ''}><span class="k">${k + 1}</span><span class="t">${esc(o)}</span>${tag}</button>`;
      }).join('')}</div>
      ${shown ? `<div class="why"><b>${g.exact ? 'Full point.' : `${fmt(g.part)} of 1 point: ${g.hits} of ${g.k} right picked${g.wrongs ? `, ${g.wrongs} wrong pick${g.wrongs > 1 ? 's' : ''} subtracted` : ''}.`}</b>${esc(q.why || '')}${unoff(q) ? `<div class="unc">Unverified answer: inferred from the study material.</div>` : ''}${q.recallNote ? `<div class="rn">Recall note: ${esc(q.recallNote)}</div>` : ''}</div>` : ''}
      ${exam
        ? `<div class="row"><button class="btn ghost" id="prev" ${i === 0 ? 'disabled' : ''}>← Previous</button><button class="btn" id="next">${i === qs.length - 1 ? 'Finish and mark' : 'Next question →'}</button></div>`
        : `<button class="btn" id="next">${shown ? (i === qs.length - 1 ? 'See results' : 'Next question →') : 'Check answer'}</button>`}
      <p class="foot">Press 1 to ${q.opts.length} to select · Enter to ${exam ? 'go on' : shown ? 'go on' : 'check'}</p>
    </div>`;
    fit();
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => toggle(+b.dataset.k));
    $('#next').onclick = next;
    if (exam) { $('#prev').onclick = () => { if (i > 0) { i--; render(); } }; tick(); }
  }
  function toggle(k) {
    if (!exam && checked[i]) return;
    const p = picks[i]; p.has(k) ? p.delete(k) : p.add(k); render();
  }
  function next() {
    if (exam) { if (i < qs.length - 1) { i++; render(); } else finish(); return; }
    if (!checked[i]) {
      checked[i] = true; const g = grade(qs[i], picks[i]); record(qs[i], g);
      done++; exact += g.exact ? 1 : 0; part += g.part; render(); return;
    }
    if (i < qs.length - 1) { i++; render(); } else finish();
  }
  function tick() {
    const el = $('#clock'); if (!el || !endAt) { if (el) el.textContent = 'Untimed'; return; }
    const left = Math.max(0, endAt - Date.now());
    const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
    el.textContent = `${m}:${String(s).padStart(2, '0')} left`;
    el.classList.toggle('low', left < 120000);
    if (left === 0) finish();
  }
  if (exam && minutes) timerId = setInterval(tick, 1000);
  function finish() {
    stopTimer(); keyHandler = null; document.body.classList.remove('quizmode');
    let ex = 0, pt = 0;
    const rows = qs.map((q, k) => {
      const g = grade(q, picks[k]);
      if (exam) record(q, g);
      ex += g.exact ? 1 : 0; pt += g.part;
      return { q, g, k };
    });
    const pct = pt / qs.length;
    logSession(label, qs.length, ex, pct);
    window.scrollTo(0, 0);
    app.innerHTML = `<div class="narrow"><div class="result">
      <div class="eyebrow">${esc(label)}</div>
      <div class="big">${Math.round(pct * 100)}%</div>
      <p class="lede" style="margin:0 auto 14px">score: ${fmt(pt)} of ${qs.length} points · ${ex} questions fully right</p>
      <span class="pass ${pct >= PASS ? 'y' : 'n'}">${pct >= PASS ? 'Above' : 'Below'} the 65% line</span>
      <p class="hint" style="margin-top:16px">Each question is worth 1 point. Every right option you pick adds its share, every wrong pick removes the same share, and a question bottoms out at 0.</p>
      </div>
      <div class="row"><button class="btn" id="again">Try these again</button><button class="btn ghost" id="wrongs">Redo the ones I missed</button></div>
      <div class="review">${rows.map(r => `<button class="item" data-k="${r.k}"><span class="dot ${r.g.exact ? 'y' : r.g.part >= .5 ? 'p' : 'n'}"></span><span style="flex:1;min-width:0">${esc(r.q.q)}</span><span class="mono" style="color:var(--muted)">${fmt(r.g.part)}</span></button>`).join('')}</div></div>`;
    $('#again').onclick = () => practice(list, label, exam, minutes);
    const miss = rows.filter(r => !r.g.exact).map(r => r.q);
    $('#wrongs').onclick = () => miss.length ? practice(miss, 'Missed from ' + label, false) : hub();
    app.querySelectorAll('.review .item').forEach(b => b.onclick = () => showOne(rows[+b.dataset.k].q, picks[+b.dataset.k]));
  }
  function showOne(q, p) {
    const right = new Set(q.correct);
    const box = document.createElement('div');
    box.className = 'why';
    box.innerHTML = `${chips(q)}<b>${esc(q.q)}</b>` + q.opts.map((o, k) => `<div style="color:${right.has(k) ? 'var(--ok)' : 'var(--muted)'}">${right.has(k) ? 'T' : 'F'} · ${esc(o)}${p.has(k) ? ' (you picked)' : ''}</div>`).join('') + `<div style="margin-top:8px">${esc(q.why || '')}</div>${q.recallNote ? `<div class="rn">Recall note: ${esc(q.recallNote)}</div>` : ''}`;
    app.querySelector('.review').prepend(box); window.scrollTo({ top: box.offsetTop - 90, behavior: 'smooth' });
  }
  keyHandler = e => {
    const q = qs[i];
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= q.opts.length) { e.preventDefault(); toggle(n - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); next(); }
    else if (exam && e.key === 'ArrowLeft' && i > 0) { i--; render(); }
  };
  render();
}

function mock() {
  nav('mock');
  const ak = BANK.filter(asked);
  app.innerHTML = `<div class="eyebrow">Exam mode</div><h1>Choose your mock.</h1>
  <p class="lede">Answers stay hidden until you finish, like the real test. The timings are practice settings. The practice benchmark is 65%.</p>
  <div class="mock">
    <button class="card hero" data-m="moodle"><span class="eyebrow">Real format</span><h3>Moodle-style mock</h3><p>10 questions across the four topics, with questions asked before drawn more often. Do the written part on paper.</p><span class="go">10 questions · 20 min<span>→</span></span></button>
    <button class="card" data-m="quick"><span class="eyebrow">Mixed</span><h3>Quick mock</h3><p>30 questions drawn evenly from every topic.</p><span class="go">30 questions · 30 min<span>→</span></span></button>
    <button class="card" data-m="asked"><span class="eyebrow">Repeats</span><h3>Asked before</h3><p>Questions repeated in the bank or marked as recollections.</p><span class="go">${ak.length} questions · ${Math.round(ak.length * 0.9)} min<span>→</span></span></button>
    <button class="card" data-m="all"><span class="eyebrow">Everything</span><h3>Whole bank</h3><p>Every scored question in Part 3.</p><span class="go">${BANK.length} questions · untimed<span>→</span></span></button>
  </div>

    ${TOPICS.map(t => `<label><input type="checkbox" id="ct_${t.id}" value="${t.id}" checked> ${esc(t.name)} <span class="count">${BANK.filter(q => q.topic === t.id).length}</span></label>`).join('')}
    <label style="margin-top:8px">Questions <input type="number" id="cn" value="25" min="5" max="${BANK.length}"> Minutes <input type="number" id="cm" value="25" min="0" max="180"></label>
    <button class="btn" id="cgo">Start custom mock</button></div>`;
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const m = b.dataset.m;
    if (m === 'quick') practice(spread(BANK, TOPICS.map(t => t.id), 30), 'Quick mock', true, 30);
    if (m === 'asked') practice(ak, 'Asked before', true, Math.round(ak.length * 0.9));
    if (m === 'all') practice(BANK, 'Whole bank', true, 0);
    if (m === 'moodle') practice(wspread(BANK, TOPICS.map(t => t.id), 10), 'Moodle-style mock', true, 20);
  });
  $('#cgo').onclick = () => {
    const ids = TOPICS.map(t => t.id).filter(id => $('#ct_' + id).checked);
    const n = Math.max(1, +$('#cn').value || 25), mins = +$('#cm').value || 0;
    if (!ids.length) return;
    practice(spread(BANK, ids, n), 'Custom mock', true, mins);
  };
}
function wpick(pool) {
  const s = store.get('q', {});
  const low = Math.min(...pool.map(q => timesDone(s, q)));
  const w = pool.map(q => timesDone(s, q) > low ? 0 : asked(q) ? 3 : 1);
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let k = 0; k < pool.length; k++) { if (!w[k]) continue; r -= w[k]; if (r <= 0) return pool.splice(k, 1)[0]; }
  return pool.splice(w.findLastIndex(x => x > 0), 1)[0];
}
function wspread(bank, ids, n) {
  const pools = shuffle(ids).map(id => bank.filter(q => q.topic === id));
  const out = [];
  while (out.length < n && pools.some(p => p.length)) pools.forEach(p => { if (p.length && out.length < n) out.push(wpick(p)); });
  return out;
}
function spread(bank, ids, n) {
  const pools = ids.map(id => fresh(bank.filter(q => q.topic === id)));
  const out = [];
  while (out.length < n && pools.some(p => p.length)) pools.forEach(p => { if (p.length && out.length < n) out.push(p.shift()); });
  return out;
}

function sheet() {
  nav('sheet');
  app.innerHTML = `<div class="narrow"><div class="eyebrow">Reference</div><h1>Cheat sheet.</h1>
  <p class="lede">Browse all ${REVIEW_BANK.length} Midterm 3 entries. “Unverified answer” marks an inferred answer. When choice letters are unclear, the available explanation appears below the choices.</p>
  <input class="search" id="s" placeholder="Search by question, term or ID, e.g. ascites, INR, q0215" autocomplete="off">
  <div class="sheet" id="list"></div></div>`;
  const draw = () => {
    const term = $('#s').value.trim().toLowerCase();
    const hits = REVIEW_BANK.filter(q => !term || (q.q + ' ' + q.src + ' ' + q.opts.join(' ') + ' ' + (q.why || '')).toLowerCase().includes(term));
    $('#list').innerHTML = hits.length ? hits.map(q => `<div class="item"><div class="qq">${inline(q)}${!q.scored ? '<span class="tagline">Review only</span>' : ''}${srcChip(q) ? `<span style="color:var(--muted)">${esc(srcChip(q))} · </span>` : ''}${esc(q.q)}</div>
      <ul>${q.opts.map((o, k) => `<li class="${q.scored ? (q.correct.includes(k) ? 'y' : 'n') : ''}">${esc(o)}</li>`).join('')}</ul>
      ${q.why ? `<div class="r">${esc(q.why)}</div>` : ''}${q.recallNote ? `<div class="r">Recall note: ${esc(q.recallNote)}</div>` : ''}</div>`).join('') : `<p class="empty">No question mentions “${esc(term)}”.</p>`;
  };
  $('#s').oninput = draw; draw();
}

  <p class="lede">Patterns to practise across the four Midterm 3 blocks.</p>
  <div class="pat">${PATTERNS.map(p => `<div class="item"><h3>${esc(p.h)}</h3><p>${esc(p.t)}</p></div>`).join('')}</div></div>`;

  <p class="lede">Try each prompt out loud, then tap to reveal a worked response.</p>
  <div class="sheet">${WRITTEN.map(w => `<details class="item"><summary class="qq">${inline(w)}${esc(w.q)}</summary><div class="r">${esc(w.a)}</div></details>`).join('')}</div></div>`;

function stats() {
  nav('stats');
  const s = store.get('q', {});
  const sessions = store.get('sessions', []);
  const seen = Object.keys(s).length;
  const tot = Object.values(s).reduce((a, r) => a + r.seen, 0);
  const acc = tot ? Object.values(s).reduce((a, r) => a + r.part, 0) / tot : 0;
  const weak = BANK.filter(q => s[q.id]).sort((a, b) => s[a.id].part / s[a.id].seen - s[b.id].part / s[b.id].seen).slice(0, 8);
  app.innerHTML = `<div class="narrow"><div class="eyebrow">Stats</div><h1>Your progress.</h1>
  <div class="stats"><div class="stat"><div class="n">${seen}/${BANK.length}</div><div class="l">questions answered</div></div>
  <div class="stat"><div class="n">${Math.round(acc * 100)}%</div><div class="l">average score per question</div></div>
  <div class="stat"><div class="n">${sessions.length}</div><div class="l">sessions finished</div></div></div>
  <div class="section-h"><span class="eyebrow">By topic</span></div>
  ${TOPICS.map(t => {
    const qs = BANK.filter(q => q.topic === t.id && s[q.id]);
    const n = qs.reduce((a, q) => a + s[q.id].seen, 0);
    const pc = n ? qs.reduce((a, q) => a + s[q.id].part, 0) / n : 0;
    return `<div class="tbar"><span>${esc(t.name)}</span><span class="track"><i style="width:${pc * 100}%"></i></span><span class="pc">${n ? Math.round(pc * 100) + '%' : 'none'}</span></div>`;
  }).join('')}
  <div class="section-h"><span class="eyebrow">Weakest questions</span></div>
  <div class="review">${weak.length ? weak.map(q => `<div class="item" style="cursor:default"><span style="flex:1;min-width:0">${esc(q.q)}</span><span class="mono" style="color:var(--muted)">${Math.round(s[q.id].part / s[q.id].seen * 100)}%</span></div>`).join('') : '<p class="empty">Answer a few questions and your weakest ones show up here.</p>'}</div>
  <div class="section-h"><span class="eyebrow">Recent sessions</span>${sessions.length ? '<button class="pill" id="reset">Reset stats</button>' : ''}</div>
  <div class="review">${sessions.length ? sessions.map(x => `<div class="item" style="cursor:default"><span style="flex:1">${esc(x.label)} <span style="color:var(--muted)">· ${new Date(x.at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</span></span><span class="mono">${Math.round(x.part * 100)}% · ${x.exact}/${x.n}</span></div>`).join('') : '<p class="empty">Finished topics and mocks will be listed here.</p>'}</div>
  <div id="confirm"></div></div>`;
  const r = $('#reset');
  if (r) r.onclick = () => {
    $('#confirm').innerHTML = `<div class="why"><b>Delete all your stats on this device?</b><div class="row"><button class="btn" id="yes">Delete stats</button><button class="btn ghost" id="no">Keep them</button></div></div>`;
    $('#yes').onclick = () => { store.set('q', {}); store.set('sessions', []); stats(); };
    $('#no').onclick = () => { $('#confirm').innerHTML = ''; };
  };
}

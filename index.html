const TOPICS = [{"id":"liver","name":"Liver, biliary tract and exocrine pancreas","day":"Practical 8 \u00b7 jaundice, cirrhosis, gallstones, pancreatitis"},{"id":"hemostasis","name":"Hemostasis and coagulation","day":"Lecture and Practical 9 \u00b7 platelets, clotting tests, thrombosis, DIC"},{"id":"blood","name":"Blood and hematology","day":"Lecture and Practical 10 \u00b7 anemia, leukocytes, marrow, transfusion"},{"id":"immunity","name":"Immunity","day":"Lecture and Practical 11 \u00b7 immunodeficiency, hypersensitivity, autoimmunity, transplant"}];
const PATTERNS = [{"h":"Four exam blocks","t":"Practical 8 covers the liver, biliary tract and exocrine pancreas. Lectures and practicals 9 to 11 cover hemostasis, hematology and immunity. The mocks mix questions from all four blocks."},{"h":"Lab patterns and mechanisms","t":"Compare bilirubin fractions and urine changes, PT and aPTT, MCV and reticulocytes, and the immune effectors behind hypersensitivity types. Then explain why each finding follows from the mechanism."},{"h":"Multiple-select scoring","t":"These mocks use the Part 2 practice rule: add one for each correct pick, subtract one for each wrong pick, and divide by the number of correct choices. Each question has a minimum of zero. The mock duration and 65% benchmark are practice settings."},{"h":"Answer evidence","t":"Source keys are reported from the past papers. Unverified answers are inferred from the study material. The quiz and cheat sheet contain edited questions with complete choices and a usable key."},{"h":"Written questions","t":"Practise explaining each step out loud. For a three-sign question, name each sign and give the causal link in a separate sentence."}];
const WRITTEN = [{"id":"q0004","q":"Write 3 important causes and 3 important symptoms (with an explanation of the mechanism of their occurrence) of coagulopathy.","a":"Secondary hemostatic disorders can arise from inherited factor deficiency, impaired liver synthesis or factor consumption in DIC. Unstable fibrin clots can cause delayed rebleeding, deep muscle hematomas and hemarthroses. Primary hemostatic disorders more often cause early mucocutaneous bleeding.","src":"3. test verze 1-2.pdf.pdf, p. 2 \u00b7 q0004 \u00b7 Copy of Czech Ws was 3.pdf, p. 329","seen":2},{"id":"q0008","q":"Explain the pathogenesis of the 3 symptoms of portal hypertension.","a":"Raised portal resistance drives portosystemic collaterals and varices. Splenic venous congestion enlarges the spleen and can lower platelets. Elevated hydrostatic pressure plus renal sodium retention contribute to ascites.","src":"3. test verze 1-2.pdf.pdf, p. 4 \u00b7 q0008 \u00b7 Copy of Czech Ws was 3.pdf, pp. 299, 364"},{"id":"q0017","q":"Explain the pathogenesis of 3 symptoms of acute cholecystitis","a":"Cystic duct obstruction traps bile and distends the gallbladder, causing persistent right upper quadrant pain. Inflammation releases pyrogenic mediators that cause fever. When the inflamed gallbladder descends against the examiner\u2019s hand during inspiration, pain abruptly stops the breath (Murphy sign). Pruritus and pale stool in the captured response suggest impaired bile flow into the intestine, which is not typical of isolated cystic duct obstruction.","src":"3. test verze 2-2.pdf.pdf, p. 4 \u00b7 q0017 \u00b7 Copy of Czech Ws was 3.pdf, p. 210 \u00b7 Copy of Czech Ws was 3.pdf, p. 58 \u00b7 Copy of Czech Ws was 3.pdf, p. 142 \u00b7 Copy of Czech Ws was 3.pdf, p. 153","seen":3},{"id":"q0186","q":"Write down 3 important causes and 3 important signs (with explanation) of disorders of primary hemostasis.","a":"Primary hemostatic disorders can result from thrombocytopenia, qualitative platelet defects or impaired vWF-dependent adhesion. Petechiae, epistaxis and gingival bleeding reflect poor early sealing of small vessel injuries.","src":"3rd test Lian.docx.pdf, p. 2 \u00b7 q0186 \u00b7 Copy of Czech Ws was 3.pdf, pp. 308\u2013310 \u00b7 Copy of Czech Ws was 3.pdf, p. 326","seen":3},{"id":"q0189","q":"Explain the pathogenesis of 3 signs of acute pancreatitis","a":"Premature pancreatic enzyme activation causes autodigestion and inflammation. Edema and irritation explain severe epigastric pain, often radiating to the back. Inflammation causes nausea and vomiting, and capillary leak can cause hypotension.","src":"3rd test Lian.docx.pdf, p. 3 \u00b7 q0189"},{"id":"q0204","q":"Imagine you are in a simulation center and there is a \"patient\" in front of you with signs of anemic syndrome. The anamnesis corresponds to this. Write down major symptoms and important laboratory parameters, which you need to evaluate in the patient.","a":"Anemia can cause pallor, fatigue, exertional dyspnea and tachycardia from reduced oxygen-carrying capacity. Start with CBC, hemoglobin, MCV, reticulocyte count and a smear. Iron studies, hemolysis markers and B12 or folate help classify the cause. Symptom onset varies with rate of onset and comorbidity.","src":"4th test Lian.docx.pdf, p. 1 \u00b7 q0204 \u00b7 \u05de\u05d1\u05d7\u05e0\u05d9 \u05e2\u05d1\u05e8 \u05e1\u05de\u05e1\u05d8\u05e8 \u05d0_ \u05dc\u05dc\u05d0 \u05d4\u05e7\u05e8\u05d3\u05d9\u05d8.pdf.pdf, p. 8 \u00b7 q1148 \u00b7 \u05de\u05d1\u05d7\u05e0\u05d9 \u05e2\u05d1\u05e8 \u05e1\u05de\u05e1\u05d8\u05e8 \u05d0_ \u05dc\u05dc\u05d0 \u05d4\u05e7\u05e8\u05d3\u05d9\u05d8.pdf.pdf, p. 28 \u00b7 q1149"},{"id":"q0225","q":"Describe etiology and pathogenesis of hepatic encephalopathy","a":"Impaired hepatic detoxification and portosystemic shunting increase ammonia exposure. Astrocytes convert ammonia to glutamine, which promotes osmotic swelling and altered neurotransmission. Inflammation can amplify the neurologic dysfunction.","src":"4th test Lian.docx.pdf, p. 13 \u00b7 q0225"},{"id":"q0790","q":"Describe the typical clinical manifestations (3) and laboratory findings (3) in Hemophilia A","a":"Hemophilia A is usually X-linked factor VIII deficiency. Expect hemarthroses, deep hematomas or delayed bleeding. Factor VIII activity is low and aPTT may be prolonged. PT/INR and platelet count are usually normal. Its incidence is roughly one in 5,000 male births.","src":"Copy of Czech Ws was 3.pdf, p. 25 \u00b7 q0790 \u00b7 Copy of Czech Ws was 3.pdf, p. 168"},{"id":"q0547","q":"Imagine that you are in a simulation center and there is a \"patient\" in front of you, in whom you are observing the symptoms of developing anaphylaxis (a graded type 1 hypersensitivity reaction); the anamnesis provided by the escort also corresponds to this. Describe the symptoms of anaphylaxis, the development of which you can observe in the bloodstream and in the digestive tract.","a":"Mast-cell mediators such as histamine cause vasodilation and increased permeability in anaphylaxis, reducing effective circulating volume and blood pressure. Gut smooth-muscle contraction and edema can cause cramps, vomiting or diarrhea.","src":"Copy of Czech Ws was 3.pdf, p. 107 \u00b7 q0547 \u00b7 Copy of Czech Ws was 3.pdf, p. 286","seen":2},{"id":"q1151","q":"Explain the pathogenesis of 3 signs of acute cholecystitis","a":"Cystic duct obstruction traps bile and distends the gallbladder, causing persistent right upper quadrant pain. Inflammation releases pyrogenic mediators that cause fever. When the inflamed gallbladder descends against the examiner\u2019s hand during inspiration, pain abruptly stops the breath (Murphy sign). Pruritus and pale stool in the captured response suggest impaired bile flow into the intestine, which is not typical of isolated cystic duct obstruction.","src":"\u05de\u05d1\u05d7\u05e0\u05d9 \u05e2\u05d1\u05e8 \u05e1\u05de\u05e1\u05d8\u05e8 \u05d0_ \u05dc\u05dc\u05d0 \u05d4\u05e7\u05e8\u05d3\u05d9\u05d8.pdf.pdf, p. 51 \u00b7 q1151 \u00b7 \u05de\u05d1\u05d7\u05e0\u05d9 \u05e2\u05d1\u05e8 \u05e1\u05de\u05e1\u05d8\u05e8 \u05d0_ \u05dc\u05dc\u05d0 \u05d4\u05e7\u05e8\u05d3\u05d9\u05d8.pdf.pdf, p. 84 \u00b7 q1153"},{"id":"q1696","q":"Pathophysiology of secondary immune deficiency","a":"Secondary immunodeficiency develops after birth when illness, nutritional deficiency or treatment disrupts immune function. HIV depletes CD4 helper T cells, weakening cell-mediated defense and coordination of antibody responses. Malnutrition limits immune-cell proliferation and weakens mucosal barriers. Immunosuppressive drugs or chemotherapy can inhibit lymphocyte responses or reduce leukocyte production. Protein loss can reduce circulating immunoglobulins. The resulting infection pattern follows the affected defense: T-cell defects predispose to opportunistic infections, while antibody loss predisposes to recurrent bacterial infections.","src":"Selected.pdf, p. 73"},{"id":"q1746","q":"Imagine that you are in a simulation center and there is a \"patient\" in front of you, in whom you are observing the symptoms of developing anaphylaxis (a graded type 1 hypersensitivity reaction); the anamnesis provided by the escort also corresponds to this. Describe the symptoms of anaphylaxis, the development of which you can observe on the skin and respiratory tract.","a":"On the skin, mast-cell mediators can cause itching, flushing and urticaria. Increased vascular permeability can produce angioedema, including swelling around the eyes or lips. In the respiratory tract, bronchial smooth-muscle contraction can cause wheezing and dyspnea. Upper airway edema can cause hoarseness or stridor.","src":"Copy of Czech Ws was 3.pdf, p. 119 \u00b7 Copy of Czech Ws was 3.pdf, p. 143 \u00b7 Copy of Czech Ws was 3.pdf, p. 155","seen":3},{"id":"q1747","q":"Describe 4 important symptoms occurring in patients with severe sideropenic anemia.","a":"Fatigue and weakness reflect reduced oxygen delivery to tissues. Exertional dyspnea develops as ventilation increases to meet oxygen demand. Palpitations can result from compensatory tachycardia. A sore, smooth tongue can result from atrophy of the lingual epithelium in longstanding iron deficiency.","src":"Copy of Czech Ws was 3.pdf, p. 130"},{"id":"q1784","q":"Describe the pathogenesis of 3 symptoms of liver cirrhosis","a":"Ascites develops when portal hypertension increases hydrostatic pressure and splanchnic vasodilation reduces effective arterial filling. The kidneys retain sodium and water, and fluid collects in the peritoneum. Jaundice results when damaged hepatocytes cannot adequately process or excrete bilirubin. Easy bruising can reflect both reduced synthesis of clotting factors and a low platelet count from splenic sequestration.","src":"Copy of Czech Ws was 3.pdf, p. 239"}];
const questionFigure = q => q.image ? `<img src="/papers/${esc(q.image)}" alt="Source diagram of antibodies, RNA and ALT over time" style="display:block;width:min(100%,580px);height:auto;margin:12px 0">` : '';
const srcChip = q => q.src || '';
const asked = q => q.recall || (q.seen || 1) >= 2;
const unoff = q => q.conf === 'inferred';
const chips = q => `${srcChip(q) ? `<span class="chip src">${esc(srcChip(q))}</span>` : ''}${asked(q) ? `<span class="chip ask">Asked before${(q.seen || 1) >= 2 ? ` · ${q.seen}x` : ''}</span>` : ''}${unoff(q) ? `<span class="chip unoff">Unverified answer</span>` : ''}`;
const inline = q => `${asked(q) ? `<span class="tagline">Asked before · ${q.seen || 1}x</span>` : ''}${unoff(q) ? '<span class="tagline" style="color:var(--muted)">Unverified answer</span>' : ''}`;
const PASS = 0.65;

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const timesDone = (s, q) => { const r = s[q.id]; if (!r || !r.seen) return 0; const last = r.last ?? r.part / r.seen; return last < 1 ? 0 : 1 + r.seen; };
const fresh = list => { const s = store.get('q', {}); return shuffle(list).sort((a, b) => timesDone(s, a) - timesDone(s, b)); };
const store = {
  get(k, d) { try { const v = localStorage.getItem('ppmt3_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ppmt3_' + k, JSON.stringify(v)); } catch (e) {} }
};

(function theme() {
  if (!store.get('editedBankV1', false)) {
    const kept = new Set(BANK.filter(q => q.conf === 'key').map(q => q.id));
    store.set('q', Object.fromEntries(Object.entries(store.get('q', {})).filter(([id]) => kept.has(id))));
    store.set('editedBankV1', true);
  }
  const t = store.get('theme', null);
  if (t) document.documentElement.setAttribute('data-theme', t);
  $('#theme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nx); store.set('theme', nx);
  };
})();

function grade(q, picked) {
  const set = new Set(q.correct);
  let hits = 0, wrongs = 0;
  picked.forEach(k => { set.has(k) ? hits++ : wrongs++; });
  const score = Math.max(0, hits - wrongs) / set.size;
  return { exact: hits === set.size && wrongs === 0, part: score, hits, wrongs, k: set.size };
}
const fmt = x => (Math.round(x * 100) / 100).toString();
function record(q, g) {
  const s = store.get('q', {});
  const r = s[q.id] || { seen: 0, exact: 0, part: 0 };
  r.seen++; r.exact += g.exact ? 1 : 0; r.part += g.part; r.last = g.part; s[q.id] = r; store.set('q', s);
}
function logSession(label, n, exact, part) {
  const l = store.get('sessions', []);
  l.unshift({ label, n, exact, part, at: Date.now() });
  store.set('sessions', l.slice(0, 20));
}

let timerId = null;
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
let keyHandler = null;
document.addEventListener('keydown', e => { if (keyHandler && !e.metaKey && !e.ctrlKey && !(e.target.tagName === 'INPUT')) keyHandler(e); });

function nav(view) { stopTimer(); keyHandler = null; $('#back').hidden = view === 'hub'; document.body.classList.toggle('quizmode', view === 'quiz'); window.scrollTo(0, 0); }
function fit() {
  const el = app.firstElementChild;
  if (!el || !document.body.classList.contains('quizmode')) return;
  el.style.zoom = 1;
  let z = 1;
  while (document.documentElement.scrollHeight > window.innerHeight && z > 0.5) { z -= 0.03; el.style.zoom = z; }
}
window.addEventListener('resize', fit);
$('#home').onclick = hub;
$('#back').onclick = hub;

  const total = BANK.length;
  const ak = BANK.filter(asked).length;
  const ky = BANK.filter(q => q.conf === 'key').length;

  <div class="eyebrow">Practice · Midterm test 3</div>
  <h1>Practise, topic by topic.</h1>
  <p class="lede">Liver and pancreas, hemostasis, hematology and immunity. ${total} scored questions, including ${ky} source keys and ${total - ky} unverified answers. ${ak} entries are repeated in the bank or marked as recollections. Several options can be right. Wrong picks cost points. Your stats stay in this browser.</p>
  <div class="grid2">
    <button class="card hero" data-go="mock"><span class="eyebrow">Exam mode</span><h3>Mock Exams</h3><p>A Moodle-style 10, a quick mock, the asked-before set, or a custom test.</p><span class="go">Choose a mock<span>→</span></span></button>
    <button class="card" data-go="sheet"><span class="eyebrow">Reference</span><h3>Cheat Sheet</h3><p>Search the full question bank, answer keys and explanations.</p><span class="go">Look something up<span>→</span></span></button>
    <button class="card" data-go="patterns"><span class="eyebrow">Shortcuts</span><h3>Exam Patterns</h3><p>Exam topics, question patterns and how practice is scored.</p><span class="go">See the patterns<span>→</span></span></button>
    <button class="card" data-go="written"><span class="eyebrow">Written part</span><h3>Written questions</h3><p>Short-answer practice with worked responses.</p><span class="go">${WRITTEN.length} prompts<span>→</span></span></button>
    <button class="card" data-go="stats"><span class="eyebrow">Stats</span><h3>Your progress</h3><p>Accuracy by topic, weakest questions, recent sessions.</p><span class="go">Review<span>→</span></span></button>
    <a class="card link" href="https://pathophys-quiz.vercel.app/part2/"><span class="eyebrow">Midterm test 2</span><h3>Part 2</h3><p>Nutrition, water and salt, acid-base and gastrointestinal disorders.</p><span class="go">Go to Part 2<span>→</span></span></a>
  </div>
  <div class="section-h"><span class="eyebrow">Topics · ${total} questions</span><span class="row"><button class="pill" id="askd">Asked before only</button><button class="pill" id="weak">Drill my weakest 20</button></span></div>
  <div class="topics">${TOPICS.map(t => {

function weakest(n) {
  const s = store.get('q', {});
  return BANK.slice().sort((a, b) => {
    const ra = s[a.id], rb = s[b.id];
    const sa = ra ? ra.part / ra.seen : 0.5, sb = rb ? rb.part / rb.seen : 0.5;
    return sa - sb;
  }).slice(0, n);
}

function optionFeedback(q, picked) {
  const right = new Set(q.correct);
  const mismatches = q.opts.map((text, i) => ({text, i})).filter(({i}) => right.has(i) !== picked.has(i));
  if (!mismatches.length) return '';
  return '<ul>' + mismatches.map(({text, i}) => {
    const correct = right.has(i);
    const reason = q.optionWhy?.[i];
    const label = correct ? 'Missed correct choice' : 'Incorrect choice you picked';
    return `<li><strong>${label} · ${i + 1}</strong> ${esc(text)}${reason ? `<div>${esc(reason)}</div>` : ''}</li>`;
  }).join('') + '</ul>';
}

function practice(list, label, exam, minutes) {
  nav('quiz');
  if (!list.length) {
    nav('empty');
    app.innerHTML = '<div class="narrow"><h1>No questions in this set.</h1><p class="lede">Choose another topic or mock from the hub.</p></div>';
    return;
  }
  const qs = fresh(list).map(q => {
    const order = shuffle(q.opts.map((_, k) => k));
    return { ...q, opts: order.map(k => q.opts[k]), optionWhy: order.map(k => q.optionWhy?.[k]), correct: order.map((k, n) => q.correct.includes(k) ? n : -1).filter(n => n >= 0) };
  });
  const picks = qs.map(() => new Set());
  const checked = qs.map(() => false);
  let i = 0, exact = 0, part = 0, done = 0;
  let endAt = minutes ? Date.now() + minutes * 60000 : 0;

  function render() {
    const q = qs[i];
    const p = picks[i];
    const shown = !exam && checked[i];
    const g = shown ? grade(q, p) : null;
    const right = new Set(q.correct);
    app.innerHTML = `<div class="narrow">
      <div class="meta"><span class="row"><span class="chip">Question ${i + 1} of ${qs.length}</span>${chips(q)}</span>
      <span class="score">${exam ? `<span class="timer" id="clock"></span>` : `${fmt(part)}/${done} points · ${done ? Math.round(part / done * 100) : 0}%`}</span></div>
      <div class="bar"><i style="width:${(i + 1) / qs.length * 100}%"></i></div>
      <p class="q">${esc(q.q)}</p>${questionFigure(q)}
      <p class="hint">Select every correct option. Wrong picks cost points.</p>
      <div class="opts">${q.opts.map((o, k) => {
        let cls = '', tag = '';
        if (shown) {
          if (right.has(k) && p.has(k)) { cls = 'right'; tag = '<span class="tag r">Correct</span>'; }
          else if (!right.has(k) && p.has(k)) { cls = 'wrong'; tag = '<span class="tag w">Wrong</span>'; }
          else if (right.has(k)) { cls = 'missed'; tag = '<span class="tag m">Missed</span>'; }
          else cls = 'dim';
        } else if (p.has(k)) cls = 'sel';
        return `<button class="opt ${cls}" data-k="${k}" ${shown ? 'disabled' : ''}><span class="k">${k + 1}</span><span class="t">${esc(o)}</span>${tag}</button>`;
      }).join('')}</div>
      ${shown ? `<div class="why"><b>${g.exact ? 'Full point.' : `${fmt(g.part)} of 1 point: ${g.hits} of ${g.k} right picked${g.wrongs ? `, ${g.wrongs} wrong pick${g.wrongs > 1 ? 's' : ''} subtracted` : ''}.`}</b>${optionFeedback(q, p)}${esc(q.why || '')}${unoff(q) ? `<div class="unc">Unverified answer: inferred from the study material.</div>` : ''}${q.recallNote ? `<div class="rn">Recall note: ${esc(q.recallNote)}</div>` : ''}</div>` : ''}
      ${exam
        ? `<div class="row"><button class="btn ghost" id="prev" ${i === 0 ? 'disabled' : ''}>← Previous</button><button class="btn" id="next">${i === qs.length - 1 ? 'Finish and mark' : 'Next question →'}</button></div>`
        : `<button class="btn" id="next">${shown ? (i === qs.length - 1 ? 'See results' : 'Next question →') : 'Check answer'}</button>`}
      <p class="foot">Press 1 to ${q.opts.length} to select · Enter to ${exam ? 'go on' : shown ? 'go on' : 'check'}</p>
    </div>`;
    fit();
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => toggle(+b.dataset.k));
    $('#next').onclick = next;
    if (exam) { $('#prev').onclick = () => { if (i > 0) { i--; render(); } }; tick(); }
  }
  function toggle(k) {
    if (!exam && checked[i]) return;
    const p = picks[i]; p.has(k) ? p.delete(k) : p.add(k); render();
  }
  function next() {
    if (exam) { if (i < qs.length - 1) { i++; render(); } else finish(); return; }
    if (!checked[i]) {
      checked[i] = true; const g = grade(qs[i], picks[i]); record(qs[i], g);
      done++; exact += g.exact ? 1 : 0; part += g.part; render(); return;
    }
    if (i < qs.length - 1) { i++; render(); } else finish();
  }
  function tick() {
    const el = $('#clock'); if (!el || !endAt) { if (el) el.textContent = 'Untimed'; return; }
    const left = Math.max(0, endAt - Date.now());
    const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
    el.textContent = `${m}:${String(s).padStart(2, '0')} left`;
    el.classList.toggle('low', left < 120000);
    if (left === 0) finish();
  }
  if (exam && minutes) timerId = setInterval(tick, 1000);
  function finish() {
    stopTimer(); keyHandler = null; document.body.classList.remove('quizmode');
    let ex = 0, pt = 0;
    const rows = qs.map((q, k) => {
      const g = grade(q, picks[k]);
      if (exam) record(q, g);
      ex += g.exact ? 1 : 0; pt += g.part;
      return { q, g, k };
    });
    const pct = pt / qs.length;
    logSession(label, qs.length, ex, pct);
    window.scrollTo(0, 0);
    app.innerHTML = `<div class="narrow"><div class="result">
      <div class="eyebrow">${esc(label)}</div>
      <div class="big">${Math.round(pct * 100)}%</div>
      <p class="lede" style="margin:0 auto 14px">score: ${fmt(pt)} of ${qs.length} points · ${ex} questions fully right</p>
      <span class="pass ${pct >= PASS ? 'y' : 'n'}">${pct >= PASS ? 'Above' : 'Below'} the 65% line</span>
      <p class="hint" style="margin-top:16px">Each question is worth 1 point. Every right option you pick adds its share, every wrong pick removes the same share, and a question bottoms out at 0.</p>
      </div>
      <div class="row"><button class="btn" id="again">Try these again</button><button class="btn ghost" id="wrongs">Redo the ones I missed</button></div>
      <div class="review">${rows.map(r => `<button class="item" data-k="${r.k}"><span class="dot ${r.g.exact ? 'y' : r.g.part >= .5 ? 'p' : 'n'}"></span><span style="flex:1;min-width:0">${esc(r.q.q)}</span><span class="mono" style="color:var(--muted)">${fmt(r.g.part)}</span></button>`).join('')}</div></div>`;
    $('#again').onclick = () => practice(list, label, exam, minutes);
    const miss = rows.filter(r => !r.g.exact).map(r => r.q);
    $('#wrongs').onclick = () => miss.length ? practice(miss, 'Missed from ' + label, false) : hub();
    app.querySelectorAll('.review .item').forEach(b => b.onclick = () => showOne(rows[+b.dataset.k].q, picks[+b.dataset.k]));
  }
  function showOne(q, p) {
    const right = new Set(q.correct);
    const box = document.createElement('div');
    box.className = 'why';
    box.innerHTML = `${chips(q)}<b>${esc(q.q)}</b>${questionFigure(q)}` + q.opts.map((o, k) => `<div style="color:${right.has(k) ? 'var(--ok)' : 'var(--muted)'}">${right.has(k) ? 'T' : 'F'} · ${esc(o)}${p.has(k) ? ' (you picked)' : ''}</div>`).join('') + optionFeedback(q, p) + `<div style="margin-top:8px">${esc(q.why || '')}</div>${q.recallNote ? `<div class="rn">Recall note: ${esc(q.recallNote)}</div>` : ''}`;
    app.querySelector('.review').prepend(box); window.scrollTo({ top: box.offsetTop - 90, behavior: 'smooth' });
  }
  keyHandler = e => {
    const q = qs[i];
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= q.opts.length) { e.preventDefault(); toggle(n - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); next(); }
    else if (exam && e.key === 'ArrowLeft' && i > 0) { i--; render(); }
  };
  render();
}

function mock() {
  nav('mock');
  const ak = BANK.filter(asked);
  app.innerHTML = `<div class="eyebrow">Exam mode</div><h1>Choose your mock.</h1>
  <p class="lede">Answers stay hidden until you finish, like the real test. The timings are practice settings. The practice benchmark is 65%.</p>
  <div class="mock">
    <button class="card hero" data-m="moodle"><span class="eyebrow">Real format</span><h3>Moodle-style mock</h3><p>10 questions across the four topics, with questions asked before drawn more often. Do the written part on paper.</p><span class="go">10 questions · 20 min<span>→</span></span></button>
    <button class="card" data-m="quick"><span class="eyebrow">Mixed</span><h3>Quick mock</h3><p>30 questions drawn evenly from every topic.</p><span class="go">30 questions · 30 min<span>→</span></span></button>
    <button class="card" data-m="asked"><span class="eyebrow">Repeats</span><h3>Asked before</h3><p>Questions repeated in the bank or marked as recollections.</p><span class="go">${ak.length} questions · ${Math.round(ak.length * 0.9)} min<span>→</span></span></button>
    <button class="card" data-m="all"><span class="eyebrow">Everything</span><h3>Whole bank</h3><p>Every scored question in Part 3.</p><span class="go">${BANK.length} questions · untimed<span>→</span></span></button>
  </div>
  <div class="custom"><h2>Custom mock</h2><p class="hint">Pick topics and how many questions.</p>
    ${TOPICS.map(t => `<label><input type="checkbox" id="ct_${t.id}" value="${t.id}" checked> ${esc(t.name)} <span class="count">${BANK.filter(q => q.topic === t.id).length}</span></label>`).join('')}
    <label style="margin-top:8px">Questions <input type="number" id="cn" value="25" min="5" max="${BANK.length}"> Minutes <input type="number" id="cm" value="25" min="0" max="180"></label>
    <button class="btn" id="cgo">Start custom mock</button></div>`;
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const m = b.dataset.m;
    if (m === 'quick') practice(spread(BANK, TOPICS.map(t => t.id), 30), 'Quick mock', true, 30);
    if (m === 'asked') practice(ak, 'Asked before', true, Math.round(ak.length * 0.9));
    if (m === 'all') practice(BANK, 'Whole bank', true, 0);
    if (m === 'moodle') practice(wspread(BANK, TOPICS.map(t => t.id), 10), 'Moodle-style mock', true, 20);
  });
  $('#cgo').onclick = () => {
    const ids = TOPICS.map(t => t.id).filter(id => $('#ct_' + id).checked);
    const n = Math.max(1, +$('#cn').value || 25), mins = +$('#cm').value || 0;
    if (!ids.length) return;
    practice(spread(BANK, ids, n), 'Custom mock', true, mins);
  };
}
function wpick(pool) {
  const s = store.get('q', {});
  const low = Math.min(...pool.map(q => timesDone(s, q)));
  const w = pool.map(q => timesDone(s, q) > low ? 0 : asked(q) ? 3 : 1);
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let k = 0; k < pool.length; k++) { if (!w[k]) continue; r -= w[k]; if (r <= 0) return pool.splice(k, 1)[0]; }
  return pool.splice(w.findLastIndex(x => x > 0), 1)[0];
}
function wspread(bank, ids, n) {
  const pools = shuffle(ids).map(id => bank.filter(q => q.topic === id));
  const out = [];
  while (out.length < n && pools.some(p => p.length)) pools.forEach(p => { if (p.length && out.length < n) out.push(wpick(p)); });
  return out;
}
function spread(bank, ids, n) {
  const pools = ids.map(id => fresh(bank.filter(q => q.topic === id)));
  const out = [];
  while (out.length < n && pools.some(p => p.length)) pools.forEach(p => { if (p.length && out.length < n) out.push(p.shift()); });
  return out;
}

function sheet() {
  nav('sheet');
  app.innerHTML = `<div class="narrow"><div class="eyebrow">Reference</div><h1>Cheat sheet.</h1>
  <p class="lede">Browse ${BANK.length} edited Midterm 3 questions with complete choices. “Unverified answer” marks an answer worked out from the study material.</p>
  <input class="search" id="s" placeholder="Search by question, term or ID, e.g. ascites, INR, q0215" autocomplete="off">
  <div class="sheet" id="list"></div></div>`;
  const draw = () => {
    const term = $('#s').value.trim().toLowerCase();
    const hits = BANK.filter(q => !term || (q.q + ' ' + q.src + ' ' + q.opts.join(' ') + ' ' + (q.why || '')).toLowerCase().includes(term));
    $('#list').innerHTML = hits.length ? hits.map(q => `<div class="item"><div class="qq">${inline(q)}${!q.scored ? '<span class="tagline">Review only</span>' : ''}${srcChip(q) ? `<span style="color:var(--muted)">${esc(srcChip(q))} · </span>` : ''}${esc(q.q)}</div>${questionFigure(q)}
      <ul>${q.opts.map((o, k) => `<li class="${q.scored ? (q.correct.includes(k) ? 'y' : 'n') : ''}">${esc(o)}</li>`).join('')}</ul>
      ${q.why ? `<div class="r">${esc(q.why)}</div>` : ''}${q.recallNote ? `<div class="r">Recall note: ${esc(q.recallNote)}</div>` : ''}</div>`).join('') : `<p class="empty">No question mentions “${esc(term)}”.</p>`;
  };
  $('#s').oninput = draw; draw();
}

function stats() {
  nav('stats');
  const s = store.get('q', {});
  const sessions = store.get('sessions', []);
  const seen = Object.keys(s).length;
  const tot = Object.values(s).reduce((a, r) => a + r.seen, 0);
  const acc = tot ? Object.values(s).reduce((a, r) => a + r.part, 0) / tot : 0;
  const weak = BANK.filter(q => s[q.id]).sort((a, b) => s[a.id].part / s[a.id].seen - s[b.id].part / s[b.id].seen).slice(0, 8);
  app.innerHTML = `<div class="narrow"><div class="eyebrow">Stats</div><h1>Your progress.</h1>
  <div class="stats"><div class="stat"><div class="n">${seen}/${BANK.length}</div><div class="l">questions answered</div></div>
  <div class="stat"><div class="n">${Math.round(acc * 100)}%</div><div class="l">average score per question</div></div>
  <div class="stat"><div class="n">${sessions.length}</div><div class="l">sessions finished</div></div></div>
  <div class="section-h"><span class="eyebrow">By topic</span></div>
  ${TOPICS.map(t => {
    const qs = BANK.filter(q => q.topic === t.id && s[q.id]);
    const n = qs.reduce((a, q) => a + s[q.id].seen, 0);
    const pc = n ? qs.reduce((a, q) => a + s[q.id].part, 0) / n : 0;
    return `<div class="tbar"><span>${esc(t.name)}</span><span class="track"><i style="width:${pc * 100}%"></i></span><span class="pc">${n ? Math.round(pc * 100) + '%' : 'none'}</span></div>`;
  }).join('')}
  <div class="section-h"><span class="eyebrow">Weakest questions</span></div>
  <div class="review">${weak.length ? weak.map(q => `<div class="item" style="cursor:default"><span style="flex:1;min-width:0">${esc(q.q)}</span><span class="mono" style="color:var(--muted)">${Math.round(s[q.id].part / s[q.id].seen * 100)}%</span></div>`).join('') : '<p class="empty">Answer a few questions and your weakest ones show up here.</p>'}</div>
  <div class="section-h"><span class="eyebrow">Recent sessions</span>${sessions.length ? '<button class="pill" id="reset">Reset stats</button>' : ''}</div>
  <div class="review">${sessions.length ? sessions.map(x => `<div class="item" style="cursor:default"><span style="flex:1">${esc(x.label)} <span style="color:var(--muted)">· ${new Date(x.at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</span></span><span class="mono">${Math.round(x.part * 100)}% · ${x.exact}/${x.n}</span></div>`).join('') : '<p class="empty">Finished topics and mocks will be listed here.</p>'}</div>
  <div id="confirm"></div></div>`;
  const r = $('#reset');
  if (r) r.onclick = () => {
    $('#confirm').innerHTML = `<div class="why"><b>Delete all your stats on this device?</b><div class="row"><button class="btn" id="yes">Delete stats</button><button class="btn ghost" id="no">Keep them</button></div></div>`;
    $('#yes').onclick = () => { store.set('q', {}); store.set('sessions', []); stats(); };
    $('#no').onclick = () => { $('#confirm').innerHTML = ''; };
  };
}

soids increases resistance to portal flow.","optionWhy":["Increased splanchnic inflow raises portal pressure when resistance to flow is already elevated.","Fibrosis and regenerative remodeling distort the vascular bed and increase intrahepatic resistance.","Isolated left-sided failure primarily causes pulmonary venous congestion. Right-sided venous congestion can raise hepatic venous pressure.","Dynamic constriction of hepatic sinusoids increases resistance to portal flow."],"src":"Test 3-all gathered.docx.pdf, p. 34 \u00b7 q1623","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1624","topic":"liver","q":"Plasmatic activity of cholinesterase is a diagnostic marker of","opts":["excretory capacity of the liver","detoxication function of the liver","hepatic proteosynthesis","cirrhotic remodelation of hepatic tissue"],"correct":[2],"why":"Hepatocytes synthesize plasma butyrylcholinesterase. Its activity can decline when hepatic synthetic function is impaired.","optionWhy":["Bilirubin handling and other markers of cholestasis give information about hepatic excretion.","Unlike some enzyme systems for drug metabolism, circulating butyrylcholinesterase activity is used here as a marker of protein synthesis.","Hepatocytes synthesize plasma butyrylcholinesterase. Its activity can decline when hepatic synthetic function is impaired.","Reduced activity can accompany cirrhosis, but it does not directly measure architectural remodeling or identify cirrhosis by itself."],"src":"Test 3-all gathered.docx.pdf, p. 34 \u00b7 q1624","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0022","topic":"liver","q":"Select correct statement\\s about pain in patients with acute pancreatitis","opts":["Pancreatic enzymes are one of the key factors, leading to development of pain","Pain is usually not severe and patients rarely need treatment with analgesic medicines","In the development of pain, prostaglandins are important","Pain irradiates to back","Usually pain becomes milder after diarrhea"],"correct":[0,2,3],"why":"Premature enzyme activation injures pancreatic tissue and triggers inflammation that contributes to pain. Prostaglandins released during inflammation sensitize pain fibers. Epigastric pain radiating to the back is a classic pattern in acute pancreatitis.","optionWhy":["Premature enzyme activation injures pancreatic tissue and triggers inflammation that contributes to pain.","Acute pancreatitis often causes severe persistent epigastric pain that requires analgesia.","Prostaglandins released during inflammation sensitize pain fibers.","Epigastric pain radiating to the back is a classic pattern in acute pancreatitis.","Diarrhea does not characteristically relieve the inflammatory pain of acute pancreatitis."],"src":"3rd test Lian.docx.pdf, p. 1 \u00b7 q0022","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0808","topic":"hemostasis","q":"A final common coagulation pathway involves:","opts":["Prothrombin formation","N-acetylation of vitamin A","Formation of the prothrombinase complex","Formation of fibrinogen","Degradation of factor XIII"],"correct":[2],"why":"Factor Xa and factor Va assemble on a phospholipid surface with calcium to form prothrombinase and generate thrombin.","optionWhy":["The common pathway consumes prothrombin by converting it into thrombin. The liver synthesizes prothrombin before coagulation is activated.","N-acetylation of vitamin A is not a step of coagulation. Vitamin K-dependent gamma-carboxylation is a separate process that occurs during synthesis of some factors.","Factor Xa and factor Va assemble on a phospholipid surface with calcium to form prothrombinase and generate thrombin.","Thrombin converts circulating fibrinogen into fibrin. Fibrinogen synthesis occurs mainly in the liver.","Thrombin activates factor XIII, which cross-links fibrin and stabilizes the clot."],"src":"Copy of Czech Ws was 3.pdf, p. 90 \u00b7 q0808","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0899","topic":"blood","q":"Choose the correct statement(s) about sideropenic anemia","opts":["It can be caused by chronic atrophic gastritis","May be caused by hereditary hemochromatosis","May be caused by chronic bleeding (often occult)","Associated with elevated ferritin levels","Atrophy of the mucous membrane in the oral cavity and dysphagia are among the symptoms"],"correct":[0,2,4],"why":"Gastric atrophy can reduce acid secretion, which impairs absorption of nonheme iron. Chronic blood loss depletes iron stores. Gastrointestinal blood loss can be occult. Iron deficiency can cause atrophic glossitis and, in Plummer\u2013Vinson syndrome, dysphagia from an esophageal web.","optionWhy":["Gastric atrophy can reduce acid secretion, which impairs absorption of nonheme iron.","Hereditary hemochromatosis causes excessive iron accumulation.","Chronic blood loss depletes iron stores. Gastrointestinal blood loss can be occult.","Ferritin generally falls as iron stores are depleted. Concurrent inflammation can raise ferritin and mask the deficiency.","Iron deficiency can cause atrophic glossitis and, in Plummer\u2013Vinson syndrome, dysphagia from an esophageal web."],"src":"Copy of Czech Ws was 3.pdf, p. 6 \u00b7 q0899","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0941","topic":"liver","q":"Elevated conjugated bilirubin, unconjugated bilirubin, AST, ALT, GGT in a 58-year-old adult are most likely to be signs of (choose 2 correct answers)","opts":["Cystic fibrosis","Acute obstruction of the bile duct","Alcoholic liver cirrhosis","Acute pancreatitis","Hepatitis C virus"],"correct":[2,4],"why":"Alcohol-related cirrhosis can impair bilirubin handling and raise both fractions, with aminotransferase and GGT elevations. Hepatitis C injures hepatocytes, elevating aminotransferases and sometimes disrupting bilirubin handling when disease is severe or advanced.","optionWhy":["Cystic fibrosis can affect the hepatobiliary system, but this vignette provides no other evidence of cystic fibrosis.","Bile duct obstruction tends to cause predominantly conjugated hyperbilirubinemia and a cholestatic enzyme pattern. Aminotransferases can also rise, particularly early in acute obstruction.","Alcohol-related cirrhosis can impair bilirubin handling and raise both fractions, with aminotransferase and GGT elevations.","Pancreatitis is assessed with clinical features and pancreatic enzymes. A biliary cause can also elevate liver tests, but this pattern alone does not point to pancreatitis.","Hepatitis C injures hepatocytes, elevating aminotransferases and sometimes disrupting bilirubin handling when disease is severe or advanced."],"src":"Copy of Czech Ws was 3.pdf, p. 436 \u00b7 q0941","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0913","topic":"liver","q":"The most common causes of acute liver failure in Europe are (choose 1 answer):","opts":["Acute autoimmune hepatitis","Acute hepatitis caused by hepatitis B or B+ Da acetaminophen (paracetamol) intoxication","Acute intoxication caused by consumption of Amanita phalloides mushrooms","Acute hepatitis caused by hepatitis A virus and hepatitis C virus","Acute hepatitis caused by hepatitis A virus and hepatitis E virus."],"correct":[1],"why":"The source translation merges the conjunction into \u201cB+ Da.\u201d The option lists acute HBV, including HBV with HDV, and paracetamol toxicity. Severe acute viral injury and toxic hepatocyte necrosis can both precipitate acute liver failure.","optionWhy":["Autoimmune hepatitis can present with acute liver failure. This question asks for the best answer among the supplied options.","The source translation merges the conjunction into \u201cB+ Da.\u201d The option lists acute HBV, including HBV with HDV, and paracetamol toxicity. Severe acute viral injury and toxic hepatocyte necrosis can both precipitate acute liver failure.","Amatoxins in death cap mushrooms can cause fulminant hepatic injury, but this is a less frequent cause than those emphasized by the question.","Hepatitis A can occasionally be fulminant. Acute hepatitis C rarely causes acute liver failure.","Hepatitis A and E can cause acute liver failure, but the option groups them without the toxic cause featured in the best answer."],"src":"Copy of Czech Ws was 3.pdf, p. 175 \u00b7 q0913","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0964","topic":"hemostasis","q":"Female patients with factor V Leyden mutation:","opts":["They have a higher risk of deep vein thrombosis","They have a lower risk of severe bleeding during childbirth","Have a higher risk of gastrointestinal bleeding","Have a higher risk of pulmonary embolism","They have a lower risk of acute myocardial infarction"],"correct":[0,3],"why":"Resistance to activated protein C prolongs factor Va activity and increases the risk of venous thrombosis. Venous thrombi can embolize to the pulmonary circulation, so pulmonary embolism risk rises as well.","optionWhy":["Resistance to activated protein C prolongs factor Va activity and increases the risk of venous thrombosis.","A handwritten mark is visible beside this choice. The variant alone does not reliably predict protection from severe obstetric hemorrhage.","Increased gastrointestinal bleeding is not a typical direct effect of factor V Leiden.","Venous thrombi can embolize to the pulmonary circulation, so pulmonary embolism risk rises as well.","The best-established association is with venous thromboembolism. Lower myocardial infarction risk is not an expected effect."],"src":"Selected.pdf, p. 54 \u00b7 q0964","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0847","topic":"hemostasis","q":"Disseminated intravascular coagulopathy","opts":["one of the important manifestations is thrombocytopenia","leads to thrombotic occlusions in the microcirculation in the late stages","can be manifested by shortening of aPTT","may be manifested by an increase in the level of plasma fibrinogen","may have a shortened or normal aPTT in the initial stages"],"correct":[0,2,4],"why":"Systemic coagulation activation consumes platelets and often lowers the platelet count. An acute-phase rise in factor VIII can shorten aPTT early. As coagulation factors are consumed, aPTT may subsequently prolong. Early in DIC, aPTT can be shortened or normal. A normal initial aPTT does not exclude evolving DIC.","optionWhy":["Systemic coagulation activation consumes platelets and often lowers the platelet count.","Microvascular thrombosis is an early feature and can persist. In the exam\u2019s staged model, factor and platelet consumption account for the later bleeding tendency.","An acute-phase rise in factor VIII can shorten aPTT early. As coagulation factors are consumed, aPTT may subsequently prolong.","Consumption tends to lower fibrinogen. Inflammatory synthesis can maintain or raise the measured concentration, so a single result may miss ongoing consumption.","Early in DIC, aPTT can be shortened or normal. A normal initial aPTT does not exclude evolving DIC."],"src":"Selected.pdf, p. 81 \u00b7 q0847","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1625","topic":"hemostasis","q":"Choose the correct statement about hemophilia A.","opts":["PT is extended","APTT is prolonged","It is a disease linked to the Y chromosome, so only men can have it","Petechial hemorrhage and purpura are typical","If the patient has approximately 10% factor VIII, this indicates a high risk of spontaneous bleeding"],"correct":[1],"why":"Factor VIII deficiency impairs intrinsic tenase and can prolong aPTT.","optionWhy":["Isolated factor VIII deficiency affects the intrinsic pathway. PT usually stays normal.","Factor VIII deficiency impairs intrinsic tenase and can prolong aPTT.","The F8 gene is on the X chromosome. Women and girls can also have clinically significant factor VIII deficiency.","Hemarthroses and deep muscle bleeding are characteristic. Petechiae are more typical of platelet disorders.","An activity of 10% is in the mild range. Frequent spontaneous bleeding is more characteristic of severe deficiency below 1%."],"src":"Copy of Czech Ws was 3.pdf, p. 211 \u00b7 q1625","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0843","topic":"hemostasis","q":"Tissue factor","opts":["is an activator of fibrinolysis","is expressed on the endothelium under physiological conditions","initiates, in a complex with negatively charged phospholipids, the external pathway of activation of the plasma coagulation system","is expressed during inflammation on activated monocytes"],"correct":[2,3],"why":"Membrane-bound tissue factor complexes with factor VIIa to activate factors X and IX. Anionic phospholipid surfaces support the reaction. Inflammatory signaling can induce tissue factor on monocytes and contribute to systemic coagulation activation.","optionWhy":["Tissue factor initiates coagulation. Tissue plasminogen activator instead promotes fibrinolysis by generating plasmin.","Quiescent vascular endothelium generally does not expose active tissue factor to the circulating blood. Vessel injury can expose tissue factor in underlying tissues.","Membrane-bound tissue factor complexes with factor VIIa to activate factors X and IX. Anionic phospholipid surfaces support the reaction.","Inflammatory signaling can induce tissue factor on monocytes and contribute to systemic coagulation activation."],"src":"Selected.pdf, p. 43 \u00b7 q0843","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0959","topic":"blood","q":"When examining blood laboratories, in patients with a moderate gram-positive bacterial infection (staphylococci, streptococci, pneumococci), it is usually assumed:","opts":["Agranulocytosis","Lymphocytosis","Polycyt\u00e9mie","Eosinofilie","Neutrophia"],"correct":[4],"why":"Neutrophia is the scan\u2019s wording for neutrophilia. Acute pyogenic bacterial infections commonly increase circulating neutrophils.","optionWhy":["Agranulocytosis is a severe depletion of granulocytes and predisposes to infection. It is not the expected response to moderate pyogenic infection.","Lymphocytosis is more commonly associated with viral infections and certain exceptions such as pertussis.","Polycyt\u00e9mie means an increased red cell concentration or mass. The typical response here is a change in the white cell differential.","Eosinofilie means eosinophilia, which is more typical of allergic responses and certain parasitic infections.","Neutrophia is the scan\u2019s wording for neutrophilia. Acute pyogenic bacterial infections commonly increase circulating neutrophils."],"src":"Selected.pdf, p. 48 \u00b7 q0959","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1627","topic":"immunity","q":"Choose the correct statement(s).","opts":["Bechterev's disease (ankylosing spondylitis) has a high association with a specific HLA type","MHC II molecules are expressed on antigen presenting cells","MHC I molecules are expressed on all nucleated somatic cells.","MHC class I molecules are found on the surface of erythrocytes.","MHC class I molecules are found only on the surface of cells of the immune system."],"correct":[0,1,2],"why":"Ankylosing spondylitis is strongly associated with HLA-B27. The checkbox is empty in this scan, but the association supports including this choice. Professional antigen-presenting cells express MHC class II and present peptide antigens to CD4 T cells. MHC class I is broadly expressed on nucleated cells and presents intracellular peptides to CD8 T cells.","optionWhy":["Ankylosing spondylitis is strongly associated with HLA-B27. The checkbox is empty in this scan, but the association supports including this choice.","Professional antigen-presenting cells express MHC class II and present peptide antigens to CD4 T cells.","MHC class I is broadly expressed on nucleated cells and presents intracellular peptides to CD8 T cells.","Mature erythrocytes lack the usual MHC class I expression seen on nucleated cells.","MHC class I is broadly expressed on nucleated cells in many tissues, including cells outside the immune system."],"src":"\u05ea\u05de\u05d5\u05e0\u05d5\u05ea \u05e6'\u05db\u05d9\u05dd \u05de\u05ea\u05d5\u05e7\u05df.pdf, p. 6 \u00b7 q1627","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1628","topic":"liver","q":"Ascites:","opts":["It is accompanied by reduced secretion of aldosterone","May cause shortness of breath in the patient","It may be due to decreased Na resorption in the proximal tubules","It is accompanied by water and sodium retention","May be accompanied by dilutional hyponatremil"],"correct":[1,3,4],"why":"Large-volume ascites can push the diaphragm upward and reduce lung expansion. Renal retention of sodium and water contributes to extracellular fluid expansion and ascites. The scan\u2019s last word reads hyponatremil, meaning hyponatremia. Nonosmotic vasopressin release can retain proportionally more water than sodium.","optionWhy":["In cirrhosis, decreased effective arterial filling activates the renin\u2013angiotensin\u2013aldosterone system, which favors sodium retention.","Large-volume ascites can push the diaphragm upward and reduce lung expansion.","Decreased sodium reabsorption promotes sodium excretion. Cirrhotic ascites is associated with avid renal sodium retention.","Renal retention of sodium and water contributes to extracellular fluid expansion and ascites.","The scan\u2019s last word reads hyponatremil, meaning hyponatremia. Nonosmotic vasopressin release can retain proportionally more water than sodium."],"src":"Selected.pdf, p. 8 \u00b7 q1628","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1629","topic":"immunity","q":"They are used in the pathogenesis of type 4 allergies","opts":["circulating immune complexes penetrating the extravascular space","IgM and Ig atively preserved aPTT makes a vitamin K antagonist plausible. The arrhythmia history makes medication reconciliation particularly relevant.","A factor VIII inhibitor typically prolongs aPTT and can cause new spontaneous bleeding. The vignette does not describe this pattern.","Vitamin K deficiency can raise INR, but the vignette supplies no antibiotic exposure or evidence for a specific protein C deficiency.","The vignette describes no active bleeding, instability, or other evidence of imminent life-threatening hemorrhage.","The patient reports no related symptoms. The INR warrants explanation, but an abnormal laboratory value alone does not establish acute clinical bleeding."],"src":"Selected.pdf, p. 9 \u00b7 q1631","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1632","topic":"blood","q":"Aplastic anemia:","opts":["It is mostly an acquired disease that arises from an unclear cause","Parvovirus B19 infection accounts for 90-95% of severe aplastic anemia","It can develop with the administration of certain antibiotics, eg chloramphenicol","Patients do not require infusion therapy","During antitumor treatment, it is mostly transient in nature"],"correct":[0,2,4],"why":"Many cases of acquired aplastic anemia have no identifiable trigger. Immune-mediated marrow failure is a common mechanism. Chloramphenicol is a classic rare trigger of idiosyncratic aplastic anemia. This choice refers to reversible marrow suppression during antitumor treatment. The matching Moodle question includes this answer, though expected chemotherapy-induced myelosuppression is clinically distinguished from acquired aplastic anemia.","optionWhy":["Many cases of acquired aplastic anemia have no identifiable trigger. Immune-mediated marrow failure is a common mechanism.","Parvovirus B19 can cause a transient aplastic crisis or pure red cell aplasia. It does not explain most cases of severe aplastic anemia.","Chloramphenicol is a classic rare trigger of idiosyncratic aplastic anemia.","Patients with severe cytopenias can require red cell or platelet transfusion support.","This choice refers to reversible marrow suppression during antitumor treatment. The matching Moodle question includes this answer, though expected chemotherapy-induced myelosuppression is clinically distinguished from acquired aplastic anemia."],"src":"Selected.pdf, p. 5 \u00b7 q1632","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1633","topic":"blood","q":"It applies to ferritin","opts":["is not present in the blood","when there is enough iron, it is present in the reticuloendothelial system","is a protein in which the storage form of iron is stored","binds iron in ferroform"],"correct":[1,2],"why":"Macrophages of the reticuloendothelial system recycle and store iron, including in ferritin. Ferritin is a protein shell that safely stores iron in a mineral core.","optionWhy":["Ferritin is predominantly intracellular, but a small amount circulates and can be measured in serum.","Macrophages of the reticuloendothelial system recycle and store iron, including in ferritin.","Ferritin is a protein shell that safely stores iron in a mineral core.","Ferritin takes up ferrous iron and oxidizes it. The stored core is predominantly ferric iron."],"src":"Selected.pdf, p. 14 \u00b7 q1633","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1635","topic":"hemostasis","q":"Leiden mutation","opts":["leads to thrombophlebitis in carriers","chasers have an extended Quick test","carriers have a shortened aPTT test","leads to prolonged bleeding"],"correct":[0],"why":"Factor V Leiden impairs inactivation of factor Va by activated protein C and increases the risk of venous thrombosis. Carriers do not inevitably develop thrombophlebitis.","optionWhy":["Factor V Leiden impairs inactivation of factor Va by activated protein C and increases the risk of venous thrombosis. Carriers do not inevitably develop thrombophlebitis.","The translation read iary cirrhosis is the older name for primary biliary cholangitis. It is an autoimmune disorder targeting small intrahepatic bile ducts."],"src":"Selected.pdf, p. 13 \u00b7 q1639","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1640","topic":"liver","q":"The pathogenesis of hepatic encephalopathy does not involve:","opts":["Phenol","Merkaptany","Uric acid","Ammonia"],"correct":[2],"why":"Uric acid is a purine breakdown product and does not have an established role in the mechanism tested here.","optionWhy":["Phenolic compounds have been proposed as contributors among gut-derived substances that can accumulate when hepatic detoxification is impaired.","Merkaptany refers to mercaptans, sulfur-containing compounds historically proposed to contribute to hepatic encephalopathy.","Uric acid is a purine breakdown product and does not have an established role in the mechanism tested here.","Ammonia accumulates when hepatic detoxification fails or portal blood bypasses the liver. Astrocytic conversion to glutamine contributes to osmotic and neurologic disturbances."],"src":"Selected.pdf, p. 18 \u00b7 q1640","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1641","topic":"immunity","q":"Cellular immunity is not involved in defense against","opts":["tumors","toxins","viruses","mold"],"correct":[1],"why":"Antibodies neutralize extracellular toxins by binding them and blocking their interaction with host cells.","optionWhy":["Cytotoxic lymphocytes can recognize and kill cells expressing tumor antigens.","Antibodies neutralize extracellular toxins by binding them and blocking their interaction with host cells.","Cytotoxic T cells recognize viral peptides presented on MHC class I and kill infected cells.","Phagocytes and T-cell responses contribute to defense against fungi, including molds."],"src":"YE.pdf.pdf, p. 42 \u00b7 q1641","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1642","topic":"immunity","q":"Cellular immunity is not involved in defense against","opts":["toxins","mold","tumors","viruses"],"correct":[0],"why":"Antibodies directly neutralize extracellular toxins and can prevent them from binding their cellular targets.","optionWhy":["Antibodies directly neutralize extracellular toxins and can prevent them from binding their cellular targets.","Cellular defenses include antifungal responses of phagocytes and T cells.","CD8 T cells and natural killer cells can eliminate susceptible tumor cells.","Cytotoxic T cells control many viral infections by killing infected cells."],"src":"YE.pdf.pdf, p. 117 \u00b7 q1642","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1644","topic":"blood","q":"Microcytic and/or hypochromic anemias include:","opts":["Folic acid deficiency anemia","Sideroblastic anemia","Pernicious anemia","Iron deficiency anemia","Anemia due to lead poisoning"],"correct":[1,3,4],"why":"Defective heme synthesis can produce hypochromic and microcytic red cells in sideroblastic anemia. Cell size varies with the underlying cause. Insufficient iron limits hemoglobin synthesis and commonly produces small, hypochromic red cells. Lead inhibits enzymes in the heme synthesis pathway and can cause microcytic or hypochromic anemia.","optionWhy":["Folate deficiency impairs DNA synthesis and typically causes megaloblastic macrocytic anemia.","Defective heme synthesis can produce hypochromic and microcytic red cells in sideroblastic anemia. Cell size varies with the underlying cause.","Pernicious anemia causes vitamin B12 deficiency and typically produces a megaloblastic macrocytic pattern.","Insufficient iron limits hemoglobin synthesis and commonly produces small, hypochromic red cells.","Lead inhibits enzymes in the heme synthesis pathway and can cause microcytic or hypochromic anemia."],"src":"Selected.pdf, p. 50 \u00b7 q1644","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1645","topic":"liver","q":"Select one or more of the following are involved in the formation of ascites in liver failure:","opts":["hyperbilirubinemia","increased blood flow through the splanchnic area","secondary disorder of aldosterone metabolism","relative hyperalbuminemia during paradoxical dehydration"],"correct":[1,2],"why":"Splanchnic vasodilation increases portal inflow. With high intrahepatic resistance, this contributes to portal hypertension and fluid filtration. Reduced effective arterial filling promotes aldosterone-mediated renal sodium retention. Water follows the retained sodium.","optionWhy":["Hyperbilirubinemia can indicate impaired hepatic function or cholestasis, but bilirubin itself does not drive peritoneal fluid accumulation.","Splanchnic vasodilation increases portal inflow. With high intrahepatic resistance, this contributes to portal hypertension and fluid filtration.","Reduced effective arterial filling promotes aldosterone-mediated renal sodium retention. Water follows the retained sodium.","Low plasma albumin can reduce oncotic pressure and contribute to ascites. Increased albumin would favor retention of fluid in the vascular space."],"src":"Selected.pdf, p. 49 \u00b7 q1645","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1646","topic":"blood","q":"Impaired iron metabolism in anemia of chronic disease is caused by (2)","opts":["increased production of hepcidin in the liver","accelerated transfer of iron from hepatocytes to bile","slowed iron export from macrophages","lack of iron in food"],"correct":[0,2],"why":"Inflammatory signaling, especially IL-6, increases hepatic hepcidin and restricts plasma iron availability. Hepcidin reduces ferroportin on macrophages, trapping recycled iron and limiting its delivery to the marrow.","optionWhy":["Inflammatory signaling, especially IL-6, increases hepatic hepcidin and restricts plasma iron availability.","The characteristic mechanism is reduced ferroportin-mediated export, not increased biliary loss.","Hepcidin reduces ferroportin on macrophages, trapping recycled iron and limiting its delivery to the marrow.","Poor dietary intake can cause absolute iron deficiency. In anemia of chronic disease, iron can be present in stores but unavailable for erythropoiesis."],"src":"Selected.pdf, p. 45 \u00b7 q1646","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1647","topic":"hemostasis","q":"What are the most common hereditary hypocoagulants malfunctions (choose 1 answer)?","opts":["Factor V mutation (Leyden)","Hemophilia A and von Willebrand disease","Thrombocytopenia associated with hypersplenism","Coagulopathy related to cirrhosis","Thrombocytopenia associated with leukemia"],"correct":[1],"why":"Both are classic inherited bleeding disorders. Hemophilia A involves factor VIII deficiency, while von Willebrand disease impairs platelet adhesion and can lower factor VIII activity.","optionWhy":["Factor V Leiden confers resistance to activated protein C and increases venous thrombosis risk.","Both are classic inherited bleeding disorders. Hemophilia A involves factor VIII deficiency, while von Willebrand disease impairs platelet adhesion and can lower factor VIII activity.","Hypersplenism can lower circulating platelets through splenic sequestration. This is an acquired mechanism in the situation described.","Cirrhosis alters clotting factor synthesis and can affect platelets. It is an acquired disorder.","Leukemia can disrupt normal marrow production and lower platelet counts. This is not a common inherited bleeding disorder."],"src":"Selected.pdf, p. 46 \u00b7 q1647","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1648","topic":"blood","q":"Complications of transfusion are not included","opts":["risk of infection","risk of overloading the organism by steel","risk of increased bleeding","risk of lung damage"],"correct":[2],"why":"Increased bleeding is the intended exception for routine transfusion in this scan. Massive transfusion can cause dilutional coagulopathy, so this option is context-dependent.","optionWhy":["Transfusion-transmitted infections are recognized complications, although screening reduces their frequency.","The translation reads \u201csteel,\u201d referring here to iron. Repeated red cell transfusions can cause iron overload.","Increased bleeding is the intended exception for routine transfusion in this scan. Massive transfusion can cause dilutional coagulopathy, so this option is context-dependent.","Transfusion-related acute lung injury is a recognized complication that can cause acute hypoxemia and pulmonary edema."],"src":"Selected.pdf, p. 44 \u00b7 q1648","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1649","topic":"blood","q":"Inefficient hematopoiesis (inefficient erythropoiesis) is part of the pathogenesis","opts":["myelodysplastic syndrome","neonatal anemia","erythropoietin deficiency anemia","megaloblastic anemia"],"correct":[0,3],"why":"Dysplastic marrow precursors fail to mature efficiently, contributing to peripheral cytopenias. Vitamin B12 or folate deficiency impairs DNA synthesis, so many megaloblastic precursors fail to mature and die in the marrow.","optionWhy":["Dysplastic marrow precursors fail to mature efficiently, contributing to peripheral cytopenias.","Neonatal anemia has several causes. Physiologic anemia of infancy primarily reflects reduced erythropoietin after birth and shorter red cell survival.","Erythropoietin deficiency reduces stimulation of red cell production. Intramedullary loss from defective maturation is a different mechanism.","Vitamin B12 or folate deficiency impairs DNA synthesis, so many megaloblastic precursors fail to mature and die in the marrow."],"src":"Selected.pdf, p. 47 \u00b7 q1649","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1650","topic":"liver","q":"Choose the correct statement about jaundice","opts":["In hepatic jaundice, the urine is dark and we detect urobilinogen and bilirubin there","Hemolytic icterus can occur with extensive hematomas","The most common cause of neonatal jaundice is Crigler-Najjar syndrome","In posthepatic jaundice with complete obstruction, the urine is dark and we demonstrate urobilinogen and bilirubin there","unconjugated bilirubin predominates in Gilbert's syndrome"],"correct":[0,1,4],"why":"Conjugated bilirubin can reach urine in hepatocellular injury. Urinary urobilinogen can still be present when some bile reaches the intestine. Breakdown of red cells within a large hematoma can increase the unconjugated bilirubin load. Reduced UGT1A1 activity in Gilbert syndrome limits conjugation and causes predominantly unconjugated hyperbilirubinemia.","optionWhy":["Conjugated bilirubin can reach urine in hepatocellular injury. Urinary urobilinogen can still be present when some bile reaches the intestine.","Breakdown of red cells within a large hematoma can increase the unconjugated bilirubin load.","Crigler\u2013Najjar syndrome is rare. Physiologic neonatal jaundice commonly reflects increased bilirubin production and immature conjugation.","Conjugated bilirubin darkens urine, but complete obstruction prevents bilirubin from reaching intestinal bacteria, so urinary urobilinogen falls or disappears.","Reduced UGT1A1 activity in Gilbert syndrome limits conjugation and causes predominantly unconjugated hyperbilirubinemia."],"src":"Selected.pdf, p. 40 \u00b7 q1650","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1651","topic":"liver","q":"It is not used in the pathogenesis of hepatic encephalopathy","opts":["anastomosis","ammonia","bleeding into the digestive tract","urea"],"correct":[3],"why":"The hepatic urea cycle converts ammonia into urea for excretion. Urea itself is not the principal neurotoxin in hepatic encephalopathy.","optionWhy":["The parallel scan specifies a portocaval anastomosis. Shunting allows intestinal blood to bypass hepatic detoxification.","Impaired hepatic ammonia clearance and portosystemic shunting contribute to neurotoxicity.","Digested blood supplies nitrogen to intestinal bacteria, increasing ammonia production and potentially precipitating encephalopathy.","The hepatic urea cycle converts ammonia into urea for excretion. Urea itself is not the principal neurotoxin in hepatic encephalopathy."],"src":"Selected.pdf, p. 38 \u00b7 q1651","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1652","topic":"liver","q":"It is not used in the pathogenesis of hepatic encephalopathy","opts":["ammonia","portocaval anastomoses","bleeding into the digestive tract","urea"],"correct":[3],"why":"Urea is the product of hepatic ammonia detoxification. It is not the contributor tested in this question.","optionWhy":["Ammonia can accumulate and disrupt astrocyte function, contributing to hepatic encephalopathy.","Portocaval shunting lets portal blood bypass the liver, reducing clearance of gut-derived compounds.","Gastrointestinal bleeding can increase the nitrogen load available for intestinal ammonia production.","Urea is the product of hepatic ammonia detoxification. It is not the contributor tested in this question."],"src":"Selected.pdf, p. 39 \u00b7 q1652","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1653","topic":"immunity","q":"Choose the correct statement(s) about disorders of the immune system","opts":["Selective IgA deficiency is an example of secondary immunodeficiency","Eosinophilia is common in allergy","Bradykinin and leukotrienes are important components in the pathogenesis of the type I hypersensitivity reaction","Malnutrition can cause secondary immunodeficiency","HIV infection primarily damages neutrophils"],"correct":[1,2,3],"why":"Type 2 cytokines, especially IL-5, promote eosinophil production and recruitment in many allergic disorders. Leukotrienes released by activated mast cells contribute to bronchoconstriction, mucus secretion and vascular permeability. Bradykinin also promotes permeability, although the classic immediate IgE-mediated mediator is histamine. Malnutrition is an acquired condition that can impair immune responses, making it a cause of secondary immunodeficiency.","optionWhy":["Selective IgA deficiency is classically a primary antibody deficiency.","Type 2 cytokines, especially IL-5, promote eosinophil production and recruitment in many allergic disorders.","Leukotrienes released by activated mast cells contribute to bronchoconstriction, mucus secretion and vascular permeability. Bradykinin also promotes permeability, although the classic immediate IgE-mediated mediator is histamine.","Malnutrition is an acquired condition that can impair immune responses, making it a cause of secondary immunodeficiency.","HIV primarily targets CD4-expressing cells, especially helper T cells."],"src":"Selected.pdf, p. 42 \u00b7 q1653","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1654","topic":"hemostasis","q":"Can a boy have hemophilia if his parents do not have clinical manifestations of the disease?","opts":["No, because it is a hereditary disorder","Yes, because the severity of the disorder increases with each new generation","Yes, because it may have a new mutation","Yes, because the mother can be heterozygous and have no signs of hemophilia","No, because both his parents are healthy"],"correct":[2,3],"why":"A de novo variant in F8 or F9 can cause hemophilia without a known family history. A heterozygous mother can be asymptomatic and transmit the affected X chromosome to a son.","optionWhy":["An X-linked variant can pass from an asymptomatic carrier to her son.","Hemophilia does not characteristically show genetic anticipation. Severity depends largely on residual factor activity.","A de novo variant in F8 or F9 can cause hemophilia without a known family history.","A heterozygous mother can be asymptomatic and transmit the affected X chromosome to a son.","Unaffected parents do not exclude an inherited carrier allele or a new variant."],"src":"Selected.pdf, p. 55 \u00b7 q1654","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1655","topic":"blood","q":"Allogeneic bone marrow transplantation includes","opts":["transplantation of cells of a relative","transplantation of own cells","transplantation of cells of another animal species","transplantation of cells of an unrelated person"],"correct":[0,3],"why":"A genetically distinct relative can provide allogeneic marrow. An unrelated human donor can provide allogeneic marrow. HLA matching helps reduce immunologic complications.","optionWhy":["A genetically distinct relative can provide allogeneic marrow.","Transplanting a person\u2019s own cells is autologous transplantation.","Cells from another species would be a xenogeneic graft.","An unrelated human donor can provide allogeneic marrow. HLA matching helps reduce immunologic complications."],"src":"Selected.pdf, p. 56 \u00b7 q1655","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1656","topic":"hemostasis","q":"After an acute respiratory infection of a 39-year-old male patient, the laboratory examination showed: 80*10^9 platelets, INR 1.1, aPPT 28 sec, Duke bleeding time 4 min 30 sec. The patient is most likely to:","opts":["He acquired the disorder hemophilia A due to the formation of antibodies against fVIII","He is deficient in vitamin K due to antibiotic treatment","He must be hospitalized in the ICU for a high risk of life-threatening bleeding","Is the mother heterozygous for hemophilia A or B","Most likely, he has no clinical manifestations of hemostasis disorders"],"correct":[4],"why":"Moderate isolated thrombocytopenia can occur without clinical bleeding, particularly with otherwise preserved coagulation tests.","optionWhy":["Acquired factor VIII inhibitors typically prolong aPTT. The result here does not support that pattern.","Vitamin K deficiency commonly prolongs prothrombin time and elevates INR. The INR in the vignette is near normal.","This platelet count alone does not establish imminent life-threatening bleeding, and no severe active bleeding is described.","These test results do not establish maternal carrier status. Hemophilia A or B typically affects the intrinsic pathway.","Moderate isolated thrombocytopenia can occur without clinical bleeding, particularly with otherwise preserved coagulation tests."],"src":"Selected.pdf, p. 58 \u00b7 q1656","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1657","topic":"immunity","q":"Which of the following diseases has an autoimmune origin?","opts":["Hemophilia","Systemic lupus erythematosus","Hashimoto's thyroiditis","Down syndrome","Crohn's disease"],"correct":[1,2],"why":"Lupus is a systemic autoimmune disease with autoantibody production and immune-complex injury. Hashimoto thyroiditis results from autoimmune injury to thyroid tissue.","optionWhy":["The usual hereditary hemophilias result from variants affecting factor VIII or IX. Acquired autoimmune hemophilia is a distinct condition.","Lupus is a systemic autoimmune disease with autoantibody production and immune-complex injury.","Hashimoto thyroiditis results from autoimmune injury to thyroid tissue.","Down syndrome results from an extra copy of chromosome 21 material.","Crohn\u2019s disease is an immune-mediated inflammatory bowel disease involving dysregulated responses to intestinal microbes. Unlike lupus and Hashimoto thyroiditis, it is not a classic autoantigen-defined autoimmune disorder. The scan shows this option selected, but no grading feedback."],"src":"Selected.pdf, p. 59 \u00b7 q1657","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1658","topic":"hemostasis","q":"Which laboratory parameter is LEAST important for the diagnosis of disseminated intravascular coagulation syndrome?","opts":["Prothrombin Time (PT)","Albumin concentration","D-dimery","Fibrinogen","Platelet count"],"correct":[1],"why":"Albumin is not part of standard DIC scoring. It can reflect hepatic synthesis, inflammation or other conditions.","optionWhy":["PT can prolong as clotting factors are consumed and is part of standard DIC scoring.","Albumin is not part of standard DIC scoring. It can reflect hepatic synthesis, inflammation or other conditions.","D-dimery refers to D-dimers, which rise as cross-linked fibrin is broken down.","Fibrinogen may fall through consumption. Its trend can be informative even when an initial value is normal.","Platelet consumption can cause thrombocytopenia. A falling platelet count supports evolving DIC in the appropriate clinical context."],"src":"Selected.pdf, p. 61 \u00b7 q1658","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1659","topic":"liver","q":"It does NOT belong to the manifestations of decompensated liver cirrhosis","opts":["dehydration","Jaundice","encephalopathy","prolonged prothrombin time"],"correct":[0],"why":"Dehydration may coexist or precipitate complications, but is not a typical manifestation of decompensation. Sodium and water retention commonly contribute to edema and ascites.","optionWhy":["Dehydration may coexist or precipitate complications, but is not a typical manifestation of decompensation. Sodium and water retention commonly contribute to edema and ascites.","Impaired bilirubin handling can cause jaundice with decompensated liver disease.","Impaired detoxification and portosystemic shunting can cause hepatic encephalopathy.","Reduced hepatic production of clotting factors can prolong prothrombin time."],"src":"Selected.pdf, p. 62 \u00b7 q1659","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1660","topic":"blood","q":"Hereditary hemochromatosis is caused by","opts":["excessive absorption of iron in the duodenum","liver disorder with reduced transfer of iron into bile","accelerated breakdown of erythrocytes","a disorder of urinary iron excretion"],"correct":[0],"why":"In common hereditary hemochromatosis, inadequate hepcidin signaling allows excess ferroportin-mediated iron export from duodenal enterocytes into blood.","optionWhy":["In common hereditary hemochromatosis, inadequate hepcidin signaling allows excess ferroportin-mediated iron export from duodenal enterocytes into blood.","The main defect is loss of regulation of intestinal absorption. Biliary iron excretion is not the principal mechanism.","Red cell breakdown recycles existing iron. Accelerated breakdown does not explain the primary increase in iron absorption.","The body has no major regulated urinary route for eliminating iron. Excess uptake drives iron accumulation."],"src":"Selected.pdf, p. 63 \u00b7 q1660","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1661","topic":"hemostasis","q":"Manifestations of disorders of primary hemostasis Do not include:","opts":["Hematuria","Epistaxis","Enteroragie","Bleeding into the joints","Petechiae and ecchymoses"],"correct":[3],"why":"Hemarthrosis is characteristic of secondary hemostatic disorders such as severe factor VIII or IX deficiency.","optionWhy":["Urinary tract bleeding can occur in bleeding disorders, including some platelet disorders. It is less specific than the skin or nasal findings.","Epistaxis is a classic mucosal manifestation of impaired platelet plug formation.","Enteroragie refers to intestinal bleeding, which can occur with impaired primary hemostasis.","Hemarthrosis is characteristic of secondary hemostatic disorders such as severe factor VIII or IX deficiency.","Small cutaneous bleeds and bruising commonly occur with low platelet counts or impaired platelet function."],"src":"Copy of Czech Ws was 3.pdf, p. 27 \u00b7 q1661","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1662","topic":"hemostasis","q":"Manifestations of disorders of primary hemostasis They do NOT include (1):","opts":["Petechiae and ecchymoses","Enteroragie","Bleeding into the joints","Hematuria","Epistaxis"],"correct":[2],"why":"Bleeding into joints is characteristic of severe coagulation factor deficiency, particularly hemophilia A or B.","optionWhy":["Petechiae and easy bruising are typical when the platelet plug is impaired.","Intestinal bleeding is a mucosal bleed and can occur with primary hemostatic disorders.","Bleeding into joints is characteristic of severe coagulation factor deficiency, particularly hemophilia A or B.","Hematuria can occur with several bleeding disorders and is not the best exception here.","Nosebleeds are a typical mucosal manifestation of impaired primary hemostasis."],"src":"YE.pdf.pdf, p. 141 \u00b7 q1662","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1663","topic":"blood","q":"Manifest sideropenic anemia will not manifest itself","opts":["by lowering the hemoglobin level","by lowering the serum iron level","by lowering ferritin levels","macrocytosis"],"correct":[3],"why":"Established iron deficiency classically produces microcytosis. Macrocytosis suggests an additional or alternative cause, such as vitamin B12 or folate deficiency.","optionWhy":["Iron deficiency restricts hemoglobin synthesis. Once anemia is established, the hemoglobin concentration falls.","Serum iron commonly falls as less iron is available to circulating transferrin.","Ferritin usually falls as storage iron is depleted, although concurrent inflammation can raise it.","Established iron deficiency classically produces microcytosis. Macrocytosis suggests an additional or alternative cause, such as vitamin B12 or folate deficiency."],"src":"Selected.pdf, p. 60 \u00b7 q1663","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1664","topic":"blood","q":"Choose the correct statement(s) about macrocytic anemia","opts":["Their symptom may be subicterus","They can be caused by chronic autoimmune gastritis","They are usually caused by lack of Fe","May be caused by ileal resection (due to decreased Fe reabsorption)","May be caused by alcoholism"],"correct":[0,1,4],"why":"Ineffective erythropoiesis in megaloblastic anemia can increase unconjugated bilirubin and cause mild jaundice. Autoimmune gastritis can reduce intrinsic factor, impair vitamin B12 absorption, and cause megaloblastic anemia. Alcohol can cause macrocytosis directly and can also contribute through folate deficiency or liver disease.","optionWhy":["Ineffective erythropoiesis in megaloblastic anemia can increase unconjugated bilirubin and cause mild jaundice.","Autoimmune gastritis can reduce intrinsic factor, impair vitamin B12 absorption, and cause megaloblastic anemia.","Iron deficiency usually produces microcytosis once established.","Terminal ileal resection can cause macrocytosis through vitamin B12 malabsorption. The stated iron mechanism is incorrect.","Alcohol can cause macrocytosis directly and can also contribute through folate deficiency or liver disease."],"src":"Selected.pdf, p. 66 \u00b7 q1664","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1665","topic":"hemostasis","q":"Acquired vasculopathies include:","opts":["Glanzman's thrombasthenia","Marfan syndrome","Henoch-Sch\u00f6nlein purpura","Cushing's syndrome","Ehlers-Danlos syndrome"],"correct":[2,3],"why":"Henoch\u2013Sch\u00f6nlein purpura, now called IgA vasculitis, is an acquired small-vessel vasculitis. Chronic glucocorticoid excess can cause skin thinning and loss of support around small vessels, leading to easy bruising.","optionWhy":["Glanzmann thrombasthenia is usually an inherited platelet aggregation defect involving glycoprotein IIb/IIIa.","Marfan syndrome is an inherited connective tissue disorder associated with FBN1 variants.","Henoch\u2013Sch\u00f6nlein purpura, now called IgA vasculitis, is an acquired small-vessel vasculitis.","Chronic glucocorticoid excess can cause skin thinning and loss of support around small vessels, leading to easy bruising.","Ehlers\u2013Danlos syndromes are inherited connective tissue disorders. Some subtypes cause vascular fragility."],"src":"Selected.pdf, p. 68 \u00b7 q1665","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1666","topic":"hemostasis","q":"Select factors dependent on vitamin K:","opts":["III, IV","IX, X","Ca S proteins","heparin","II, VII"],"correct":[1,2,4],"why":"Factors IX and X require vitamin K-dependent gamma-carboxylation to bind calcium and membrane surfaces. \u201cCa S proteins\u201d refers to proteins C and S, both vitamin K-dependent natural anticoagulants. Prothrombin (II) and factor VII both require vitamin K-dependent gamma-carboxylation.","optionWhy":["Factor III is tissue factor and factor IV is calcium. Neither undergoes vitamin K-dependent carboxylation.","Factors IX and X require vitamin K-dependent gamma-carboxylation to bind calcium and membrane surfaces.","\u201cCa S proteins\u201d refers to proteins C and S, both vitamin K-dependent natural anticoagulants.","Heparin acts through antithrombin. It is not a vitamin K-dependent protein.","Prothrombin (II) and factor VII both require vitamin K-dependent gamma-carboxylation."],"src":"Selected.pdf, p. 69 \u00b7 q1666","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1667","topic":"hemostasis","q":"Risk factors for the development of thromboembolic disease include","opts":["excess protein Ca S","protein Ca S deficiency","prothrombin gene mutation","increased level of HDL cholesterol"],"correct":[1,2],"why":"Deficiency of protein C or S impairs inactivation of factors Va and VIIIa and raises venous thrombosis risk. The prothrombin G20210A variant can increase prothrombin levels and predispose to venous thrombosis.","optionWhy":["Proteins C and S restrain clotting. Excess is not the prothrombotic mechanism tested here.","Deficiency of protein C or S impairs inactivation of factors Va and VIIIa and raises venous thrombosis risk.","The prothrombin G20210A variant can increase prothrombin levels and predispose to venous thrombosis.","Increased HDL is not a recognized inherited risk factor for venous thromboembolism."],"src":"Selected.pdf, p. 71 \u00b7 q1667","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1669","topic":"hemostasis","q":"Prolongation of aPTT can induce","opts":["heparin therapy","Factor V Leyden mutation","factor XI deficiency","hemophilia A"],"correct":[0,2,3],"why":"Unfractionated heparin potentiates antithrombin and can prolong aPTT. Factor XI functions in the intrinsic pathway, so deficiency can prolong aPTT. Hemophilia A reduces factor VIII activity, impairing the intrinsic pathway and potentially prolonging aPTT.","optionWhy":["Unfractionated heparin potentiates antithrombin and can prolong aPTT.","Factor V Leiden causes resistance to activated protein C and generally does not prolong routine aPTT.","Factor XI functions in the intrinsic pathway, so deficiency can prolong aPTT.","Hemophilia A reduces factor VIII activity, impairing the intrinsic pathway and potentially prolonging aPTT."],"src":"Selected.pdf, p. 72 \u00b7 q1669","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1670","topic":"blood","q":"Select the correct statement(s) about hematopoietic stem cell transplantation:","opts":["It is an important method of treatment for Hodgkin's disease and Wiskott-Aldrich syndrome","Recipients require immunosuppressive drugs to mitigate graft versus host disease (Graft versus Host Disease)","Indications for transplantation include aplastic anemia, sickle cell anemia, thalassemia","It is often performed in patients with sideropenic anemia","It is most often performed in patients with lymphoproliferative disorders and leukemias"],"correct":[0,1,2,4],"why":"Transplant can be used in selected relapsed Hodgkin lymphoma and can reconstitute immune function in Wiskott\u2013Aldrich syndrome. The transplant types can differ. This applies to allogeneic transplantation, where donor immune cells can attack recipient tissues. Auto inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1708","topic":"immunity","q":"Which cells are most important for immunopathological reactions IV. type? (choose 1 best answer)","opts":["Basophilic granulocytes, mast cells, B-lymphocytes","Neutrophil granulocytes, eosinophilic granulocytes","Basophilic granulocytes, plasma cells","Basophilic granulocytes, eosinophilic granulocytes","T-cells, monocytes and macrophages"],"correct":[4],"why":"Sensitized T cells mediate type IV responses. Their cytokines can recruit and activate monocytes and macrophages, and cytotoxic T cells can directly injure targets.","optionWhy":["Mast cells and basophils are characteristic of immediate IgE-mediated reactions. B cells produce antibodies.","These granulocytes participate in several inflammatory responses, but antigen-specific T cells drive type IV hypersensitivity.","Plasma cells secrete antibodies and basophils respond to IgE. Neither defines type IV hypersensitivity.","Basophils and eosinophils are more characteristic of allergic inflammation.","Sensitized T cells mediate type IV responses. Their cytokines can recruit and activate monocytes and macrophages, and cytotoxic T cells can directly injure targets."],"src":"Copy of Czech Ws was 3.pdf, p. 17 \u00b7 q1708","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1709","topic":"hemostasis","q":"Anemia accompanying the ischemic phase of disseminated intravascular coagulopathy (DIC) is","opts":["Hemolytic","Hemorrhagic","Dilutive","Macrocytic"],"correct":[0],"why":"Fibrin strands in small vessels shear passing erythrocytes, causing microangiopathic hemolysis and schistocytes.","optionWhy":["Fibrin strands in small vessels shear passing erythrocytes, causing microangiopathic hemolysis and schistocytes.","Bleeding can occur when platelets and clotting factors are consumed. The ischemic phase points to microvascular clotting and red-cell fragmentation.","Dilutional anemia reflects expansion of plasma volume, such as after fluid administration. It does not explain anemia from microvascular fibrin deposition.","A high MCV does not define DIC-related anemia. Fragmented erythrocytes are the characteristic clue."],"src":"Copy of Czech Ws was 3.pdf, p. 19 \u00b7 q1709","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1710","topic":"liver","q":"Liver cells form","opts":["Immunoglobulin G","Immunoglobulin M","Albumin","Plasma coagulation factors II, V, VII, IX, X","C-reactive protein (CRP)"],"correct":[2,3,4],"why":"Hepatocytes synthesize albumin, a major plasma protein contributing to oncotic pressure. The liver synthesizes the listed factors. Factors II, VII, IX and X are vitamin K dependent, while factor V is not. Hepatocytes increase CRP synthesis during inflammation, largely in response to IL-6.","optionWhy":["Plasma cells synthesize IgG.","Activated B cells that differentiate into antibody-secreting cells produce IgM.","Hepatocytes synthesize albumin, a major plasma protein contributing to oncotic pressure.","The liver synthesizes the listed factors. Factors II, VII, IX and X are vitamin K dependent, while factor V is not.","Hepatocytes increase CRP synthesis during inflammation, largely in response to IL-6."],"src":"Copy of Czech Ws was 3.pdf, p. 21 \u00b7 q1710","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1711","topic":"blood","q":"When examining blood laboratories, in patients with a moderate gram-negative bacterial infection (Escherichia coli, Pseudomonas species), it is usually assumed:","opts":["Polycythemia","Agranulocytosis","Neutrophilia","Lymphocytosis","Eosinophilia"],"correct":[2],"why":"Bacterial inflammation mobilizes neutrophils from marrow pools and can increase circulating neutrophils, sometimes with a left shift.","optionWhy":["Polycythemia is an increase in red-cell mass. The typical blood-count response in this question involves leukocytes.","Agranulocytosis is severe depletion of circulating granulocytes. A moderate bacterial infection typically stimulates a neutrophil response.","Bacterial inflammation mobilizes neutrophils from marrow pools and can increase circulating neutrophils, sometimes with a left shift.","Lymphocytosis is more typical of many viral infections and some specific bacterial infections, such as pertussis.","Eosinophilia is more characteristic of allergic disease, drug reactions or tissue-invasive helminth infections."],"src":"Copy of Czech Ws was 3.pdf, p. 28 \u00b7 q1711","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1712","topic":"immunity","q":"Among the components of non-specific immunity we include","opts":["Antibodies","Macrophages, NK cells","Complement","T and B lymphocytes"],"correct":[1,2],"why":"Macrophages recognize and engulf microbes, and natural killer cells can kill infected or abnormal cells without prior antigen-specific priming. Complement is an innate plasma protein cascade. It can opsonize microbes, promote inflammation and form membrane attack complexes.","optionWhy":["Antibodies are produced by B-lineage cells as part of adaptive immunity. They can recruit innate mechanisms such as complement.","Macrophages recognize and engulf microbes, and natural killer cells can kill infected or abnormal cells without prior antigen-specific priming.","Complement is an innate plasma protein cascade. It can opsonize microbes, promote inflammation and form membrane attack complexes.","Conventional T and B lymphocytes use antigen-specific receptors and are central to adaptive immunity."],"src":"Copy of Czech Ws was 3.pdf, p. 30 \u00b7 q1712","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1713","topic":"blood","q":"Blood viscosity is","opts":["Independent of hematocrit","Decreases with increasing hematocrit","Rises with increasing hematocrit","Directly proportional to hematocrit"],"correct":[2],"why":"More erythrocytes increase interactions between cells and resistance to flow, raising viscosity.","optionWhy":["The fraction of blood volume occupied by red cells strongly affects whole-blood viscosity.","At a given shear rate, a higher red-cell fraction generally increases resistance to flow.","More erythrocytes increase interactions between cells and resistance to flow, raising viscosity.","Viscosity rises nonlinearly with hematocrit and also depends on shear rate and red-cell properties."],"src":"Copy of Czech Ws was 3.pdf, p. 32 \u00b7 q1713","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1714","topic":"hemostasis","q":"Thrombocytosis can occur in the following diseases or conditions:","opts":["Chronic inflammatory diseases (for example, Crohn's disease)","Hypersplenism","DIC","Polycythemia vera","Thrombotic purpura"],"correct":[0,3],"why":"Chronic inflammation can raise thrombopoietin through cytokines such as IL-6 and cause reactive thrombocytosis. Polycythemia vera is a myeloproliferative neoplasm. In addition to increased red-cell mass, it can increase platelet production.","optionWhy":["Chronic inflammation can raise thrombopoietin through cytokines such as IL-6 and cause reactive thrombocytosis.","An enlarged spleen can sequester platelets and reduce the circulating platelet count.","DIC typically consumes platelets and clotting factors, leading to thrombocytopenia.","Polycythemia vera is a myeloproliferative neoplasm. In addition to increased red-cell mass, it can increase platelet production.","Thrombotic thrombocytopenic purpura consumes platelets in microvascular thrombi and lowers the platelet count."],"src":"Copy of Czech Ws was 3.pdf, p. 40 \u00b7 q1714","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1715","topic":"immunity","q":"An Rh-negative individual will make anti-D antibodies","opts":["Already during intrauterine life","Shortly after birth","After Rh-positive blood transfusion","Due to the delivery of an Rh-positive fetus"],"correct":[2,3],"why":"Transf epsin B activity","Increased intracellular trypsin activation","Increased elastase activity"],"correct":[2,3],"why":"Premature trypsinogen activation in acinar cells can activate other digestive enzymes and contribute to tissue injury. Activated elastase can degrade elastin in blood vessel walls, contributing to vascular injury and hemorrhage.","optionWhy":["Activated phospholipase A\u2082 can contribute to membrane damage in pancreatitis. Decreased activity does not explain the injury.","Cathepsin B can activate trypsinogen within acinar cells. The proposed injury mechanism involves activation of this pathway.","Premature trypsinogen activation in acinar cells can activate other digestive enzymes and contribute to tissue injury.","Activated elastase can degrade elastin in blood vessel walls, contributing to vascular injury and hemorrhage."],"src":"Copy of Czech Ws was 3.pdf, p. 81 \u00b7 q1727","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1728","topic":"blood","q":"Macrocytic and normochromic anemias may include:","opts":["Sickle cell disease","Folic acid deficiency anemia","Hereditary spherocytosis","Megaloblastic anemia","Sideropenic anemia"],"correct":[1,3],"why":"Folate deficiency impairs DNA synthesis and produces macrocytes, typically with normal mean corpuscular hemoglobin concentration. Megaloblastic anemia typically produces macro-ovalocytes because of impaired DNA synthesis.","optionWhy":["Sickle cell disease usually causes normocytic hemolytic anemia, although reticulocytosis or hydroxyurea can raise MCV.","Folate deficiency impairs DNA synthesis and produces macrocytes, typically with normal mean corpuscular hemoglobin concentration.","Hereditary spherocytosis is a membrane disorder that typically features spherocytes and a raised mean corpuscular hemoglobin concentration.","Megaloblastic anemia typically produces macro-ovalocytes because of impaired DNA synthesis.","Iron deficiency usually produces microcytic, hypochromic erythrocytes."],"src":"Copy of Czech Ws was 3.pdf, p. 82 \u00b7 q1728","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1729","topic":"liver","q":"What is the typical set of events in the pathogenesis of alcoholic liver cirrhosis","opts":["Alcohol consumption \u2192 pancreatitis \u2192 cholecystitis \u2192 steatosis \u2192 cirrhosis","Alcohol consumption \u2192 cholecystitis \u2192 steatosis \u2192 fibrosis \u2192 cirrhosis","Alcohol consumption \u2192 fibrosis \u2192 steatohepatitis \u2192 steatosis \u2192 cirrhosis","Alcohol consumption \u2192 steatosis \u2192 steatohepatitis \u2192 fibrosis \u2192 cirrhosis","Alcohol consumption \u2192 steatohepatitis \u2192 fibrosis \u2192 steatosis \u2192 cirrhosis"],"correct":[3],"why":"Hepatic fat accumulation can progress to inflammatory liver injury, fibrosis and eventually cirrhosis.","optionWhy":["Pancreatitis and cholecystitis are not steps in the progression of alcohol-associated liver injury.","Gallbladder inflammation is not a required precursor to hepatic steatosis or fibrosis.","Steatosis is usually an early change in alcohol-associated liver disease. Fibrosis develops with ongoing injury.","Hepatic fat accumulation can progress to inflammatory liver injury, fibrosis and eventually cirrhosis.","Placing steatosis after fibrosis reverses the usual teaching sequence."],"src":"Copy of Czech Ws was 3.pdf, p. 83 \u00b7 q1729","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1730","topic":"hemostasis","q":"Which of the following statements about aspirin is false?","opts":["Aspirin leads to a decrease in the synthesis of thromboxane A\u2082","Aspirin reduces the size and stability of platelet aggregates","Vitamin K is an essential cofactor in the reaction that is inhibited by aspirin","Aspirin inhibits the platelet enzyme cyclooxygenase-1 (COX-1)","The effects of aspirin on coagulation are significant"],"correct":[2,4],"why":"Vitamin K is required for gamma-carboxylation of certain coagulation proteins. Platelet COX-1 does not require it. Aspirin has a major effect on platelet function and primary hemostasis. In this question, coagulation refers to the plasma clotting cascade, which aspirin does not directly inhibit.","optionWhy":["Aspirin inhibits platelet COX-1, reducing thromboxane A\u2082 synthesis.","Less thromboxane A\u2082 reduces platelet recruitment and aggregation.","Vitamin K is required for gamma-carboxylation of certain coagulation proteins. Platelet COX-1 does not require it.","Aspirin irreversibly acetylates platelet COX-1.","Aspirin has a major effect on platelet function and primary hemostasis. In this question, coagulation refers to the plasma clotting cascade, which aspirin does not directly inhibit."],"src":"Copy of Czech Ws was 3.pdf, p. 86 \u00b7 q1730","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1731","topic":"liver","q":"Among the most common causes of acute pancreatitis are:","opts":["Hyperglycemia","Cholelithiasis","Gastrin hypersecretion","Alcoholism"],"correct":[1,3],"why":"A gallstone passing through or obstructing the ampulla can interrupt pancreatic drainage and trigger pancreatitis. Heavy alcohol exposure can injure acinar cells and predispose to acute pancreatitis.","optionWhy":["Hyperglycemia can accompany pancreatitis, but it is not a common initiating cause. Severe hypertriglyceridemia is a recognized cause.","A gallstone passing through or obstructing the ampulla can interrupt pancreatic drainage and trigger pancreatitis.","Gastrin hypersecretion primarily increases gastric acid output.","Heavy alcohol exposure can injure acinar cells and predispose to acute pancreatitis."],"src":"Copy of Czech Ws was 3.pdf, p. 87 \u00b7 q1731","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1732","topic":"blood","q":"Hepcidin","opts":["It is mainly formed in the liver","Inhibits the absorption of iron in the duodenum","It is overproduced in hereditary hemochromatosis","Is a peptide controlling copper metabolism"],"correct":[0,1],"why":"Hepatocytes produce most circulating hepcidin. Hepcidin binds ferroportin and reduces iron export from enterocytes to plasma.","optionWhy":["Hepatocytes produce most circulating hepcidin.","Hepcidin binds ferroportin and reduces iron export from enterocytes to plasma.","Common HFE-related hemochromatosis involves hepcidin that is inappropriately low for the degree of iron loading.","Hepcidin chiefly regulates iron availability. Copper metabolism involves other proteins, including ATP7B."],"src":"Copy of Czech Ws was 3.pdf, p. 88 \u00b7 q1732","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1733","topic":"liver","q":"Select the incorrect statement for alcohol","opts":["Causes an increase in the synthesis of fatty acids (compared to beta-oxidation)","It toxically damages the liver through its intermediate acetaldehyde","It is metabolized by enzymes from the cytochrome P450 family, alcohol dehydrogenase, among others","Inhibits the reduction of NAD\u207a to NADH"],"correct":[3],"why":"Alcohol dehydrogenase and aldehyde dehydrogenase reduce NAD\u207a to NADH as they oxidize ethanol and acetaldehyde.","optionWhy":["Ethanol metabolism raises the NADH-to-NAD\u207a ratio, suppressing fatty acid oxidation and favoring fat accumulation.","Acetaldehyde forms protein adducts and contributes to cellular injury.","Alcohol dehydrogenase and CYP2E1 both participate in ethanol oxidation.","Alcohol dehydrogenase and aldehyde dehydrogenase reduce NAD\u207a to NADH as they oxidize ethanol and acetaldehyde."],"src":"Copy of Czech Ws was 3.pdf, p. 89 \u00b7 q1733","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1734","topic":"liver","q":"Choose the correct statement about hepatitis","opts":["Hepatitis A is often (in 50% of patients) manifested by acute liver failure","Viral hepatitis C is a risk factor for liver cancer","Complications of chronic viral hepatitis C include anemia","Viral hepatitis B is a risk factor for liver cancer","Complications of chronic viral hepatitis C include hypoalbuminemia"],"correct":[1,2,3,4],"why":"Chronic HCV can lead to cirrhosis and increase the risk of hepatocellular carcinoma. Anemia can accompany chronic HCV, especially with advanced liver disease, bleeding, inflammation or some older treatments. It is not specific to HCV. Chronic HBV increases the risk of hepatocellular carcinoma, including in some patients without cirrhosis. Advanced chronic liver injury can reduce hepatic albumin synthesis.","optionWhy":["Most hepatitis A cases resolve. Acute liver failure is an uncommon complication.","Chronic HCV can lead to cirrhosis and increase the risk of hepatocellular carcinoma.","Anemia can accompany chronic HCV, especially with advanced liver disease, bleeding, inflammation or some older treatments. It is not specific to HCV.","Chronic HBV increases the risk of hepatocellular carcinoma, including in some patients without cirrhosis.","Advanced chronic liver injury can reduce hepatic albumin synthesis."],"src":"Copy of Czech Ws was 3.pdf, p. 92 \u00b7 q1734","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1735","topic":"liver","q":"Genetic disorders associated with liver damage (Wilson's disease, hemochromatosis, alpha-1 antitrypsin deficiency) usually","opts":["They are inherited in an X-linked fashion, so they are much more common in boys","They lead to chronic liver damage and usually appear in adulthood","They lead to acute liver failure in early childhood","They do not have serious clinical manifestations related to other organs","They can be partially affected by special preventive measures"],"correct":[1,4],"why":"Progressive injury can cause fibrosis and cirrhosis, often recognized in adulthood. Wilson disease and alpha-1 antitrypsin deficiency can also manifest earlier. Early recognition and disease-specific measures can reduce complications, such as managing copper or iron overload and avoiding additional liver injury.","optionWhy":["Wilson disease and common HFE hemochromatosis are autosomal recessive. Alpha-1 antitrypsin variants show codominant expression.","Progressive injury can cause fibrosis and cirrhosis, often recognized in adulthood. Wilson disease and alpha-1 antitrypsin deficiency can also manifest earlier.","Acute liver failure is possible in some of these disorders, particularly Wilson disease, but is not their usual shared presentation.","Extrahepatic manifestations include neurologic disease in Wilson disease, cardiac or endocrine injury in iron overload, and emphysema in alpha-1 antitrypsin deficiency.","Early recognition and disease-specific measures can reduce complications, such as managing copper or iron overload and avoiding additional liver injury."],"src":"Copy of Czech Ws was 3.pdf, p. 95 \u00b7 q1735","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1736","topic":"blood","q":"Choose correct statement/s about anemia of chronic diseases","opts":["It can be caused by Crohn's disease","Hepcidin level increases due to pro-inflammatory mediators","IL 2 and IL 8 play a major role in the pathogenesis of this anemia","It is associated with decreased plasma concentrations of ferritin and transferrin","Patients usually have severe iron deficiency and very low plasma iron level"],"correct":[0,1],"why":"Chronic inflammation in Crohn disease can restrict iron availability and suppress erythropoiesis. True iron deficiency can also coexist. Inflammatory signaling, particularly IL-6, raises hepatic hepcidin and reduces iron export through ferroportin.","optionWhy":["Chronic inflammation in Crohn disease can restrict iron availability and suppress erythropoiesis. True iron deficiency can also coexist.","Inflammatory signaling, particularly IL-6, raises hepatic hepcidin and reduces iron export through ferroportin.","IL-6 is the classic driver of the hepcidin response. IL-2 and IL-8 are not the principal mediators emphasized here.","Transferrin can fall, but ferritin is often normal or elevated because it is an acute-phase reactant and stored iron is retained.","Low circulating iron commonly reflects iron sequestration. Severe depletion of total body iron is not required."],"src":"Copy of Czech Ws was 3.pdf, p. 97 \u00b7 q1736","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1737","topic":"liver","q":"Select correct statement/s about pain in patients with acute pancreatitis","opts":["Pancreatic enzymes are one of the key factors, leading to development of pain","In the development of pain, prostaglandins are important","Pain is usually not severe and patients rarely need treatment with analgesic medicines","Usually pain becomes milder after diarrhea","Pain irradiates to back"],"correct":[0,1,4],"why":"Activated pancreatic enzymes can injure tissue and trigger inflammation that stimulates pain pathways. Prostaglandins sensitize nociceptors and contribute to inflammatory pain. Epigastric pain radiating to the back is a classic presentation.","optionWhy":["Activated pancreatic enzymes can injure tissue and trigger inflammation that stimulates pain pathways.","Prostaglandins sensitize nociceptors and contribute to inflammatory pain.","Acute pancreatitis typically causes severe, persistent epigastric pain.","Diarrhea does not characteristically relieve pancreatitis pain.","Epigastric pain radiating to the back is a classic presentation."],"src":"Copy of Czech Ws was 3.pdf, p. 98 \u00b7 q1737","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1738","topic":"hemostasis","q":"APTT time is increased in patients with","opts":["Often in patients with liver failure","Usually in patients with increased D-dimers","Usually in patients treated with heparin","Usually in patients with hemophilia B","Usually in patients with thrombocytopenia"],"correct":[0,2,3],"why":"Advanced liver failure can lower several clotting factors and prolong aPTT as well as PT. Unfractionated heparin often prolongs aPTT through antithrombin-mediated inhibition of clotting enzymes. Factor IX deficiency impairs the intrinsic coagulation pathway and typically prolongs aPTT.","optionWhy":["Advanced liver failure can lower several clotting factors and prolong aPTT as well as PT.","D-dimer reflects breakdown of cross-linked fibrin. Its elevation alone does not predict a prolonged aPTT.","Unfractionated heparin often prolongs aPTT through antithrombin-mediated inhibition of clotting enzymes.","Factor IX deficiency impairs the intrinsic coagulation pathway and typically prolongs aPTT.","Isolated thrombocytopenia affects primary hemostasis. The plasma-based aPTT usually remains normal."],"src":"Copy of Czech Ws was 3.pdf, p. 99 \u00b7 q1738","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1739","topic":"hemostasis","q":"Leiden mutation is","opts":["Factor V decreased resistance to degradation by protein C action, leading to activation of fibrinolysis","Factor V increased resistance to degradation by protein C action, leading to activation of coagulation cascade","Factor V decreased resistance to degradation by protein C action, leading to activation of coagulation cascade","In asymptomatic patients measurement of D-dimers is important for diagnosis","Factor V increased resistance to degradation by protein C action, leading to activation of fibrinolysis"],"correct":[1],"why":"Activated factor V persists longer, sustaining prothrombinase activity and promoting thrombin formation.","optionWhy":["Factor V Leiden increases resistance to activated protein C. It does not act by stimulating fibrin breakdown.","Activated factor V persists longer, sustaining prothrombinase activity and promoting thrombin formation.","Greater susceptibility to inactivation would reduce factor Va activity. The mutation increases resistance.","D-dimer reflects fibrin turnover and does not identify the factor V Leiden variant. Functional resistance testing or genotyping can identify it.","The downstream effect is increased coagulation. Fibrinolysis is the breakdown of fibrin."],"src":"Copy of Czech Ws was 3.pdf, p. 101 \u00b7 q1739","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1740","topic":"hemostasis","q":"After acute respiratory infection laboratory investigation of the 19-year-old male patient has shown 82 \u00d7 10\u2079 platelets, INR 1.12, aPTT 29 sec, Duke bleeding time 4 min 40 sec. Most probably that the patient:","opts":["Has vitamin K deficiency due to treatment by antibiotics","Has to be hospitalized to ICU for high risk of life-threatening bleeding","Has no clinical signs of bleeding disorders","Has acquired hemophilia A-type disorder due to formation of antibodies to factor VIII","Has a mother heterozygous for hemophilia A or B"],"correct":[2],"why":"Moderate thrombocytopenia can be asymptomatic. The normal INR and aPTT fit an isolated platelet-count abnormality.","optionWhy":["Clinically significant vitamin K deficiency usually prolongs PT and raises INR. It does not explain isolated thrombocytopenia.","The platelet value alone does not establish life-threatening bleeding. The vignette gives no severe bleeding symptoms.","Moderate thrombocytopenia can be asymptomatic. The normal INR and aPTT fit an isolated platelet-count abnormality.","An acquired factor VIII inhibitor typically prolongs aPTT and does not explain the platelet-count reduction.","The results do not support a diagnosis of hemophilia or establish the mother's carrier status."],"src":"Copy of Czech Ws was 3.pdf, p. 103 \u00b7 q1740","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1741","topic":"hemostasis","q":"Thrombocytosis often has the reactive nature related to:","opts":["Splenectomy","Splenomegaly","Acute or chronic inflammation","Clonal expansion of megakaryocytes due to myeloproliferative disease","Bleeding"],"correct":[0,2,4],"why":"R

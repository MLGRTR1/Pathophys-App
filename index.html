<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Pathophysiology Test 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#f5f5f7;--surface:#fff;--rule:rgba(0,0,0,.08);--rule-strong:rgba(0,0,0,.14);
  --text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--danger:#d70015;--ok:#248a3d;
  --ok-bg:rgba(52,199,89,.10);--ok-line:rgba(52,199,89,.45);--bad-bg:rgba(255,59,48,.08);--bad-line:rgba(255,59,48,.45);
  --sel-bg:rgba(0,113,227,.08);--sel-line:rgba(0,113,227,.55);--warn:#b25000;--warn-bg:rgba(255,149,0,.12);
  --glass:hsla(0,0%,100%,.72);
  --grad:linear-gradient(100deg,#f0506e 0%,#b35ce6 50%,#3d82f5 100%);
  --ground:radial-gradient(1100px 640px at 12% 8%,rgba(240,80,110,.08),transparent 60%),radial-gradient(1000px 600px at 90% 92%,rgba(61,130,245,.09),transparent 60%),#f5f5f7;
  --shadow:0 4px 14px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--surface:#1c1c1e;--rule:hsla(0,0%,100%,.08);--rule-strong:hsla(0,0%,100%,.16);
  --text:#f5f5f7;--muted:#98989d;--accent:#0a84ff;--danger:#ff6961;--ok:#30d158;
  --ok-bg:rgba(48,209,88,.13);--ok-line:rgba(48,209,88,.5);--bad-bg:rgba(255,69,58,.13);--bad-line:rgba(255,69,58,.5);
  --sel-bg:rgba(10,132,255,.14);--sel-line:rgba(10,132,255,.6);--warn:#ffb340;--warn-bg:rgba(255,159,10,.14);
  --glass:rgba(20,20,22,.66);
  --ground:radial-gradient(1100px 640px at 12% 12%,rgba(240,80,110,.12),transparent 60%),radial-gradient(1000px 600px at 90% 88%,rgba(61,130,245,.14),transparent 60%),#000;
  --shadow:0 4px 14px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--surface:#1c1c1e;--rule:hsla(0,0%,100%,.08);--rule-strong:hsla(0,0%,100%,.16);
  --text:#f5f5f7;--muted:#98989d;--accent:#0a84ff;--danger:#ff6961;--ok:#30d158;
  --ok-bg:rgba(48,209,88,.13);--ok-line:rgba(48,209,88,.5);--bad-bg:rgba(255,69,58,.13);--bad-line:rgba(255,69,58,.5);
  --sel-bg:rgba(10,132,255,.14);--sel-line:rgba(10,132,255,.6);--warn:#ffb340;--warn-bg:rgba(255,159,10,.14);
  --glass:rgba(20,20,22,.66);
  --ground:radial-gradient(1100px 640px at 12% 12%,rgba(240,80,110,.12),transparent 60%),radial-gradient(1000px 600px at 90% 88%,rgba(61,130,245,.14),transparent 60%),#000;
  --shadow:0 4px 14px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:var(--ground);background-attachment:fixed;min-height:100vh;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--rule)}
.nav-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:1.15rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;border:0;padding:0;background-color:transparent}
.pill{border:1px solid var(--rule-strong);background:var(--surface);border-radius:980px;padding:8px 16px;cursor:pointer;font-size:.95rem;white-space:nowrap}
.pill:hover{border-color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:48px 96px}
.narrow{max-width:760px;margin:0 auto}
.eyebrow{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.04;letter-spacing:-.03em;margin:.35em 0 .3em;font-weight:800;text-wrap:balance}
h2{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 .4em;text-wrap:balance}
.lede{color:var(--muted);font-size:1.15rem;max-width:62ch;margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:40px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:28px 30px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card h3{font-size:1.75rem;margin:0;letter-spacing:-.02em}
.card p{margin:0;color:var(--muted)}
.card .go{display:flex;justify-content:space-between;margin-top:10px;font-size:.95rem}
.card.hero{background:var(--grad);color:#fff;border-color:transparent}
.card.hero p,.card.hero .eyebrow{color:rgba(255,255,255,.88)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:56px 0 16px;gap:12px;flex-wrap:wrap}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.topic{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;text-align:left}
.topic:hover{border-color:var(--rule-strong)}
.topic b{font-weight:600}
.topic small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:980px;padding:6px 14px;font-size:.92rem}
.chip.src{color:var(--muted)}
.chip.ask{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip.unoff{color:var(--muted);border-style:dashed}
.tagline{font-size:.78rem;font-weight:600;color:var(--warn);margin-right:6px}
.why .rn{margin-top:10px;color:var(--muted);font-size:.9rem}
.card.link{text-decoration:none;color:inherit}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.bar{height:6px;background:var(--rule);border-radius:9px;margin:18px 0 30px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .25s}
.q{font-size:clamp(1.3rem,3vw,1.75rem);font-weight:700;letter-spacing:-.015em;line-height:1.3;margin:0 0 8px;text-wrap:pretty}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;cursor:pointer;text-align:left;width:100%;font-size:1.05rem}
.opt:hover:not([disabled]){border-color:var(--rule-strong)}
.opt .k{flex:none;width:32px;height:32px;border:1px solid var(--rule-strong);border-radius:8px;display:grid;place-items:center;font-size:.9rem;font-weight:600}
.opt .t{flex:1;min-width:0;padding-top:4px}
.opt .tag{flex:none;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:980px;margin-top:5px}
.opt.sel{background:var(--sel-bg);border-color:var(--sel-line)}
.opt.sel .k{border-color:var(--sel-line);color:var(--accent)}
.opt.right{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.right .k{border-color:var(--ok-line)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--danger)}
.opt.wrong .k{border-color:var(--bad-line)}
.opt.missed{border:1.5px dashed var(--ok-line);color:var(--ok)}
.opt.dim{opacity:.6}
.tag.r{background:var(--ok-bg)} .tag.w{background:var(--bad-bg)} .tag.m{background:var(--ok-bg)}
.why{margin-top:20px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 20px;font-size:.98rem}
.why b{display:block;margin-bottom:4px}
.why .unc{margin-top:10px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem}
.btn{display:block;width:100%;margin-top:26px;border:0;border-radius:980px;padding:17px;font-size:1.1rem;font-weight:600;color:#fff;background:var(--grad);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--rule-strong)}
.foot{text-align:center;color:var(--muted);font-size:.9rem;margin-top:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .btn{flex:1;min-width:200px}
.mock{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:36px}
.mock .card h3{font-size:1.45rem}
.mono{font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--danger)}
.custom{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:24px 28px;margin-top:16px}
.custom label{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.custom input[type=number]{width:90px;padding:8px 10px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--bg);color:var(--text);font:inherit}
.search{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--text);font:inherit;font-size:1.05rem;margin:24px 0}
.sheet{display:flex;flex-direction:column;gap:12px}
.sheet .item{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 20px}
.sheet .item .qq{font-weight:600;margin-bottom:6px}
.sheet ul{margin:6px 0 0;padding-left:0;list-style:none}
.sheet li{padding:2px 0 2px 26px;position:relative;font-size:.97rem}
.sheet li::before{position:absolute;left:0;font-weight:700}
.sheet li.y{color:var(--ok)} .sheet li.y::before{content:"T"}
.sheet li.n{color:var(--muted)} .sheet li.n::before{content:"F"}
.sheet .r{color:var(--muted);font-size:.9rem;margin-top:6px}
.pat{display:grid;gap:14px;margin-top:28px}
.pat .item{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 22px}
.pat .item h3{margin:0 0 6px;font-size:1.1rem}
.pat .item p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:28px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 20px}
.stat .n{font-size:2rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.9rem}
.tbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 56px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.tbar .track{height:8px;background:var(--rule);border-radius:9px;overflow:hidden}
.tbar .track i{display:block;height:100%;background:var(--grad)}
.tbar .pc{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.result{text-align:center;padding:30px 0}
.result .big{font-size:clamp(3rem,10vw,5.5rem);font-weight:800;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pass{display:inline-block;padding:6px 16px;border-radius:980px;font-weight:600}
.pass.y{background:var(--ok-bg);color:var(--ok)} .pass.n{background:var(--bad-bg);color:var(--danger)}
.review{margin-top:30px;display:flex;flex-direction:column;gap:10px}
.review .item{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;text-align:left;width:100%}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.dot.y{background:var(--ok)} .dot.p{background:var(--warn)} .dot.n{background:var(--danger)}
.theme{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;z-index:6}
.theme svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:1.8}
.empty{color:var(--muted);padding:20px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.wrap{padding-block:28px 80px}.card{padding:22px}.opt{padding:14px 16px;gap:12px;font-size:1rem}.tbar{grid-template-columns:minmax(0,1fr) 70px 46px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body.quizmode{margin:0;min-height:0}
body.quizmode .wrap{padding-block:10px}
body.quizmode .theme{display:none}
body.quizmode .bar{margin:10px 0 14px}
body.quizmode .q{font-size:clamp(1.1rem,2.6vw,1.5rem);margin-bottom:4px}
body.quizmode .hint{margin:0 0 10px;font-size:.85rem}
body.quizmode .opts{gap:8px}
body.quizmode .opt{padding:10px 12px;gap:10px;font-size:.98rem}
body.quizmode .opt .k{width:28px;height:28px}
body.quizmode .opt .t{padding-top:2px}
body.quizmode .opt .tag{margin-top:3px}
body.quizmode .why{margin-top:10px;padding:10px 14px;font-size:.92rem}
body.quizmode .btn{margin-top:12px;padding:13px;font-size:1.02rem}
body.quizmode .foot{margin-top:6px;font-size:.8rem}
@media (hover:none){body.quizmode .foot{display:none}}
</style>
</head>

<script>
const REVIEW_BANK = [{"id":"midterm3-q0002","topic":"liver","q":"Select the correct statement about pain in patients with acute pancreatitis","opts":["Pain is usually not severe and patients rarely require analgesic treatment","Pancreatic enzymes are one of the key factors leading to the development of pain","Prostaglandins are important in the development of pain","The pain radiates to the back","After vomiting, the pain usually subsides"],"correct":[1,2,3],"why":"Premature enzyme activation damages pancreatic tissue and drives the painful inflammatory response. Inflammatory prostaglandins sensitize nociceptors and contribute to pain. Radiation from the epigastrium through to the back is characteristic.","src":"Copy of Czech Ws was 3.pdf, p. 203 \u00b7 q0921","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Acute pancreatitis often causes severe persistent epigastric pain.","Premature enzyme activation damages pancreatic tissue and drives the painful inflammatory response.","Inflammatory prostaglandins sensitize nociceptors and contribute to pain.","Radiation from the epigastrium through to the back is characteristic.","Vomiting can accompany pancreatitis, but it does not reliably relieve inflammatory pain."]},{"id":"midterm3-q0003","topic":"liver","q":"Symptoms of cirrhosis of the liver and portal hypertension include:","opts":["Coagulation disorder","Ascites","Hyperalbuminemia","Anemia","Esophageal varices"],"correct":[0,1,3,4],"why":"Portal hypertension favors ascites and varices. Reduced hepatic synthesis can impair coagulation, and bleeding, nutrition, or hypersplenism may contribute to anemia.","src":"3. test verze 1-2.pdf.pdf, p. 2 \u00b7 q0003","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Loss of hepatic synthetic capacity can alter coagulation.","Portal pressure and renal salt retention favor peritoneal fluid accumulation.","Advanced liver dysfunction often lowers albumin synthesis.","Bleeding, nutritional deficiencies and hypersplenism can contribute to anemia.","Portosystemic collaterals form when portal pressure rises."]},{"id":"midterm3-q0534","topic":"hemostasis","q":"Thrombocytopenia with platelet level =110 10\u2079/L","opts":["Usually without symptoms (asymptomatic)","It is a typical sign of the Leiden mutation","It is an important cause of hemarthrosis","Means there is a risk of spontaneous intracranial bleeding","Associated with purpura and ecchymosis"],"correct":[0],"why":"An isolated count of 110 \u00d7 10\u2079/L is mild thrombocytopenia and usually causes no symptoms.","optionWhy":["An isolated count of 110 \u00d7 10\u2079/L is mild thrombocytopenia and usually causes no symptoms.","Factor V Leiden raises the risk of venous thrombosis and does not typically lower platelets.","Hemarthrosis is characteristic of significant coagulation factor deficiency.","Spontaneous major bleeding generally requires a much lower count or additional risk factors.","Purpura and ecchymosis can occur in more significant thrombocytopenia."],"src":"Copy of Czech Ws was 3.pdf, p. 207 \u00b7 q0925","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0013","topic":"hemostasis","q":"Choose the correct statement(s) about thrombocytopenia","opts":["It can be treated with aspirin","Associated with hematomas but never with hemarthrosis","It is one of the causes of impaired primary hemostasis","May be the result of portal hypertension","It is a typical sign of ulcerative colitis"],"correct":[2,3],"why":"A low platelet count reduces the ability to form an initial platelet plug. Portal hypertension may cause splenic enlargement and sequestration of platelets.","src":"Copy of Czech Ws was 3.pdf, p. 316 \u00b7 q0934","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Aspirin inhibits platelet aggregation and can worsen bleeding from thrombocytopenia.","Platelet disorders favor mucocutaneous bleeding. The absolute claim that joint bleeding can never occur is unreliable.","A low platelet count reduces the ability to form an initial platelet plug.","Portal hypertension may cause splenic enlargement and sequestration of platelets.","Thrombocytopenia is not a typical feature of ulcerative colitis."]},{"id":"midterm3-q0019","topic":"hemostasis","q":"Choose the correct statement about hemophilia A.","opts":["PT is extended","It is a disease linked to the Y chromosome, therefore only men can have it","They are typically petechial bleeding and purpura","If the patient has approximately 10% factor VIII, this indicates a high risk of spontaneous bleeding","APTT is prolonged"],"correct":[4],"why":"Factor VIII participates in intrinsic tenase, so aPTT may be prolonged in hemophilia A.","src":"Copy of Czech Ws was 3.pdf, p. 196 \u00b7 q0919","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["The extrinsic and common pathways assessed by PT are usually intact in isolated hemophilia A.","Hemophilia A is classically X-linked. Females can also have low factor VIII and symptoms.","Deep bleeding and hemarthroses are more characteristic. Petechiae point toward primary hemostasis defects.","A factor VIII activity around 10% is usually classified as mild. Frequent spontaneous bleeding is more typical with severe deficiency.","Factor VIII participates in intrinsic tenase, so aPTT may be prolonged in hemophilia A."]},{"id":"midterm3-q0020","topic":"liver","q":"The presence of a gallstone in the papilla duodeni major (Vateri) can lead to:","opts":["Acute pancreatitis","Acute cholecystitis","Increased plasma concentrations of unconjugated bilirubin","Increased concentration of urobilinogen in urine","Jaundice"],"correct":[0,1,4],"why":"A stone at the major papilla can impair pancreatic duct drainage and trigger acute pancreatitis. Moodle includes this choice. Acute calculous cholecystitis classically follows cystic duct obstruction and can coexist with a stone at the papilla. Obstruction of bile drainage causes conjugated bilirubin to accumulate and can produce jaundice.","src":"Copy of Czech Ws was 3.pdf, p. 211 \u00b7 q0927","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["A stone at the major papilla can impair pancreatic duct drainage and trigger acute pancreatitis.","Moodle includes this choice. Acute calculous cholecystitis classically follows cystic duct obstruction and can coexist with a stone at the papilla.","Distal duct obstruction chiefly raises conjugated bilirubin because already conjugated bilirubin cannot drain normally.","Complete obstruction reduces the amount of bilirubin reaching intestinal bacteria, which reduces urobilinogen production.","Obstruction of bile drainage causes conjugated bilirubin to accumulate and can produce jaundice."]},{"id":"midterm3-q0021","topic":"hemostasis","q":"After acute respiratory infection laboratory investigation of the 19-year old male patient has shown 82*10^9 platelets, INR 1.12, aPTT 29 sec, Duke bleeding time 4 min 40 sec. Most probably that the patient:","opts":["Has no clinical signs of bleeding disorders","Has to be hospitalized to ICU for high risk of life-threatening bleeding","Has acquired hemophylia A \u2013type disorder due to formation of antibodies to f.VIII","Has mother heterozygotic for hemophylia A or B","Has vitamin K deficiency due to treatment by antibiotics"],"correct":[0],"why":"The presentation suggests mild to moderate thrombocytopenia after infection with preserved coagulation times, so clinical bleeding may be absent.","src":"3rd test Lian.docx.pdf, p. 1 \u00b7 q0021","conf":"key","seen":2,"recall":false,"scored":true,"optionWhy":["The presentation suggests mild to moderate thrombocytopenia after infection with preserved coagulation times, so clinical bleeding may be absent.","The reported platelet count and absence of a described major bleed do not suggest an imminent life-threatening hemorrhage in this vignette.","A factor VIII inhibitor typically prolongs aPTT and can produce spontaneous soft-tissue bleeding.","The results do not establish maternal carrier status. Hemophilia A and B typically impair the intrinsic pathway and can prolong aPTT.","Vitamin K deficiency commonly prolongs PT or raises INR before it materially affects aPTT. The INR here offers no supporting evidence."]},{"id":"midterm3-q0206","topic":"blood","q":"Select correct statement\\s about leucocytes","opts":["Increased amount of eosinophils with 4% of basophils and 9% of neutrophils can be related to bacterial infection","Increased amount of macrophages with 14% of basophils and 62% of lymphocytes can be related to bacterial infection","Chemotherapy is an important risk factor of neutropenia","Increased amount of neutrophils with 4% of metamyelocytes and 9% of bands can be related to bacterial infection","Amount of leucocytes in peripheral blood is approximately 0,5 kg"],"correct":[2,3],"why":"Cytotoxic chemotherapy suppresses marrow production of neutrophils and increases infection risk. Immature neutrophils in blood indicate a left shift, a common response to bacterial infection.","src":"4th test Lian.docx.pdf, p. 2 \u00b7 q0206","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["A marked eosinophil increase is more typical of allergies or certain parasitic infections than acute pyogenic infection.","An elevated lymphocyte fraction with marked basophilia is not the typical differential in acute pyogenic infection.","Cytotoxic chemotherapy suppresses marrow production of neutrophils and increases infection risk.","Immature neutrophils in blood indicate a left shift, a common response to bacterial infection.","Peripheral leukocyte abundance is measured as a count per volume. Half a kilogram is far too high for the circulating compartment."]},{"id":"midterm3-q0207","topic":"immunity","q":"Choose correct statement/s about immune system disorders","opts":["HIV infection primarily damages neutrophils","Bradykinin and leukotrienes are important components in the pathogenesis of the type I hypersensitivity reaction","Increase amount of macrophages and neutrophils is common in allergies","Malnutrition is a major cause of primary immunodeficiency","Selective IgD deficiency is most frequent type of primary immune deficiencies"],"correct":[1],"why":"The key includes this option. Cysteinyl leukotrienes contribute to bronchoconstriction and vascular leak. Bradykinin also increases permeability, though histamine is the classic immediate IgE-mediated mediator.","src":"4th test Lian.docx.pdf, p. 2 \u00b7 q0207","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["HIV primarily targets CD4-expressing cells, especially helper T cells.","The key includes this option. Cysteinyl leukotrienes contribute to bronchoconstriction and vascular leak. Bradykinin also increases permeability, though histamine is the classic immediate IgE-mediated mediator.","Eosinophils are a characteristic inflammatory cell in many allergic disorders. The stated increase in macrophages and neutrophils is not the usual defining pattern.","Malnutrition can cause acquired or secondary immunodeficiency.","Selective IgA deficiency is a common primary antibody deficiency. The option names IgD."]},{"id":"midterm3-q0210","topic":"immunity","q":"Select correct statement/s about hypersensitivity reactions","opts":["A type III hypersensitivity reaction is important in the pathogenesis of systemic lupus erythematosus","Type I hypersensitivity reaction is associated with increased IgE levels","The most severe type II hypersensitivity reaction is anaphylactic shock","A type II hypersensitivity reaction is the major cause of bronchial asthma","The mechanism of development of glomerulonephritis is most frequently related to type IV hypersensitivity reaction"],"correct":[0,1],"why":"Immune-complex deposition and complement activation explain many manifestations of systemic lupus erythematosus. Allergen-specific IgE on mast cells drives immediate type I hypersensitivity.","src":"4th test Lian.docx.pdf, p. 4 \u00b7 q0210","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Immune-complex deposition and complement activation explain many manifestations of systemic lupus erythematosus.","Allergen-specific IgE on mast cells drives immediate type I hypersensitivity.","Anaphylaxis is a severe systemic reaction classically caused by type I hypersensitivity.","Allergic asthma commonly involves IgE-mediated responses and type 2 airway inflammation.","Many forms of glomerulonephritis are driven by deposited immune complexes, a type III mechanism. Anti-GBM disease is a type II example."]},{"id":"midterm3-q0211","topic":"blood","q":"Choose correct statement/s about anemia of chronic diseases","opts":["Hepcidin level increases due to pro-inflammatory mediators","It is associated with decreased plasma concentrations of ferritin and transferrin","Patients usually have severe iron deficiency and very low plasma iron level","It can be caused by Crohn\u2019s disease","IL 2 and IL 8 play a major role in the pathogenesis of this anemia"],"correct":[0,3],"why":"Inflammatory mediators such as IL-6 stimulate hepatic hepcidin, which reduces ferroportin-mediated iron export. Chronic inflammation in Crohn\u2019s disease can raise hepcidin and restrict iron availability. Concomitant bleeding can produce an additional iron deficiency.","src":"4th test Lian.docx.pdf, p. 4 \u00b7 q0211","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammatory mediators such as IL-6 stimulate hepatic hepcidin, which reduces ferroportin-mediated iron export.","Transferrin can fall during inflammation. Ferritin often remains normal or rises despite low circulating iron.","Iron is sequestered and serum iron can fall even when iron stores are preserved. True iron deficiency can coexist.","Chronic inflammation in Crohn\u2019s disease can raise hepcidin and restrict iron availability. Concomitant bleeding can produce an additional iron deficiency.","IL-6 is a principal inducer of hepcidin in this mechanism. IL-2 and IL-8 are not the principal pair."]},{"id":"midterm3-q0214","topic":"liver","q":"Which findings fit acute common bile duct obstruction from a gallstone?","opts":["Conjugated hyperbilirubinemia","Colicky abdominal pain","Dark stool and pale urine as the expected pattern","ALP typically falls"],"correct":[0,1],"why":"Obstruction impairs excretion of conjugated bilirubin. Urine can darken, stool can pale, and a stone may produce colicky pain.","src":"4th test Lian.docx.pdf, p. 6 \u00b7 q0214","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Conjugated bilirubin backs up when the common duct cannot drain.","A stone can cause intermittent obstruction and biliary colic.","Conjugated bilirubin darkens urine. Less pigment reaches the intestine, which can lighten stool.","Cholestasis generally raises ALP, particularly if obstruction persists."]},{"id":"midterm3-q0215","topic":"immunity","q":"Which mechanisms contribute to anaphylactic shock or airway compromise?","opts":["Leukotriene-mediated bronchoconstriction","Histamine-mediated vasodilation","Increased vascular permeability and airway edema","Hyperkalemia as the usual primary mechanism"],"correct":[0,1,2],"why":"Mast cell mediators cause vasodilation, capillary leakage, bronchospasm, and edema.","src":"4th test Lian.docx.pdf, p. 7 \u00b7 q0215","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Mast-cell leukotrienes contract bronchial smooth muscle.","Histamine dilates vessels and reduces systemic vascular resistance.","Vascular leakage can cause airway edema and reduce effective circulating volume.","Distributive shock is driven by vasodilation and leakage. Hyperkalemia is a different mechanism."]},{"id":"midterm3-q0216","topic":"blood","q":"Which statements describe sickle cell disease?","opts":["Infection can precipitate a crisis","It is an extrinsic red-cell disorder","It can cause acute crises and chronic pain","It can cause cerebral vaso-occlusive injury"],"correct":[0,2,3],"why":"Deoxygenated HbS polymerizes, promoting sickling, hemolysis, and microvascular obstruction.","src":"4th test Lian.docx.pdf, p. 8 \u00b7 q0216","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Infection can increase hypoxia and inflammation, promoting HbS polymerization.","The defect is within the erythrocyte. HbS polymerizes as oxygen tension falls.","Microvascular obstruction causes acute crises, and recurrent injury can contribute to chronic pain.","Sickling and vascular injury can compromise cerebral perfusion and cause stroke."]},{"id":"midterm3-q0219","topic":"blood","q":"Microcytic and hypochromic anaemias may include:","opts":["anemia with impaired heme synthesis","thalassemia","impaired synthesis of the globin component of hemoglobin","anemia of chronic diseases","B12 deficiency anemia"],"correct":[0,1,2,3],"why":"Impaired heme synthesis reduces hemoglobinization and can produce small, pale red cells. Reduced alpha- or beta-globin synthesis in thalassemia commonly leads to microcytosis and hypochromia. Globin chain production is required for normal hemoglobin assembly. Reduced production can yield small, poorly hemoglobinized cells. Chronic inflammation can restrict iron supply to red cell precursors. This anemia is often normocytic at first and can become microcytic.","src":"4th test Lian.docx.pdf, p. 10 \u00b7 q0219","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Impaired heme synthesis reduces hemoglobinization and can produce small, pale red cells.","Reduced alpha- or beta-globin synthesis in thalassemia commonly leads to microcytosis and hypochromia.","Globin chain production is required for normal hemoglobin assembly. Reduced production can yield small, poorly hemoglobinized cells.","Chronic inflammation can restrict iron supply to red cell precursors. This anemia is often normocytic at first and can become microcytic.","B12 deficiency impairs DNA synthesis and classically uired hemophilia can be autoimmune.","Down syndrome is usually caused by trisomy 21.","The paper groups Crohn disease here. It is generally described as immune-mediated inflammatory bowel disease.","Hashimoto thyroiditis involves immune-mediated damage to thyroid tissue.","Systemic lupus involves autoantibodies and immune-complex injury."]},{"id":"midterm3-q0223","topic":"liver","q":"What is typical for most patients with hepatitis A during the period of clinical manifestations of the disease","opts":["Blood ALT and AST levels increase","More than half of the patients rapidly develop hepatic encephalopathy","Stool color is usually hypercholic","Conjugated and unconjugated bilirubin concentrations in the blood increase","Patients usually do not have jaundice"],"correct":[0,3],"why":"Acute hepatocellular injury releases aminotransferases into the circulation. Acute hepatocellular dysfunction can disrupt bilirubin uptake and excretion, raising both bilirubin fractions.","src":"4th test Lian.docx.pdf, p. 12 \u00b7 q0223","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Acute hepatocellular injury releases aminotransferases into the circulation.","Hepatic encephalopathy suggests acute liver failure, a rare complication of hepatitis A.","Cholestasis can reduce bile pigment reaching the intestine and cause pale stool. Darker stool is not characteristic.","Acute hepatocellular dysfunction can disrupt bilirubin uptake and excretion, raising both bilirubin fractions.","Jaundice can occur during symptomatic disease, especially in adults. Children are more likely to have anicteric or asymptomatic infection."]},{"id":"midterm3-q0898","topic":"blood","q":"Choose the correct statement(s) about sideropenic anemia","opts":["May be caused by chronic bleeding (often occult)","May be caused by hereditary hemochromatosis","Associated with elevated ferritin","May be caused by chronic atrophic gastritis","Atrophy of the mucous membrane in the oral cavity and dysphagia are among the symptoms"],"correct":[0,3,4],"why":"Ongoing occult blood loss can deplete iron stores. Reduced gastric acidity can impair iron absorption. Longstanding iron deficiency can cause oral mucosal atrophy and dysphagia.","src":"Copy of Czech Ws was 3.pdf, p. 108 \u00b7 q0809","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Ongoing occult blood loss can deplete iron stores.","Hereditary hemochromatosis usually causes excess iron absorption and iron overload.","Uncomplicated iron deficiency lowers ferritin.","Reduced gastric acidity can impair iron absorption.","Longstanding iron deficiency can cause oral mucosal atrophy and dysphagia."]},{"id":"midterm3-q0900","topic":"hemostasis","q":"Where is von Willebrand factor found?","opts":["Hepatocytes are its primary site of synthesis","The subendothelial matrix","Only inside red blood cells","Only in the fibrin clot"],"correct":[1],"why":"Endothelial cells deposit von Willebrand factor in the subendothelial matrix, where it supports platelet adhesion.","src":"Copy of Czech Ws was 3.pdf, p. 8 \u00b7 q0900","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Endothelial cells and megakaryocytes synthesize von Willebrand factor.","Endothelial von Willebrand factor binds exposed subendothelial matrix and helps recruit platelets.","Red cells are not its source or exclusive location.","It circulates in plasma and is stored in endothelial cells and platelet granules before clotting."]},{"id":"midterm3-q0787","topic":"hemostasis","q":"What is the effect of factor V Leiden?","opts":["Prolonged PT","Increased risk of venous thrombosis","Spontaneous bleeding","Shortened aPTT as its characteristic finding"],"correct":[1],"why":"Factor V Leiden makes activated factor V resistant to cleavage by activated protein C.","src":"Copy of Czech Ws was 3.pdf, p. 15 \u00b7 q0787","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The mutation alters regulation of factor Va, and routine PT is usually normal.","Resistance to activated protein C prolongs factor Va activity and increases venous thrombosis risk.","Persistent factor Va activity favors clotting rather than bleeding.","Routine aPTT shortening is not the characteristic diagnostic finding."]},{"id":"midterm3-q0795","topic":"liver","q":"Which inherited disorders can cause chronic liver damage?","opts":["Wilson disease","Hereditary hemochromatosis","Alpha-1 antitrypsin deficiency","Inherited hemophilia A as a direct cause of cirrhosis"],"correct":[0,1,2],"why":"Copper accumulation, iron overload, and hepatocyte retention of abnormal alpha-1 antitrypsin can injure the liver.","src":"Copy of Czech Ws was 3.pdf, p. 44 \u00b7 q0795","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Impaired biliary copper excretion leads to copper accumulation in hepatocytes.","Iron loading can cause chronic oxidative injury and fibrosis.","Misfolded alpha-1 antitrypsin can accumulate in hepatocytes.","Factor VIII deficiency causes bleeding. It does not directly produce chronic hepatocyte injury."]},{"id":"midterm3-q0801","topic":"immunity","q":"Which cell releases preformed mediators immediately after allergen cross-links receptor-bound IgE?","opts":["Mast cell","Erythrocyte","Megakaryocyte","Hepatocyte"],"correct":[0],"why":"Mast cells carry Fc\u03b5RI-bound IgE and degranulate after antigen-dependent cross-linking.","src":"Copy of Czech Ws was 3.pdf, p. 61 \u00b7 q0801","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Mast cells bind IgE via Fc\u03b5RI and can degranulate within minutes of cross-linking.","Erythrocytes transport oxygen and do not have mast-cell granules.","Megakaryocytes produce platelets.","Hepatocytes synthesize plasma proteins and do not mediate rapid IgE degranulation."]},{"id":"midterm3-q0814","topic":"immunity","q":"Autoimmune reactions against cell surface receptors","opts":["It is a typical cause anaphylactic reactions","It is described as a reacti on"],"correct":[0,1,2],"why":"HIV and malnutrition cause secondary immune dysfunction. Selective IgA deficiency is primary, and eosinophilia can accompany allergic disease.","src":"Copy of Czech Ws was 3.pdf, p. 121 \u00b7 q0816","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The virus uses CD4 and a coreceptor for entry and can deplete helper T cells.","Nutrient deficiency can impair barrier integrity and immune cell function.","Selective IgA deficiency is a primary antibody deficiency.","Eosinophils commonly participate in allergic inflammation."]},{"id":"midterm3-q1532","topic":"immunity","q":"A translocation places MYC under an immunoglobulin enhancer. Which disease is the classic example?","opts":["Burkitt lymphoma","Iron deficiency anemia","Systemic lupus erythematosus","Polycythemia vera"],"correct":[0],"why":"The immunoglobulin enhancer drives inappropriate MYC expression in the B cell.","src":"Copy of Czech Ws was 3.pdf, p. 132 \u00b7 q1532","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["The classic translocation places MYC near an immunoglobulin locus, increasing MYC expression in B cells.","Iron depletion limits hemoglobin synthesis.","Lupus is driven by loss of self-tolerance and immune responses to self antigens.","Polycythemia vera commonly involves a JAK2 mutation and autonomous myeloid proliferation."]},{"id":"midterm3-q0917","topic":"blood","q":"Which neutrophil function is impaired in lazy leukocyte syndrome?","opts":["Oxidative burst","Chemotaxis","Antibody production","Complement activation"],"correct":[1],"why":"This disorder impairs directed neutrophil migration.","src":"Copy of Czech Ws was 3.pdf, p. 189 \u00b7 q0917 \u00b7 Ulvi PDF, p. 169 \u00b7 q0917","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A defective oxidative burst is characteristic of chronic granulomatous disease.","The neutrophils have difficulty following chemical gradients to sites of infection.","Plasma cells produce antibodies.","Complement activation is a plasma protein cascade."]},{"id":"midterm3-q1189","topic":"blood","q":"What red cell pattern is typical of anemia due to reduced erythropoietin in chronic kidney disease?","opts":["Normocytic hypoproliferative anemia","Severe macrocytosis from impaired DNA synthesis","Hypochromic microcytosis in every case","Reticulocytosis from marrow overstimulation"],"correct":[0],"why":"Reduced renal erythropoietin lowers marrow red cell production without directly impairing hemoglobin synthesis or DNA replication.","src":"Copy of Czech Ws was 3.pdf, p. 190 \u00b7 q1189","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced EPO lowers erythrocyte production, so the marrow response is inadequate and MCV is usually normal.","Megaloblastic macrocytosis suggests impaired DNA synthesis, such as B12 deficiency.","Iron deficiency can coexist, but reduced EPO itself does not require microcytosis.","An inadequate EPO signal does not produce a robust reticulocyte response."]},{"id":"midterm3-q0023","topic":"immunity","q":"Which findings can result from a systemic type I hypersensitivity reaction?","opts":["Bronchospasm","Diarrhea","Distributive shock","Delayed granuloma formation as its defining manifestation"],"correct":[0,1,2],"why":"Mast-cell mediators affect the airways, gut, and circulation.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0023","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammatory mediators such as leukotrienes contract airway smooth muscle.","Mediator effects on the gut can increase secretion and motility.","Systemic vasodilation and capillary leakage reduce effective circulating volume.","Granuloma formation develops through sustained cell-mediated inflammation."]},{"id":"midterm3-q0027","topic":"liver","q":"Which statements about cirrhosis are correct?","opts":["Can cause secondary immunodeficiency","Can develop as a complication of nonalcoholic fatty liver disease","Is a risk factor for hypoaldosteronism","Is a risk factor for hypoglycemia","Often develops as a complication of viral hepatitis A"],"correct":[0,1,3],"why":"Cirrhosis can impair immune defenses and glucose regulation. Steatotic liver disease can progress to cirrhosis. Hepatitis A does not establish chronic infection.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0027","conf":"key","seen":2,"recall":false,"scored":true,"optionWhy":["Advanced liver disease can impair innate and adaptive immune defenses.","Steatotic liver disease can progress through inflammation and fibrosis to cirrhosis.","Effective arterial underfilling commonly activates aldosterone rather than suppressing it.","Loss of hepatic reserve can impair glycogen storage and glucose production.","Hepatitis A generally does not establish the chronic infection that drives progressive fibrosis."]},{"id":"midterm3-q0028","topic":"hemostasis","q":"Which statement is correct about platelet dysfunction?","opts":["Can be caused by aspirin","aPTT is prolonged","INR is prolonged","Can be treated by heparin","D-dimer level is increased"],"correct":[0],"why":"Aspirin lowers platelet thromboxane A\u2082 production. PT and aPTT measure plasma coagulation rather than platelet aggregation.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0028","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Aspirin irreversibly inhibits platelet COX-1 and lowers thromboxane A\u2082 production.","aPTT measures plasma clotting pathways, rather than platelet aggregation.","INR is derived from PT and does not directly measure platelet dysfunction.","Heparin enhances antithrombin and does not restore platelet function.","D-dimer reflects cross-linked fibrin turnover."]},{"id":"midterm3-q0030","topic":"blood","q":"Which statements about leukocytes in inflammation are correct?","opts":["During degranulation, mast cells release histamine, heparin and serotonin","Ne "Factor IX deficiency impairs activity of the intrinsic pathway.","Unfractionated heparin enhances antithrombin activity and can prolong aPTT."]},{"id":"midterm3-q0040","topic":"liver","q":"Liver cirrhosis","opts":["Often develops as complication of hepatitis type A","Is a risk factor for hypoglycemia","May cause secondary hyperaldosteronism","Can develop as complication of nonalcoholic fatty liver disease","Can cause secondary immunodeficiency"],"correct":[1,2,3,4],"why":"Loss of glycogen reserve and gluconeogenic capacity can predispose to hypoglycemia. Splanchnic vasodilation lowers effective arterial volume and can activate the renin\u2013angiotensin\u2013aldosterone system. Steatotic liver disease can progress through inflammation and fibrosis to cirrhosis. Advanced cirrhosis can impair innate and adaptive immune defenses.","src":"3rd test Lian.docx.pdf, p. 4 \u00b7 q0191","conf":"key","seen":2,"recall":false,"scored":true,"optionWhy":["Hepatitis A generally does not produce chronic hepatitis.","Loss of glycogen reserve and gluconeogenic capacity can predispose to hypoglycemia.","Splanchnic vasodilation lowers effective arterial volume and can activate the renin\u2013angiotensin\u2013aldosterone system.","Steatotic liver disease can progress through inflammation and fibrosis to cirrhosis.","Advanced cirrhosis can impair innate and adaptive immune defenses."]},{"id":"midterm3-q0044","topic":"liver","q":"Laboratory blood tests in patients with acute pancreatitis developed due to alcohol consumption will usually show","opts":["Decreased level of leukocytes","Increased amylase level","Increased level of Ca2+","Increased lipase level","Increased GGT level"],"correct":[1,3,4],"why":"Amylase may rise after acinar injury, although it can be normal in alcohol-associated attacks. Lipase rises with pancreatic injury and is generally preferred for assessing acute pancreatitis. The paper includes GGT, which can rise with alcohol exposure or hepatobiliary disease. It is not a marker of pancreatic injury itself.","src":"3rd test Lian.docx.pdf, p. 4 \u00b7 q0190","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Acute inflammation can raise leukocyte counts rather than routinely decrease them.","Amylase may rise after acinar injury, although it can be normal in alcohol-associated attacks.","A rise in calcium is not a typical result. Severe pancreatitis can lower calcium.","Lipase rises with pancreatic injury and is generally preferred for assessing acute pancreatitis.","The paper includes GGT, which can rise with alcohol exposure or hepatobiliary disease. It is not a marker of pancreatic injury itself."]},{"id":"midterm3-q0045","topic":"hemostasis","q":"Leiden mutation is","opts":["Factor V decreased resistance to degradation by protein C action, leading to activation of coagulation cascade","Factor V increased resistance to degradation by protein C action, leading to activation of fibrinolysis","Factor V increased resistance to degradation by protein C action, leading to activation of coagulation cascade","In asymptomatic patients measurement of D-dimers is important for diagnosis","Factor V decreased resistance to degradation by protein C action, leading to activation of fibrinolysis"],"correct":[2],"why":"Factor Va remains active longer because it resists cleavage by activated protein C.","src":"3rd test Lian.docx.pdf, p. 3 \u00b7 q0188","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["The mutation decreases susceptibility to degradation, rather than decreasing resistance.","Resistance to degradation increases procoagulant activity, rather than activating fibrinolysis.","Factor Va remains active longer because it resists cleavage by activated protein C.","D-dimer reflects fibrin breakdown and does not diagnose the inherited mutation.","Decreased resistance would favor more rapid inactivation of factor Va."]},{"id":"midterm3-q0227","topic":"blood","q":"Which statements about anemia are correct?","opts":["A hyperdynamic circulation can compensate for reduced oxygen delivery","Occult bleeding can lead to iron deficiency anemia","Hemolytic anemias characterized by increased level of conjugated bilirubin and normal level of unconjugated bilirubin","Iron deficiency anemia is usually macrocytic","Anemia of chronic diseases associated with decreased level of ferritin"],"correct":[0,1],"why":"A higher cardiac output can partly compensate for reduced oxygen-carrying capacity. Chronic occult bleeding can deplete iron stores.","src":"D8F043B3-4693-45BD-810F-8CAF38873756.pdf.pdf, p. 2 \u00b7 q0227","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["A rise in cardiac output can partly offset reduced arterial oxygen content.","Repeated blood loss removes iron contained in hemoglobin.","Heme breakdown typically raises unconjugated bilirubin.","Iron restriction limits hemoglobin synthesis and tends toward microcytosis.","Inflammation can raise ferritin even when serum iron and transferrin saturation are low."]},{"id":"midterm3-q0228","topic":"liver","q":"Which laboratory patterns can occur in advanced cirrhosis?","opts":["Increased ammonia","Increased conjugated bilirubin","A reliably normal platelet count","A mandatory 40-fold rise in both AST and ALT"],"correct":[0,1],"why":"Reduced hepatic clearance and shunting can increase ammonia. Impaired bilirubin processing can raise the conjugated fraction, and severe dysfunction need not produce extreme aminotransferase elevations.","src":"D8F043B3-4693-45BD-810F-8CAF38873756.pdf.pdf, p. 3 \u00b7 q0228","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Shunting and reduced hepatic detoxification can increase circulating ammonia.","Impaired excretion of conjugated bilirubin can raise its plasma concentration.","Portal hypertension and reduced thrombopoietin can lower the count.","Advanced cirrhosis can exist with modest or near-normal aminotransferase values."]},{"id":"midterm3-q0230","topic":"hemostasis","q":"25-year old patient with severe GIT bleeding is at risk of the disseminated intravascular coagulation syndrome (DIC). Which laboratory test/s is/are important for diagnostics of a DIC?","opts":["Fibrinogen concentration","Albumin concentration","Platelet count","D-dimers concentration","Erythrocyte count"],"correct":[0,2,3],"why":"Fibrinogen can fall as it is consumed during clot formation. Platelets are consumed in widespread coagulation. D-dimers rise when cross-linked fibrin is broken down.","optionWhy":["Fibrinogen can fall as it is consumed during clot formation.","Albumin does not measure the consumption of clotting factors or platelets.","Platelets are consumed in widespread coagulation.","D-dimers rise when cross-linked fibrin is broken down.","The erythrocyte count can reflect blood loss, but does not measure the coagulation process."],"src":"\u05de\u05d1\u05d7\u05e0\u05d9 \u05e2\u05d1\u05e8 \u05e1\u05de\u05e1\u05d8\u05e8 \u05d0_ \u05dc\u05dc\u05d0 \u05d4\u05e7\u05e8\u05d3\u05d9\u05d8.pdf.pdf, p. 55 \u00b7 q1152","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1281","topic":"hemostasis","q":"Which factors make up Virchow's triad?","opts":["Endothelial injury","Abnormal blood flow","Hypercoagulability","Increased fibrinolysis"],"correct":[0,1,2],"why":"Vessel injury, stasis or turbulence, and increased coagulability promote thrombosis.","src":"Open qs 3.pdf, p. 1 \u00b7 q1281","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Endothelial damage exposes procoagulant surfaces and can activate platelets.","Stasis or turbulence can promote coagulation and impair clearance of activated factors.","A shift toward procoagulant activity raises thrombus risk.","Fibrinolysis removes fibrin and is not a component of the triad."]},{"id":"midterm3-q1285","topic":"liver","q":"What pattern is expected in jaundice due to isolated hemolysis?","opts":["Increased unconjugated bilirubin","Absent bilirubinuria","Urinary urobilinogen can increase","A marked increase in conjugated bilirubin is the defining change"],"correct":[0,1,2],"why":"Excess heme breakdown raises the unconjugated fraction, which is albumin-bound and cannot enter urine directly.","src":"Open qs 3.pdf, p. 1 \u00b7 q1285","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Accelerated heme breakdown raises unconjugated bilirubin production.","Unconjugated bilirubin is albumin-bound and is not filtered into urine.","More pigment can reach the gut, increasing formation and urinary excretion of urobilinogen.","A predominantly conjugated rise suggests impaired excretion or cholestasis."]},{"id":"midterm3-q1304","topic":"hemostasis","q":"How can a venous clot cause a paradoxical arterial embolism?","opts":["It crosses a right-to-left shunt","It travels through an intact pulmonary capillary bed by its usual route","It first becomes an immune complex","It must originate in the left ventricle"],"correct":[0],"why":"A right-to-left communication can let venous embolic material bypass the pulmonary circulation.","src":"Open qs 3.pdf, p. 1 \u00b7 q1304","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A right-to-left communication lets venous embolic material reach systemic arteries.","An intact pulmonary circulation typically traps larger venous emboli.","Immune complexes are antigen\u2013antibody aggregates and are not required for clot embolization.","A paradoxical embolus starts on the venous side."]},{"id":"midterm3-q1325","topic":"liver","q":"Which mechanisms favor cholesterol gallstone formation?","opts":["Cholesterol supersaturation of bile","Gallbladder hypomotility","Crystal nucleation","Rapid and complete gallbladder emptying as a risk factor"],"correct":[0,1,2],"why":"Supersaturation permits cholesterol crystallization, and stasis supports growth of stones.","src":"Open qs 3.pdf, p. 2 \u00b7 q1325","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Excess cholesterol relative to bile salts and phospholipids makes bile prone to crystallization.","Slow emptying allows crystals to remain and grow.","Nucleation initiates formation of cholesterol crystals.","Effective emptying reduces stasis."]},{"id":"midterm3-q0947","topic":"blood","q":"Which measurement usually remains normal in isolated anemia?","opts":["Arterial oxygen content","Hemoglobin concentration","Arterial oxygen partial pressure","Red cell mass"],"correct":[2],"why":"Anemia reduces the amount of hemoglobin available to carry oxygen. It does not directly lower dissolved arterial oxygen pressure.","src":"Selected.pdf, p. 6 \u00b7 q0947","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Low hemoglobin reduces arterial oxygen content even when arterial oxygen pressure is normal.","Low hemoglobin is the defining finding.","Arterial oxygen partial pressure reflects dissolved oxygen and pulmonary gas exchange. Isolated anemia changes oxygen carriage.","True anemia lowers circulating red cell mass, although dilution can lower measured hemoglobin without that mechanism."]},{"id":"midterm3-q0948","topic":"immunity","q":"Which cells directly mediate cytotoxic tissue injury in type IV hypersensitivity?","opts":["IgE-producing plasma cells","Mast cells","Cytotoxic T cells","Eosinophils"],"correct":[2],"why":"Type IV hypersensitivity is T-cell mediated. Cytotoxic T cells directly injure target cells in some forms.","src":"Selected.pdf, p. 7 \u00b7 q0948","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["IgE-producing cells contribute to type I sensitization.","Mast cells drive rapid IgE-associated reactions.","CD8 T cells can recognize antigen on target cells and directly induce cell death.","Eosinophils are associated with allergic inflammation and helminth defense."]},{"id":"midterm3-q0949","topic":"blood","q":"Mean erythrocyte volume (MCV) is in aplastic anemia","opts":["increased","normal","70-83 femtoliters","reduced"],"correct":[1],"why":"Marrow failure reduces the number of blood cells produced. The red cells can remain normal in size.","src":"Selected.pdf, p. 12 \u00b7 q1638","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Aplastic anemia can sometimes be mildly macrocytic. The scan selects the usual normocytic classification.","Marrow failure reduces the number of blood cells produced. The red cells can remain normal in size.","This interval includes microcytic values and is not a characteristic range for aplastic anemia.","Microcytosis suggests an additional or alternative process such as iron deficiency."]},{"id":"midterm3-q0950","topic":"liver","q":"Primary biliary cirrhosis is not:","opts":["consequence of portal hypertension","Liver damage due to the action of chemotoxic substances","primary liver damage as a result of the effects of alcohol","autoimmune disease"],"correct":[0,1,2],"why":"Portal hypertension can develop as a complication of advanced primary biliary cholangitis. Toxic injury has a different mechanism. The initiating injury here is immune-mediated damage to small intrahepatic bile ducts. Alcohol-associated liver injury is a separate cause of cirrhosis. Alcohol exposure does not define this bile duct disease.","src":"Selected.pdf, p. 2 \u00b7 q1626","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Portal hypertension can develop as a complication of advanced primary biliary cholangitis.","Toxic injury has a different mechanism. The initiating injury here is immune-mediated damage to small intrahepatic bile ducts.","Alcohol-associated liver injury is a separate cause of cirrhosis. Alcohol exposure does not define this bile duct disease.","Primary biliary cirrhosis is the older name for primary biliary cholangitis, an autoimmune disease. The negative stem excludes this true description."]},{"id":"midterm3-q0951","topic":"blood","q":"Choose the incorrect statement for iron deficiency","opts":["is accompanied by low transferrin saturation","is accompanied by a high concentration of serum ferritin","leads to microcytic and hypochromic anemia","can result from frequent bleeding"],"correct":[1],"why":"Ferritin generally falls when iron stores are depleted. Inflammation can sometimes obscure the expected low value.","src":"YE.pdf.pdf, p. 77 \u00b7 q0867","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Circulating iron falls relative to total iron-binding capacity, lowering transferrin saturation.","Ferritin generally falls when iron stores are depleted. Inflammation can sometimes obscure the expected low value.","Reduced hemoglobin synthesis can yield small, pale red cells.","Chronic blood loss depletes iron stores over time."]},{"id":"midterm3-q0954","topic":"immunity","q":"Type 2 allergic reaction","opts":["is caused by IgG antibodies only","is directed against antigens carried on the membrane of the organism's own cells, which manifests itself, for example, as hemolytic anemia, thrombocytopenia","is also called delayed hypersensitivity","is caused by excessive production of IgE"],"correct":[1],"why":"Cell-targeted antibodies can promote opsonization or complement-mediated injury, as in autoimmune hemolysis or immune thrombocytopenia.","src":"YE.pdf.pdf, p. 138 \u00b7 q1551","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Type II reactions can involve IgM as well as IgG.","Cell-targeted antibodies can promote opsonization or complement-mediated injury, as in autoimmune hemolysis or immune thrombocytopenia.","Delayed hypersensitivity is classically type IV and T-cell mediated.","IgE is the classic mediator of type I hypersensitivity."]},{"id":"midterm3-q0957","topic":"blood","q":"Which changes explain iron restriction in anemia of chronic inflammation?","opts":["Increased hepatic hepcidin production","Accelerated export of iron from macrophages","Reduced ferroportin-mediated iron export","Increased intestinal iron absorption"],"correct":[0,2],"why":"Hepcidin reduces ferroportin activity, retaining iron in macrophages and limiting delivery to the marrow.","src":"Selected.pdf, p. 45 \u00b7 q0957 \u00b7 Ulvi PDF, p. 230 \u00b7 q0957","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammatory signaling, particularly IL-6, raises hepatic hepcidin production.","Hepcidin impairs iron release from macrophages.","Hepcidin causes ferroportin internalization, holding iron inside storage cells.","Loss of intestinal ferroportin reduces iron transfer into blood."]},{"id":"midterm3-q0958","topic":"hemostasis","q":"Which pair consists of inherited bleeding disorders?","opts":["Factor V Leiden and antithrombin deficiency","Hemophilia A and von Willebrand disease","DIC and liver failure","Hypersplenism and immune thrombocytopenia"],"correct":[1],"why":"Hemophilia A affects factor VIII, while inherited von Willebrand disease affects platelet adhesion and can reduce circulating factor VIII.","src":"Selected.pdf, p. 46 \u00b7 q0958","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Both changes increase thrombosis risk by impairing anticoagulant regulation.","Hemophilia reduces factor VIII activity, while von Willebrand disease impairs platelet adhesion and can lower factor VIII.","Both can cause acquired coagulopathy.","Both can reduce the platelet count through acquired processes."]},{"id":"midterm3-q0960","topic":"liver","q":"They contribute to the formation of ascites in liver failure","opts":["increased blood flow through the splanchnic area","secondary disorder of aldosterone metabolism","hyperbilirubinemia","relative hyperalbuminemia during paradoxical dehydration"],"correct":[0,1],"why":"Splanchnic vasodilation increases portal inflow and reduces effective arterial blood volume. Secondary hyperaldosteronism promotes renal sodium retention and fluid accumulation.","src":"YE.pdf.pdf, p. 132 \u00b7 q0881","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Splanchnic vasodilation increases portal inflow and reduces effective arterial blood volume.","Secondary hyperaldosteronism promotes renal sodium retention and fluid accumulation.","Hyperbilirubinemia reflects impaired bilirubin handling and does not directly drive ascites.","Hypoalbuminemia can contribute to ascites by lowering plasma oncotic pressure."]},{"id":"midterm3-q0844","topic":"blood","q":"Which conditions can produce microcytic or hypochromic red cells?","opts":["Folate deficiency","Sideroblastic anemia","Vitamin B12 deficiency","Iron deficiency","Lead toxicity"],"correct":[1,3,4],"why":"Defects in heme production or reduced iron availability can reduce hemoglobin content and cell size.","src":"Selected.pdf, p. 50 \u00b7 q0844","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Folate deficiency impairs DNA synthesis, producing megaloblastic macrocytosis.","Defective heme synthesis can yield hypochromic or microcytic cells.","B12 deficiency impairs nuclear maturation and usually causes macrocytosis.","Insufficient iron limits hemoglobin synthesis, reducing cell size and hemoglobin content.","Lead interferes with heme synthesis and can produce microcytosis."]},{"id":"midterm3-q0961","topic":"liver","q":"Hepatic encephalopathy","opts":["is a syndrome characterized by disorders of consciousness and neuromuscular activity","arises in patients with hyperuricemia","is a syndrome characterized by impaired consciousness and hemolysis","arises in patients with hepatocellular failure"],"correct":[0,3],"why":"Hepatic encephalopathy can produce altered attention or consciousness and motor findings such as asterixis. Hepatocellular failure allows ammonia and other gut-derived substances to reach the systemic circulation and affect brain function.","src":"Selected.pdf, p. 51 \u00b7 q0963","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hepatic encephalopathy can produce altered attention or consciousness and motor findings such as asterixis.","Hyperuricemia is not the defining cause. The relevant mechanisms include impaired hepatic detoxification and portosystemic shunting.","Consciousness can be impaired, but hemolysis is not a defining feature.","Hepatocellular failure allows ammonia and other gut-derived substances to reach the systemic circulation and affect brain function."]},{"id":"midterm3-q1536","topic":"blood","q":"Which cell sources can be used for an allogeneic hematopoietic stem cell transplant?","opts":["A genetically distinct related human donor","The patient's own cells","A genetically distinct unrelated human donor","An animal donor"],"correct":[0,2],"why":"Allogeneic means the donor is another person. The patient's own cells are autologous.","src":"Selected.pdf, p. 56 \u00b7 q1536","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["A genetically distinct relative can donate cells for allogeneic transplantation.","Using the patient's own cells is autologous transplantation.","A suitably matched unrelated human donor is also an allogeneic source.","Transplantation across species is xenogeneic."]},{"id":"midterm3-q0845","topic":"liver","q":"Which is least characteristic of decompensated cirrhosis?","opts":["Hepatic encephalopathy","Ascites","Prolonged PT","Isolated dehydration as the defining feature"],"correct":[3],"why":"Decompensation presents with major complications of hepatic dysfunction and portal hypertension, including ascites and encephalopathy.","src":"Selected.pdf, p. 62 \u00b7 q0845 \u00b7 Ulvi PDF, p. 250 \u00b7 q0845","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Neurologic dysfunction from impaired detoxification is a major manifestation of decompensation.","Ascites is a common sign of decompensation and portal hypertension.","Reduced coagulation factor synthesis can prolong PT.","Dehydration can coexist or precipitate symptoms, but it does not define decompensation."]},{"id":"midterm3-q0846","topic":"blood","q":"Which lab findings support hemolysis?","opts":["Elevated LDH","Low haptoglobin","Elevated unconjugated bilirubin","Unconjugated bilirubin filtered into the urine"],"correct":[0,1,2],"why":"Red cell destruction releases LDH and hemoglobin. Heme breakdown raises unconjugated bilirubin, which remains albumin-bound in plasma.","src":"Selected.pdf, p. 78 \u00b7 q0846","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Red cell destruction releases LDH.","Haptoglobin binds free hemoglobin and is consumed, especially in intravascular hemolysis.","More heme breakdown produces more unconjugated bilirubin.","Albumin-bound unconjugated bilirubin cannot enter urine by glomerular filtration."]},{"id":"midterm3-q1541","topic":"liver","q":"Which bilirubin change is least characteristic of isolated cholestasis?","opts":["Increase in conjugated bilirubin","Increase in unconjugated bilirubin","Increase GGT","Increase ALP"],"correct":[1],"why":"Impaired bile flow chiefly raises conjugated bilirubin. ALP and GGT can also rise in hepatobiliary cholestasis.","src":"TEST 3 GIT.doc.pdf, p. 1 \u00b7 q1541","conf":"key","seen":1,"recall":true,"scored":true,"optionWhy":["Bilirubin that has already been conjugated accumulates when excretion into bile is impaired.","Isolated cholestasis primarily increases the conjugated fraction.","GGT commonly rises alongside ALP in hepatobiliary cholestasis.","ALP commonly rises with bile duct or canalicular dysfunction."]},{"id":"midterm3-q1542","topic":"liver","q":"Which finding is least characteristic of hemolytic jaundice?","opts":["Reticulocytosis","Anaemia","Decreased survival of RBCs","Pale stool"],"correct":[3],"why":"Reticulocytosis can reflect the marrow response to hemolysis. Pale stools instead suggest reduced delivery of bile pigments to the intestine.","src":"TEST 3 GIT.doc.pdf, p. 1 \u00b7 q1542","conf":"key","seen":1,"recall":true,"scored":true,"optionWhy":["Marrow usually releases more reticulocytes to compensate for red-cell destruction.","Accelerated destruction can reduce circulating hemoglobin.","Shortened red-cell survival is central to hemolysis.","Pale stool suggests reduced bile pigment delivery, as in major biliary obstruction."]},{"id":"midterm3-q1543","topic":"liver","q":"Which urinary finding can occur in hepatocellular jaundice?","opts":["Conjugated bilirubin in urine","Direct filtration of albumin-bound unconjugated bilirubin","Obligate absence of urine urobilinogen in all cases","Urine bilirubin proves isolated hemolysis"],"correct":[0],"why":"Conjugated bilirubin is water soluble. Urinary urobilinogen varies with hepatic clearance and bile flow.","src":"TEST 3 GIT.doc.pdf, p. 1 \u00b7 q1543","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Water-soluble conjugated bilirubin can spill into urine when hepatic excretion is impaired.","Albumin-bound unconjugated bilirubin is not appreciably filtered.","Urobilinogen may vary with intestinal pigment delivery and hepatic handling.","Bilirubinuria points to circulating conjugated bilirubin rather than isolated hemolysis."]},{"id":"midterm3-q0062","topic":"liver","q":"What are typical consequences of exocrine pancreatic insufficiency?","opts":["Steatorrhea","Fat-soluble vitamin deficiency","Increased capacity to digest dietary fat","Elevated production of pancreatic enzymes"],"correct":[0,1],"why":"Lack of pancreatic digestive enzymes causes maldigestion. Fat malabsorption can lead to steatorrhea and deficiencies of vitamins A, D, E, and K.","src":"TEST 3 GIT.doc.pdf, p. 3 \u00b7 q0062","conf":"inferred","seen":1,"recall":true,"scored":true,"optionWhy":["Low pancreatic lipase activity causes fat maldigestion and greasy stools.","Poor fat absorption can reduce uptake of vitamins A, D, E and K.","Fat digestion worsens when pancreatic enzyme output falls.","Exocrine insufficiency means less effective enzyme delivery to the intestinal lumen."]},{"id":"midterm3-q0064","topic":"liver","q":"Which results best distinguish a predominantly cholestatic from a predominantly hepatocellular pattern?","opts":["Relative elevations of ALP and GGT versus AST and ALT","Total bilirubin alone","Hemoglobin alone","Isolated serum sodium"],"correct":[0],"why":"ALP and GGT predominate in cholestasis, while AST and ALT usually predominate in hepatocellular injury.","src":"TEST 3 GIT.doc.pdf, p. 3 \u00b7 q0064","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Aminotransferase predominance suggests hepatocyte injury, while disproportionate ALP with GGT supports cholestasis.","Bilirubin can rise in both patterns.","Hemoglobin assesses anemia and does not distinguish the two hepatic patterns.","Sodium reflects fluid balance and does not localize hepatic injury."]},{"id":"midterm3-q0067","topic":"liver","q":"Which can contribute to bleeding abnormalities in advanced liver disease?","opts":["Reduced synthesis of clotting factors","Platelet sequestration from hypersplenism","Obligate elevation of platelet count","Increased synthesis of every clotting factor"],"correct":[0,1],"why":"Hepatic synthetic dysfunction can lower factor activity, and portal hypertension can reduce the circulating platelet count.","src":"TEST 3 GIT.doc.pdf, p. 4 \u00b7 q0067","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hepatic failure can reduce plasma coagulation factor activity.","Portal hypertension can enlarge the spleen and lower circulating platelet counts.","Thrombocytopenia is common, and a rise is not obligatory.","Synthesis of many clotting factors can decline as hepatic reserve falls."]},{"id":"midterm3-q0071","topic":"liver","q":"Which systemic complications can occur in severe acute pancreatitis?","opts":["Circulatory shock","Acute respiratory distress syndrome","Acute kidney injury","Isolated chronic hyperalbuminemia as the defining complication"],"correct":[0,1,2],"why":"Severe pancreatic inflammation can produce capillary leakage, systemic inflammation, and multiorgan dysfunction.","src":"TEST 3 GIT.doc.pdf, p. 4 \u00b7 q0071","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammation and capillary leakage can reduce circulating volume and tissue perfusion.","Systemic inflammation can injure pulmonary capillaries and cause permeability edema.","Hypoperfusion and systemic inflammation can injure the kidneys.","Albumin is not characteristically increased as a defining systemic complication."]},{"id":"midterm3-q0095","topic":"liver","q":"Which changes favor hepatic triglyceride accumulation?","opts":["Increased fatty acid delivery to the liver","Increased hepatic lipogenesis","Reduced fatty acid oxidation or lipid export","A large sustained increase in lipid export relative to production"],"correct":[0,1,2],"why":"Steatosis develops when hepatic lipid input and synthesis exceed oxidation and export.","src":"TEST 3.docx (1).pdf, p. 1 \u00b7 q0095","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Greater delivery of circulating fatty acids increases the substrate available for triglyceride synthesis.","Increased production of fatty acids supplies more substrate for storage.","Reduced oxidation or impaired VLDL export leaves more lipid inside hepatocytes.","Effective export removes lipid from the liver and reduces accumulation."]},{"id":"midterm3-q0096","topic":"liver","q":"How does the healthy liver detoxify much of the ammonia arriving from the gut?","opts":["It converts nitrogen to urea through the urea cycle","It converts ammonia directly to bilirubin","It secretes ammonia as albumin","It uses erythropoietin to neutralize ammonia"],"correct":[0],"why":"Urea is less toxic and can be excreted by the kidneys.","src":"TEST 3.docx (1).pdf, p. 1 \u00b7 q0096","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hepatocytes incorporate ammonia-derived nitrogen into urea for renal excretion.","Bilirubin comes from heme breakdown.","Albumin is a hepatic transport protein, not the main means of disposing of ammonia nitrogen.","Erythropoietin regulates red-cell production."]},{"id":"midterm3-q0108","topic":"liver","q":"Which presentations can occur in porphyrias, depending on subtype?","opts":["Acute neurovisceral attacks with abdominal pain","Cutaneous photosensitivity","A defining increase in factor VIII activity","Obligate obstructive jaundice in every subtype"],"correct":[0,1],"why":"Accumulated intermediates of heme synthesis differ by enzyme defect, producing different clinical syndromes.","src":"TEST 3.docx (1).pdf, p. 2 \u00b7 q0108","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Some acute porphyrias cause severe abdominal pain and neurologic manifestations.","Accumulated porphyrins can react to light and damage exposed skin.","Porphyrias are disorders of heme synthesis rather than factor VIII regulation.","Biliary obstruction does not define porphyria and is not required."]},{"id":"midterm3-q0110","topic":"liver","q":"Which can cause acute liver failure?","opts":["Severe acetaminophen toxicity","Acute viral hepatitis","Ischemic hepatic injury","Uncomplicated Gilbert syndrome"],"correct":[0,1,2],"why":"Massive or severe acute hepatocellular injury can impair synthesis and lead to encephalopathy.","src":"TEST 3.docx (1).pdf, p. 2 \u00b7 q0110","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Accumulation of the reactive metabolite NAPQI can cause extensive hepatocyte necrosis.","Acute viral injury can occasionally cause severe loss of hepatic function.","Insufficient oxygen delivery can cause widespread hepatocellular injury.","Gilbert syndrome produces mild unconjugated hyperbilirubinemia with preserved liver function."]},{"id":"midterm3-q0116","topic":"liver","q":"What can excess ammonia promote in astrocytes during acute liver failure?","opts":["Glutamine accumulation and cellular swelling","Immediate bilirubin conjugation","Erythropoietin release as the main response","Synthesis of factor VIII as the defining response"],"correct":[0],"why":"Astrocytes metabolize ammonia to glutamine. Osmotic and metabolic effects contribute to swelling.","src":"TEST 3.docx (1).pdf, p. 2 \u00b7 q0116","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Astrocytes incorporate ammonia into glutamine. Intracellular accumulation contributes to swelling.","Bilirubin conjugation is performed by hepatic UGT1A1.","Erythropoietin is primarily a renal response to hypoxia.","Production of coagulation factors does not explain ammonia-related astrocyte injury."]},{"id":"midterm3-q0982","topic":"blood","q":"Which vascular disorders can cause congestive splenomegaly?","opts":["Portal vein thrombosis","Isolated renal vein thrombosis","Splenic vein thrombosis","Budd\u2013Chiari syndrome"],"correct":[0,2,3],"why":"Portal, splenic, and hepatic venous obstruction can increase upstream portal-system pressure.","src":"TEST 3.docx.pdf, p. 18 \u00b7 q0982","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Portal vein obstruction raises upstream pressure and can congest the spleen.","Renal venous drainage is separate from splenic portal drainage.","Splenic vein obstruction directly impedes splenic drainage.","Hepatic venous outflow obstruction can raise portal pressure."]},{"id":"midterm3-q0985","topic":"hemostasis","q":"Thrombocytopenia","opts":["is often accompanied by increased thrombopoietin concentration in the blood","can be caused by hypersplenism","is a typical symptom of von Willebrand\u2019s disease","can be caused by an autoimmune process"],"correct":[0,1,3],"why":"Thrombopoietin may rise when platelet and megakaryocyte clearance decreases. Levels vary with the underlying cause and may not rise in cirrhosis. An enlarged spleen can sequester platelets and lower the circulating count. Immune thrombocytopenia can result from immune-mediated destruction and impaired platelet production.","src":"Test 3-all gathered.docx.pdf, p. 36 \u00b7 q0530","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Thrombopoietin may rise when platelet and megakaryocyte clearance decreases. Levels vary with the underlying cause and may not rise in cirrhosis.","An enlarged spleen can sequester platelets and lower the circulating count.","Most types of von Willebrand disease have a normal platelet count. Type 2B can be an exception.","Immune thrombocytopenia can result from immune-mediated destruction and impaired platelet production."]},{"id":"midterm3-q0986","topic":"hemostasis","q":"Congenital hypercoagulability disorders include","opts":["Leiden mutation","antithrombin III deficiency","resistance to protein S","polycythaemia vera"],"correct":[0,1],"why":"Factor V Leiden causes resistance to activated protein C and predisposes to venous thrombosis. Inherited antithrombin deficiency reduces inhibition of thrombin and factor Xa.","src":"Test 3-all gathered.docx.pdf, p. 36 \u00b7 q0531","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Factor V Leiden causes resistance to activated protein C and predisposes to venous thrombosis.","Inherited antithrombin deficiency reduces inhibition of thrombin and factor Xa.","Protein S deficiency, rather than the term resistance to protein S, is the established inherited thrombophilia.","Polycythemia vera is generally an acquired myeloproliferative neoplasm."]},{"id":"midterm3-q0990","topic":"hemostasis","q":"Which coagulation change can occur in the consumptive phase of DIC?","opts":["Prolonged aPTT","Increased platelet count","Falling D-dimer","Shortened PT as the defining finding"],"correct":[0],"why":"Consumption of coagulation factors can prolong PT and aPTT. Platelets may fall and D-dimer typically rises.","src":"TEST 3.docx.pdf, p. 19 \u00b7 q0990","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Consumption of clotting factors can prolong aPTT and PT.","Platelets are consumed in systemic clotting and often fall.","Breakdown of cross-linked fibrin t

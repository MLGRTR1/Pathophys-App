production cannot keep up with loss or destruction.","src":"YE.pdf.pdf, p. 101 \u00b7 q0875","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0876","topic":"immunity","q":"Which events can follow tissue deposition of soluble immune complexes?","opts":["Complement activation","Recruitment of inflammatory leukocytes","Local tissue injury","Immediate direct IgE cross-linking as the defining reaction"],"correct":[0,1,2],"why":"Type III hypersensitivity involves deposited immune complexes, complement, and recruited inflammatory cells.","src":"YE.pdf.pdf, p. 103 \u00b7 q0876","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1125","topic":"hemostasis","q":"Which findings are shared by thrombotic thrombocytopenic purpura and hemolytic uremic syndrome?","opts":["Thrombocytopenia","Microangiopathic hemolytic anemia","Red cell fragmentation on the blood film","Isolated factor VIII deficiency"],"correct":[0,1,2],"why":"Both are thrombotic microangiopathies. Small-vessel platelet thrombi consume platelets and shear red cells.","src":"midterm 3 long Copy.pdf, p. 18 \u00b7 q1125","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1131","topic":"hemostasis","q":"Which finding is more characteristic of defective secondary hemostasis than defective primary hemostasis?","opts":["Petechiae","Epistaxis","Hemarthrosis","Mucosal bleeding"],"correct":[2],"why":"Deep joint bleeding suggests a coagulation factor disorder. Platelet defects more often cause mucocutaneous bleeding.","src":"midterm 3 long Copy.pdf, p. 36 \u00b7 q1131","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1209","topic":"hemostasis","q":"What complex converts prothrombin into thrombin in the common pathway?","opts":["Factor Xa and factor Va assembled on a phospholipid surface","Factor XII and prekallikrein","Factor IXa and factor VIIIa alone","Plasmin with tPA"],"correct":[0],"why":"The Xa\u2013Va prothrombinase complex catalyzes thrombin formation.","src":"midterm 3 long Copy.pdf, p. 37 \u00b7 q1209","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1132","topic":"hemostasis","q":"Which disorder can lower factor VIII activity by reducing its stability in plasma?","opts":["Hemophilia B","Von Willebrand disease","Isolated vitamin K deficiency","Factor XI deficiency"],"correct":[1],"why":"Von Willebrand factor carries and stabilizes factor VIII in circulation.","src":"midterm 3 long Copy.pdf, p. 39 \u00b7 q1132","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1134","topic":"blood","q":"Which findings are characteristic of megaloblastic anemia due to B12 or folate deficiency?","opts":["Macrocytosis","Marrow megaloblasts","Uniform microcytosis","Accelerated nuclear maturation"],"correct":[0,1],"why":"Impaired DNA synthesis delays nuclear maturation and produces enlarged precursors.","src":"midterm 3 long Copy.pdf, p. 42 \u00b7 q1134","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1143","topic":"blood","q":"In which settings can anemia of chronic inflammation occur?","opts":["Chronic infection","Chronic inflammatory rheumatic disease","Isolated acute blood loss without inflammation as its defining cause","An isolated dietary folate deficiency"],"correct":[0,1],"why":"Sustained inflammatory cytokines alter iron handling and erythropoiesis.","src":"send rony.pdf, p. 19 \u00b7 q1143","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1211","topic":"liver","q":"Which statements describe hepatorenal syndrome?","opts":["It is primarily caused by direct nephrotoxicity from ammonia","It involves functional renal failure associated with advanced liver disease","It often occurs in cirrhosis with ascites","It starts as primary kidney disease that subsequently causes cirrhosis"],"correct":[1,2],"why":"Splanchnic vasodilation and reduced effective arterial filling contribute to renal vasoconstriction and impaired filtration.","src":"send rony.pdf, p. 29 \u00b7 q1211","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0126","topic":"immunity","q":"Which mechanism and example fit type III hypersensitivity?","opts":["Soluble immune complexes deposit and activate complement","Serum sickness is a classic example","It is initiated by allergen-specific IgE on mast cells","It requires antibodies against a fixed cell surface as its defining mechanism"],"correct":[0,1],"why":"Immune complexes can deposit in vessels and tissues and trigger complement-dependent inflammation.","src":"test 4 pp.docx, p. 1 \u00b7 q0126","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0130","topic":"blood","q":"Which complications can follow transfusion?","opts":["Acute hemolytic transfusion reaction","Transfusion-related acute lung injury","Transfusion-associated circulatory overload","An inherited factor V Leiden mutation"],"correct":[0,1,2],"why":"Transfusion complications can involve antibody-mediated hemolysis, inflammatory lung injury, or excess volume.","src":"test 4 pp.docx, p. 1 \u00b7 q0130","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0131","topic":"blood","q":"Which are intrinsic red-cell causes of hemolysis?","opts":["Hereditary spherocytosis","G6PD deficiency","Sickle cell disease","Mechanical fragmentation across a damaged valve"],"correct":[0,1,2],"why":"Intrinsic defects affect the red-cell membrane, enzymes, or hemoglobin. Mechanical injury is extrinsic.","src":"test 4 pp.docx, p. 1 \u00b7 q0131","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0139","topic":"immunity","q":"Which example illustrates destruction of a cell by antibodies directed against its surface antigens?","opts":["Autoimmune hemolytic anemia","Contact dermatitis","Serum sickness","Allergic rhinitis"],"correct":[0],"why":"Antibodies directed against red cell surface antigens can promote clearance or complement-mediated injury.","src":"test 4 pp.docx, p. 1 \u00b7 q0139","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0141","topic":"immunity","q":"Which example illustrates delayed T-cell-mediated hypersensitivity?","opts":["Allergic contact dermatitis","Acute IgE-mediated anaphylaxis","Serum sickness","Immediate allergic rhinitis"],"correct":[0],"why":"Contact allergens can produce delayed inflammation mediated by previously sensitized T cells.","src":"test 4 pp.docx, p. 1 \u00b7 q0141","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0149","topic":"immunity","q":"What immune defect is characteristic of DiGeorge syndrome?","opts":["T-cell deficiency due to thymic hypoplasia","Absent phagocyte oxidative burst as the primary defect","Terminal complement deficiency","Selective loss of platelet adhesion as the primary defect"],"correct":[0],"why":"The thymus is needed for maturation of T cells.","src":"test 4 pp.docx, p. 1 \u00b7 q0149","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0150","topic":"blood","q":"How do alpha and beta thalassemia differ?","opts":["Alpha thalassemia reduces alpha-globin synthesis","Beta thalassemia reduces beta-globin synthesis","Both result from polymerization of HbS","Both arise from iron deficiency alone"],"correct":[0,1],"why":"In both disorders, imbalance between globin chains contributes to ineffective erythropoiesis and hemolysis.","src":"test 4 pp.docx, p. 1 \u00b7 q0150","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0153","topic":"blood","q":"What distinguishes relative erythrocytosis from absolute erythrocytosis?","opts":["Relative erythrocytosis can result from reduced plasma volume","Absolute erythrocytosis involves increased red cell mass","Relative erythrocytosis requires increased red cell mass","Absolute erythrocytosis is defined by dehydration alone"],"correct":[0,1],"why":"Hematocrit can rise through hemoconcentration or through a genuine expansion in red cell mass.","src":"test 4 pp.docx, p. 1 \u00b7 q0153","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0166","topic":"immunity","q":"What drives hyperacute rejection of a transplanted organ?","opts":["Pre-existing recipient antibodies against donor antigens","Delayed sensitization requiring several months","Loss of erythropoietin from transplanted marrow","Primary antibody production by mature donor red cells"],"correct":[0],"why":"Preformed antibodies can rapidly activate complement and injure graft vessels.","src":"test 4 pp.docx, p. 1 \u00b7 q0166","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0174","topic":"immunity","q":"Which target can produce autoimmune disease through receptor stimulation?","opts":["The TSH receptor in Graves disease","The hemoglobin molecule in iron deficiency anemia","Factor IX in inherited hemophilia B","CFTR in cystic fibrosis as the usual mechanism"],"correct":[0],"why":"Thyroid-stimulating autoantibodies activate the receptor and increase thyroid hormone production.","src":"test 4 pp.docx, p. 2 \u00b7 q0174","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0179","topic":"blood","q":"Which are extrinsic causes of hemolysis?","opts":["Autoantibodies to red cells","Mechanical injury from a prosthetic valve","Shearing in microangiopathic disease","Inherited spectrin deficiency"],"correct":[0,1,2],"why":"Extrinsic processes damage otherwise normal red cells through external immune or mechanical mechanisms.","src":"test 4 pp.docx, p. 2 \u00b7 q0179","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0182","topic":"blood","q":"Which can cause neutropenia?","opts":["Cytotoxic chemotherapy","Severe marrow failure","Some drug-induced immune reactions","Glucocorticoid-mediated demargination as the typical effect"],"correct":[0,1,2],"why":"Neutrophil counts can fall from impaired production or increased peripheral destruction.","src":"test 4 pp.docx, p. 2 \u00b7 q0182","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1159","topic":"immunity","q":"Which statements about HLA alleles are correct?","opts":["They can mark susceptibility to specific diseases","Only class II alleles are associated with disease","They can contribute to autoimmune susceptibility via antigen presentation","Only class I alleles are associated with disease"],"correct":[0,2],"why":"HLA variation in both classes can affect peptide presentation and predisposition to immune-mediated disease.","src":"\u05e9\u05d7\u05d6\u05d5\u05e8 \u05de\u05d9\u05d3\u05d8\u05e8\u05dd 3 A.pdf, p. 20 \u00b7 q1159","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1162","topic":"blood","q":"Which statements about iron deficiency are correct?","opts":["Is often caused by rheumatoid arthritis","Can be a consequence of decreased stomach acidity","Can be caused by chronic occult bleeding","Can manifest as a microcytic anemia, dysphagia and angular stomatitis","Is characterized by increased level of ferritin"],"correct":[1,2,3],"why":"Poor iron absorption or chronic blood loss can deplete iron. Longstanding deficiency may cause mucosal changes and microcytic anemia.","src":"\u05e9\u05d7\u05d6\u05d5\u05e8 \u05de\u05d9\u05d3\u05d8\u05e8\u05dd 3 A.pdf, p. 25 \u00b7 q1162","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1181","topic":"blood","q":"Which statements about allogeneic hematopoietic stem cell transplantation are correct?","opts":["Peripheral blood can be a source of stem cells","HLA matching helps reduce immune complications","Donor immune cells can cause graft-versus-host disease","The cells always come from an animal donor"],"correct":[0,1,2],"why":"Allogeneic transplantation uses another human donor. HLA matching affects rejection and graft-versus-host risk.","src":"\u05ea\u05de\u05d5\u05e0\u05d5\u05ea \u05e6\u2019\u05db\u05d9\u05dd.pdf, p. 72 \u00b7 q1181","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1578","topic":"hemostasis","q":"Which factor deficiencies distinguish hemophilia A and B?","opts":["Hemophilia A involves factor VIII","Hemophilia B involves factor IX","Hemophilia A involves factor VII","Hemophilia B involves fibrinogen"],"correct":[0,1],"why":"Both disorders impair the intrinsic pathway, but they affect different coagulation factors.","src":"IMG_7319.jpg, p. 1 \u00b7 q1578","conf":"inferred","seen":1,"recall":false,"scored":true}];

const WRITTEN = [{"q":"A gallstone obstructs the common bile duct. Which bilirubin fraction rises and what happens to urine and stool?","a":"Conjugated bilirubin rises. Water-soluble conjugated bilirubin enters urine, darkening it. Less bile pigment reaches the gut, so stool can become pale. Hemolytic jaundice instead predominantly raises unconjugated bilirubin."},{"q":"Which findings fit advanced cirrhosis: hypoglycemia, secondary hyperaldosteronism, secondary immunodeficiency, or routine progression from hepatitis A?","a":"The first three fit. Reduced hepatic glucose reserve, reduced effective arterial filling, and cirrhosis-associated immune dysfunction explain them. HAV typically causes acute rather than chronic hepatitis."},{"q":"Explain three manifestations of portal hypertension.","a":"Varices form as blood is diverted through portosystemic collaterals. Splenomegaly results from congestion and can cause hypersplenism. Ascites reflects increased portal pressure plus renal sodium and water retention."},{"q":"Explain three findings of acute cholecystitis.","a":"Persistent cystic duct obstruction and inflammation cause RUQ pain and local tenderness. Inflammation causes fever. Inspiratory arrest during RUQ palpation reflects contact with the inflamed gallbladder. Marked jaundice prompts consideration of common duct involvement."},{"q":"Which findings fit alcohol-associated acute pancreatitis: raised amylase, raised lipase, raised calcium or raised GGT?","a":"The past-paper key lists raised amylase, lipase and GGT. Lipase and amylase reflect pancreatic injury. GGT is nonspecific and can reflect alcohol exposure or hepatobiliary disease. Raised calcium is not the expected consequence."},{"q":"Aspirin causes a thrombocytopathy. What pattern is expected?","a":"Impaired platelet aggregation with a generally normal PT and aPTT. Those assays assess factor pathways. A platelet count measures quantity rather than function."},{"q":"Which finding fits hemophilia A: prolonged PT, prolonged aPTT or predominantly petechial bleeding?","a":"Prolonged aPTT fits isolated VIII deficiency. PT is usually normal and deep bleeding is more typical than petechiae."},{"q":"Why does factor V Leiden cause thrombophilia?","a":"Factor Va resists inactivation by activated protein C, maintaining prothrombinase activity and increasing thrombin generation. An elevated INR is not its characteristic finding."},{"q":"Which tests help assess DIC after severe trauma: albumin, D-dimer, platelet count, fibrinogen or erythrocyte count?","a":"The past-paper key lists D-dimer, platelet count and fibrinogen. They sample fibrin breakdown and consumption. PT and aPTT are also relevant to the broader workup."},{"q":"What causes iron deficiency and what findings support it?","a":"Chronic occult blood loss and impaired iron absorption are possible causes. Microcytosis, low ferritin and low transferrin saturation support it. Angular stomatitis and dysphagia can occur. Increased ferritin alone is not the classic pattern."},{"q":"What differentiates sickle cell anemia from thalassemia?","a":"Sickle cell disease involves an abnormal hemoglobin that polymerizes on deoxygenation. Thalassemia involves reduced production of a globin chain. Both can produce hemolysis, but vaso-occlusion is characteristic of sickling."},{"q":"Why can polycythemia cause thrombosis?","a":"Increased red-cell mass raises viscosity. In polycythemia vera, clonal changes affecting other blood cells can also contribute to thrombotic risk."},{"q":"Which are compatible with bacterial infection or treatment effects: metamyelocytes and bands, or chemotherapy-associated neutropenia?","a":"The past-paper key accepts both findings in their respective contexts. Bands and metamyelocytes represent a left shift during infection. Chemotherapy can suppress granulocyte production."},{"q":"Which processes distinguish leukocyte adhesion deficiency and chronic granulomatous disease?","a":"Adhesion deficiency impairs recruitment into tissues despite circulating leukocytes. Chronic granulomatous disease impairs NADPH oxidase-dependent oxidative killing after phagocytosis."},{"q":"Which disorder links thrombocytopenia to immune dysfunction and eczema?","a":"Wiskott\u2013Aldrich syndrome. The platelet finding links this immune disorder to the hemostasis block."},{"q":"Which mechanisms contribute to anaphylactic shock and respiratory compromise?","a":"Vasodilation and vascular leakage reduce effective circulating volume. Bronchoconstriction and mucosal edema compromise airflow. The lecture links these effects to mast-cell mediators including histamine and leukotrienes."},{"q":"Who attacks whom in graft-versus-host disease?","a":"Donor immune cells attack recipient tissues. In host-versus-graft rejection, recipient immune responses target the graft."}];

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const timesDone = (s, q) => { const r = s[q.id]; if (!r || !r.seen) return 0; const last = r.last ?? r.part / r.seen; return last < 1 ? 0 : 1 + r.seen; };
const fresh = list => { const s = store.get('q', {}); return shuffle(list).sort((a, b) => timesDone(s, a) - timesDone(s, b)); };
const store = {

function grade(q, picked) {
  const set = new Set(q.correct);
  let hits = 0, wrongs = 0;
  picked.forEach(k => { set.has(k) ? hits++ : wrongs++; });
  const score = Math.max(0, hits - wrongs) / set.size;
  return { exact: hits === set.size && wrongs === 0, part: score, hits, wrongs, k: set.size };
}
const fmt = x => (Math.round(x * 100) / 100).toString();
function record(q, g) {
  const s = store.get('q', {});
  const r = s[q.id] || { seen: 0, exact: 0, part: 0 };
  r.seen++; r.exact += g.exact ? 1 : 0; r.part += g.part; r.last = g.part; s[q.id] = r; store.set('q', s);
}
function logSession(label, n, exact, part) {
  const l = store.get('sessions', []);
  l.unshift({ label, n, exact, part, at: Date.now() });
  store.set('sessions', l.slice(0, 20));
}

function weakest(n) {
  const s = store.get('q', {});
  return BANK.slice().sort((a, b) => {
    const ra = s[a.id], rb = s[b.id];
    const sa = ra ? ra.part / ra.seen : 0.5, sb = rb ? rb.part / rb.seen : 0.5;
    return sa - sb;
  }).slice(0, n);
}

function practice(list, label, exam, minutes) {
  nav('quiz');
  if (!list.length) {
    nav('empty');
    app.innerHTML = '<div class="narrow"><h1>No questions in this set.</h1><p class="lede">Choose another topic or mock from the hub.</p></div>';
    return;
  }
  const qs = fresh(list).map(q => {
    const order = shuffle(q.opts.map((_, k) => k));
    return { ...q, opts: order.map(k => q.opts[k]), correct: order.map((k, n) => q.correct.includes(k) ? n : -1).filter(n => n >= 0) };
  });
  const picks = qs.map(() => new Set());
  const checked = qs.map(() => false);
  let i = 0, exact = 0, part = 0, done = 0;
  let endAt = minutes ? Date.now() + minutes * 60000 : 0;

  function render() {
    const q = qs[i];
    const p = picks[i];
    const shown = !exam && checked[i];
    const g = shown ? grade(q, p) : null;
    const right = new Set(q.correct);
    app.innerHTML = `<div class="narrow">
      <div class="meta"><span class="row"><span class="chip">Question ${i + 1} of ${qs.length}</span>${chips(q)}</span>
      <span class="score">${exam ? `<span class="timer" id="clock"></span>` : `${fmt(part)}/${done} points · ${done ? Math.round(part / done * 100) : 0}%`}</span></div>
      <div class="bar"><i style="width:${(i + 1) / qs.length * 100}%"></i></div>
      <p class="q">${esc(q.q)}</p>
      <p class="hint">Select every correct option. Wrong picks cost points.</p>
      <div class="opts">${q.opts.map((o, k) => {
        let cls = '', tag = '';
        if (shown) {
          if (right.has(k) && p.has(k)) { cls = 'right'; tag = '<span class="tag r">Correct</span>'; }
          else if (!right.has(k) && p.has(k)) { cls = 'wrong'; tag = '<span class="tag w">Wrong</span>'; }
          else if (right.has(k)) { cls = 'missed'; tag = '<span class="tag m">Missed</span>'; }
          else cls = 'dim';
        } else if (p.has(k)) cls = 'sel';
        return `<button class="opt ${cls}" data-k="${k}" ${shown ? 'disabled' : ''}><span class="k">${k + 1}</span><span class="t">${esc(o)}</span>${tag}</button>`;
      }).join('')}</div>
      ${shown ? `<div class="why"><b>${g.exact ? 'Full point.' : `${fmt(g.part)} of 1 point: ${g.hits} of ${g.k} right picked${g.wrongs ? `, ${g.wrongs} wrong pick${g.wrongs > 1 ? 's' : ''} subtracted` : ''}.`}</b>${esc(q.why || '')}${unoff(q) ? `<div class="unc">Unverified answer: inferred from the study material.</div>` : ''}${q.recallNote ? `<div class="rn">Recall note: ${esc(q.recallNote)}</div>` : ''}</div>` : ''}
      ${exam
        ? `<div class="row"><button class="btn ghost" id="prev" ${i === 0 ? 'disabled' : ''}>← Previous</button><button class="btn" id="next">${i === qs.length - 1 ? 'Finish and mark' : 'Next question →'}</button></div>`
        : `<button class="btn" id="next">${shown ? (i === qs.length - 1 ? 'See results' : 'Next question →') : 'Check answer'}</button>`}
      <p class="foot">Press 1 to ${q.opts.length} to select · Enter to ${exam ? 'go on' : shown ? 'go on' : 'check'}</p>
    </div>`;
    fit();
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => toggle(+b.dataset.k));
    $('#next').onclick = next;
    if (exam) { $('#prev').onclick = () => { if (i > 0) { i--; render(); } }; tick(); }
  }
  function toggle(k) {
    if (!exam && checked[i]) return;
    const p = picks[i]; p.has(k) ? p.delete(k) : p.add(k); render();
  }
  function next() {
    if (exam) { if (i < qs.length - 1) { i++; render(); } else finish(); return; }
    if (!checked[i]) {
      checked[i] = true; const g = grade(qs[i], picks[i]); record(qs[i], g);
      done++; exact += g.exact ? 1 : 0; part += g.part; render(); return;
    }
    if (i < qs.length - 1) { i++; render(); } else finish();
  }
  function tick() {
    const el = $('#clock'); if (!el || !endAt) { if (el) el.textContent = 'Untimed'; return; }
    const left = Math.max(0, endAt - Date.now());
    const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
    el.textContent = `${m}:${String(s).padStart(2, '0')} left`;
    el.classList.toggle('low', left < 120000);
    if (left === 0) finish();
  }
  if (exam && minutes) timerId = setInterval(tick, 1000);
  function finish() {
    stopTimer(); keyHandler = null; document.body.classList.remove('quizmode');
    let ex = 0, pt = 0;
    const rows = qs.map((q, k) => {
      const g = grade(q, picks[k]);
      if (exam) record(q, g);
      ex += g.exact ? 1 : 0; pt += g.part;
      return { q, g, k };
    });
    const pct = pt / qs.length;
    logSession(label, qs.length, ex, pct);
    window.scrollTo(0, 0);
    app.innerHTML = `<div class="narrow"><div class="result">
      <div class="eyebrow">${esc(label)}</div>
      <div class="big">${Math.round(pct * 100)}%</div>
      <p class="lede" style="margin:0 auto 14px">score: ${fmt(pt)} of ${qs.length} points · ${ex} questions fully right</p>
      <span class="pass ${pct >= PASS ? 'y' : 'n'}">${pct >= PASS ? 'Above' : 'Below'} the 65% line</span>
      <p class="hint" style="margin-top:16px">Each question is worth 1 point. Every right option you pick adds its share, every wrong pick removes the same share, and a question bottoms out at 0.</p>
      </div>
      <div class="row"><button class="btn" id="again">Try these again</button><button class="btn ghost" id="wrongs">Redo the ones I missed</button></div>
      <div class="review">${rows.map(r => `<button class="item" data-k="${r.k}"><span class="dot ${r.g.exact ? 'y' : r.g.part >= .5 ? 'p' : 'n'}"></span><span style="flex:1;min-width:0">${esc(r.q.q)}</span><span class="mono" style="color:var(--muted)">${fmt(r.g.part)}</span></button>`).join('')}</div></div>`;
    $('#again').onclick = () => practice(list, label, exam, minutes);
    const miss = rows.filter(r => !r.g.exact).map(r => r.q);
    $('#wrongs').onclick = () => miss.length ? practice(miss, 'Missed from ' + label, false) : hub();
    app.querySelectorAll('.review .item').forEach(b => b.onclick = () => showOne(rows[+b.dataset.k].q, picks[+b.dataset.k]));
  }
  function showOne(q, p) {
    const right = new Set(q.correct);
    const box = document.createElement('div');
    box.className = 'why';
    box.innerHTML = `${chips(q)}<b>${esc(q.q)}</b>` + q.opts.map((o, k) => `<div style="color:${right.has(k) ? 'var(--ok)' : 'var(--muted)'}">${right.has(k) ? 'T' : 'F'} · ${esc(o)}${p.has(k) ? ' (you picked)' : ''}</div>`).join('') + `<div style="margin-top:8px">${esc(q.why || '')}</div>${q.recallNote ? `<div class="rn">Recall note: ${esc(q.recallNote)}</div>` : ''}`;
    app.querySelector('.review').prepend(box); window.scrollTo({ top: box.offsetTop - 90, behavior: 'smooth' });
  }
  keyHandler = e => {
    const q = qs[i];
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= q.opts.length) { e.preventDefault(); toggle(n - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); next(); }
    else if (exam && e.key === 'ArrowLeft' && i > 0) { i--; render(); }
  };
  render();
}

function wpick(pool) {
  const s = store.get('q', {});
  const low = Math.min(...pool.map(q => timesDone(s, q)));
  const w = pool.map(q => timesDone(s, q) > low ? 0 : asked(q) ? 3 : 1);
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let k = 0; k < pool.length; k++) { if (!w[k]) continue; r -= w[k]; if (r <= 0) return pool.splice(k, 1)[0]; }
  return pool.splice(w.findLastIndex(x => x > 0), 1)[0];
}
function wspread(bank, ids, n) {
  const pools = shuffle(ids).map(id => bank.filter(q => q.topic === id));
  const out = [];
  while (out.length < n && pools.some(p => p.length)) pools.forEach(p => { if (p.length && out.length < n) out.push(wpick(p)); });
  return out;
}
function spread(bank, ids, n) {
  const pools = ids.map(id => fresh(bank.filter(q => q.topic === id)));
  const out = [];
  while (out.length < n && pools.some(p => p.length)) pools.forEach(p => { if (p.length && out.length < n) out.push(p.shift()); });
  return out;
}

    const term = $('#s').value.trim().toLowerCase();
    const hits = REVIEW_BANK.filter(q => !term || (q.q + ' ' + q.src + ' ' + q.opts.join(' ') + ' ' + (q.why || '')).toLowerCase().includes(term));
    $('#list').innerHTML = hits.length ? hits.map(q => `<div class="item"><div class="qq">${inline(q)}${!q.scored ? '<span class="tagline">Review only</span>' : ''}${srcChip(q) ? `<span style="color:var(--muted)">${esc(srcChip(q))} · </span>` : ''}${esc(q.q)}</div>
      <ul>${q.opts.map((o, k) => `<li class="${q.scored ? (q.correct.includes(k) ? 'y' : 'n') : ''}">${esc(o)}</li>`).join('')}</ul>
      ${q.why ? `<div class="r">${esc(q.why)}</div>` : ''}${q.recallNote ? `<div class="r">Recall note: ${esc(q.recallNote)}</div>` : ''}</div>`).join('') : `<p class="empty">No question mentions “${esc(term)}”.</p>`;
  };
  $('#s').oninput = draw; draw();
}

function patterns() {
  nav('patterns');
  app.innerHTML = `<div class="narrow"><div class="eyebrow">Shortcuts</div><h1>Exam patterns.</h1>
  <p class="lede">Patterns to practise across the four Midterm 3 blocks.</p>
  <div class="pat">${PATTERNS.map(p => `<div class="item"><h3>${esc(p.h)}</h3><p>${esc(p.t)}</p></div>`).join('')}</div></div>`;
}

function written() {
  nav('written');
  app.innerHTML = `<div class="narrow"><div class="eyebrow">Written part</div><h1>Written questions.</h1>
  <p class="lede">Try each prompt out loud, then tap to reveal a worked response.</p>
  <div class="sheet">${WRITTEN.map(w => `<details class="item"><summary class="qq">${inline(w)}${esc(w.q)}</summary><div class="r">${esc(w.a)}</div></details>`).join('')}</div></div>`;
}

function stats() {
  nav('stats');
  const s = store.get('q', {});
  const sessions = store.get('sessions', []);
  const seen = Object.keys(s).length;
  const tot = Object.values(s).reduce((a, r) => a + r.seen, 0);
  const acc = tot ? Object.values(s).reduce((a, r) => a + r.part, 0) / tot : 0;
  const weak = BANK.filter(q => s[q.id]).sort((a, b) => s[a.id].part / s[a.id].seen - s[b.id].part / s[b.id].seen).slice(0, 8);
  app.innerHTML = `<div class="narrow"><div class="eyebrow">Stats</div><h1>Your progress.</h1>
  <div class="stats"><div class="stat"><div class="n">${seen}/${BANK.length}</div><div class="l">questions answered</div></div>
  <div class="stat"><div class="n">${Math.round(acc * 100)}%</div><div class="l">average score per question</div></div>
  <div class="stat"><div class="n">${sessions.length}</div><div class="l">sessions finished</div></div></div>
  <div class="section-h"><span class="eyebrow">By topic</span></div>
  ${TOPICS.map(t => {
    const qs = BANK.filter(q => q.topic === t.id && s[q.id]);
    const n = qs.reduce((a, q) => a + s[q.id].seen, 0);
    const pc = n ? qs.reduce((a, q) => a + s[q.id].part, 0) / n : 0;
    return `<div class="tbar"><span>${esc(t.name)}</span><span class="track"><i style="width:${pc * 100}%"></i></span><span class="pc">${n ? Math.round(pc * 100) + '%' : 'none'}</span></div>`;
  }).join('')}
  <div class="section-h"><span class="eyebrow">Weakest questions</span></div>
  <div class="review">${weak.length ? weak.map(q => `<div class="item" style="cursor:default"><span style="flex:1;min-width:0">${esc(q.q)}</span><span class="mono" style="color:var(--muted)">${Math.round(s[q.id].part / s[q.id].seen * 100)}%</span></div>`).join('') : '<p class="empty">Answer a few questions and your weakest ones show up here.</p>'}</div>
  <div class="section-h"><span class="eyebrow">Recent sessions</span>${sessions.length ? '<button class="pill" id="reset">Reset stats</button>' : ''}</div>
  <div class="review">${sessions.length ? sessions.map(x => `<div class="item" style="cursor:default"><span style="flex:1">${esc(x.label)} <span style="color:var(--muted)">· ${new Date(x.at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</span></span><span class="mono">${Math.round(x.part * 100)}% · ${x.exact}/${x.n}</span></div>`).join('') : '<p class="empty">Finished topics and mocks will be listed here.</p>'}</div>
  <div id="confirm"></div></div>`;
  const r = $('#reset');
  if (r) r.onclick = () => {
    $('#confirm').innerHTML = `<div class="why"><b>Delete all your stats on this device?</b><div class="row"><button class="btn" id="yes">Delete stats</button><button class="btn ghost" id="no">Keep them</button></div></div>`;
    $('#yes').onclick = () => { store.set('q', {}); store.set('sessions', []); stats(); };
    $('#no').onclick = () => { $('#confirm').innerHTML = ''; };
  };
}

hub();
</script>

</body>
</html>

radykinin can contribute to vascular permeability and edema. Allergic type 2 inflammation can increase eosinophil recruitment and production. Malnutrition can weaken immune defenses and is a cause of acquired immunodeficiency.","optionWhy":["Selective IgA deficiency is a primary antibody deficiency.","Leukotrienes mediate bronchoconstriction and vascular changes. Bradykinin can contribute to vascular permeability and edema.","Allergic type 2 inflammation can increase eosinophil recruitment and production.","Malnutrition can weaken immune defenses and is a cause of acquired immunodeficiency.","HIV chiefly targets CD4-expressing cells, especially helper T lymphocytes."],"src":"Copy of Czech Ws was 3.pdf, p. 141 \u00b7 q1752","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1753","topic":"blood","q":"Choose the correct statement(s) about macrocytic anemia","opts":["Their symptom may be subicterus","They are usually caused by Fe deficiency","May be caused by ileal resection (due to decreased Fe reabsorption)","Can be caused by alcoholism (due to cirrhosis of the liver)","They can be caused by chronic autoimmune gastritis"],"correct":[0,3,4],"why":"Ineffective erythropoiesis can raise unconjugated bilirubin and cause mild jaundice. Alcohol exposure and liver disease can both cause macrocytosis. Autoimmune gastritis can impair B12 absorption through loss of intrinsic factor.","optionWhy":["Ineffective erythropoiesis can raise unconjugated bilirubin and cause mild jaundice.","Iron deficiency usually causes microcytosis.","Ileal resection can cause macrocytosis by reducing vitamin B12 absorption. The choice attributes it to iron.","Alcohol exposure and liver disease can both cause macrocytosis.","Autoimmune gastritis can impair B12 absorption through loss of intrinsic factor."],"src":"Copy of Czech Ws was 3.pdf, p. 143 \u00b7 q1753","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1754","topic":"blood","q":"Choose the correct statemen lly involves type I hypersensitivity and type 2 inflammation.","Immune-complex deposition and complement activation contribute to many manifestations of SLE."],"src":"Copy of Czech Ws was 3.pdf, p. 147 \u00b7 q1756","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1757","topic":"liver","q":"The presence of a gallstone in the papilla duodeni major (Vateri) can lead to:","opts":["Jaundice","Increased plasma concentrations of unconjugated bilirubin","Increased concentration of urobilinogen in urine","Acute cholecystitis","Acute pancreatitis"],"correct":[0,3,4],"why":"Obstruction of bile drainage causes conjugated bilirubin to accumulate and can produce jaundice. Moodle includes this choice. Acute calculous cholecystitis classically follows cystic duct obstruction and can coexist with a stone at the papilla. A stone at the major papilla can impair pancreatic duct drainage and trigger acute pancreatitis.","optionWhy":["Obstruction of bile drainage causes conjugated bilirubin to accumulate and can produce jaundice.","Distal duct obstruction chiefly raises conjugated bilirubin because already conjugated bilirubin cannot drain normally.","Complete obstruction reduces the amount of bilirubin reaching intestinal bacteria, which reduces urobilinogen production.","Moodle includes this choice. Acute calculous cholecystitis classically follows cystic duct obstruction and can coexist with a stone at the papilla.","A stone at the major papilla can impair pancreatic duct drainage and trigger acute pancreatitis."],"src":"Copy of Czech Ws was 3.pdf, p. 148 \u00b7 q1757","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1755","topic":"blood","q":"A blood analysis is performed on a young adult patient with fever, sore throat, and symptoms of a viral upper respiratory tract infection. What representation (in %) of neutrophil granulocytes is most likely in the differential count of white blood cells? (Choose 1 best answer)","opts":["15\u201320%","20\u201330%","1\u20135%","0\u20131%","50\u201370%"],"correct":[4],"why":"The source uses a typical adult neutrophil fraction of 50\u201370%. Viral illness may change the differential, so the exact percentage cannot be inferred from symptoms alone.","optionWhy":["This is below the usual adult relative neutrophil range.","This is closer to a common adult lymphocyte percentage and is below the usual neutrophil range.","This is closer to a typical eosinophil fraction.","This is closer to a typical basophil fraction.","The source uses a typical adult neutrophil fraction of 50\u201370%. Viral illness may change the differential, so the exact percentage cannot be inferred from symptoms alone."],"src":"Copy of Czech Ws was 3.pdf, p. 145 \u00b7 q1755","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1758","topic":"immunity","q":"Autoimmune reactions against cell surface receptors","opts":["It is a typical cause anaphylactic reactions","It is described as a reaction type V hypersensitivity, which is a subtype of type II hypersensitivity reaction","May cause Graves disease","It is described as a type III hypersensitivity reaction","It can cause myasthenia gravis"],"correct":[1,2,4],"why":"The paper uses type V for receptor-directed functional effects, often grouped under type II. TSH receptor-stimulating antibodies can cause Graves disease. Antibodies against acetylcholine receptors or related proteins impair neuromuscular transmission.","optionWhy":["Typical allergic anaphylaxis involves mast-cell activation and IgE.","The paper uses type V for receptor-directed functional effects, often grouped under type II.","TSH receptor-stimulating antibodies can cause Graves disease.","Type III involves deposition of soluble immune complexes.","Antibodies against acetylcholine receptors or related proteins impair neuromuscular transmission."],"src":"Copy of Czech Ws was 3.pdf, p. 149 \u00b7 q1758","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1759","topic":"blood","q":"Choose the correct statement(s) about neutrophilia","opts":["It is a typical sign of AIDS","It is a typical sign of a parasitic infection","It may be caused by a bacterial infection","May be caused by corticoids","It can be caused by a viral infection"],"correct":[2,3],"why":"Acute bacterial inflammation can increase circulating neutrophils through marrow release and mobilization. Glucocorticoids increase circulating neutrophils through redistribution, delayed clearance and reduced tissue migration.","optionWhy":["AIDS primarily involves depletion of CD4 T cells.","Many tissue-invasive parasitic infections classically cause eosinophilia.","Acute bacterial inflammation can increase circulating neutrophils through marrow release and mobilization.","Glucocorticoids increase circulating neutrophils through redistribution, delayed clearance and reduced tissue migration.","The displayed key excludes this choice. Viral infections often have a lymphocytic pattern, though some can present with neutrophilia."],"src":"Copy of Czech Ws was 3.pdf, p. 150 \u00b7 q1759","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1760","topic":"immunity","q":"Choose the correct statement(s) about disorders of the immune system","opts":["Malnutrition can cause secondary immunodeficiency","Eosinophilia is common in allergy","HIV infection primarily damages neutrophils","Bradykinin and leukotrienes are important components in the pathogenesis of type I hypersensitivity reaction","Selective IgA deficiency is an example of secondary immunodeficiency"],"correct":[0,1,3],"why":"Malnutrition can impair barrier and immune function after birth. Eosinophils can increase in allergic inflammation, especially type 2 responses. The exam includes both mediators. Leukotrienes promote bronchoconstriction and permeability. Bradykinin can contribute to vascular effects.","optionWhy":["Malnutrition can impair barrier and immune function after birth.","Eosinophils can increase in allergic inflammation, especially type 2 responses.","HIV primarily targets CD4-expressing cells, including helper T cells.","The exam includes both mediators. Leukotrienes promote bronchoconstriction and permeability. Bradykinin can contribute to vascular effects.","Selective IgA deficiency is conventionally classified as a primary immunodeficiency."],"src":"Copy of Czech Ws was 3.pdf, p. 151 \u00b7 q1760","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1761","topic":"blood","q":"Choose the correct statement(s) about sideropenic anemia","opts":["Associated with elevated ferritin","May be caused by hereditary hemochromatosis","May be caused by chronic bleeding (often occult)","May be caused by chronic atrophic gastritis","Atrophy of the mucous membrane in the oral cavity and dysphagia are among the symptoms"],"correct":[2,3,4],"why":"Ongoing occult blood loss can deplete iron stores. Reduced gastric acidity can impair iron absorption. Longstanding iron deficiency can cause oral mucosal atrophy and dysphagia.","optionWhy":["Uncomplicated iron deficiency lowers ferritin.","Hereditary hemochromatosis usually causes excess iron absorption and iron overload.","Ongoing occult blood loss can deplete iron stores.","Reduced gastric acidity can impair iron absorption.","Longstanding iron deficiency can cause oral mucosal atrophy and dysphagia."],"src":"Copy of Czech Ws was 3.pdf, p. 152 \u00b7 q1761","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1762","topic":"liver","q":"Elevated conjugated bilirubin, unconjugated bilirubin, AST, ALT, GGT in a 58-year-old adult are most likely to be signs of (choose 2 correct answers)","opts":["Cystic fibrosis","Acute pancreatitis","Alcoholic cirrhosis of the liver","Viral hepatitis C","Acute obstruction of the bile duct"],"correct":[2,3],"why":"Cirrhosis related to alcohol can impair bilirubin handling and raise aminotransferases and GGT. Hepatitis C can cause hepatocellular injury and raise aminotransferases. Bilirubin may rise with more severe dysfunction. The test pattern by itself cannot establish the cause.","optionWhy":["Cystic fibrosis can cause hepatobiliary disease, but the question provides no supporting history or findings specific to cystic fibrosis.","Acute pancreatitis is usually supported by typical abdominal pain and elevated lipase. Biliary pancreatitis can also alter liver tests.","Cirrhosis related to alcohol can impair bilirubin handling and raise aminotransferases and GGT.","Hepatitis C can cause hepatocellular injury and raise aminotransferases. Bilirubin may rise with more severe dysfunction. The test pattern by itself cannot establish the cause.","Bile duct obstruction typically produces a cholestatic pattern, particularly elevated conjugated bilirubin and alkaline phosphatase. Aminotransferases can also rise during acute obstruction."],"src":"Copy of Czech Ws was 3.pdf, p. 153 \u00b7 q1762","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1763","topic":"immunity","q":"Causes of acquired secondary immunodeficiency include","opts":["Treatment with immunosuppressive drugs","Alcoholism","Anorexia nervosa","Diabetes mellitus","Di-George syndrome"],"correct":[0,1,2,3],"why":"Immunosuppressive drugs can reduce lymphocyte activation or proliferation and weaken host defenses. Chronic heavy alcohol use can impair innate and adaptive immunity. Associated malnutrition can compound the effect. Severe malnutrition associated with anorexia nervosa can compromise immune responses. Poorly controlled diabetes can impair neutrophil function and increase susceptibility to infection.","optionWhy":["Immunosuppressive drugs can reduce lymphocyte activation or proliferation and weaken host defenses.","Chronic heavy alcohol use can impair innate and adaptive immunity. Associated malnutrition can compound the effect.","Severe malnutrition associated with anorexia nervosa can compromise immune responses.","Poorly controlled diabetes can impair neutrophil function and increase susceptibility to infection.","DiGeorge syndrome is a congenital disorder in which thymic hypoplasia can impair T-cell development."],"src":"Copy of Czech Ws was 3.pdf, p. 154 \u00b7 q1763","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1764","topic":"hemostasis","q":"Thrombocytopenia with platelet level =110 10\u2079/L","opts":["It is an important cause of hemarthrosis","Usually without symptoms (asymptomatic)","It is a typical sign of the Leiden mutation","Associated with purpura and ecchymosis","Means there is a risk of spontaneous intracranial bleeding"],"correct":[1],"why":"An isolated count of 110 \u00d7 10\u2079/L is mild thrombocytopenia and usually causes no symptoms.","optionWhy":["Hemarthrosis is characteristic of significant coagulation factor deficiency.","An isolated count of 110 \u00d7 10\u2079/L is mild thrombocytopenia and usually causes no symptoms.","Factor V Leiden raises the risk of venous thrombosis and does not typically lower platelets.","Purpura and ecchymosis can occur in more significant thrombocytopenia.","Spontaneous major bleeding generally requires a much lower count or additional risk factors."],"src":"Copy of Czech Ws was 3.pdf, p. 157 \u00b7 q1764","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1765","topic":"blood","q":"Which type of anemia can often be macrocytic and normochromic:","opts":["Anemia in alcoholics with malabsorption","Anemia caused by a lack of vitamin B12 in the diet","Severe iron deficiency anemia","Thalassemia","Pernicious anemia"],"correct":[0,1,4],"why":"Alcohol can directly cause macrocytosis, and associated malnutrition or malabsorption can cause folate deficiency. Vitamin B12 deficiency impairs DNA synthesis and produces macrocytosis. Loss of intrinsic factor reduces B12 absorption and causes megaloblastic anemia.","optionWhy":["Alcohol can directly cause macrocytosis, and associated malnutrition or malabsorption can cause folate deficiency.","Vitamin B12 deficiency impairs DNA synthesis and produces macrocytosis.","Iron deficiency impairs hemoglobin production and usually causes microcytosis and hypochromia.","Reduced globin synthesis typically produces microcytic, hypochromic cells.","Loss of intrinsic factor reduces B12 absorption and causes megaloblastic anemia."],"src":"Copy of Czech Ws was 3.pdf, p. 158 \u00b7 q1765","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1766","topic":"immunity","q":"Which of the following inflammatory mediators is most important in the pathogenesis of anaphylactic shock?","opts":["Noradrenaline","Serotonin","Histamine","Gastrin","Somatostatin"],"correct":[2],"why":"Mast-cell histamine causes vasodilation and increases vascular permeability, contributing to hypotension.","optionWhy":["Noradrenaline supports vascular tone and is not the principal allergic mediator in this question.","Serotonin can affect vessels, but histamine is the classic immediate mediator released by mast cells here.","Mast-cell histamine causes vasodilation and increases vascular permeability, contributing to hypotension.","Gastrin primarily promotes gastric acid secretion.","Somatostatin inhibits the secretion of various hormones and is not a principal mediator of anaphylactic shock."],"src":"Copy of Czech Ws was 3.pdf, p. 159 \u00b7 q1766","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1767","topic":"blood","q":"Cyanosis of the skin and mucous membranes is a symptom of","opts":["Circulatory hypoxia with blood stagnation","Anemic hypoxia","Severe respiratory hypoxia","High concentrations of deoxyhemoglobin (>50 g/L)","Local circulatory hypoxia caused by ischemia"],"correct":[0,2,3],"why":"Slow blood flow increases local oxygen extraction and can produce peripheral cyanosis. Marked arterial desaturation can produce central cyanosis, including in the mucous membranes. The source uses the classic absolute deoxyhemoglobin threshold of about 50 g/L. Clinical detectability varies.","optionWhy":["Slow blood flow increases local oxygen extraction and can produce peripheral cyanosis.","Low total hemoglobin makes it harder to reach a high absolute deoxyhemoglobin concentration, even when oxygen delivery is inadequate.","Marked arterial desaturation can produce central cyanosis, including in the mucous membranes.","The source uses the classic absolute deoxyhemoglobin threshold of about 50 g/L. Clinical detectability varies.","Local arterial ischemia does not explain generalized cyanosis involving skin and mucous membranes."],"src":"Copy of Czech Ws was 3.pdf, p. 160 \u00b7 q1767","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1768","topic":"immunity","q":"Which mediator(s) disrupts the cell wall and enables granzyme-induced apoptosis?","opts":["IL-6","IL-10","Perforin","IL-1","Granulocyte and monocyte colony stimulating factor"],"correct":[2],"why":"Perforin released by cytotoxic T cells or NK cells forms pores that facilitate granzyme access to the target-cell cytosol. The human target has a plasma membrane.","optionWhy":["IL-6 is an inflammatory cytokine and stimulates acute-phase responses.","IL-10 has immunoregulatory effects and does not enable granzyme delivery.","Perforin released by cytotoxic T cells or NK cells forms pores that facilitate granzyme access to the target-cell cytosol. The human target has a plasma membrane.","IL-1 promotes inflammation and fever. It does not form pores for granzymes.","GM-CSF supports the production and function of myeloid cells. It does not enable granzyme entry."],"src":"Copy of Czech Ws was 3.pdf, p. 161 \u00b7 q1768","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1769","topic":"hemostasis","q":"Select the correct statement(s) about thrombocytopenia","opts":["It is one of the causes of impaired primary hemostasis","Associated with hematomas but never with hemarthrosis","It is a typical sign of ulcerative colitis","It can be treated with aspirin","May be the result of portal hypertension"],"correct":[0,4],"why":"A low platelet count reduces the ability to form an initial platelet plug. Portal hypertension may cause splenic enlargement and sequestration of platelets.","optionWhy":["A low platelet count reduces the ability to form an initial platelet plug.","Platelet disorders favor mucocutaneous bleeding. The absolute claim that joint bleeding can never occur is unreliable.","Thrombocytopenia is not a typical feature of ulcerative colitis.","Aspirin inhibits platelet aggregation and can worsen bleeding from thrombocytopenia.","Portal hypertension may cause splenic enlargement and sequestration of platelets."],"src":"Copy of Czech Ws was 3.pdf, p. 209 \u00b7 q1769","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1770","topic":"liver","q":"Elevated conjugated bilirubin, unconjugated bilirubin, AST, ALT, GGT in a 58-year-old adult are most likely to be signs of (choose 2 correct answers)","opts":["Alcoholic cirrhosis of the liver","Acute obstruction of the bile duct","Viral hepatitis C","Acute pancreatitis","Cystic fibrosis"],"correct":[0,2],"why":"Cirrhosis related to alcohol can impair bilirubin handling and raise aminotransferases and GGT. Hepatitis C can cause hepatocellular injury and raise aminotransferases. Bilirubin may rise with more severe dysfunction. The test pattern by itself cannot establish the cause.","optionWhy":["Cirrhosis related to alcohol can impair bilirubin handling and raise aminotransferases and GGT.","Bile duct obstruction typically produces a cholestatic pattern, particularly elevated conjugated bilirubin and alkaline phosphatase. Aminotransferases can also rise during acute obstruction.","Hepatitis C can cause hepatocellular injury and raise aminotransferases. Bilirubin may rise with more severe dysfunction. The test pattern by itself cannot establish the cause.","Acute pancreatitis is usually supported by typical abdominal pain and elevated lipase. Biliary pancreatitis can also alter liver tests.","Cystic fibrosis can cause hepatobiliary disease, but the question provides no supporting history or findings specific to cystic fibrosis."],"src":"Copy of Czech Ws was 3.pdf, p. 213 \u00b7 q1770","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1771","topic":"liver","q":"What is usually shown in a laboratory blood test in patients with acute pancreatitis that developed as a result of alcohol consumption?","opts":["Elevated level of leukocytes","Elevated GGT level","Increased lipase level","Increased Ca\u00b2\u207a level","Increased level of amylase"],"correct":[0,1,2,4],"why":"Acute pancreatic inflammation can produce leukocytosis as part of the systemic inflammatory response. GGT can rise with heavy alcohol use or associated hepatobiliary injury. It is neither specific to pancreatitis nor necessarily elevated in every case. Injured pancreatic acinar cells release lipase. It is a preferred serum marker of acute pancreatitis. Amylase can rise after pancreatic injury, although it may be normal in some cases and is less specific than lipase.","optionWhy":["Acute pancreatic inflammation can produce leukocytosis as part of the systemic inflammatory response.","GGT can rise with heavy alcohol use or associated hepatobiliary injury. It is neither specific to pancreatitis nor necessarily elevated in every case.","Injured pancreatic acinar cells release lipase. It is a preferred serum marker of acute pancreatitis.","Hypercalcemia can precipitate pancreatitis. Calcium can fall during severe pancreatitis, including from fat saponification.","Amylase can rise after pancreatic injury, although it may be normal in some cases and is less specific than lipase."],"src":"Copy of Czech Ws was 3.pdf, p. 217 \u00b7 q1771","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1772","topic":"hemostasis","q":"Choose correct statement/s about thrombocytopathies","opts":["aPTT is prolonged","Can be caused by aspirin","Can be treated by heparin","Can be caused by bleeding from peptic ulcer","Amount of thrombocytes is decreased"],"correct":[1],"why":"Aspirin irreversibly inhibits platelet COX-1 and decreases thromboxane A\u2082 production, impairing aggregation.","optionWhy":["Isolated platelet dysfunction generally leaves plasma coagulation screening tests such as aPTT normal.","Aspirin irreversibly inhibits platelet COX-1 and decreases thromboxane A\u2082 production, impairing aggregation.","Heparin is an anticoagulant and does not restore platelet function.","A bleeding ulcer causes blood loss. It does not typically cause a primary defect in platelet function.","A decreased platelet count is thrombocytopenia. A thrombocytopathy is a qualitative platelet defect."],"src":"Copy of Czech Ws was 3.pdf, p. 221 \u00b7 q1772","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1773","topic":"hemostasis","q":"Hemophilia A and B differ by:","opts":["Way of inheritance","APTT time","PT or INR time","Level of factor VIII and factor IX","Major clinical symptoms"],"correct":[3],"why":"Hemophilia A reflects factor VIII deficiency and hemophilia B reflects factor IX deficiency. Factor assays distinguish them.","optionWhy":["Both are classically X-linked recessive.","Either can prolong aPTT, depending on severity and assay sensitivity.","PT and INR are usually normal in both disorders.","Hemophilia A reflects factor VIII deficiency and hemophilia B reflects factor IX deficiency. Factor assays distinguish them.","Both can produce hemarthroses, deep muscle bleeding and delayed bleeding."],"src":"Copy of Czech Ws was 3.pdf, p. 221 \u00b7 q1773","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1774","topic":"hemostasis","q":"APTT is prolonged","opts":["Usually in patients with elevated D-dimers","Usually in patients treated with heparin","Usually in patients with hemophilia A","Often in patients with DIC syndrome (consumptive coagulopathy)","Usually in patients with increased Quick test time"],"correct":[1,2,3],"why":"Unfractionated heparin enhances antithrombin action and often prolongs aPTT. Factor VIII deficiency impairs the intrinsic pathway and can prolong aPTT. Consumption of coagulation factors can prolong aPTT in DIC. Results vary with timing and severity.","optionWhy":["Elevated D-dimers indicate fibrin turnover. They do not independently predict a prolonged aPTT.","Unfractionated heparin enhances antithrombin action and often prolongs aPTT.","Factor VIII deficiency impairs the intrinsic pathway and can prolong aPTT.","Consumption of coagulation factors can prolong aPTT in DIC. Results vary with timing and severity.","The Quick test measures PT, which can be prolonged due to an isolated extrinsic pathway defect without prolonging aPTT."],"src":"Copy of Czech Ws was 3.pdf, p. 225 \u00b7 q1774","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1775","topic":"liver","q":"The presence of a gallstone in the papilla duodeni major (Vateri) can lead to:","opts":["Acute cholecystitis","Jaundice","Increased concentration of urobilinogen in urine","Increased plasma concentrations of unconjugated bilirubin","Acute pancreatitis"],"correct":[0,1,4],"why":"Moodle includes this choice. Acute calculous cholecystitis classically follows cystic duct obstruction and can coexist with a stone at the papilla. Obstruction of bile drainage causes conjugated bilirubin to accumulate and can produce jaundice. A stone at the major papilla can impair pancreatic duct drainage and trigger acute pancreatitis.","optionWhy":["Moodle includes this choice. Acute calculous cholecystitis classically follows cystic duct obstruction and can coexist with a stone at the papilla.","Obstruction of bile drainage causes conjugated bilirubin to accumulate and can produce jaundice.","Complete obstruction reduces the amount of bilirubin reaching intestinal bacteria, which reduces urobilinogen production.","Distal duct obstruction chiefly raises conjugated bilirubin because already conjugated bilirubin cannot drain normally.","A stone at the major papilla can impair pancreatic duct drainage and trigger acute pancreatitis."],"src":"Copy of Czech Ws was 3.pdf, p. 226 \u00b7 q1775","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1776","topic":"liver","q":"Choose the correct statement about jaundice","opts":["Hemolytic icterus can occur with extensive hematomas","The most common cause of neonatal jaundice is Crigler-Najjar syndrome","In hepatic jaundice, the urine is dark and we detect urobilinogen and bilirubin there","unconjugated bilirubin predominates in Gilbert's syndrome","In posthepatic jaundice with complete obstruction, the urine is dark and we demonstrate urobilinogen and bilirubin there"],"correct":[0,2,3],"why":"Breakdown of red cells within a large hematoma can increase the unconjugated bilirubin load. Conjugated bilirubin can reach urine in hepatocellular injury. Urinary urobilinogen can still be present when some bile reaches the intestine. Reduced UGT1A1 activity in Gilbert syndrome limits conjugation and causes predominantly unconjugated hyperbilirubinemia.","optionWhy":["Breakdown of red cells within a large hematoma can increase the unconjugated bilirubin load.","Crigler\u2013Najjar syndrome is rare. Physiologic neonatal jaundice commonly reflects increased bilirubin production and immature conjugation.","Conjugated bilirubin can reach urine in hepatocellular injury. Urinary urobilinogen can still be present when some bile reaches the intestine.","Reduced UGT1A1 activity in Gilbert syndrome limits conjugation and causes predominantly unconjugated hyperbilirubinemia.","Conjugated bilirubin darkens urine, but complete obstruction prevents bilirubin from reaching intestinal bacteria, so urinary urobilinogen falls or disappears."],"src":"Copy of Czech Ws was 3.pdf, p. 227 \u00b7 q1776","conf":"key","seen":1,"recall":false,"scor ock.","The marked choice describes hypersensitivity broadly. Atopy specifically involves a tendency toward IgE sensitization.","Atopy does not require parenteral exposure or an immediate systemic reaction.","The key idea is a predisposition to form allergen-specific IgE. The wording about first contact refers to sensitization, which may occur without symptoms."],"src":"Copy of Czech Ws was 3.pdf, p. 278 \u00b7 q1803","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1804","topic":"blood","q":"Select the condition(s) or disease(s) with an increased risk of hemolysis","opts":["Advanced burns affecting 60% of the body","Bacterial sepsis","Disseminated intravascular coagulation status","Transfusion of ABO-incompatible Rh-negative erythrocytes to an Rh-negative patient","Transfusion of ABO-compatible Rh-negative erythrocytes to Rh-positive patients"],"correct":[0,1,2,3],"why":"Extensive burns can damage erythrocytes directly and shorten their survival. Sepsis can cause hemolysis through mechanisms including DIC and, for certain organisms, hemolytic toxins. Microvascular fibrin can fragment passing erythrocytes. Recipient anti-A or anti-B can trigger complement-mediated intravascular hemolysis. Matching RhD does not eliminate ABO incompatibility.","optionWhy":["Extensive burns can damage erythrocytes directly and shorten their survival.","Sepsis can cause hemolysis through mechanisms including DIC and, for certain organisms, hemolytic toxins.","Microvascular fibrin can fragment passing erythrocytes.","Recipient anti-A or anti-B can trigger complement-mediated intravascular hemolysis. Matching RhD does not eliminate ABO incompatibility.","RhD-negative donor red cells lack the D antigen. Giving ABO-compatible RhD-negative cells to an RhD-positive patient does not itself cause hemolysis. The scan marks E and omits D."],"src":"Copy of Czech Ws was 3.pdf, p. 279 \u00b7 q1804","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1805 ng schemes call functional antibody effects on receptors type V, within type II hypersensitivity."],"src":"Copy of Czech Ws was 3.pdf, p. 282 \u00b7 q1806","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1807","topic":"immunity","q":"Causes of acquired secondary immunodeficiency include","opts":["Di-George syndrome","Treatment with immunosuppressive drugs","Anorexia nervosa","Diabetes mellitus","Alcoholism"],"correct":[1,2,3,4],"why":"Immunosuppressive drugs can reduce lymphocyte activation or proliferation and weaken host defenses. Severe malnutrition associated with anorexia nervosa can compromise immune responses. Poorly controlled diabetes can impair neutrophil function and increase susceptibility to infection. Chronic heavy alcohol use can impair innate and adaptive immunity. Associated malnutrition can compound the effect.","optionWhy":["DiGeorge syndrome is a congenital disorder in which thymic hypoplasia can impair T-cell development.","Immunosuppressive drugs can reduce lymphocyte activation or proliferation and weaken host defenses.","Severe malnutrition associated with anorexia nervosa can compromise immune responses.","Poorly controlled diabetes can impair neutrophil function and increase susceptibility to infection.","Chronic heavy alcohol use can impair innate and adaptive immunity. Associated malnutrition can compound the effect."],"src":"Copy of Czech Ws was 3.pdf, p. 285 \u00b7 q1807","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1808","topic":"immunity","q":"Autoimmune reactions against cell surface receptors","opts":["It is described as a type V hypersensitivity reaction, which is a subtype of type II hypersensitivity reaction","It is described as a type III hypersensitivity reaction","Can cause Graves' disease","It is a typical cause of anaphylactic reaction","May cause myasthenia gravis"],"correct":[0,2,4],"why":"Some teaching schemes call receptor-stimulating or receptor-blocking antibody effects type V, a functional subtype of type II. Stimulating antibodies to the TSH receptor increase thyroid hormone synthesis in Graves disease. Antibodies to the acetylcholine receptor can reduce effective neuromuscular transmission in myasthenia gravis.","optionWhy":["Some teaching schemes call receptor-stimulating or receptor-blocking antibody effects type V, a functional subtype of type II.","Type III hypersensitivity is mediated by deposition of soluble immune complexes. These antibodies bind directly to cell-surface receptors.","Stimulating antibodies to the TSH receptor increase thyroid hormone synthesis in Graves disease.","Classic anaphylaxis is a type I reaction involving IgE and mast-cell activation.","Antibodies to the acetylcholine receptor can reduce effective neuromuscular transmission in myasthenia gravis."],"src":"Copy of Czech Ws was 3.pdf, p. 285 \u00b7 q1808","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1809","topic":"blood","q":"Choose the correct statement(s) about neutrophilia","opts":["May be caused by corticoids","It is a typical sign of AIDS","It may be caused by a bacterial infection","It can be caused by a viral infection","It is a typical sign of a parasitic infection"],"correct":[0,2],"why":"Glucocorticoids increase circulating neutrophils through redistribution, delayed clearance and reduced tissue migration. Acute bacterial inflammation can increase circulating neutrophils through marrow release and mobilization.","optionWhy":["Glucocorticoids increase circulating neutrophils through redistribution, delayed clearance and reduced tissue migration.","AIDS primarily involves depletion of CD4 T cells.","Acute bacterial inflammation can increase circulating neutrophils through marrow release and mobilization.","The displayed key excludes this choice. Viral infections often have a lymphocytic pattern, though some can present with neutrophilia.","Many tissue-invasive parasitic infections classically cause eosinophilia."],"src":"Copy of Czech Ws was 3.pdf, p. 286 \u00b7 q1809","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1810","topic":"liver","q":"Symptoms of cirrhosis of the liver and portal hypertension include:","opts":["Coagulation disorder","Esophageal varices","Ascites","Hyperalbuminemia","Anemia"],"correct":[0,1,2,4],"why":"Loss of hepatic synthetic capacity can alter coagulation. Portosystemic collaterals form when portal pressure rises. Portal pressure and renal salt retention favor peritoneal fluid accumulation. Bleeding, nutritional deficiencies and hypersplenism can contribute to anemia.","optionWhy":["Loss of hepatic synthetic capacity can alter coagulation.","Portosystemic collaterals form when portal pressure rises.","Portal pressure and renal salt retention favor peritoneal fluid accumulation.","Advanced liver dysfunction often lowers albumin synthesis.","Bleeding, nutritional deficiencies and hypersplenism can contribute to anemia."],"src":"Copy of Czech Ws was 3.pdf, p. 289 \u00b7 q1810","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1811","topic":"liver","q":"The presence of a gallstone in the papilla duodeni major (Vateri) can lead to:","opts":["Increased plasma concentrations of unconjugated bilirubin","Acute cholecystitis","Jaundice","Acute pancreatitis","Increased concentration of urobilinogen in urine"],"correct":[1,2,3],"why":"Moodle includes this choice. Acute calculous cholecystitis classically follows cystic duct obstruction and can coexist with a stone at the papilla. Obstruction of bile drainage causes conjugated bilirubin to accumulate and can produce jaundice. A stone at the major papilla can impair pancreatic duct drainage and trigger acute pancreatitis.","optionWhy":["Distal duct obstruction chiefly raises conjugated bilirubin because already conjugated bilirubin cannot drain normally.","Moodle includes this choice. Acute calculous cholecystitis classically follows cystic duct obstruction and can coexist with a stone at the papilla.","Obstruction of bile drainage causes conjugated bilirubin to accumulate and can produce jaundice.","A stone at the major papilla can impair pancreatic duct drainage and trigger acute pancreatitis.","Complete obstruction reduces the amount of bilirubin reaching intestinal bacteria, which reduces urobilinogen production."],"src":"Copy of Czech Ws was 3.pdf, p. 291 \u00b7 q1811","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1812","topic":"hemostasis","q":"APTT is prolonged","opts":["Usually in patients treated with heparin","Often in patients with DIC syndrome (consumptive coagulopathy)","Usually in patients with increased Quick test time","Usually in patients with hemophilia A","Usually in patients with elevated D-dimers"],"correct":[0,1,3],"why":"Unfractionated heparin enhances antithrombin action and often prolongs aPTT. Consumption of coagulation factors can prolong aPTT in DIC. Results vary with timing and severity. Factor VIII deficiency impairs the intrinsic pathway and can prolong aPTT.","optionWhy":["Unfractionated heparin enhances antithrombin action and often prolongs aPTT.","Consumption of coagulation factors can prolong aPTT in DIC. Results vary with timing and severity.","The Quick test measures PT, which can be prolonged due to an isolated extrinsic pathway defect without prolonging aPTT.","Factor VIII deficiency impairs the intrinsic pathway and can prolong aPTT.","Elevated D-dimers indicate fibrin turnover. They do not independently predict a prolonged aPTT."],"src":"Copy of Czech Ws was 3.pdf, p. 294 \u00b7 q1812","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1813","topic":"liver","q":"What is usually shown in a laboratory blood test in patients with acute pancreatitis that developed as a result of alcohol consumption?","opts":["Increased Ca\u00b2\u207a level","Increased lipase level","Increased level of amylase","Elevated GGT level","Elevated level of leukocytes"],"correct":[1, n the characteristic meal-triggered pain as directly."],"src":"Copy of Czech Ws was 3.pdf, p. 389 \u00b7 q1826","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1827","topic":"liver","q":"It is NOT among the etiopathogenetic mechanisms of hepatic encephalopathy","opts":["increased production of steroid hormones in the liver","the presence of increased levels of toxic substances produced by the activity of intestinal bacteria (mercaptans, phenol) in the circulation","Ammonia metabolism disorder","neurotransmission disorders"],"correct":[0],"why":"Increased hepatic steroid synthesis is not a defining mechanism.","optionWhy":["Increased hepatic steroid synthesis is not a defining mechanism.","Gut-derived compounds can accumulate when hepatic clearance is impaired or bypassed.","Reduced conversion of ammonia to urea and portosystemic shunting increase systemic ammonia exposure.","Astrocyte dysfunction and altered neurotransmission contribute to neurologic signs."],"src":"Copy of Czech Ws was 3.pdf, p. 408 \u00b7 q1827","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1828","topic":"blood","q":"Choose the correct statement(s) about anemia of chronic disease","opts":["It can be caused by rheumatoid arthritis","Hepcidin level increases due to pro-inflammatory mediators","It is associated with increased plasma concentration of ferritin and decreased transferrin","It is associated with decreased plasma concentrations of ferritin and transferrin","IL-10 and IL-12 play a major role in the pathogenesis of this anemia"],"correct":[0,1,2],"why":"Persistent inflammation in rheumatoid arthritis can impair iron availability and erythropoiesis. Inflammation, especially IL-6 signaling, increases hepatic hepcidin and restricts iron export. Ferritin can rise as an acute-phase reactant while transferrin falls.","optionWhy":["Persistent inflammation in rheumatoid arthritis can impair iron availability and erythropoiesis.","Inflammation, especially IL-6 signaling, increases hepatic hepcidin and restricts iron export.","Ferritin can rise as an acute-phase reactant while transferrin falls.","Ferritin is typically preserved or raised with inflammation. Low ferritin suggests coexisting absolute iron deficiency.","IL-6 is the best-established cytokine driving the hepcidin response in this context."],"src":"Copy of Czech Ws was 3.pdf, p. 409 \u00b7 q1828","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1829","topic":"hemostasis","q":"Mark the pathological condition that may be the cause of bleeding","opts":["protein C deficiency","antithrombin III deficiency","protein S deficiency","fibrinogen deficiency"],"correct":[3],"why":"Fibrinogen supplies the substrate for fibrin formation. Deficiency weakens the clot and can cause bleeding.","optionWhy":["Protein C inactivates factors Va and VIIIa. Deficiency favors thrombosis.","Antithrombin inhibits thrombin and factor Xa. Deficiency increases thrombotic risk.","Protein S supports activated protein C. Deficiency favors thrombosis.","Fibrinogen supplies the substrate for fibrin formation. Deficiency weakens the clot and can cause bleeding."],"src":"Copy of Czech Ws was 3.pdf, p. 410 \u00b7 q1829","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1830","topic":"blood","q":"Glucose-6-phosphate dehydrogenase deficiency","opts":["is manifested in an acute attack by the consumption of haptoglobin and hemoglobinuria","is caused by only one functional mutation","is more pronounced in women","is more pronounced in men"],"correct":[0,3],"why":"Intravascular hemolysis releases free hemoglobin, which binds haptoglobin and can spill into urine. Hemizygous males carrying a deficient allele typically have no normal copy on a second X chromosome.","src":"Copy of Czech Ws was 3.pdf, p. 412 \u00b7 q1830","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Intravascular hemolysis releases free hemoglobin, which binds haptoglobin and can spill into urine.","Many G6PD variants can reduce enzyme activity.","Heterozygous women usually have a mixture of normal and deficient red cells, although skewed X inactivation can cause symptoms.","Hemizygous males carrying a deficient allele typically have no normal copy on a second X chromosome."]},{"id":"midterm3-q1831","topic":"liver","q":"Ascites","opts":["is accompanied by reduced secretion of aldosterone","is accompanied by water and sodium (Na) retention","may be due to decreased Na resorption in the proximal tubules","may be accompanied by dilutional hyponatremia"],"correct":[1,3],"why":"Renal sodium and water retention helps sustain ascites in cirrhosis. Nonosmotic vasopressin release can retain proportionally more water than sodium and lower serum sodium.","src":"Copy of Czech Ws was 3.pdf, p. 414 \u00b7 q1831","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Reduced effective arterial volume in cirrhosis activates the renin\u2013angiotensin\u2013aldosterone system.","Renal sodium and water retention helps sustain ascites in cirrhosis.","Reduced proximal sodium reabsorption increases sodium delivery downstream and does not explain the sodium retention driving cirrhotic ascites.","Nonosmotic vasopressin release can retain proportionally more water than sodium and lower serum sodium."]},{"id":"midterm3-q1832","topic":"immunity","q":"Bronchoconstriction in anaphylactic shock is caused by","opts":["effect of adrenaline","leukotrienes (LTC4, LTD4 and LTE4)","effect of noradrenaline","activation of the sympathetic nervous system"],"correct":[1],"why":"Cysteinyl leukotrienes released during anaphylaxis contract bronchial smooth muscle.","src":"Copy of Czech Ws was 3.pdf, p. 415 \u00b7 q1832","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Adrenaline stimulates beta-2 receptors and relaxes bronchial smooth muscle.","Cysteinyl leukotrienes released during anaphylaxis contract bronchial smooth muscle.","Noradrenaline chiefly supports vascular tone and is not the mediator responsible for bronchospasm.","The bronchospasm is driven by released inflammatory mediators. Sympathetic beta-2 signaling favors bronchodilation."]},{"id":"midterm3-q1833","topic":"hemostasis","q":"Thrombophilic state","opts":["can contribute to the development of arterial thrombosis","does not represent a higher risk of developing thromboembolic disease","may contribute to the development of acute coronary syndrome","occurs when taking acetylsalicylic acid"],"correct":[0,2],"why":"Some thrombophilic states, particularly antiphospholipid syndrome, can increase arterial thrombosis risk. A prothrombotic state can contribute to coronary thrombosis.","optionWhy":["Some thrombophilic states, particularly antiphospholipid syndrome, can increase arterial thrombosis risk.","A thrombophilic state increases susceptibility to thrombosis and thromboembolism.","A prothrombotic state can contribute to coronary thrombosis.","Acetylsalicylic acid inhibits platelet thromboxane production and reduces platelet aggregation."],"src":"Copy of Czech Ws was 3.pdf, p. 416 \u00b7 q1833","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1834","topic":"liver","q":"Which factors can play a role in cholelithiasis?","opts":["reduction of bile acid secretion","increased sensitivity of the bile ducts to cholecystokinin","insufficient saturation of bile with cholesterol","hypersaturation of bile with cholesterol"],"correct":[0,3],"why":"Bile acids help keep cholesterol in solution. A reduced bile acid supply favors crystallization. Supersaturation allows cholesterol to precipitate, a key step in cholesterol stone formation.","src":"Copy of Czech Ws was 3.pdf, p. 417 \u00b7 q1834","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Bile acids help keep cholesterol in solution. A reduced bile acid supply favors crystallization.","Gallbladder stasis favors stone formation. Increased duct sensitivity to cholecystokinin is not a typical mechanism.","Cholesterol is less likely to precipitate from undersaturated bile.","Supersaturation allows cholesterol to precipitate, a key step in cholesterol stone formation."]},{"id":"midterm3-q1835","topic":"blood","q":"The following changes occur in thalassemia major","opts":["increase in unconjugated bilirubin","sideropenia","decrease in reticulocytes","microcytic anemia"],"correct":[0,3],"why":"Ineffective erythropoiesis and hemolysis increase heme breakdown and can raise unconjugated bilirubin. Reduced globin synthesis produces small, hypochromic red cells.","src":"Copy of Czech Ws was 3.pdf, p. 418 \u00b7 q1835","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Ineffective erythropoiesis and hemolysis increase heme breakdown and can raise unconjugated bilirubin.","Thalassemia is a defect in globin synthesis. Iron overload is common in severe disease.","Reticulocytes can increase in response to hemolysis, though the response may be inadequate for the severity of anemia.","Reduced globin synthesis produces small, hypochromic red cells."]},{"id":"midterm3-q1836","topic":"blood","q":"Hepcidin","opts":["its production increases during inflammation and may contribute to the development of anemia in chronic diseases","it is insufficiently formed in hereditary hemochromatosis","increases iron absorption","it is formed in excess due to a lack of iron in the body","is a degradation product of hemoglobin"],"correct":[0,1],"why":"Inflammation induces hepcidin, which limits circulating iron and contributes to anemia of inflammation. In common HFE-related hemochromatosis, hepcidin is inappropriately low relative to iron stores.","src":"Copy of Czech Ws was 3.pdf, p. 419 \u00b7 q1836","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Inflammation induces hepcidin, which limits circulating iron and contributes to anemia of inflammation.","In common HFE-related hemochromatosis, hepcidin is inappropriately low relative to iron stores.","Hepcidin reduces ferroportin-mediated iron export from enterocytes, lowering iron absorption.","Iron deficiency suppresses hepcidin to make iron more available.","Hepcidin is a peptide hormone made primarily in the liver."]},{"id":"midterm3-q1837","topic":"immunity","q":"Systemic lupus erythematosus is characterized by","opts":["the formation of antibodies directed against DNA","the formation of a wide spectrum of autoantibodies","significantly more frequent occurrence in men than in women","the formation of a broad spectrum of cytotoxic lymphocytes"],"correct":[0,1],"why":"Anti-double-stranded DNA antibodies are characteristic of SLE. SLE can produce autoantibodies against several nuclear and other cellular antigens.","src":"Copy of Czech Ws was 3.pdf, p. 422 \u00b7 q1837","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Anti-double-stranded DNA antibodies are characteristic of SLE.","SLE can produce autoantibodies against several nuclear and other cellular antigens.","SLE is more frequent in women.","A broad cytotoxic lymphocyte response is not a defining feature. Autoantibodies and immune complexes account for many manifestations."]},{"id":"midterm3-q1838","topic":"hemostasis","q":"Acquired vasculopathies include:","opts":["Cushing's syndrome","Ehlers-Danlos syndrome","Henoch-Sch\u00f6nlein purpura","Glanzman's thrombasthenia","Marfan syndrome"],"correct":[0,2],"why":"Chronic glucocorticoid excess can cause skin thinning and loss of support around small vessels, leading to easy bruising. Henoch\u2013Sch\u00f6nlein purpura, now called IgA vasculitis, is an acquired small-vessel vasculitis.","optionWhy":["Chronic glucocorticoid excess can cause skin thinning and loss of support around small vessels, leading to easy bruising.","Ehlers\u2013Danlos syndromes are inherited connective tissue disorders. Some subtypes cause vascular fragility.","Henoch\u2013Sch\u00f6nlein purpura, now called IgA vasculitis, is an acquired small-vessel vasculitis.","Glanzmann thrombasthenia is usually an inherited platelet aggregation defect involving glycoprotein IIb/IIIa.","Marfan syndrome is an inherited connective tissue disorder associated with FBN1 variants."],"src":"Copy of Czech Ws was 3.pdf, p. 420 \u00b7 q1838","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1839","topic":"liver","q":"Symptoms of cirrhosis of the liver and portal hypertension include:","opts":["Hyperalbuminemia","Esophageal varices","Anemia","Coagulation disorder","Ascites"],"correct":[1,2,3,4],"why":"Portosystemic collaterals form when portal pressure rises. Bleeding, nutritional deficiencies and hypersplenism can contribute to anemia. Loss of hepatic synthetic capacity can alter coagulation. Portal pressure and renal salt retention favor peritoneal fluid accumulation.","src":"Copy of Czech Ws was 3.pdf, p. 421 \u00b7 q1839","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Advanced liver dysfunction often lowers albumin synthesis.","Portosystemic collaterals form when portal pressure rises.","Bleeding, nutritional deficiencies and hypersplenism can contribute to anemia.","Loss of hepatic synthetic capacity can alter coagulation.","Portal pressure and renal salt retention favor peritoneal fluid accumulation."]},{"id":"midterm3-q1840","topic":"liver","q":"Which can lead to ascites?","opts":["portal hypertension","insufficient production of aldosterone","peptic ulcer","lowering of oncotic pressure"],"correct":[0,3],"why":"Elevated portal pressure favors fluid filtration into the peritoneal cavity. Low plasma oncotic pressure from hypoalbuminemia can contribute to fluid accumulation.","src":"Copy of Czech Ws was 3.pdf, p. 425 \u00b7 q1840","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Elevated portal pressure favors fluid filtration into the peritoneal cavity.","Cirrhotic ascites is typically accompanied by secondary hyperaldosteronism and renal sodium retention.","A peptic ulcer is not a typical cause of ascites.","Low plasma oncotic pressure from hypoalbuminemia can contribute to fluid accumulation."]},{"id":"midterm3-q1841","topic":"immunity","q":"Which play a role in the pathogenesis of type III hypersensitivity?","opts":["memory T lymphocytes","polyclonal activation of B cells","immune complexes","cytotoxic T lymphocytes"],"correct":[2],"why":"Antigen\u2013antibody complexes deposit in tissues and activate complement, recruiting inflammatory cells.","src":"Copy of Czech Ws was 3.pdf, p. 426 \u00b7 q1841","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Memory T cells mediate recall responses and are not the defining effector of type III injury.","Antibodies are needed for immune complexes, but polyclonal B-cell activation is not required.","Antigen\u2013antibody complexes deposit in tissues and activate complement, recruiting inflammatory cells.","Cytotoxic T cells cause direct cell injury in T-cell-mediated hypersensitivity."]},{"id":"midterm3-q1842","topic":"hemostasis","q":"Common sites of bleeding in platelet disorders are:","opts":["liver tissue","mucous membrane of the nose, mouth","coronary vessels, leading to myocardial infarction","mucous membrane of the gastrointestinal tract, uterine cavity","skin"],"correct":[1,3,4],"why":"Epistaxis and oral bleeding are typical mucosal manifestations of platelet disorders. Gastrointestinal mucosal bleeding and heavy uterine bleeding can result from impaired platelet plug formation. Petechiae, purpura and easy bruising are common cutaneous manifestations.","optionWhy":["Deep solid-organ bleeding is not the characteristic pattern of primary hemostatic failure.","Epistaxis and oral bleeding are typical mucosal manifestations of platelet disorders.","Myocardial infarction usually involves coronary occlusion rather than a typical mucosal or cutaneous bleed.","Gastrointestinal mucosal bleeding and heavy uterine bleeding can result from impaired platelet plug formation.","Petechiae, purpura and easy bruising are common cutaneous manifestations."],"src":"Copy of Czech Ws was 3.pdf, p. 430 \u00b7 q1842","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1843","topic":"liver","q":"What is usually shown in a laboratory blood test in patients with acute pancreatitis that developed as a result of alcohol consumption?","opts":["Increased lipase level","Increased level of amylase","Elevated GGT level","Elevated level of leukocytes","Increased Ca\u00b2\u207a level"],"correct":[0,1,2,3],"why":"Injured pancreatic acinar cells release lipase. It is a preferred serum marker of acute pancreatitis. Amylase can rise after pancreatic injury, although it may be normal in some cases and is less specific than lipase. GGT can rise with heavy alcohol use or associated hepatobiliary injury. It is neither specific to pancreatitis nor necessarily elevated in every case. Acute pancreatic inflammation can produce leukocytosis as part of the systemic inflammatory response.","optionWhy":["Injured pancreatic acinar cells release lipase. It is a preferred serum marker of acute pancreatitis.","Amylase can rise after pancreatic injury, although it may be normal in some cases and is less specific than lipase.","GGT can rise with heavy alcohol use or associated hepatobiliary injury. It is neither specific to pancreatitis nor necessarily elevated in every case.","Acute pancreatic inflammation can produce leukocytosis as part of the systemic inflammatory response.","Hypercalcemia can precipitate pancreatitis. Calcium can fall during severe pancreatitis, including from fat saponification."],"src":"Copy of Czech Ws was 3.pdf, p. 432 \u00b7 q1843","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1844","topic":"liver","q":"A 64-year-old patient with BMI 38 kg/m\u00b2 used to take paracetamol for several months to decrease chronic lower back pain. He plans to celebrate his 65th anniversary with his family and friends and plans to drink alcohol. What should the doctor recommend to him?","opts":["Not to consume fatty food with higher amounts of alcohol, because this combination increases the risk of pancreatitis.","No specific recommendations, except recommendations of weight reduction.","To increase the dosage of paracetamol, because drinking alcohol during the celebration will decrease the activity of paracetamol.","To stop taking paracetamol several days before the celebration, because combination of even a lower dose of alcohol and paracetamol leads to a very high risk of pancreatitis.","To stop taking paracetamol 1\u20132 days before the celebration, because combination of alcohol and paracetamol leads to increased risk of liver injury."],"correct":[0],"why":"Heavy alcohol intake is an established risk factor for acute pancreatitis. This is the option highlighted in the source.","src":"Copy of Czech Ws was 3.pdf, p. 2 \u00b7 q1844","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Heavy alcohol intake is an established risk factor for acute pancreatitis. This is the option highlighted in the source.","Weight reduction does not address the question about planned heavy alcohol consumption.","Increasing paracetamol exposure can raise the risk of liver toxicity. Alcohol does not justify a dose increase.","The question provides no basis for attributing a very high pancreatitis risk to the combination at low doses.","Paracetamol-related liver injury depends on factors such as dose and drinking pattern. The question does not establish a fixed 1\u20132 day interruption rule."]},{"id":"midterm3-q1845","topic":"liver","q":"Select the correct statement about pain in patients with acute pancreatitis","opts":["After vomiting, the pain usually gets worse","The pain radiates to the back","Pain is usually not severe and patients rarely require analgesic treatment","Prostaglandins are important in the development of pain","Pancreatic enzymes are one of the key factors leading to the development of pain"],"correct":[1,3,4],"why":"Radiation from the epigastrium through to the back is characteristic. Inflammatory prostaglandins sensitize nociceptors and contribute to pain. Premature enzyme activation damages pancreatic tissue and drives the painful inflammatory response.","src":"Copy of Czech Ws was 3.pdf, p. 441 \u00b7 q1845","conf":"key","seen":1,"recall":false,"scored":true,"optionWhy":["Pancreatitis causes persistent inflammatory pain. Vomiting does not predictably worsen it.","Radiation from the epigastrium through to the back is characteristic.","Acute pancreatitis often causes severe persistent epigastric pain.","Inflammatory prostaglandins sensitize nociceptors and contribute to pain.","Premature enzyme activation damages pancreatic tissue and drives the painful inflammatory response."]},{"id":"midterm3-q1846","topic":"liver","q":"The presence of a gallstone in the papilla duodeni major (Vateri) can lead to:","opts":["Increased plasma concentrations of unconjugated bilirubin","Acute cholecystitis","Increased concentration of urobilinogen in urine","Jaundice","Acute pancreatitis"],"correct":[1,3,4],"why":"Moodle includes this choice. Acute calculous cholecystitis classically follows cystic duct obstruction and can coexist with a stone at the papilla. Obstruction of bile drainage causes conjugated bilirubin to accumulate and can produce jaundice. A stone at the major papilla can impair pancreatic duct drainage and trigger acute pancreatitis.","optionWhy":["Distal duct obstruction chiefly raises conjugated bilirubin because already conjugated bilirubin cannot drain normally.","Moodle includes this choice. Acute calculous cholecystitis classically follows cystic duct obstruction and can coexist with a stone at the papilla.","Complete obstruction reduces the amount of bilirubin reaching intestinal bacteria, which reduces urobilinogen production.","Obstruction of bile drainage causes conjugated bilirubin to accumulate and can produce jaundice.","A stone at the major papilla can impair pancreatic duct drainage and trigger acute pancreatitis."],"src":"Copy of Czech Ws was 3.pdf, p. 442 \u00b7 q1846","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1847","topic":"liver","q":"Malabsorption syndrome occurs most often (2) as a consequence of","opts":["disorders of bile secretion","disorders of pancreatic secretion","reduced secretion of gastric juice","decreased secretion of saliva","diabetes insipidus"],"correct":[0,1],"why":"Bile salts are needed for micelle formation and efficient absorption of fat and fat-soluble vitamins. Exocrine pancreatic insufficiency reduces delivery of digestive enzymes, especially lipase, causing maldigestion and steatorrhea.","src":"From Ulvi/\u05d1\u05d9\u05d0\u05e0\u05d9 \u05de\u05e9\u05d0\u05dc\u05d4 123.pdf, p. 2 \u00b7 q1847","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Bile salts are needed for micelle formation and efficient absorption of fat and fat-soluble vitamins.","Exocrine pancreatic insufficiency reduces delivery of digestive enzymes, especially lipase, causing maldigestion and steatorrhea.","Reduced gastric secretion can affect certain nutrients, but it is not one of the two principal causes of maldigestion listed here.","Reduced saliva can affect oral processing and swallowing. It does not usually cause an intestinal malabsorption syndrome.","Diabetes insipidus impairs water balance through reduced antidiuretic hormone action and does not directly impair nutrient absorption."]},{"id":"midterm3-q1848","topic":"liver","q":"Constipation","opts":["can occur with hyponatremia","arises in hyperthyroidism","can occur during dehydration","is a negative factor that may contribute to portosystemic encephalopathy in advanced liver cirrhosis","risk factors include older age"],"correct":[2,3,4],"why":"Dehydration can contribute to hard stools and make them harder to pass. Slow transit can increase the gut-derived nitrogen load and precipitate hepatic encephalopathy in cirrhosis. Older adults are more prone to constipation, partly because of medications, reduced mobility, and comorbidities.","src":"From Ulvi/\u05d1\u05d9\u05d0\u05e0\u05d9 \u05de\u05e9\u05d0\u05dc\u05d4 123.pdf, p. 7 \u00b7 q1848","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hyponatremia itself is not a typical cause of constipation. An underlying illness or medication can account for both findings.","Hyperthyroidism usually speeds intestinal transit. Hypothyroidism is more commonly associated with constipation.","Dehydration can contribute to hard stools and make them harder to pass.","Slow transit can increase the gut-derived nitrogen load and precipitate hepatic encephalopathy in cirrhosis.","Older adults are more prone to constipation, partly because of medications, reduced mobility, and comorbidities."]},{"id":"midterm3-q1849","topic":"liver","q":"In an acutely admitted patient with repeated vomiting during a several-day attack of acute pancreatitis, which disorders of the internal environment may be found?","opts":["metabolic alkalosis with hypercapnia, polyuria and hyperkalemia","a combination of metabolic alkalosis and acidosis, dehydration and reduced urinary chloride excretion","pure metabolic alkalosis with complete compensation, hypochloremia, hyperchloruria and hyperkalemia","pure metabolic acidosis with hypocapnia, dehydration and hypokalemia"],"correct":[1],"why":"Loss of gastric hydrochloric acid can produce chloride-depletion alkalosis with low urinary chloride. Pancreatitis with hypoperfusion can add lactic acidosis.","src":"From Ulvi/\u05d1\u05d9\u05d0\u05e0\u05d9 \u05de\u05e9\u05d0\u05dc\u05d4 123.pdf, p. 20 \u00b7 q1849","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Hypercapnia can compensate for metabolic alkalosis, but chloride and volume loss from vomiting does not typically produce this combination of polyuria and hyperkalemia.","Loss of gastric hydrochloric acid can produce chloride-depletion alkalosis with low urinary chloride. Pancreatitis with hypoperfusion can add lactic acidosis.","Compensation alone does not completely normalize pH in a simple disorder. Vomiting with volume depletion usually lowers urine chloride and can lower serum potassium.","Hypocapnia could compensate for metabolic acidosis, but gastric acid loss can produce a concurrent metabolic alkalosis."]},{"id":"midterm3-q1850","topic":"liver","q":"What may be present in malabsorption?","opts":["reduced absorption of water and salt","increased absorption of water and salt","insufficient breakdown of fats","decreased intraluminal osmotic pressure in the alimentary canal"],"correct":[0,2],"why":"Unabsorbed solutes retain water in the intestinal lumen, and impaired mucosal function can reduce salt and water absorption. Exocrine pancreatic insufficiency reduces fat digestion and can cause steatorrhea.","src":"From Ulvi/\u05d1\u05d9\u05d0\u05e0\u05d9 \u05de\u05e9\u05d0\u05dc\u05d4 123.pdf, p. 24 \u00b7 q1850","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Unabsorbed solutes retain water in the intestinal lumen, and impaired mucosal function can reduce salt and water absorption.","Increased water and salt absorption does not explain the diarrhea that can accompany malabsorption.","Exocrine pancreatic insufficiency reduces fat digestion and can cause steatorrhea.","Unabsorbed solutes generally increase the osmotic load in the intestinal lumen."]},{"id":"midterm3-q1851","topic":"blood","q":"Choose the correct statement(s) about vitamin B12","opts":["The recommended daily intake of B12 is 70\u2013150 mg for adults","B12 is mostly absorbed in the duodenum","Vitamin B12 deficiency can lead to macrocytic anemia and demyelination of nerves","Vitamin B12 deficiency leads to hyperhomocysteinemia with an increased risk of endothelial damage","Gastric resection leads to B12 absorption disorders"],"correct":[2,3,4],"why":"B12 deficiency impairs DNA synthesis in marrow and can also cause neurologic injury through demyelination. B12 is required by methionine synthase. Deficiency raises homocysteine, which is associated with endothelial dysfunction. Gastric resection can reduce intrinsic factor production and impair B12 absorption.","src":"From Ulvi/\u05d1\u05d9\u05d0\u05e0\u05d9 \u05de\u05e9\u05d0\u05dc\u05d4 123.pdf, p. 49 \u00b7 q1851","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Adult vitamin B12 requirements are generally measured in micrograms, so the milligram amount shown is much too high.","The intrinsic factor\u2013B12 complex is absorbed mainly in the terminal ileum.","B12 deficiency impairs DNA synthesis in marrow and can also cause neurologic injury through demyelination.","B12 is required by methionine synthase. Deficiency raises homocysteine, which is associated with endothelial dysfunction.","Gastric resection can reduce intrinsic factor production and impair B12 absorption."]},{"id":"midterm3-q1852","topic":"liver","q":"Malabsorption syndrome","opts":["can manifest as iron deficiency","is usually accompanied by obstinate constipation","is usually accompanied by diarrhea","diarrhea is often accompanied by a tendency to develop metabolic alkalosis","can manifest as vitamin B12 deficiency"],"correct":[0,2,4],"why":"Impaired absorption, particularly in the proximal small bowel, can cause iron deficiency. Unabsorbed nutrients retain water in the lumen and can cause diarrhea. Conditions affecting the terminal ileum or other steps in B12 absorption can lead to B12 deficiency.","src":"From Ulvi/\u05d1\u05d9\u05d0\u05e0\u05d9 \u05de\u05e9\u05d0\u05dc\u05d4 123.pdf, p. 81 \u00b7 q1852","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Impaired absorption, particularly in the proximal small bowel, can cause iron deficiency.","Diarrhea is a more typical manifestation of intestinal malabsorption than persistent constipation.","Unabsorbed nutrients retain water in the lumen and can cause diarrhea.","Diarrheal loss of bicarbonate generally favors metabolic acidosis.","Conditions affecting the terminal ileum or other steps in B12 absorption can lead to B12 deficiency."]},{"id":"midterm3-q1853","topic":"liver","q":"Steatorrhea","opts":["can be caused by a disorder of pancreatic secretion","is always accompanied by impaired glucose tolerance","is the most important complication of lactose intolerance","can often be caused by a disorder of gastric secretion","can be accompanied by a lack of fat-soluble vitamins"],"correct":[0,4],"why":"Insufficient exocrine pancreatic enzyme secretion reduces fat digestion and can cause fatty stools. Poor fat absorption can reduce uptake of vitamins A, D, E and K.","src":"From Ulvi/\u05d1\u05d9\u05d0\u05e0\u05d9 \u05de\u05e9\u05d0\u05dc\u05d4 123.pdf, p. 83 \u00b7 q1853","conf":"inferred","seen":1,"recall":false,"scored":true,"optionWhy":["Insufficient exocrine pancreatic enzyme secretion reduces fat digestion and can cause fatty stools.","Fat maldigestion can occur independently of endocrine pancreatic dysfunction or impaired glucose tolerance.","Lactase deficiency causes carbohydrate malabsorption, typically with gas and osmotic diarrhea.","Pancreatic enzyme deficiency or impaired bile delivery is a more typical cause of steatorrhea.","Poor fat absorption can reduce uptake of vitamins A, D, E and K."]}];

function collapseRepeats(items, key) {
  const groups = new Map();
  for (const item of items) {
    const fingerprint = key(item);
    if (!groups.has(fingerprint)) groups.set(fingerprint, []);
    groups.get(fingerprint).push(item);
  }
  return [...groups.values()].map(group => {
    const canonical = group.find(item => item.conf === 'key') || group[0];
    return {
      ...canonical,
      seen: group.reduce((count, item) => count + (item.seen || 1), 0),
      src: [...new Set(group.map(item => item.src))].join(' · '),
    };
  });
}

const REVIEW_BANK = [{"id":"midterm3-q0002","topic":"liver","q":"Select the correct statement about pain in patients with acute pancreatitis","opts":["Pain is usually not severe and patients rarely require analgesic treatment","Pancreatic enzymes are one of the key factors leading to the development of pain","Prostaglandins contribute to the pain","The pain radiates to the back","After vomiting, the pain usually subsides"],"correct":[1,2,3],"why":"Inflammatory mediators and enzyme-mediated tissue injury contribute to pain. Pancreatic pain commonly radiates to the back and is often severe.","src":"3. test verze 1-2.pdf.pdf, p. 1 \u00b7 q0002","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0003","topic":"liver","q":"Symptoms of cirrhosis of the liver and portal hypertension include:","opts":["Coagulation disorder","Ascites","Hyperalbuminemia","Anemia","Esophageal varices"],"correct":[0,1,3,4],"why":"Portal hypertension favors ascites and varices. Reduced hepatic synthesis can impair coagulation, and bleeding, nutrition, or hypersplenism may contribute to anemia.","src":"3. test verze 1-2.pdf.pdf, p. 2 \u00b7 q0003","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0008","topic":"liver","q":"Which manifestations can follow portal hypertension?","opts":["Esophageal varices","Congestive splenomegaly","Ascites","Hyperalbuminemia from increased hepatic synthesis"],"correct":[0,1,2],"why":"Portal pressure promotes collateral formation and splenic congestion. Increased hydrostatic pressure and sodium retention contribute to ascites.","src":"3. test verze 1-2.pdf.pdf, p. 4 \u00b7 q0008","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0534","topic":"hemostasis","q":"What is typical at an isolated platelet count of 110 \u00d7 10\u2079/L?","opts":["Usually without symptoms (asymptomatic)","It is a typical sign of the Leiden mutation","It is an important cause of hemarthrosis","Means there is a risk of spontaneous intracranial bleeding","Associated with purpura and ecchymosis"],"correct":[0],"why":"Mild isolated thrombocytopenia is usually asymptomatic. The count alone does not indicate a high risk of spontaneous intracranial bleeding.","src":"3. test verze 1-2.pdf.pdf, p. 5 \u00b7 q0534","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0013","topic":"hemostasis","q":"Which statements about thrombocytopenia are correct?","opts":["It is one of the causes of impaired primary hemostasis","Associated with hematomas but never with hemarthrosis","It is a typical sign of ulcerative colitis","It can be treated with aspirin","May result from portal hypertension"],"correct":[0,4],"why":"Low platelet numbers impair primary hemostasis. Portal hypertension can cause splenomegaly and platelet sequestration. Aspirin impairs platelet function.","src":"3. test verze 2-2.pdf.pdf, p. 2 \u00b7 q0013","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0017","topic":"liver","q":"Which findings support acute calculous cholecystitis?","opts":["Persistent right upper quadrant pain","Fever","Inspiratory arrest during deep right upper quadrant palpation","Painless unconjugated hyperbilirubinemia as the defining presentation"],"correct":[0,1,2],"why":"Persistent cystic duct obstruction inflames the gallbladder and can produce a positive Murphy sign.","src":"3. test verze 2-2.pdf.pdf, p. 4 \u00b7 q0017","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0019","topic":"hemostasis","q":"Choose the correct statement about hemophilia A.","opts":["PT is extended","APTT is prolonged","It is a disease linked to the Y chromosome, therefore only men can have it","Petechial hemorrhage and purpura are typical","If the patient has approximately 10% factor VIII, this indicates a high risk of spontaneous bleeding"],"correct":[1],"why":"Factor VIII deficiency impairs the intrinsic pathway, prolonging aPTT with a usually normal PT. Inherited hemophilia A is X-linked.","src":"3. test verze 2-2.pdf.pdf, p. 5 \u00b7 q0019","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0020","topic":"liver","q":"Which complications can directly result from an obstructing stone at the ampulla of Vater?","opts":["Acute pancreatitis","Obstructive jaundice","Isolated cystic duct obstruction as the direct mechanism","Unconjugated hyperbilirubinemia as the expected pattern"],"correct":[0,1],"why":"An ampullary stone may block both pancreatic juice and bile. Acute cholecystitis generally follows cystic duct obstruction.","src":"3. test verze 2-2.pdf.pdf, p. 5 \u00b7 q0020","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0021","topic":"hemostasis","q":"A 19-year-old recovering from a respiratory infection has platelets of 82 \u00d7 10\u2079/L, INR 1.12, aPTT 29 seconds, and Duke bleeding time 4 minutes 40 seconds. Which finding is most likely?","opts":["Has no clinical signs of bleeding disorders","Has to be hospitalized to ICU for high risk of life-threatening bleeding","Has acquired hemophilia A \u2013type disorder due to formation of antibodies to f.VIII","Has mother heterozygotic for hemophilia A or B","Has vitamin K deficiency due to treatment by antibiotics"],"correct":[0],"why":"This degree of thrombocytopenia can occur without clinical bleeding. PT and aPTT do not point to a severe coagulation factor deficiency here.","src":"3rd test Lian.docx.pdf, p. 1 \u00b7 q0021","conf":"key","seen":2,"recall":false,"scored":true},{"id":"midterm3-q0206","topic":"blood","q":"Which statements about leukocyte counts are correct?","opts":["An increased number of eosinophils with 4% of basophils and 9% of neutrophils can be related to bacterial infection","An increased number of macrophages with 14% of basophils and 62% of lymphocytes can be related to bacterial infection","Chemotherapy is an important risk factor of neutropenia","An increased number of neutrophils with 4% of metamyelocytes and 9% of bands can be related to bacterial infection","Amount of leucocytes in peripheral blood is approximately 0,5 kg"],"correct":[2,3],"why":"Chemotherapy may suppress marrow production. An increase in bands and metamyelocytes is a left shift, which can occur in bacterial infection.","src":"4th test Lian.docx.pdf, p. 2 \u00b7 q0206","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0207","topic":"immunity","q":"Which mediator contributes to bronchoconstriction during type I hypersensitivity?","opts":["Leukotrienes released after mast-cell activation","Hepcidin released from hepatocytes","Factor XIII released to cross-link fibrin","Erythropoietin released from the kidney"],"correct":[0],"why":"Allergen exposure can cross-link mast cell-bound IgE and cause leukotriene release, bronchoconstriction, and edema.","src":"4th test Lian.docx.pdf, p. 2 \u00b7 q0207","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0210","topic":"immunity","q":"Which statements about hypersensitivity are correct?","opts":["A type III hypersensitivity reaction is important in the pathogenesis of systemic lupus erythematosus","Type I hypersensitivity reaction is associated with increased IgE levels","The most severe type II hypersensitivity reaction is anaphylactic shock","A type II hypersensitivity reaction is the major cause of bronchial asthma","The mechanism of development of glomerulonephritis is most frequently related to type IV hypersensitivity reaction"],"correct":[0,1],"why":"Immune complexes contribute to lupus pathology. Type I reactions involve antigen-specific IgE and include anaphylaxis.","src":"4th test Lian.docx.pdf, p. 4 \u00b7 q0210","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0211","topic":"blood","q":"Which statements describe anemia of chronic inflammation?","opts":["Hepcidin level increases due to pro-inflammatory mediators","It is associated with decreased plasma concentrations of ferritin and transferrin","Patients usually have severe iron deficiency and very low plasma iron level","It can be caused by Crohn\u2019s disease","IL 2 and IL 8 play a major role in the pathogenesis of this anemia"],"correct":[0,3],"why":"Inflammation raises hepcidin and restricts iron availability. Inflammatory bowel disease can supply that inflammatory stimulus.","src":"4th test Lian.docx.pdf, p. 4 \u00b7 q0211","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0214","topic":"liver","q":"Which findings fit acute common bile duct obstruction from a gallstone?","opts":["Conjugated hyperbilirubinemia","Colicky abdominal pain","Dark stool and pale urine as the expected pattern","ALP typically falls"],"correct":[0,1],"why":"Obstruction impairs excretion of conjugated bilirubin. Urine can darken, stool can pale, and a stone may produce colicky pain.","src":"4th test Lian.docx.pdf, p. 6 \u00b7 q0214","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0215","topic":"immunity","q":"Which mechanisms contribute to anaphylactic shock or airway compromise?","opts":["Leukotriene-mediated bronchoconstriction","Histamine-mediated vasodilation","Increased vascular permeability and airway edema","Hyperkalemia as the usual primary mechanism"],"correct":[0,1,2],"why":"Mast cell mediators cause vasodilation, capillary leakage, bronchospasm, and edema.","src":"4th test Lian.docx.pdf, p. 7 \u00b7 q0215","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0216","topic":"blood","q":"Which statements describe sickle cell disease?","opts":["Infection can precipitate a crisis","It is an extrinsic red-cell disorder","It can cause acute crises and chronic pain","It can cause cerebral vaso-occlusive injury"],"correct":[0,2,3],"why":"Deoxygenated HbS polymerizes, promoting sickling, hemolysis, and microvascular obstruction.","src":"4th test Lian.docx.pdf, p. 8 \u00b7 q0216","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0219","topic":"blood","q":"Which conditions or mechanisms can produce microcytic or hypochromic anemia?","opts":["Anemia due to impaired heme synthesis","thalassemia","impaired synthesis of the globin component of hemoglobin","anemia of chronic diseases","B12 deficiency anemia"],"correct":[0,1,2,3],"why":"Heme synthesis disorders and reduced globin synthesis can produce microcytosis. Anemia of chronic inflammation is often normocytic but can become microcytic.","src":"4th test Lian.docx.pdf, p. 10 \u00b7 q0219","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0220","topic":"blood","q":"Which products help neutrophils kill microbes inside phagolysosomes?","opts":["Defensins","Lysozyme","IgA secreted by neutrophils","Histamine as their main intracellular antimicrobial agent"],"correct":[0,1],"why":"Neutrophil granules contain antimicrobial peptides and enzymes, including defensins and lysozyme.","src":"4th test Lian.docx.pdf, p. 10 \u00b7 q0220","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0222","topic":"immunity","q":"Which diseases are classic examples of autoimmunity?","opts":["Hashimoto thyroiditis","Systemic lupus erythematosus","Inherited hemophilia A","Down syndrome"],"correct":[0,1],"why":"Hashimoto thyroiditis targets the thyroid and lupus can affect multiple organs through autoantibodies and immune complexes.","src":"4th test Lian.docx.pdf, p. 11 \u00b7 q0222","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0223","topic":"liver","q":"Which laboratory findings can occur during symptomatic hepatitis A?","opts":["Blood ALT and AST levels increase","More than half of the patients rapidly develop hepatic encephalopathy","Stool color is usually hypercholic","Conjugated and unconjugated bilirubin concentrations in the blood increase","Patients usually do not have jaundice"],"correct":[0,3],"why":"Acute hepatitis can raise AST and ALT through hepatocyte injury. Both bilirubin fractions can rise when bilirubin handling is impaired.","src":"4th test Lian.docx.pdf, p. 12 \u00b7 q0223","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0898","topic":"blood","q":"Which findings or causes fit iron deficiency anemia?","opts":["Chronic atrophic gastritis","Chronic occult bleeding","High ferritin as the expected pattern","Dysphagia and oral mucosal atrophy in longstanding disease"],"correct":[0,1,3],"why":"Poor absorption or chronic blood loss can deplete iron. Longstanding deficiency may cause mucosal changes.","src":"Copy of Czech Ws was 3.pdf, p. 5 \u00b7 q0898","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0900","topic":"hemostasis","q":"Where is von Willebrand factor found?","opts":["Hepatocytes are its primary site of synthesis","The subendothelial matrix","Only inside red blood cells","Only in the fibrin clot"],"correct":[1],"why":"Endothelial cells deposit von Willebrand factor in the subendothelial matrix, where it supports platelet adhesion.","src":"Copy of Czech Ws was 3.pdf, p. 8 \u00b7 q0900","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0787","topic":"hemostasis","q":"What is the effect of factor V Leiden?","opts":["Prolonged PT","Increased risk of venous thrombosis","Spontaneous bleeding","Shortened aPTT as its characteristic finding"],"correct":[1],"why":"Factor V Leiden makes activated factor V resistant to cleavage by activated protein C.","src":"Copy of Czech Ws was 3.pdf, p. 15 \u00b7 q0787","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0795","topic":"liver","q":"Which inherited disorders can cause chronic liver damage?","opts":["Wilson disease","Hereditary hemochromatosis","Alpha-1 antitrypsin deficiency","Inherited hemophilia A as a direct cause of cirrhosis"],"correct":[0,1,2],"why":"Copper accumulation, iron overload, and hepatocyte retention of abnormal alpha-1 antitrypsin can injure the liver.","src":"Copy of Czech Ws was 3.pdf, p. 44 \u00b7 q0795","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0801","topic":"immunity","q":"Which cell releases preformed mediators immediately after allergen cross-links receptor-bound IgE?","opts":["Mast cell","Erythrocyte","Megakaryocyte","Hepatocyte"],"correct":[0],"why":"Mast cells carry Fc\u03b5RI-bound IgE and degranulate after antigen-dependent cross-linking.","src":"Copy of Czech Ws was 3.pdf, p. 61 \u00b7 q0801","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0814","topic":"immunity","q":"Which disorders can result from antibodies directed against cell-surface receptors?","opts":["Myasthenia gravis","Graves disease","Iron deficiency anemia","Hereditary hemophilia A"],"correct":[0,1],"why":"Antibodies impair acetylcholine receptor function in myasthenia gravis and stimulate the TSH receptor in Graves disease.","src":"Copy of Czech Ws was 3.pdf, p. 114 \u00b7 q0814","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0550","topic":"immunity","q":"Which can cause secondary immunodeficiency?","opts":["Immunosuppressive medication","Severe malnutrition","DiGeorge syndrome","HIV infection"],"correct":[0,1,3],"why":"Secondary immunodeficiency is acquired. DiGeorge syndrome is a primary developmental disorder.","src":"Copy of Czech Ws was 3.pdf, p. 115 \u00b7 q0550","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0816","topic":"immunity","q":"Which statements about immune disorders are correct?","opts":["HIV primarily targets CD4 T cells","Severe malnutrition can impair immunity","Selective IgA deficiency is a form of primary immunodeficiency","Eosinophilia excludes allergic inflammation"],"correct":[0,1,2],"why":"HIV and malnutrition cause secondary immune dysfunction. Selective IgA deficiency is primary, and eosinophilia can accompany allergic disease.","src":"Copy of Czech Ws was 3.pdf, p. 121 \u00b7 q0816","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1532","topic":"immunity","q":"A translocation places MYC under an immunoglobulin enhancer. Which disease is the classic example?","opts":["Burkitt lymphoma","Iron deficiency anemia","Systemic lupus erythematosus","Polycythemia vera"],"correct":[0],"why":"The immunoglobulin enhancer drives inappropriate MYC expression in the B cell.","src":"Copy of Czech Ws was 3.pdf, p. 132 \u00b7 q1532","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0917","topic":"blood","q":"Which neutrophil function is impaired in lazy leukocyte syndrome?","opts":["Oxidative burst","Chemotaxis","Antibody production","Complement activation"],"correct":[1],"why":"This disorder impairs directed neutrophil migration.","src":"Copy of Czech Ws was 3.pdf, p. 189 \u00b7 q0917","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1189","topic":"blood","q":"What red cell pattern is typical of anemia due to reduced erythropoietin in chronic kidney disease?","opts":["Normocytic hypoproliferative anemia","Severe macrocytosis from impaired DNA synthesis","Hypochromic microcytosis in every case","Reticulocytosis from marrow overstimulation"],"correct":[0],"why":"Reduced renal erythropoietin lowers marrow red cell production without directly impairing hemoglobin synthesis or DNA replication.","src":"Copy of Czech Ws was 3.pdf, p. 190 \u00b7 q1189","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0023","topic":"immunity","q":"Which findings can result from a systemic type I hypersensitivity reaction?","opts":["Bronchospasm","Diarrhea","Distributive shock","Delayed granuloma formation as its defining manifestation"],"correct":[0,1,2],"why":"Mast-cell mediators affect the airways, gut, and circulation.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0023","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0027","topic":"liver","q":"Which statements about cirrhosis are correct?","opts":["Can cause secondary immunodeficiency","Can develop as a complication of nonalcoholic fatty liver disease","Is a risk factor for hypoaldosteronism","Is a risk factor for hypoglycemia","Often develops as a complication of viral hepatitis A"],"correct":[0,1,3],"why":"Cirrhosis can impair immune defenses and glucose regulation. Steatotic liver disease can progress to cirrhosis. Hepatitis A does not establish chronic infection.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0027","conf":"key","seen":2,"recall":false,"scored":true},{"id":"midterm3-q0028","topic":"hemostasis","q":"Which statement is correct about platelet dysfunction?","opts":["Can be caused by aspirin","aPTT is prolonged","INR is prolonged","Can be treated by heparin","D-dimer level is increased"],"correct":[0],"why":"Aspirin lowers platelet thromboxane A\u2082 production. PT and aPTT measure plasma coagulation rather than platelet aggregation.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0028","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0030","topic":"blood","q":"Which statements about leukocytes in inflammation are correct?","opts":["During degranulation, mast cells release histamine, heparin and serotonin","Neutrophils are macrophages which cannot phagocyte microorganism without opsonization","IL-6 directly induces hepatocytes to produce acute phase reactants","Tissue macrophages are the important producers of interleukin-1 and TNF-\u03b1","Neutrophilic granulocytes are key cells in defense against multicellular parasites"],"correct":[0,2,3],"why":"Mast-cell granules contain inflammatory mediators. IL-6 stimulates hepatic acute-phase reactants, and activated macrophages produce IL-1 and TNF.","src":"D1DEAB52-F78C-4617-91B0-794D63294998.pdf.pdf, p. 1 \u00b7 q0030","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0038","topic":"hemostasis","q":"Which situations can prolong aPTT?","opts":["Usually in patients with increased D-dimers","Usually in patients treated with heparin","Usually in patients with hemophilia B","Often in patients with liver failure","Usually in patients with thrombocytopenia"],"correct":[1,2,3],"why":"Unfractionated heparin, factor IX deficiency, and some cases of advanced liver failure can prolong aPTT. The platelet count and D-dimer do not directly determine it.","src":"D8F043B3-4693-45BD-810F-8CAF38873756 2.pdf, p. 1 \u00b7 q0038","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0040","topic":"liver","q":"Which statements about liver cirrhosis are correct?","opts":["Often develops as complication of hepatitis type A","May cause secondary hyperaldosteronism","Is a risk factor for hypoglycemia","Can cause secondary immunodeficiency","Can develop as complication of nonalcoholic fatty liver disease"],"correct":[1,2,3,4],"why":"Portal circulatory changes can activate aldosterone. Loss of hepatic reserve can cause hypoglycemia, and cirrhosis can impair immune defense.","src":"D8F043B3-4693-45BD-810F-8CAF38873756 2.pdf, p. 1 \u00b7 q0040","conf":"key","seen":2,"recall":false,"scored":true},{"id":"midterm3-q0044","topic":"liver","q":"Which laboratory results directly support pancreatic injury in acute pancreatitis?","opts":["Elevated lipase","Elevated amylase","Elevated GGT alone","Low leukocyte count alone"],"correct":[0,1],"why":"Lipase and amylase reflect pancreatic injury, with lipase generally more specific. GGT can reflect concurrent hepatobiliary disease or alcohol exposure.","src":"D8F043B3-4693-45BD-810F-8CAF38873756 2.pdf, p. 1 \u00b7 q0044","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0045","topic":"hemostasis","q":"Which statement describes factor V Leiden?","opts":["in asymptomatic patients measurement of D-dimers is important for diagnosis","Factor V increased resistance to degradation by protein C action, leading to activation of fibrinolysis","Factor V decreased resistance to degradation by protein C action, leading to activation of coagulation cascade","Factor V increased resistance to degradation by protein C action, leading to activation of coagulation cascade","Factor V decreased resistance to degradation by protein C action, leading to activation of fibrinolysis"],"correct":[3],"why":"Factor V Leiden makes activated factor V resistant to inactivation by activated protein C, prolonging procoagulant activity.","src":"D8F043B3-4693-45BD-810F-8CAF38873756 2.pdf, p. 1 \u00b7 q0045","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0227","topic":"blood","q":"Which statements about anemia are correct?","opts":["A hyperdynamic circulation can compensate for reduced oxygen delivery","Occult bleeding can lead to iron deficiency anemia","Hemolytic anemias characterized by increased level of conjugated bilirubin and normal level of unconjugated bilirubin","Iron deficiency anemia is usually macrocytic","Anemia of chronic diseases associated with decreased level of ferritin"],"correct":[0,1],"why":"A higher cardiac output can partly compensate for reduced oxygen-carrying capacity. Chronic occult bleeding can deplete iron stores.","src":"D8F043B3-4693-45BD-810F-8CAF38873756.pdf.pdf, p. 2 \u00b7 q0227","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0228","topic":"liver","q":"Which laboratory patterns can occur in advanced cirrhosis?","opts":["Increased ammonia","Increased conjugated bilirubin","A reliably normal platelet count","A mandatory 40-fold rise in both AST and ALT"],"correct":[0,1],"why":"Reduced hepatic clearance and shunting can increase ammonia. Impaired bilirubin processing can raise the conjugated fraction, and severe dysfunction need not produce extreme aminotransferase elevations.","src":"D8F043B3-4693-45BD-810F-8CAF38873756.pdf.pdf, p. 3 \u00b7 q0228","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0230","topic":"hemostasis","q":"Which tests help assess suspected DIC after severe trauma?","opts":["Albumin concentration","D-dimer concentration","Platelet count","Fibrinogen concentration","Erythrocyte count"],"correct":[1,2,3],"why":"Platelets and fibrinogen help assess consumption, while D-dimer reflects fibrin breakdown. PT and aPTT can also inform the overall evaluation.","src":"D8F043B3-4693-45BD-810F-8CAF38873756.pdf.pdf, p. 4 \u00b7 q0230","conf":"key","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1281","topic":"hemostasis","q":"Which factors make up Virchow's triad?","opts":["Endothelial injury","Abnormal blood flow","Hypercoagulability","Increased fibrinolysis"],"correct":[0,1,2],"why":"Vessel injury, stasis or turbulence, and increased coagulability promote thrombosis.","src":"Open qs 3.pdf, p. 1 \u00b7 q1281","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1285","topic":"liver","q":"What pattern is expected in jaundice due to isolated hemolysis?","opts":["Increased unconjugated bilirubin","Absent bilirubinuria","Urinary urobilinogen can increase","A marked increase in conjugated bilirubin is the defining change"],"correct":[0,1,2],"why":"Excess heme breakdown raises the unconjugated fraction, which is albumin-bound and cannot enter urine directly.","src":"Open qs 3.pdf, p. 1 \u00b7 q1285","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1304","topic":"hemostasis","q":"How can a venous clot cause a paradoxical arterial embolism?","opts":["It crosses a right-to-left shunt","It travels through an intact pulmonary capillary bed by its usual route","It first becomes an immune complex","It must originate in the left ventricle"],"correct":[0],"why":"A right-to-left communication can let venous embolic material bypass the pulmonary circulation.","src":"Open qs 3.pdf, p. 1 \u00b7 q1304","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1325","topic":"liver","q":"Which mechanisms favor cholesterol gallstone formation?","opts":["Cholesterol supersaturation of bile","Gallbladder hypomotility","Crystal nucleation","Rapid and complete gallbladder emptying as a risk factor"],"correct":[0,1,2],"why":"Supersaturation permits cholesterol crystallization, and stasis supports growth of stones.","src":"Open qs 3.pdf, p. 2 \u00b7 q1325","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0947","topic":"blood","q":"Which measurement usually remains normal in isolated anemia?","opts":["Arterial oxygen content","Hemoglobin concentration","Arterial oxygen partial pressure","Red cell mass"],"correct":[2],"why":"Anemia reduces the amount of hemoglobin available to carry oxygen. It does not directly lower dissolved arterial oxygen pressure.","src":"Selected.pdf, p. 6 \u00b7 q0947","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0948","topic":"immunity","q":"Which cells directly mediate cytotoxic tissue injury in type IV hypersensitivity?","opts":["IgE-producing plasma cells","Mast cells","Cytotoxic T cells","Eosinophils"],"correct":[2],"why":"Type IV hypersensitivity is T-cell mediated. Cytotoxic T cells directly injure target cells in some forms.","src":"Selected.pdf, p. 7 \u00b7 q0948","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0949","topic":"blood","q":"What is the typical MCV pattern in aplastic anemia?","opts":["Marked microcytosis is required","Usually normocytic","Always severely macrocytic","MCV is unmeasurable"],"correct":[1],"why":"Aplastic anemia reflects marrow failure and is commonly normocytic, although mild macrocytosis can occur.","src":"Selected.pdf, p. 12 \u00b7 q0949","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0950","topic":"liver","q":"What is the underlying process in primary biliary cholangitis?","opts":["Alcohol-induced acinar injury","Autoimmune injury to small intrahepatic bile ducts","Obstruction of the cystic duct by a stone","Increased red cell destruction"],"correct":[1],"why":"Immune-mediated injury to small intrahepatic ducts causes chronic cholestasis.","src":"Selected.pdf, p. 13 \u00b7 q0950","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0951","topic":"blood","q":"Which finding is inconsistent with uncomplicated iron deficiency anemia?","opts":["Low transferrin saturation","Microcytosis","High ferritin","A history of chronic blood loss"],"correct":[2],"why":"Ferritin usually falls as iron stores are depleted. Inflammation can complicate interpretation.","src":"Selected.pdf, p. 22 \u00b7 q0951","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0954","topic":"immunity","q":"Which mechanism defines type II hypersensitivity?","opts":["Antibodies target antigens on cell surfaces or in extracellular matrix","Soluble immune complexes deposit in tissues","Mast cells are activated through allergen-specific IgE","Memory T cells produce a delayed response without antibodies"],"correct":[0],"why":"Type II involves antibody binding to a fixed target, which may cause tissue injury or alter receptor function.","src":"Selected.pdf, p. 30 \u00b7 q0954","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0957","topic":"blood","q":"Which changes explain iron restriction in anemia of chronic inflammation?","opts":["Increased hepatic hepcidin production","Accelerated export of iron from macrophages","Reduced ferroportin-mediated iron export","Increased intestinal iron absorption"],"correct":[0,2],"why":"Hepcidin reduces ferroportin activity, retaining iron in macrophages and limiting delivery to the marrow.","src":"Selected.pdf, p. 45 \u00b7 q0957","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0958","topic":"hemostasis","q":"Which pair consists of inherited bleeding disorders?","opts":["Factor V Leiden and antithrombin deficiency","Hemophilia A and von Willebrand disease","DIC and liver failure","Hypersplenism and immune thrombocytopenia"],"correct":[1],"why":"Hemophilia A affects factor VIII, while inherited von Willebrand disease affects platelet adhesion and can reduce circulating factor VIII.","src":"Selected.pdf, p. 46 \u00b7 q0958","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0960","topic":"liver","q":"Which mechanisms contribute to ascites in cirrhosis?","opts":["Splanchnic vasodilation","Elevated serum bilirubin acting as an osmole","Secondary aldosterone-mediated sodium retention","Elevated plasma albumin"],"correct":[0,2],"why":"Splanchnic vasodilation reduces effective arterial filling and activates sodium retention. Portal hypertension also drives fluid into the peritoneal cavity.","src":"Selected.pdf, p. 49 \u00b7 q0960","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0844","topic":"blood","q":"Which conditions can produce microcytic or hypochromic red cells?","opts":["Folate deficiency","Sideroblastic anemia","Vitamin B12 deficiency","Iron deficiency","Lead toxicity"],"correct":[1,3,4],"why":"Defects in heme production or reduced iron availability can reduce hemoglobin content and cell size.","src":"Selected.pdf, p. 50 \u00b7 q0844","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0961","topic":"liver","q":"Which statements describe hepatic encephalopathy?","opts":["It can alter mental status and neuromuscular function","It is defined by hemolysis","It is caused by hyperuricemia","It can occur with liver failure or portosystemic shunting"],"correct":[0,3],"why":"Impaired hepatic clearance and shunting expose the brain to gut-derived compounds, including ammonia.","src":"Selected.pdf, p. 51 \u00b7 q0961","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1536","topic":"blood","q":"Which cell sources can be used for an allogeneic hematopoietic stem cell transplant?","opts":["A genetically distinct related human donor","The patient's own cells","A genetically distinct unrelated human donor","An animal donor"],"correct":[0,2],"why":"Allogeneic means the donor is another person. The patient's own cells are autologous.","src":"Selected.pdf, p. 56 \u00b7 q1536","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0845","topic":"liver","q":"Which is least characteristic of decompensated cirrhosis?","opts":["Hepatic encephalopathy","Ascites","Prolonged PT","Isolated dehydration as the defining feature"],"correct":[3],"why":"Decompensation presents with major complications of hepatic dysfunction and portal hypertension, including ascites and encephalopathy.","src":"Selected.pdf, p. 62 \u00b7 q0845","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0846","topic":"blood","q":"Which lab findings support hemolysis?","opts":["Elevated LDH","Low haptoglobin","Elevated unconjugated bilirubin","Unconjugated bilirubin filtered into the urine"],"correct":[0,1,2],"why":"Red cell destruction releases LDH and hemoglobin. Heme breakdown raises unconjugated bilirubin, which remains albumin-bound in plasma.","src":"Selected.pdf, p. 78 \u00b7 q0846","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1541","topic":"liver","q":"Which bilirubin change is least characteristic of isolated cholestasis?","opts":["Increase in conjugated bilirubin","Increase in unconjugated bilirubin","Increase GGT","Increase ALP"],"correct":[1],"why":"Impaired bile flow chiefly raises conjugated bilirubin. ALP and GGT can also rise in hepatobiliary cholestasis.","src":"TEST 3 GIT.doc.pdf, p. 1 \u00b7 q1541","conf":"key","seen":1,"recall":true,"scored":true},{"id":"midterm3-q1542","topic":"liver","q":"Which finding is least characteristic of hemolytic jaundice?","opts":["Reticulocytosis","Anaemia","Decreased survival of RBCs","Pale stool"],"correct":[3],"why":"Reticulocytosis can reflect the marrow response to hemolysis. Pale stools instead suggest reduced delivery of bile pigments to the intestine.","src":"TEST 3 GIT.doc.pdf, p. 1 \u00b7 q1542","conf":"key","seen":1,"recall":true,"scored":true},{"id":"midterm3-q1543","topic":"liver","q":"Which urinary finding can occur in hepatocellular jaundice?","opts":["Conjugated bilirubin in urine","Direct filtration of albumin-bound unconjugated bilirubin","Obligate absence of urine urobilinogen in all cases","Urine bilirubin proves isolated hemolysis"],"correct":[0],"why":"Conjugated bilirubin is water soluble. Urinary urobilinogen varies with hepatic clearance and bile flow.","src":"TEST 3 GIT.doc.pdf, p. 1 \u00b7 q1543","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0062","topic":"liver","q":"What are typical consequences of exocrine pancreatic insufficiency?","opts":["Steatorrhea","Fat-soluble vitamin deficiency","Increased capacity to digest dietary fat","Elevated production of pancreatic enzymes"],"correct":[0,1],"why":"Lack of pancreatic digestive enzymes causes maldigestion. Fat malabsorption can lead to steatorrhea and deficiencies of vitamins A, D, E, and K.","src":"TEST 3 GIT.doc.pdf, p. 3 \u00b7 q0062","conf":"inferred","seen":1,"recall":true,"scored":true},{"id":"midterm3-q0064","topic":"liver","q":"Which results best distinguish a predominantly cholestatic from a predominantly hepatocellular pattern?","opts":["Relative elevations of ALP and GGT versus AST and ALT","Total bilirubin alone","Hemoglobin alone","Isolated serum sodium"],"correct":[0],"why":"ALP and GGT predominate in cholestasis, while AST and ALT usually predominate in hepatocellular injury.","src":"TEST 3 GIT.doc.pdf, p. 3 \u00b7 q0064","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0067","topic":"liver","q":"Which can contribute to bleeding abnormalities in advanced liver disease?","opts":["Reduced synthesis of clotting factors","Platelet sequestration from hypersplenism","Obligate elevation of platelet count","Increased synthesis of every clotting factor"],"correct":[0,1],"why":"Hepatic synthetic dysfunction can lower factor activity, and portal hypertension can reduce the circulating platelet count.","src":"TEST 3 GIT.doc.pdf, p. 4 \u00b7 q0067","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0071","topic":"liver","q":"Which systemic complications can occur in severe acute pancreatitis?","opts":["Circulatory shock","Acute respiratory distress syndrome","Acute kidney injury","Isolated chronic hyperalbuminemia as the defining complication"],"correct":[0,1,2],"why":"Severe pancreatic inflammation can produce capillary leakage, systemic inflammation, and multiorgan dysfunction.","src":"TEST 3 GIT.doc.pdf, p. 4 \u00b7 q0071","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0095","topic":"liver","q":"Which changes favor hepatic triglyceride accumulation?","opts":["Increased fatty acid delivery to the liver","Increased hepatic lipogenesis","Reduced fatty acid oxidation or lipid export","A large sustained increase in lipid export relative to production"],"correct":[0,1,2],"why":"Steatosis develops when hepatic lipid input and synthesis exceed oxidation and export.","src":"TEST 3.docx (1).pdf, p. 1 \u00b7 q0095","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0096","topic":"liver","q":"How does the healthy liver detoxify much of the ammonia arriving from the gut?","opts":["It converts nitrogen to urea through the urea cycle","It converts ammonia directly to bilirubin","It secretes ammonia as albumin","It uses erythropoietin to neutralize ammonia"],"correct":[0],"why":"Urea is less toxic and can be excreted by the kidneys.","src":"TEST 3.docx (1).pdf, p. 1 \u00b7 q0096","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0108","topic":"liver","q":"Which presentations can occur in porphyrias, depending on subtype?","opts":["Acute neurovisceral attacks with abdominal pain","Cutaneous photosensitivity","A defining increase in factor VIII activity","Obligate obstructive jaundice in every subtype"],"correct":[0,1],"why":"Accumulated intermediates of heme synthesis differ by enzyme defect, producing different clinical syndromes.","src":"TEST 3.docx (1).pdf, p. 2 \u00b7 q0108","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0110","topic":"liver","q":"Which can cause acute liver failure?","opts":["Severe acetaminophen toxicity","Acute viral hepatitis","Ischemic hepatic injury","Uncomplicated Gilbert syndrome"],"correct":[0,1,2],"why":"Massive or severe acute hepatocellular injury can impair synthesis and lead to encephalopathy.","src":"TEST 3.docx (1).pdf, p. 2 \u00b7 q0110","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0116","topic":"liver","q":"What can excess ammonia promote in astrocytes during acute liver failure?","opts":["Glutamine accumulation and cellular swelling","Immediate bilirubin conjugation","Erythropoietin release as the main response","Synthesis of factor VIII as the defining response"],"correct":[0],"why":"Astrocytes metabolize ammonia to glutamine. Osmotic and metabolic effects contribute to swelling.","src":"TEST 3.docx (1).pdf, p. 2 \u00b7 q0116","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0982","topic":"blood","q":"Which vascular disorders can cause congestive splenomegaly?","opts":["Portal vein thrombosis","Isolated renal vein thrombosis","Splenic vein thrombosis","Budd\u2013Chiari syndrome"],"correct":[0,2,3],"why":"Portal, splenic, and hepatic venous obstruction can increase upstream portal-system pressure.","src":"TEST 3.docx.pdf, p. 18 \u00b7 q0982","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0985","topic":"hemostasis","q":"Which mechanisms can lower platelet counts?","opts":["Splenic sequestration","Immune-mediated platelet destruction","Reduced marrow platelet production","Isolated factor VIII deficiency as its characteristic effect"],"correct":[0,1,2],"why":"Thrombocytopenia can reflect increased sequestration, increased destruction, or reduced production.","src":"TEST 3.docx.pdf, p. 18 \u00b7 q0985","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0986","topic":"hemostasis","q":"Which are inherited thrombophilias?","opts":["Factor V Leiden","Antithrombin deficiency","Acquired factor VIII inhibitors","Cirrhosis-associated coagulopathy"],"correct":[0,1],"why":"Both inherited disorders reduce physiological anticoagulant control.","src":"TEST 3.docx.pdf, p. 18 \u00b7 q0986","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0990","topic":"hemostasis","q":"Which coagulation change can occur in the consumptive phase of DIC?","opts":["Prolonged aPTT","Increased platelet count","Falling D-dimer","Shortened PT as the defining finding"],"correct":[0],"why":"Consumption of coagulation factors can prolong PT and aPTT. Platelets may fall and D-dimer typically rises.","src":"TEST 3.docx.pdf, p. 19 \u00b7 q0990","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0992","topic":"hemostasis","q":"What is a typical cause and consequence of pseudothrombocytopenia?","opts":["In vitro platelet clumping falsely lowers the measured count","It typically causes spontaneous bleeding","It reflects reduced marrow platelet production","The laboratory artifact itself has no bleeding consequence"],"correct":[0,3],"why":"Platelet clumps are undercounted by the analyzer even when the true circulating count is adequate.","src":"TEST 3.docx.pdf, p. 19 \u00b7 q0992","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0993","topic":"hemostasis","q":"Which can prolong aPTT?","opts":["Factor XII deficiency","Unfractionated heparin","Factor V Leiden","A factor VIII inhibitor"],"correct":[0,1,3],"why":"The intrinsic pathway assay is sensitive to contact factor deficiency, heparin, and factor VIII inhibition.","src":"TEST 3.docx.pdf, p. 19 \u00b7 q0993","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0995","topic":"hemostasis","q":"Which finding is associated with bleeding rather than inherited thrombophilia?","opts":["Factor V Leiden","Protein C deficiency","A factor VIII inhibitor","Antithrombin deficiency"],"correct":[2],"why":"Factor VIII inhibitors impair intrinsic pathway clotting and can cause acquired hemophilia.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q0995","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0996","topic":"hemostasis","q":"How can von Willebrand factor deficiency impair hemostasis?","opts":["Reduced platelet adhesion","Reduced stabilization of circulating factor VIII","Accelerated thrombin generation","Increased activation of factor IX"],"correct":[0,1],"why":"Von Willebrand factor bridges platelets to injured vessel walls and protects factor VIII from clearance.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q0996","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0999","topic":"hemostasis","q":"Which of these proteins is affected by warfarin?","opts":["Factor VIII","Fibrinogen","Von Willebrand factor","Protein C"],"correct":[3],"why":"Protein C is vitamin K dependent, as are factors II, VII, IX, and X.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q0999","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1000","topic":"hemostasis","q":"Which coagulation protein is not vitamin K dependent?","opts":["Factor X","Prothrombin","Factor VII","Fibrinogen"],"correct":[3],"why":"Factors II, VII, IX, and X require vitamin K-dependent carboxylation. Fibrinogen does not.","src":"TEST 3.docx.pdf, p. 20 \u00b7 q1000","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1001","topic":"hemostasis","q":"What directly replaces the missing activity in severe bleeding due to hemophilia A?","opts":["Factor VIII concentrate","A platelet concentrate","Vitamin K alone","An anticoagulant"],"correct":[0],"why":"The deficient coagulation activity in hemophilia A is factor VIII.","src":"TEST 3.docx.pdf, p. 21 \u00b7 q1001","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1002","topic":"hemostasis","q":"Which phase of primary hemostasis is most directly impaired by reduced von Willebrand factor?","opts":["Platelet adhesion to exposed subendothelium","Fibrin cross-linking","Fibrinolysis","Thrombin cleavage of fibrinogen"],"correct":[0],"why":"Von Willebrand factor bridges exposed collagen and platelet GPIb.","src":"TEST 3.docx.pdf, p. 21 \u00b7 q1002","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1004","topic":"hemostasis","q":"Which findings can prolong prothrombin time?","opts":["Factor XII deficiency","Factor X deficiency","Warfarin treatment","Isolated hemophilia A"],"correct":[1,2],"why":"Factor X is in the common pathway. Warfarin reduces vitamin K-dependent factor activity, including factor VII.","src":"TEST 3.docx.pdf, p. 21 \u00b7 q1004","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1008","topic":"hemostasis","q":"Which statements about D-dimer are correct?","opts":["It is formed from cross-linked fibrin","It indicates fibrin formation followed by degradation","An elevated result alone proves venous thromboembolism","It can be used in validated rule-out strategies"],"correct":[0,1,3],"why":"D-dimer reflects breakdown of cross-linked fibrin and is sensitive but nonspecific.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1008","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1009","topic":"hemostasis","q":"Which statements describe the platelet GPIIb/IIIa receptor?","opts":["It binds fibrinogen to support aggregation","It is the main receptor for initial von Willebrand factor-mediated adhesion","It is defective in Glanzmann thrombasthenia","It is a fibrinolytic enzyme"],"correct":[0,2],"why":"GPIIb/IIIa bridges adjacent platelets via fibrinogen. GPIb supports initial adhesion through von Willebrand factor.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1009","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1010","topic":"hemostasis","q":"Which pathways are assessed by the Quick test or prothrombin time?","opts":["Extrinsic and common pathways","Intrinsic pathway alone","Platelet adhesion alone","Fibrinolysis alone"],"correct":[0],"why":"Tissue factor initiates the assay and clot formation depends on the common pathway.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1010","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1012","topic":"hemostasis","q":"What does thrombophilia describe?","opts":["A predisposition to thrombosis that can be inherited or acquired","An obligatory deficiency of platelets","A tendency to bleed from an isolated factor VIII deficiency","An inherited disorder in every case"],"correct":[0],"why":"Inherited anticoagulant defects and acquired conditions can both increase thrombosis risk.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1012","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1013","topic":"hemostasis","q":"Which statements about INR are correct?","opts":["It is calculated from the PT ratio and the reagent's ISI","It primarily measures the intrinsic pathway","It typically rises in isolated hemophilia A","It may rise when hepatic clotting factor synthesis declines"],"correct":[0,3],"why":"INR standardizes the PT ratio. PT reflects the tissue factor and common pathways.","src":"TEST 3.docx.pdf, p. 22 \u00b7 q1013","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1015","topic":"hemostasis","q":"Which change can favor thrombosis by reducing fibrinolysis?","opts":["Reduced tissue plasminogen activator activity","Increased generation of plasmin","Loss of plasminogen activator inhibitor activity","Accelerated fibrin breakdown"],"correct":[0],"why":"Reduced activation of plasminogen decreases the capacity to remove fibrin.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1015","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1016","topic":"hemostasis","q":"Which statements describe thrombocytopathy?","opts":["Platelet function is impaired","Bleeding may occur despite a normal platelet count","It always means a low platelet count","It is the same as factor IX deficiency"],"correct":[0,1],"why":"Platelet dysfunction impairs primary hemostasis even when the count is normal.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1016","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1017","topic":"hemostasis","q":"When can vitamin K administration help correct a prolonged INR?","opts":["When vitamin K deficiency reduces factor carboxylation","When isolated factor XII deficiency prolongs aPTT","When aspirin inhibits platelet COX-1","When the sample has EDTA-induced platelet clumping"],"correct":[0],"why":"Vitamin K is required for activation of factors II, VII, IX, and X through gamma-carboxylation.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1017","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1018","topic":"hemostasis","q":"What can a prolonged PT help assess?","opts":["Reduced hepatic synthesis of coagulation factors","Reduced tissue-factor and common pathway activity","Impaired platelet adhesion as a direct measure","Isolated intrinsic pathway activity as its main role"],"correct":[0,1],"why":"PT reflects extrinsic and common pathway clotting. It can also serve as a marker of hepatic synthetic function.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1018","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1019","topic":"hemostasis","q":"Which are acquired risk factors for venous thrombosis?","opts":["Estrogen exposure","Nephrotic syndrome","Inherited factor V Leiden","Congenital protein C deficiency"],"correct":[0,1],"why":"Estrogen affects coagulation factors, and nephrotic syndrome can alter circulating anticoagulant and procoagulant proteins.","src":"TEST 3.docx.pdf, p. 23 \u00b7 q1019","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1022","topic":"hemostasis","q":"How does fibrinogen usually behave during an inflammatory acute-phase response?","opts":["It can rise as a positive acute-phase protein","It is necessarily depleted in every inflammatory state","It remains fixed regardless of inflammation","It rises only through vitamin K activation"],"correct":[0],"why":"Inflammatory signaling increases hepatic production of fibrinogen.","src":"TEST 3.docx.pdf, p. 24 \u00b7 q1022","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1023","topic":"hemostasis","q":"Which can prolong both PT and aPTT?","opts":["Consumptive DIC","Severe depletion of multiple vitamin K-dependent factors","Isolated factor VIII deficiency as the usual pattern","Isolated factor XII deficiency as the usual pattern"],"correct":[0,1],"why":"A process affecting several clotting factors or the common pathway can prolong both assays.","src":"TEST 3.docx.pdf, p. 24 \u00b7 q1023","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1024","topic":"hemostasis","q":"What best explains spontaneous recurrent hemarthrosis in severe hemophilia A?","opts":["Deficient intrinsic pathway amplification due to low factor VIII activity","Increased platelet adhesion","Reduced plasmin formation from excess inhibitor","Isolated reduction of platelet count"],"correct":[0],"why":"Factor VIII deficiency impairs stable fibrin formation, producing deep-tissue and joint bleeding.","src":"TEST 3.docx.pdf, p. 24 \u00b7 q1024","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1027","topic":"hemostasis","q":"What screening pattern is expected in isolated factor XIII deficiency?","opts":["Prolonged PT with normal aPTT","Normal PT and aPTT","Prolonged aPTT with normal PT","Low fibrinogen is required"],"correct":[1],"why":"Factor XIII cross-links fibrin after the clot forms, beyond the endpoint of PT and aPTT.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1027","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1028","topic":"hemostasis","q":"Which agents inhibit coagulation in vivo through different mechanisms?","opts":["Warfarin","Heparin","A fibrin degradation product used as a laboratory marker","A tissue plasminogen activator acting directly on platelet receptors"],"correct":[0,1],"why":"Warfarin interferes with vitamin K recycling, while heparin enhances antithrombin.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1028","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1029","topic":"hemostasis","q":"How does heparin inhibit coagulation?","opts":["It enhances antithrombin-mediated inhibition of factor Xa","It inhibits vitamin K recycling","Unfractionated heparin enhances antithrombin-mediated inhibition of thrombin","It directly blocks platelet GPIIb/IIIa"],"correct":[0,2],"why":"Heparin potentiates antithrombin. Unfractionated heparin can inhibit both Xa and thrombin.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1029","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1030","topic":"hemostasis","q":"When can the historical Duke bleeding time be prolonged?","opts":["Severe thrombocytopenia","Von Willebrand disease","Factor V Leiden as the characteristic finding","Isolated factor XII deficiency as the characteristic finding"],"correct":[0,1],"why":"Bleeding time primarily reflects formation of the initial platelet plug.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1030","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1033","topic":"hemostasis","q":"Which hormone is the main regulator of platelet production?","opts":["Thrombopoietin","Erythropoietin","Aldosterone","Hepcidin"],"correct":[0],"why":"Thrombopoietin stimulates megakaryocyte development and production of platelets.","src":"TEST 3.docx.pdf, p. 25 \u00b7 q1033","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0850","topic":"hemostasis","q":"Which contributors to thrombosis can be acquired?","opts":["Endothelial injury or dysfunction","Estrogen therapy","A germline factor V Leiden variant","An inherited antithrombin mutation"],"correct":[0,1],"why":"Acquired thrombosis risk can involve vessel wall injury and altered coagulation.","src":"TEST 3.docx.pdf, p. 26 \u00b7 q0850","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0853","topic":"liver","q":"Which ion transport protein is disrupted in cystic fibrosis?","opts":["An epithelial sodium pump","A voltage-gated calcium channel","The CFTR chloride and bicarbonate channel","A potassium channel in skeletal muscle"],"correct":[2],"why":"CFTR dysfunction alters epithelial salt and water transport and can obstruct pancreatic ducts.","src":"TEST 3.docx.pdf, p. 26 \u00b7 q0853","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1046","topic":"hemostasis","q":"How can an acute stress response affect hemostasis?","opts":["It can transiently increase platelet and coagulation activity","It obligatorily causes complete fibrinogen depletion","It prevents platelet activation","It eliminates tissue factor expression in injured tissue"],"correct":[0],"why":"Acute stress can shift hemostatic activity in a procoagulant direction.","src":"TEST 3.docx.pdf, p. 28 \u00b7 q1046","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1356","topic":"liver","q":"What mechanism explains Gilbert syndrome?","opts":["Reduced bilirubin conjugation causing mild unconjugated hyperbilirubinemia","Complete obstruction of the common bile duct","An isolated increase in conjugated bilirubin from duct injury","Excess erythropoietin as the primary defect"],"correct":[0],"why":"Reduced UGT1A1 activity produces intermittent mild unconjugated hyperbilirubinemia.","src":"Test 3-all gathered.docx, p. 1 \u00b7 q1356","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0253","topic":"liver","q":"Which bilirubin fraction typically increases in Gilbert syndrome during fasting or illness?","opts":["Unconjugated bilirubin","Only conjugated bilirubin","Neither fraction can increase","Bilirubin in urine from albumin-bound unconjugated bilirubin"],"correct":[0],"why":"Reduced conjugation leads to intermittent unconjugated hyperbilirubinemia.","src":"Test 3-all gathered.docx.pdf, p. 1 \u00b7 q0253","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0313","topic":"hemostasis","q":"Why can INR increase in advanced liver disease?","opts":["Reduced production of some clotting factors prolongs PT","Loss of factor VIII is the only mechanism","A higher platelet count directly prolongs PT","Increased bilirubin directly creates a longer intrinsic pathway"],"correct":[0],"why":"Loss of hepatic synthetic function can lower factor activity measured by the PT.","src":"Test 3-all gathered.docx.pdf, p. 4 \u00b7 q0313","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0316","topic":"blood","q":"What erythropoietin pattern can be seen in secondary erythrocytosis caused by chronic hypoxia?","opts":["Increased or inappropriately normal erythropoietin","Suppressed erythropoietin as the required finding","Absent erythropoietin in all cases","A level determined exclusively by the platelet count"],"correct":[0],"why":"Hypoxic signaling stimulates EPO. In polycythemia vera, autonomous marrow production often suppresses EPO.","src":"Test 3-all gathered.docx.pdf, p. 4 \u00b7 q0316","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0331","topic":"blood","q":"Which findings can occur in multiple myeloma?","opts":["A monoclonal immunoglobulin or light chain","Lytic bone lesions","Anemia or renal impairment","An isolated inherited platelet adhesion defect as the cause"],"correct":[0,1,2],"why":"Clonal plasma cells and their secreted proteins can damage bone and kidney and suppress normal marrow function.","src":"Test 3-all gathered.docx.pdf, p. 7 \u00b7 q0331","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0350","topic":"blood","q":"What commonly explains neutrophilia after glucocorticoid administration?","opts":["Demargination of neutrophils into the circulating pool","Immediate conversion of lymphocytes into neutrophils","Obligate marrow aplasia","An increase in eosinophil recruitment as its main mechanism"],"correct":[0],"why":"Glucocorticoids alter neutrophil distribution and trafficking, increasing the measured circulating count.","src":"Test 3-all gathered.docx.pdf, p. 10 \u00b7 q0350","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0384","topic":"blood","q":"Which situation can cause reticulocytosis when marrow function is intact?","opts":["Recovery after blood loss","Compensated hemolysis","Untreated severe marrow aplasia","Severe isolated lack of erythropoietin as the expected direct response"],"correct":[0,1],"why":"Reticulocytosis indicates a marrow response to increased red cell demand.","src":"Test 3-all gathered.docx.pdf, p. 15 \u00b7 q0384","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1507","topic":"blood","q":"Which mechanism defines pernicious anemia?","opts":["Impaired B12 absorption due to loss of intrinsic factor","Reduced iron intake alone","Excess erythropoietin","A germline defect of globin synthesis"],"correct":[0],"why":"Autoimmune injury to gastric parietal cells and intrinsic factor can cause B12 deficiency.","src":"Test 3-all gathered.docx.pdf, p. 28 \u00b7 q1507","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0195","topic":"blood","q":"Which gastrointestinal conditions can lead to vitamin B12 deficiency and megaloblastic anemia?","opts":["Autoimmune atrophic gastritis","Gastrectomy","Terminal ileal resection","Isolated duodenal resection as its classic cause"],"correct":[0,1,2],"why":"B12 absorption requires gastric intrinsic factor and an intact terminal ileum.","src":"Test 3-all gathered.docx.pdf, p. 32 \u00b7 q0195","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0202","topic":"liver","q":"Which findings can accompany decompensated cirrhosis?","opts":["Hepatic encephalopathy","Prolonged prothrombin time","Jaundice","Ascites"],"correct":[0,1,2,3],"why":"Impaired liver function, portal hypertension, and circulatory dysfunction explain these findings.","src":"Test 3-all gathered.docx.pdf, p. 32 \u00b7 q0202","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0203","topic":"liver","q":"Which can cause cirrhosis?","opts":["Chronic hepatitis C","Wilson disease","Alpha-1 antitrypsin deficiency","Resolved hepatitis A"],"correct":[0,1,2],"why":"Chronic viral injury and inherited metabolic or protein-folding disorders can produce progressive fibrosis. Hepatitis A does not usually become chronic.","src":"Test 3-all gathered.docx.pdf, p. 32 \u00b7 q0203","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1073","topic":"liver","q":"Which hepatitis viruses are classically associated with transmission through infected blood?","opts":["HBV","HCV","HAV as its principal route","HEV as its principal route"],"correct":[0,1],"why":"HBV and HCV can spread parenterally. HAV and HEV typically spread by other routes.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1073","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1074","topic":"liver","q":"Which of these is a product of hepatic ammonia detoxification rather than a precipitant of hepatic encephalopathy?","opts":["Ammonia","Urea","Gastrointestinal bleeding","Portosystemic shunting"],"correct":[1],"why":"The liver converts ammonia to urea. Reduced clearance of ammonia, shunting, and GI bleeding can contribute to encephalopathy.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1074","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1075","topic":"liver","q":"What promotes renal sodium retention in cirrhosis with ascites?","opts":["Reduced effective arterial filling","Activation of the renin\u2013angiotensin\u2013aldosterone system","Suppression of aldosterone in every case","Increased effective arterial volume as the main stimulus"],"correct":[0,1],"why":"Splanchnic vasodilation reduces effective arterial filling and activates sodium-retaining responses.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1075","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1076","topic":"liver","q":"Which finding is least consistent with sustained complete bile duct obstruction?","opts":["Pruritus","Pale stool","Increased urinary urobilinogen","Vitamin K malabsorption"],"correct":[2],"why":"Complete obstruction prevents bilirubin from reaching the intestine, reducing formation of urobilinogen.","src":"Test 3-all gathered.docx.pdf, p. 33 \u00b7 q1076","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1077","topic":"liver","q":"Which condition is least likely to cause ascites through its characteristic mechanism?","opts":["Isolated acute left-sided heart failure","Right-sided heart failure","Budd\u2013Chiari syndrome","Nephrotic syndrome"],"correct":[0],"why":"Isolated acute left ventricular failure primarily causes pulmonary congestion. The other conditions can produce systemic or abdominal fluid accumulation.","src":"Test 3-all gathered.docx.pdf, p. 34 \u00b7 q1077","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1083","topic":"liver","q":"Which processes contribute to tissue injury in acute pancreatitis?","opts":["Premature intracellular trypsin activation","Reduced activation of all digestive enzymes","Elastase-mediated injury","Increased hepcidin"],"correct":[0,2],"why":"Premature protease activation triggers autodigestion and inflammation. Elastase can damage tissue and vessels.","src":"Test 3-all gathered.docx.pdf, p. 35 \u00b7 q1083","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1084","topic":"liver","q":"Which exposure is a classic risk factor for chronic pancreatitis?","opts":["Long-term heavy alcohol exposure","Brief acid reflux","Treated iron deficiency","An isolated increase in gastrin as the usual cause"],"correct":[0],"why":"Recurrent acinar injury and chronic inflammation can lead to fibrosis and loss of pancreatic tissue.","src":"Test 3-all gathered.docx.pdf, p. 35 \u00b7 q1084","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1111","topic":"immunity","q":"Which defects characterize chronic granulomatous disease?","opts":["Impaired intracellular killing in phagocytes","Defective neutrophil adhesion as the primary mechanism","Reduced production of reactive oxygen species by phagocytes","Absent circulating neutrophils in every case"],"correct":[0,2],"why":"Defective NADPH oxidase limits the phagocyte oxidative burst.","src":"YD folder.pdf, p. 22 \u00b7 q1111","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1113","topic":"immunity","q":"Which is not a classic example of type I hypersensitivity?","opts":["Allergic urticaria","Allergic rhinitis","Systemic lupus erythematosus","Allergic asthma"],"correct":[2],"why":"Lupus features immune-complex and other autoimmune mechanisms. Type I hypersensitivity involves IgE and mast cells.","src":"YD folder.pdf, p. 32 \u00b7 q1113","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1206","topic":"hemostasis","q":"Which protein mediates the anticoagulant effect of heparin?","opts":["Protein C","Antithrombin","Thrombomodulin","Fibrinogen"],"correct":[1],"why":"Heparin potentiates antithrombin-mediated inhibition of activated coagulation factors.","src":"YD folder.pdf, p. 54 \u00b7 q1206","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0855","topic":"blood","q":"What can happen after repeated red cell transfusions?","opts":["Systemic iron deposition increases","Transferrin saturation can increase","Iron stores inevitably decline","Copper deposition is the defining complication"],"correct":[0,1],"why":"Each transfusion adds iron, and humans have limited capacity to excrete excess iron.","src":"YE.pdf.pdf, p. 1 \u00b7 q0855","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0857","topic":"liver","q":"Which are common triggers of acute pancreatitis?","opts":["Gallstones","Alcohol exposure","Isolated hyperglycemia","Gastrin hypersecretion"],"correct":[0,1],"why":"Gallstones can obstruct pancreatic outflow, and alcohol can promote acinar injury.","src":"YE.pdf.pdf, p. 7 \u00b7 q0857","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0596","topic":"liver","q":"How does lactulose reduce gut-derived ammonia in hepatic encephalopathy?","opts":["It acidifies colonic contents, trapping ammonia as ammonium","It directly increases hepatic UGT1A1 activity","It blocks platelet GPIIb/IIIa","It increases absorption of ammonia into portal blood"],"correct":[0],"why":"Colonic acidification and faster transit reduce the amount of ammonia absorbed.","src":"YE.pdf.pdf, p. 42 \u00b7 q0596","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q1120","topic":"immunity","q":"What is atopy?","opts":["A predisposition to produce IgE against common environmental allergens","Circulating immune complex deposition","Acquired failure of complement synthesis","An immediate reaction to any foreign protein"],"correct":[0],"why":"Atopy is an individual predisposition to IgE sensitization and associated allergic disease.","src":"YE.pdf.pdf, p. 63 \u00b7 q1120","conf":"inferred","seen":1,"recall":false,"scored":true},{"id":"midterm3-q0865","topic":"blood","q":"Which statements describe megaloblastic anemia?","opts":["Iron deficiency is its classic cause","Autoimmune atrophic gastritis can lead to it","Increased hepcidin directly causes megaloblastosis","Vitamin B12 or folate deficiency can cause it"],"correct":[1,3],"why":"Both deficiencies impair DNA synthesis. Autoimmune gastritis can
